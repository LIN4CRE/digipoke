rate/3 of nominal, 1 HP ≈ rate.\n  const health = ((3 * safeMax - 2 * safeHp) * (rate / 255)) / (3 * safeMax);\n  // Lower-level targets are easier to hold.\n  const levelFactor = Math.max(0.4, 1.25 - level / 100);\n  const statusFactor = status ? (STATUS_BONUS[status] || 1) : 1;\n\n  const p = health * ball.mult * levelFactor * statusFactor;\n  return Math.max(0.01, Math.min(0.97, p));\n}\n\n/**\n * Resolve a capture attempt.\n * @param {object} o Same shape as `captureChance`, plus `rand` (RNG with .next()).\n * @returns {{success:boolean, chance:number, roll:number, shakes:number}}\n */\nexport function attemptCapture({ hp, maxHp, rate, ballId, level, status = null, rand }) {\n  const chance = captureChance({ hp, maxHp, rate, ballId, level, status });\n  const roll = rand.next();\n  const success = roll < chance;\n  // Visual \"wobble\" count: more shakes when the roll was nearly a success.\n  const nearMiss = Math.abs(roll - chance);\n  const shakes = success ? 3 : Math.max(1, 3 - Math.ceil(nearMiss * 6));\n  return { success, chance, roll, shakes };\n}\n\n/** Starting inventory granted to a new profile. */\nexport const STARTER_INVENTORY = { dataBall: 12, cipherBall: 4, matrixBall: 1 };\n\n/** Shop pricing (Data Shards) if the player runs dry. */\nexport const BALL_PRICES = { dataBall: 6, cipherBall: 16, matrixBall: 40 };\n"},{"key":"src/domain/zones.js","code":"/**\n * zones.js — Exploration zones, encounter tables and rival rosters.\n *\n * Zones are pure data. Each zone defines a level band, an encounter table\n * (weighted species pool) and a roster bias used to procedurally generate\n * rival trainer teams. Zones gate themselves behind a \"recommended level\"\n * so the world opens up as the player's team grows.\n *\n * @module domain/zones\n */\n\n/**\n * Encounter weights are relative integers; higher = more common.\n * `boss` marks the zone's signature encounter (guaranteed at first clear).\n */\nexport const ZONES = [\n  {\n    id: 'pixel_plains',\n    name: 'Pixel Plains',\n    blurb: 'Tufted lowlands where rookie digi-life grazes on stray packets.',\n    minLevel: 3, maxLevel: 7,\n    recommended: 0,\n    encounters: [\n      { id: 'nulkit', w: 30 },\n      { id: 'sproutle', w: 25 },\n      { id: 'zephyrling', w: 20 },\n      { id: 'emberling', w: 15 },\n      { id: 'pebblit', w: 10 },\n    ],\n    rivals: ['Byte Scout', 'Patch Cadet'],\n    accent: '#7bd88f',\n  },\n  {\n    id: 'static_springs',\n    name: 'Static Springs',\n    blurb: 'Mineral pools charged by underground current. Bring grounding.',\n    minLevel: 8, maxLevel: 13,\n    recommended: 10,\n    encounters: [\n      { id: 'drizzle', w: 28 },\n      { id: 'sparkit', w: 24 },\n      { id: 'frostkit', w: 18 },\n      { id: 'bitling', w: 18 },\n      { id: 'nulkit', w: 12 },\n    ],\n    rivals: ['Surge Warden', 'Cache Diver'],\n    accent: '#7fdcff',\n  },\n  {\n    id: 'ember_ridge',\n    name: 'Ember Ridge',\n    blurb: 'A volcanic spine still cooling from the last server migration.',\n    minLevel: 14, maxLevel: 20,\n    recommended: 18,\n    encounters: [\n      { id: 'emberling', w: 26 },\n      { id: 'flarion', w: 16 },\n      { id: 'pebblit', w: 20 },\n      { id: 'roccolith', w: 14 },\n      { id: 'shadling', w: 24 },\n    ],\n    rivals: ['Cinder Adept', 'Ash Runner'],\n    accent: '#ff6b3d',\n  },\n  {\n    id: 'cipher_warrens',\n    name: 'Cipher Warrens',\n    blurb: 'Abandoned data-ducts. Packets go in; most things do not come out.',\n    minLevel: 21, maxLevel: 28,\n    recommended: 26,\n    encounters: [\n      { id: 'bitling', w: 24 },\n      { id: 'datamite', w: 18 },\n      { id: 'shadling', w: 16 },\n      { id: 'venomire', w: 16 },\n      { id: 'galewing', w: 14 },\n      { id: 'zephyrling', w: 12 },\n    ],\n    rivals: ['Null Sysop', 'Hex Archivist'],\n    accent: '#b48cff',\n  },\n  {\n    id: 'glacier_vault',\n    name: 'Glacier Vault',\n    blurb: 'Cold storage, literally. Old builds are preserved here perfectly.',\n    minLevel: 29, maxLevel: 36,\n    recommended: 34,\n    encounters: [\n      { id: 'frostkit', w: 18 },\n      { id: 'glacion', w: 18 },\n      { id: 'roccolith', w: 18 },\n      { id: 'mountanix', w: 10 },\n      { id: 'tidecub', w: 18 },\n      { id: 'tempestrix', w: 10 },\n    ],\n    rivals: ['Frost Curator', 'Vault Sentinel'],\n    accent: '#9fe8ff',\n  },\n  {\n    id: 'nexus_core',\n    name: 'Nexus Core',\n    blurb: 'The beating heart of the network. Everything here is legendary.',\n    minLevel: 37, maxLevel: 46,\n    recommended: 42,\n    encounters: [\n      { id: 'datamite', w: 16 },\n      { id: 'cipherax', w: 14 },\n      { id: 'thunderion', w: 12 },\n      { id: 'cryophinx', w: 14 },\n      { id: 'aetherion', w: 12 },\n      { id: 'mountanix', w: 12 },\n      { id: 'oblivionix', w: 10 },\n      { id: 'pyrovern', w: 10 },\n    ],\n    rivals: ['Nexus Architect', 'Root Admin'],\n    accent: '#ff5fa2',\n  },\n];\n\n/** Zone lookup with defensive fallback. */\nexport function getZone(id) {\n  return ZONES.find((z) => z.id === id) || ZONES[0];\n}\n\n/** Zones the player has earned access to, given their strongest creature. */\nexport function unlockedZones(strongestLevel) {\n  return ZONES.filter((z) => strongestLevel >= z.recommended - 4);\n}\n\n/**\n * Weighted random species pick from a zone's encounter table.\n * @param {object} zone\n * @param {() => number} rand Uniform random function in [0,1).\n * @returns {string} Species id.\n */\nexport function rollEncounter(zone, rand) {\n  const total = zone.encounters.reduce((s, e) => s + e.w, 0);\n  let roll = rand() * total;\n  for (const e of zone.encounters) {\n    roll -= e.w;\n    if (roll <= 0) return e.id;\n  }\n  return zone.encounters[0].id;\n}\n\n/**\n * Generate a rival trainer team for a zone, scaled to the player's level.\n * Uses only species that appear in (or below) the zone's band so encounters\n * stay internally consistent.\n *\n * @param {object} zone\n * @param {number} playerLevel Strongest creature level of the player.\n * @param {() => number} rand\n * @returns {{name:string, level:number, members:{speciesId:string, level:number}[]}}\n */\nexport function rollRival(zone, playerLevel, rand) {\n  const pool = zone.encounters.map((e) => e.id);\n  const size = Math.min(6, 2 + Math.floor(rand() * 3) + (zone.recommended >= 26 ? 1 : 0));\n  const baseLevel = Math.max(zone.minLevel, Math.min(zone.maxLevel, playerLevel + (rand() < 0.5 ? -1 : 1)));\n  const members = [];\n  for (let i = 0; i < size; i++) {\n    const speciesId = pool[Math.floor(rand() * pool.length)];\n    members.push({\n      speciesId,\n      level: Math.max(1, Math.min(50, baseLevel + Math.floor(rand() * 3) - 1)),\n    });\n  }\n  const name = zone.rivals[Math.floor(rand() * zone.rivals.length)];\n  return { name, level: baseLevel, members };\n}\n"},{"key":"src/core/state.js","code":"/**\n * state.js — Single source of truth for the player's save file.\n *\n * Architecture\n * ------------\n * One immutable-by-convention state object lives in memory. Screens read it\n * directly; every write goes through a named action in this module, which\n * mutates, notifies subscribers (via the bus) and schedules a debounced\n * IndexedDB write. This gives us:\n *\n *   • predictable data flow (no hidden writes scattered across the UI),\n *   • cheap \"dirty\" tracking for the sync engine,\n *   • one place to add migrations and invariants.\n *\n * The save file is plain JSON — no class instances, no Dates, no Maps — so it\n * round-trips through IndexedDB, `JSON.stringify` and the network unchanged.\n *\n * @module core/state\n */\n\nimport * as db from '«src/core/db.js»';\nimport { emit, EVENTS } from '«src/core/bus.js»';\nimport { createRng, randomSeed } from '«src/core/rng.js»';\nimport { randomId } from '«src/core/crypto.js»';\nimport { createCreature, displayName, healCreature, maxHpOf } from '«src/domain/creature.js»';\nimport { getSpecies } from '«src/domain/species.js»';\nimport { STARTER_INVENTORY, BALL_PRICES, BALLS } from '«src/domain/capture.js»';\nimport { dailyObjectives, shardValue, victoryRewards } from '«src/domain/progression.js»';\nimport { ZONES, getZone } from '«src/domain/zones.js»';\n\n/** Bump this whenever the shape of the save file changes. */\nexport const SCHEMA_VERSION = 4;\n\n/** Maximum size of the active battle team. */\nexport const TEAM_SIZE = 6;\n\n/** Local seed used for deterministic world rolls tied to this profile. */\nconst rng = createRng(randomSeed());\n\n/* ------------------------------------------------------------- defaults */\n\n/** Build a fresh save file. */\nexport function defaultState({ displayName = 'Tamer', starterId = 'emberling', tamer = null } = {}) {\n  const now = new Date().toISOString();\n  const starter = createCreature({ speciesId: starterId, level: 5, rand: rng, origin: { zone: 'lab', wild: false } });\n  starter.bond = 20;\n  return {\n    schema: SCHEMA_VERSION,\n    profile: {\n      id: randomId('profile'),\n      displayName,\n      tamer,                       // avatar config from ui/tamerAvatar.js\n      starterId,\n      tutorial: { nexus: false, ranch: false, lab: false, battle: false },\n      createdAt: now,\n      lastSeenAt: now,\n      seed: randomSeed(),\n      shards: 40,\n      stats: {\n        battles: 0, battlesWon: 0, captures: 0, evolutions: 0,\n        steps: 0, trainersBeaten: 0, faints: 0, releases: 0,\n      },\n    },\n    creatures: { [starter.uid]: starter },\n    team: [starter.uid],\n    inventory: { ...STARTER_INVENTORY, healPatch: 3, statusPatch: 2 },\n    progress: {\n      zoneId: ZONES[0].id,\n      unlocked: [ZONES[0].id],\n      defeatedTrainers: [],\n      objectives: null,\n    },\n    settings: {\n      theme: 'nexus',\n      motion: true,\n      sound: true,\n      music: true,\n      sfxVolume: 0.7,\n      musicVolume: 0.35,\n      autosave: true,\n      syncEnabled: false,\n      serverUrl: null,\n      autoHealOnLevelUp: true,\n    },\n    account: { email: null, token: null, vaultRev: 0, lastSyncedAt: null },\n    updatedAt: now,\n  };\n}\n\n/* ---------------------------------------------------------------- module */\n\nlet state = null;\nlet persistTimer = null;\nlet lastPersistedAt = null;\n\n/** Current save file (throws before `init()` if used too early). */\nexport function getState() {\n  if (!state) throw new Error('state accessed before init()');\n  return state;\n}\n\n/** True once `init()` has completed and the in-memory save is usable. */\nexport function isReady() { return !!state; }\n\n/** True when a profile exists in memory. */\nexport function hasProfile() {\n  return !!state?.profile;\n}\n\n/** Subscribe to change notifications. Returns an unsubscribe function. */\nexport function subscribe(fn) {\n  return onStateChanged(fn);\n}\nfunction onStateChanged(fn) {\n  return subscribeToBus(EVENTS.STATE_CHANGED, fn);\n}\n// Imported lazily to keep the module graph flat.\nimport { on as subscribeToBus } from '«src/core/bus.js»';\n\n/* ------------------------------------------------------------ lifecycle */\n\n/**\n * Load the save file from IndexedDB (running migrations if needed).\n * @returns {Promise<object|null>} The loaded state, or null for a fresh install.\n */\nexport async function init() {\n  const raw = await db.loadState();\n  if (!raw) return null;\n  state = migrate(raw);\n  ensureObjectives();\n  state.profile.lastSeenAt = new Date().toISOString();\n  return state;\n}\n\n/**\n * Upgrade an older save file to the current schema.\n * Migrations are additive and idempotent: a v1 save can jump straight to v3.\n *\n * @param {object} raw\n * @returns {object}\n */\nexport function migrate(raw) {\n  const out = { ...raw };\n  out.schema = out.schema ?? 1;\n\n  if (out.schema < 2) {\n    // v2 introduced the Data Shard currency and the objectives block.\n    out.profile = { ...out.profile, shards: out.profile?.shards ?? 0 };\n    out.progress = { ...out.progress, objectives: out.progress?.objectives ?? null };\n  }\n  if (out.schema < 3) {\n    // v3 split settings out of profile and added the sync account block.\n    out.settings = {\n      theme: 'nexus', motion: true, sound: true, autosave: true,\n      syncEnabled: false, serverUrl: null, autoHealOnLevelUp: true,\n      ...(out.settings || {}),\n    };\n    out.account = { email: null, token: null, vaultRev: 0, lastSyncedAt: null, ...(out.account || {}) };\n    out.inventory = { healPatch: 3, statusPatch: 2, ...(out.inventory || {}) };\n  }\n\n  // Defensive normalisation: never trust persisted data.\n  out.creatures = out.creatures || {};\n  out.team = (out.team || []).filter((uid) => out.creatures[uid]).slice(0, TEAM_SIZE);\n  out.profile = out.profile || { displayName: 'Tamer', stats: {}, shards: 0 };\n  out.profile.stats = {\n    battles: 0, battlesWon: 0, captures: 0, evolutions: 0,\n    steps: 0, trainersBeaten: 0, faints: 0, releases: 0,\n    ...(out.profile.stats || {}),\n  };\n  if (out.schema < 4) {\n    // v4 adds the Tamer avatar, tutorial flags and separate audio volumes.\n    out.profile = {\n      ...out.profile,\n      tamer: out.profile?.tamer || null,\n      starterId: out.profile?.starterId || null,\n      tutorial: { nexus: false, ranch: false, lab: false, battle: false, ...(out.profile?.tutorial || {}) },\n    };\n    out.settings = {\n      music: true, sfxVolume: 0.7, musicVolume: 0.35,\n      ...(out.settings || {}),\n    };\n  }\n\n  out.progress = { zoneId: ZONES[0].id, unlocked: [ZONES[0].id], defeatedTrainers: [], ...(out.progress || {}) };\n  out.progress.unlocked = Array.from(new Set([ZONES[0].id, ...out.progress.unlocked]));\n  out.schema = SCHEMA_VERSION;\n  return out;\n}\n\n/**\n * Apply a mutation and notify subscribers.\n * @param {(s:object)=>void} fn\n * @param {{persist?:boolean, silent?:boolean}} [opts]\n */\nexport function mutate(fn, { persist = true, silent = false } = {}) {\n  fn(state);\n  state.updatedAt = new Date().toISOString();\n  if (!silent) emit(EVENTS.STATE_CHANGED, state);\n  if (persist) schedulePersist();\n  return state;\n}\n\n/** Debounced write-behind persistence. */\nexport function schedulePersist(delay = 600) {\n  if (!state?.settings?.autosave) return;\n  clearTimeout(persistTimer);\n  persistTimer = setTimeout(() => { flush().catch((err) => console.error('[state] persist failed', err)); }, delay);\n}\n\n/** Write the save file immediately. */\nexport async function flush() {\n  clearTimeout(persistTimer);\n  if (!state) return null;\n  await db.saveState(state);\n  lastPersistedAt = new Date().toISOString();\n  emit(EVENTS.STATE_PERSISTED, lastPersistedAt);\n  return lastPersistedAt;\n}\n\n/** Timestamp of the last successful write (Settings > Data). */\nexport function lastPersisted() { return lastPersistedAt; }\n\n/* ------------------------------------------------------------- profiles */\n\n/** Create a brand-new profile with the chosen starter. */\nexport async function createProfile({ displayName, starterId, tamer = null }) {\n  state = defaultState({ displayName, starterId, tamer });\n  ensureObjectives();\n  await flush();\n  emit(EVENTS.STATE_CHANGED, state);\n  return state;\n}\n\n/**\n * Replace the in-memory state with an imported save file.\n * @param {object} raw Parsed save file.\n */\nexport async function replaceState(raw) {\n  state = migrate(raw);\n  ensureObjectives();\n  await flush();\n  emit(EVENTS.STATE_CHANGED, state);\n  return state;\n}\n\n/** Erase everything: IndexedDB, dex, backups and memory. */\nexport async function wipe() {\n  await db.clearAll();\n  state = null;\n  lastPersistedAt = null;\n  emit(EVENTS.STATE_CHANGED, null);\n}\n\n/* ------------------------------------------------------------ creatures */\n\n/** Look up a creature by uid. */\nexport function getCreature(uid) {\n  return state?.creatures?.[uid] || null;\n}\n\n/** Every owned creature, newest first. */\nexport function allCreatures() {\n  return Object.values(state.creatures).sort((a, b) => (a.origin.at < b.origin.at ? 1 : -1));\n}\n\n/** The active battle team, padded-safe (missing uids are skipped). */\nexport function teamCreatures() {\n  return state.team.map((uid) => state.creatures[uid]).filter(Boolean);\n}\n\n/** Highest level among owned creatures (drives zone unlocks). */\nexport function strongestLevel() {\n  return allCreatures().reduce((max, c) => Math.max(max, c.level), 1);\n}\n\n/** True when every team member has fainted. */\nexport function teamIsWiped() {\n  const team = teamCreatures();\n  return team.length === 0 || team.every((c) => c.hp <= 0);\n}\n\n/** Restore the whole roster to full health. */\nexport function healAllCreatures() {\n  return mutate((s) => {\n    for (const c of Object.values(s.creatures)) healCreature(c);\n  });\n}\n\n/**\n * Add a creature to the save file (and to the team if there is room).\n * @returns {object} The stored creature.\n */\nexport function addCreature(creature, { toTeam = true } = {}) {\n  mutate((s) => {\n    s.creatures[creature.uid] = creature;\n    if (toTeam && s.team.length < TEAM_SIZE && !s.team.includes(creature.uid)) {\n      s.team.push(creature.uid);\n    }\n  });\n  return creature;\n}\n\n/**\n * Release a creature back to the wild in exchange for Data Shards.\n * @param {string} uid\n * @returns {{ok:boolean, shards?:number, reason?:string}}\n */\nexport function releaseCreature(uid) {\n  const creature = state.creatures[uid];\n  if (!creature) return { ok: false, reason: 'Creature not found.' };\n  if (state.team.length === 1 && state.team.includes(uid)) {\n    return { ok: false, reason: 'You cannot release your last team member.' };\n  }\n  const value = shardValue(getSpecies(creature.speciesId), creature.level);\n  mutate((s) => {\n    delete s.creatures[uid];\n    s.team = s.team.filter((u) => u !== uid);\n    s.profile.shards += value;\n    s.profile.stats.releases += 1;\n  });\n  return { ok: true, shards: value };\n}\n\n/** Rename a creature (empty string clears the nickname). */\nexport function renameCreature(uid, nickname) {\n  return mutate((s) => {\n    const c = s.creatures[uid];\n    if (c) c.nickname = nickname?.trim() ? nickname.trim().slice(0, 18) : null;\n  });\n}\n\n/** Move a creature into the active team (max 6). */\nexport function addToTeam(uid) {\n  return mutate((s) => {\n    if (!s.creatures[uid] || s.team.includes(uid)) return;\n    if (s.team.length >= TEAM_SIZE) return;\n    s.team.push(uid);\n  });\n}\n\n/** Remove a creature from the active team (keeps it in storage). */\nexport function removeFromTeam(uid) {\n  return mutate((s) => {\n    if (s.team.length === 1) return;\n    s.team = s.team.filter((u) => u !== uid);\n  });\n}\n\n/** Reorder / replace the team wholesale (validated). */\nexport function setTeam(uids) {\n  return mutate((s) => {\n    const valid = uids.filter((u) => s.creatures[u]).slice(0, TEAM_SIZE);\n    if (valid.length) s.team = valid;\n  });\n}\n\n/* ------------------------------------------------------------ inventory */\n\n/** Add items to the bag. */\nexport function addItem(itemId, count = 1) {\n  return mutate((s) => { s.inventory[itemId] = (s.inventory[itemId] ?? 0) + count; });\n}\n\n/** Remove items if available. Returns false when the bag is short. */\nexport function consumeItem(itemId, count = 1) {\n  if ((state.inventory[itemId] ?? 0) < count) return false;\n  mutate((s) => { s.inventory[itemId] -= count; });\n  return true;\n}\n\n/** Buy a ball with Data Shards. */\nexport function buyBall(ballId, count = 1) {\n  const price = (BALL_PRICES[ballId] ?? 999) * count;\n  if (state.profile.shards < price) return { ok: false, reason: 'Not enough Data Shards.' };\n  mutate((s) => {\n    s.profile.shards -= price;\n    s.inventory[ballId] = (s.inventory[ballId] ?? 0) + count;\n  });\n  return { ok: true, spent: price };\n}\n\n/** Grant Data Shards. */\nexport function addShards(n) { return mutate((s) => { s.profile.shards += n; }); }\n\n/** Spend Data Shards if affordable. */\nexport function spendShards(n) {\n  if (state.profile.shards < n) return false;\n  mutate((s) => { s.profile.shards -= n; });\n  return true;\n}\n\n/* ------------------------------------------------------------ objectives */\n\n/** Ensure today's objectives exist, rolling them over at midnight. */\nexport function ensureObjectives() {\n  const today = new Date().toISOString().slice(0, 10);\n  if (state.progress.objectives?.dateKey === today) return state.progress.objectives;\n  const items = dailyObjectives(today).map((o) => ({ ...o, progress: 0 }));\n  state.progress.objectives = { dateKey: today, items, claimed: [] };\n  return state.progress.objectives;\n}\n\n/**\n * Increment a profile statistic and feed any matching objectives.\n * @param {string} key Stat key (battles, captures, evolutions, steps…).\n * @param {number} [by]\n */\nexport function bumpStat(key, by = 1) {\n  return mutate((s) => {\n    s.profile.stats[key] = (s.profile.stats[key] ?? 0) + by;\n    const objs = ensureObjectives();\n    for (const item of objs.items) {\n      if (item.stat === key) item.progress = Math.min(item.goal, item.progress + by);\n    }\n  });\n}\n\n/**\n * Claim a completed objective's reward.\n * @param {string} id Objective id.\n * @returns {{ok:boolean, reward?:number, reason?:string}}\n */\nexport function claimObjective(id) {\n  const objs = ensureObjectives();\n  const item = objs.items.find((o) => o.id === id);\n  if (!item) return { ok: false, reason: 'Unknown objective.' };\n  if (objs.claimed.includes(id)) return { ok: false, reason: 'Already claimed.' };\n  if (item.progress < item.goal) return { ok: false, reason: 'Not finished yet.' };\n  objs.claimed.push(id);\n  addShards(item.reward);\n  emit(EVENTS.STATE_CHANGED, state);\n  schedulePersist();\n  return { ok: true, reward: item.reward };\n}\n\n/* ------------------------------------------------------------- battle IO */\n\n/**\n * Record the outcome of a battle and pay out rewards.\n * Called by the battle screen once the engine reports `end`.\n *\n * @param {object} o\n * @param {'win'|'lose'|'flee'|'caught'} o.outcome\n * @param {boolean} o.isTrainer\n * @param {string} [o.zoneId]\n * @param {string} [o.trainerName]\n */\nexport function recordBattleResult({ outcome, isTrainer, zoneId, trainerName }) {\n  const zone = getZone(zoneId || state.progress.zoneId);\n  const tier = ZONES.indexOf(zone);\n  mutate((s) => {\n    s.profile.stats.battles += 1;\n    if (outcome === 'win' || outcome === 'caught') {\n      s.profile.stats.battlesWon += 1;\n      if (isTrainer) s.profile.stats.trainersBeaten += 1;\n      const reward = victoryRewards(isTrainer, tier);\n      s.profile.shards += reward.shards;\n    }\n    if (outcome === 'lose') {\n      s.profile.stats.faints += 1;\n    }\n    if (isTrainer && trainerName && !s.progress.defeatedTrainers.includes(trainerName)) {\n      s.progress.defeatedTrainers.push(trainerName);\n    }\n  });\n  // Objective counters (routed through bumpStat so progress rolls over daily).\n  bumpStat('battlesWon', outcome === 'win' || outcome === 'caught' ? 1 : 0);\n  if (isTrainer && (outcome === 'win' || outcome === 'caught')) bumpStat('trainersBeaten', 1);\n}\n\n/** Register a capture: adds the creature, dex entry and objective progress. */\nexport function recordCapture(creature, zoneId) {\n  addCreature(creature);\n  db.recordDex(creature.speciesId, { caught: true }).catch(() => {});\n  mutate((s) => { s.profile.stats.captures += 1; });\n  bumpStat('captures', 1);\n  emit(EVENTS.CREATURE_CAUGHT, creature);\n  return creature;\n}\n\n/** Register an evolution (dex + stats + objectives). */\nexport function recordEvolution(uid, fromId, toId) {\n  db.recordDex(toId, { caught: true }).catch(() => {});\n  mutate((s) => { s.profile.stats.evolutions += 1; });\n  bumpStat('evolutions', 1);\n  emit(EVENTS.EVOLVED, { uid, fromId, toId });\n}\n\n/** Advance the exploration step counter and unlock zones as the team grows. */\nexport function recordSteps(n = 1) {\n  bumpStat('steps', n);\n  return mutate((s) => {\n    const level = strongestLevel();\n    for (const zone of ZONES) {\n      if (level >= zone.recommended - 4 && !s.progress.unlocked.includes(zone.id)) {\n        s.progress.unlocked.push(zone.id);\n      }\n    }\n  });\n}\n\n/* ------------------------------------------------------------- settings */\n\n/** Patch settings and persist. */\nexport function updateSettings(patch) {\n  return mutate((s) => { s.settings = { ...s.settings, ...patch }; });\n}\n\n/** Replace the Tamer avatar configuration. */\nexport function setTamer(tamer) {\n  return mutate((s) => { s.profile.tamer = { ...(s.profile.tamer || {}), ...tamer }; });\n}\n\n/** True when a first-run coach mark has not been dismissed yet. */\nexport function tutorialPending(key) {\n  return !state?.profile?.tutorial?.[key];\n}\n\n/** Dismiss a first-run coach mark permanently (stored in the save file). */\nexport function markTutorialSeen(key) {\n  return mutate((s) => {\n    s.profile.tutorial = { ...(s.profile.tutorial || {}), [key]: true };\n  });\n}\n\n/** Store cloud credentials returned by the sync API. */\nexport function setAccount(account) {\n  return mutate((s) => { s.account = { ...s.account, ...account }; });\n}\n\n/** Forget cloud credentials (local data is untouched). */\nexport function clearAccount() {\n  return mutate((s) => {\n    s.account = { email: null, token: null, vaultRev: 0, lastSyncedAt: null };\n    s.settings.syncEnabled = false;\n  });\n}\n\n/* ---------------------------------------------------------------- export */\n\n/** Serialise the save file for download or encryption. */\nexport function exportPayload() {\n  return JSON.parse(JSON.stringify(state));\n}\n\n/** Human-readable summary used by the Settings screen. */\nexport function saveSummary() {\n  const creatures = allCreatures();\n  return {\n    creatures: creatures.length,\n    team: state.team.length,\n    strongest: strongestLevel(),\n    shards: state.profile.shards,\n    dexSeen: Object.keys(state.creatures).length,\n    maxHpTeam: teamCreatures().reduce((sum, c) => sum + maxHpOf(c), 0),\n    names: teamCreatures().map(displayName),\n  };\n}\n\n/** Inventory helper used by the battle bag and shop. */\nexport function ballCounts() {\n  return Object.keys(BALLS).reduce((acc, id) => {\n    acc[id] = state.inventory[id] ?? 0;\n    return acc;\n  }, {});\n}\n"},{"key":"src/domain/types.js","code":"/**\n * types.js — Elemental type system for DigiPoke.\n *\n * The type chart is the single source of truth for damage multipliers.\n * It is stored as a SPARSE matrix: any (attacker, defender) pair that is not\n * explicitly listed resolves to a multiplier of 1.0 (neutral). This keeps the\n * data readable and makes it trivial to diff/balance during tuning.\n *\n * Design goals:\n *  - Deterministic: pure lookup, no RNG.\n *  - Data-driven: balance changes never touch engine code.\n *  - Total: every type has a defined interaction with every other type.\n *\n * @module domain/types\n */\n\n/** Canonical element identifiers. Order matters only for UI rendering. */\nexport const TYPE_IDS = [\n  'flame',   // Combustion / heat\n  'aqua',    // Water / liquid\n  'verdant', // Plant / organic growth\n  'volt',    // Electricity\n  'terra',   // Rock / ground / mineral\n  'aero',    // Air / wind / flight\n  'frost',   // Ice / cold\n  'byte',    // Data / machine / digital\n  'virus',   // Corruption / toxin / dark data\n  'null',    // Neutral / formless\n];\n\n/**\n * Human-facing metadata for each element.\n * `color` drives chips, bars and sprite auras; `glyph` is an inline-safe symbol.\n */\nexport const TYPES = {\n  flame:   { name: 'Flame',   glyph: '🜂', color: '#ff6b3d', weak: ['aqua', 'terra', 'flame'] },\n  aqua:    { name: 'Aqua',    glyph: '🜄', color: '#3db4ff', weak: ['verdant', 'aqua'] },\n  verdant: { name: 'Verdant', glyph: '🜁', color: '#4fd67c', weak: ['flame', 'verdant', 'aero'] },\n  volt:    { name: 'Volt',    glyph: '🜇', color: '#ffd93d', weak: ['volt', 'verdant'] },\n  terra:   { name: 'Terra',   glyph: '🜃', color: '#c98a4b', weak: ['aqua', 'verdant', 'frost'] },\n  aero:    { name: 'Aero',    glyph: '🜀', color: '#9fe8ff', weak: ['volt', 'frost', 'terra'] },\n  frost:   { name: 'Frost',   glyph: '🜆', color: '#7fdcff', weak: ['flame', 'frost', 'byte'] },\n  byte:    { name: 'Byte',    glyph: '⌗', color: '#b48cff', weak: ['flame', 'aqua'] },\n  virus:   { name: 'Virus',   glyph: '☣', color: '#ff5fa2', weak: ['byte', 'virus'] },\n  null:    { name: 'Null',    glyph: '∅', color: '#c8cfe0', weak: ['virus'] },\n};\n\n/**\n * Sparse effectiveness chart.\n * CHART[attacker][defender] = multiplier (0, 0.25, 0.5, 2 or 4).\n * Missing entries default to 1.\n */\nconst CHART = {\n  flame:   { verdant: 2, frost: 2, byte: 2, aqua: 0.5, terra: 0.5, flame: 0.5 },\n  aqua:    { flame: 2, terra: 2, verdant: 0.5, aqua: 0.5, frost: 0.5 },\n  verdant: { aqua: 2, terra: 2, flame: 0.5, verdant: 0.5, aero: 0.5, frost: 0.5 },\n  volt:    { aqua: 2, aero: 2, verdant: 0.5, volt: 0.5, terra: 0 },\n  terra:   { flame: 2, volt: 2, byte: 2, frost: 2, aero: 0, verdant: 0.5 },\n  aero:    { verdant: 2, virus: 2, volt: 0.5, terra: 0.5, byte: 0.5 },\n  frost:   { verdant: 2, terra: 2, aero: 2, flame: 0.5, frost: 0.5, aqua: 0.5 },\n  byte:    { frost: 2, virus: 2, aero: 2, flame: 0.5, byte: 0.5, aqua: 0.5 },\n  virus:   { null: 2, verdant: 2, virus: 0.5, byte: 0.5 },\n  null:    { virus: 2, byte: 0.5, terra: 0.5 },\n};\n\n/**\n * Resolve the damage multiplier for an attacking type against one or more\n * defending types (dual-type creatures multiply both factors together).\n *\n * @param {string} attackType  Element id of the move.\n * @param {string[]} defendTypes Element ids of the defender (1 or 2 entries).\n * @returns {number} Multiplier: 0 (immune), 0.25, 0.5, 1, 2 or 4.\n */\nexport function effectiveness(attackType, defendTypes) {\n  let mult = 1;\n  for (const def of defendTypes) {\n    const row = CHART[attackType];\n    mult *= (row && row[def] !== undefined) ? row[def] : 1;\n  }\n  return mult;\n}\n\n/** Verbose label used by the battle log (\"It's super effective!\"). */\nexport function effectivenessLabel(mult) {\n  if (mult === 0) return \"It has no effect…\";\n  if (mult >= 2) return \"It's super effective!\";\n  if (mult > 0 && mult < 1) return \"It's not very effective…\";\n  return '';\n}\n\n/** Defensive profile summary used by the Ranch / Lab inspector panels. */\nexport function defensiveProfile(types) {\n  const out = [];\n  for (const atk of TYPE_IDS) {\n    const m = effectiveness(atk, types);\n    if (m > 1) out.push({ type: atk, mult: m, kind: 'weak' });\n    else if (m < 1) out.push({ type: atk, mult: m, kind: 'resist' });\n  }\n  return out;\n}\n"},{"key":"src/domain/battle.js","code":"/**\n * battle.js — Deterministic turn-based battle engine.\n *\n * Design contract\n * ---------------\n * 1. The engine is a *state machine with a pure-ish surface*: `submit(action)`\n *    returns an ordered array of events describing everything that happened.\n *    No DOM, no timers, no persistence. The UI replays events to animate;\n *    tests assert against them.\n * 2. All randomness flows through the injected RNG, so a seed fully determines\n *    a battle. This is what makes the engine fuzz-testable (see tests/).\n * 3. Creatures passed in are the LIVE persisted objects: HP and XP are written\n *    back as they change. If the tab dies mid-battle, no progress is lost —\n *    a core property of the local-first architecture.\n *\n * @module domain/battle\n */\n\nimport { getMove, STATUSES } from '«src/domain/moves.js»';\nimport { effectiveness, effectivenessLabel } from '«src/domain/types.js»';\nimport { getSpecies } from '«src/domain/species.js»';\nimport { displayName, maxHpOf, gainXp, statsFor } from '«src/domain/creature.js»';\nimport { attemptCapture, BALLS } from '«src/domain/capture.js»';\nimport { LEVEL_CAP } from '«src/domain/progression.js»';\n\n/** Side keys. */\nexport const SIDE = { ALLY: 'ally', FOE: 'foe' };\n\n/** Action priority tiers (higher resolves first, before Speed is consulted). */\nconst PRIORITY = { switch: 6, flee: 6, item: 5, ball: 4, move: 0 };\n\n/** Combat stage bounds. */\nconst STAGE_MIN = -2;\nconst STAGE_MAX = 2;\n\n/** Convert a combat stage (-2..+2) into a stat multiplier. */\nexport function stageMultiplier(stage) {\n  return stage >= 0 ? (2 + stage) / 2 : 2 / (2 - stage);\n}\n\n/**\n * Wrap a persisted creature into a volatile combatant.\n * @param {object} creature\n * @returns {object}\n */\nfunction makeCombatant(creature) {\n  const stats = statsFor(creature);\n  return {\n    uid: creature.uid,\n    ref: creature,\n    speciesId: creature.speciesId,\n    species: getSpecies(creature.speciesId),\n    nickname: creature.nickname,\n    level: creature.level,\n    maxHp: stats.hp,\n    hp: Math.max(0, Math.min(stats.hp, creature.hp)),\n    stats,\n    moves: [...creature.moves],\n    stages: { atk: 0, def: 0, spd: 0 },\n    status: null,\n    statusTurns: 0,\n    fainted: creature.hp <= 0,\n    participated: false,\n  };\n}\n\n/** Effective stat after stages and status modifiers. */\nfunction effStat(c, stat) {\n  let v = c.stats[stat] * stageMultiplier(c.stages[stat]);\n  if (stat === 'atk' && c.status === 'burn') v *= STATUSES.burn.atkMult;\n  if (stat === 'spd' && c.status === 'paralyze') v *= STATUSES.paralyze.spdMult;\n  return Math.max(1, Math.floor(v));\n}\n\n/**\n * Damage roll. Mirrors the genre-standard formula, tuned for a 4-stat model.\n *\n * @param {object} attacker Combatant.\n * @param {object} defender Combatant.\n * @param {object} move Move record.\n * @param {object} rng RNG.\n * @returns {{damage:number, eff:number, crit:boolean, hit:boolean}}\n */\nexport function computeDamage(attacker, defender, move, rng) {\n  const hitRoll = rng.next() * 100;\n  const acc = move.acc ?? 100;\n  if (acc < 100 && hitRoll >= acc) {\n    return { damage: 0, eff: 1, crit: false, hit: false };\n  }\n\n  const atk = effStat(attacker, 'atk');\n  const def = effStat(defender, 'def');\n  const level = attacker.level;\n\n  const base = Math.floor(((2 * level) / 5 + 2) * move.power * (atk / def) / 50 + 2);\n  const stab = attacker.species.types.includes(move.type) ? 1.25 : 1;\n  const crit = rng.next() < 0.0625;\n  const critMult = crit ? 1.5 : 1;\n  const eff = effectiveness(move.type, defender.species.types);\n  const variance = 0.85 + rng.next() * 0.15;\n\n  const damage = Math.max(1, Math.floor(base * stab * eff * critMult * variance));\n  return { damage, eff, crit, hit: true };\n}\n\n/** Rough expected damage used by the AI (no variance, no crit). */\nfunction expectedDamage(attacker, defender, move) {\n  if (!move.power) return 0;\n  const atk = effStat(attacker, 'atk');\n  const def = effStat(defender, 'def');\n  const base = Math.floor(((2 * attacker.level) / 5 + 2) * move.power * (atk / def) / 50 + 2);\n  const stab = attacker.species.types.includes(move.type) ? 1.25 : 1;\n  const eff = effectiveness(move.type, defender.species.types);\n  return base * stab * eff;\n}\n\nexport class Battle {\n  /**\n   * @param {object} cfg\n   * @param {object[]} cfg.allyTeam Player creatures (1..6, live objects).\n   * @param {object[]} cfg.foeTeam  Opponent creatures (live or generated).\n   * @param {'wild'|'trainer'} [cfg.kind]\n   * @param {string} [cfg.foeName]\n   * @param {object} cfg.rng RNG instance from core/rng.js.\n   * @param {object} [cfg.inventory] Mutable inventory (balls/items consumed).\n   * @param {string} [cfg.zoneId] Zone the battle started in (provenance).\n   */\n  constructor({ allyTeam, foeTeam, kind = 'wild', foeName = 'Wild Digi', rng, inventory = {}, zoneId = null }) {\n    if (!rng) throw new Error('Battle requires an RNG instance');\n    const ally = allyTeam.filter(Boolean).slice(0, 6);\n    const foe = foeTeam.filter(Boolean).slice(0, 6);\n    if (!ally.length || !foe.length) throw new Error('Battle requires at least one creature per side');\n\n    this.rng = rng;\n    this.kind = kind;\n    this.zoneId = zoneId;\n    this.inventory = inventory;\n    this.turn = 0;\n    this.over = false;\n    this.outcome = null; // 'win' | 'lose' | 'flee' | 'caught'\n    this.pendingSwitch = null; // side key forced to send in a replacement\n    this.capturedUid = null;\n    this.log = [];\n    this.sides = {\n      [SIDE.ALLY]: {\n        key: SIDE.ALLY,\n        name: 'Your team',\n        isPlayer: true,\n        team: ally.map(makeCombatant),\n        index: firstHealthyIndex(ally),\n      },\n      [SIDE.FOE]: {\n        key: SIDE.FOE,\n        name: foeName,\n        isPlayer: false,\n        team: foe.map(makeCombatant),\n        index: 0,\n      },\n    };\n    // Sync back: the engine's HP view is authoritative from here on.\n    for (const key of [SIDE.ALLY, SIDE.FOE]) {\n      for (const c of this.sides[key].team) c.ref.hp = c.hp;\n    }\n    this.emit({ t: 'start', kind, foeName, ally: this.active(SIDE.ALLY).species.name, foe: this.active(SIDE.FOE).species.name });\n  }\n\n  /* ------------------------------------------------------------------ read */\n\n  /** Active combatant for a side (or null when the team is wiped). */\n  active(key) {\n    const side = this.sides[key];\n    if (!side) return null;\n    const c = side.team[side.index];\n    return c && !c.fainted ? c : null;\n  }\n\n  team(key) { return this.sides[key].team; }\n  sideName(key) { return this.sides[key].name; }\n\n  /** True when the player may throw a ball right now. */\n  canCapture() {\n    return this.kind === 'wild' && !this.over && !!this.active(SIDE.FOE);\n  }\n\n  /** True when the player is being forced to choose a replacement. */\n  awaitingSwitch() { return this.pendingSwitch === SIDE.ALLY; }\n\n  /** Legal action types for the current moment (drives UI enable/disable). */\n  legalActions() {\n    if (this.over) return [];\n    if (this.awaitingSwitch()) return ['switch'];\n    const acts = ['move', 'switch', 'item', 'flee'];\n    if (this.canCapture()) acts.push('ball');\n    return acts;\n  }\n\n  /* ----------------------------------------------------------------- write */\n\n  /** Internal: append an event to the log and return it. */\n  emit(ev) { this.log.push(ev); return ev; }\n\n  /**\n   * Submit the player's action for this turn and resolve the whole turn.\n   *\n   * @param {{type:string}} action\n   *   { type:'move',   moveId }\n   *   { type:'switch', index }    index into the player's team\n   *   { type:'item',   itemId }   'healPatch' | 'statusPatch'\n   *   { type:'ball',   ballId }\n   *   { type:'flee' }\n   * @returns {object[]} Ordered event list produced by this turn.\n   */\n  submit(action) {\n    const events = [];\n    const start = this.log.length;\n    if (this.over) return [{ t: 'msg', text: 'The battle has already ended.' }];\n\n    if (this.awaitingSwitch() && action.type !== 'switch') {\n      return [{ t: 'msg', text: 'You must send in a replacement first.' }];\n    }\n\n    const playerAction = this.normalise(action);\n    if (!playerAction) return [{ t: 'msg', text: 'That action is not available.' }];\n\n    const foeAction = this.chooseFoeAction();\n\n    const order = this.resolveOrder(playerAction, foeAction);\n    for (const entry of order) {\n      if (this.over) break;\n      this.execute(entry.side, entry.action, events);\n      this.resolveFaints(events);\n      if (this.over) break;\n    }\n\n    if (!this.over) {\n      this.endOfTurn(events);\n      this.resolveFaints(events);\n      this.turn += 1;\n    }\n\n    return this.log.slice(start);\n  }\n\n  /** Validate and shape an incoming action, or null when illegal. */\n  normalise(action) {\n    switch (action.type) {\n      case 'move': {\n        const c = this.active(SIDE.ALLY);\n        if (!c || !c.moves.includes(action.moveId)) return null;\n        return { type: 'move', moveId: action.moveId };\n      }\n      case 'switch': {\n        const side = this.sides[SIDE.ALLY];\n        const target = side.team[action.index];\n        if (!target || target.fainted || action.index === side.index) return null;\n        return { type: 'switch', index: action.index };\n      }\n      case 'item': {\n        const count = this.inventory[action.itemId] ?? 0;\n        if (count <= 0) return { type: 'item', itemId: action.itemId, empty: true };\n        return { type: 'item', itemId: action.itemId };\n      }\n      case 'ball': {\n        if (!this.canCapture() || !BALLS[action.ballId]) return null;\n        if ((this.inventory[action.ballId] ?? 0) <= 0) return { type: 'ball', ballId: action.ballId, empty: true };\n        return { type: 'ball', ballId: action.ballId };\n      }\n      case 'flee':\n        return { type: 'flee' };\n      default:\n        return null;\n    }\n  }\n\n  /** Determine which side acts first this turn. */\n  resolveOrder(playerAction, foeAction) {\n    const entries = [\n      { side: SIDE.ALLY, action: playerAction },\n      { side: SIDE.FOE, action: foeAction },\n    ];\n    const prio = (a) => PRIORITY[a.type] ?? 0;\n    entries.sort((a, b) => {\n      const d = prio(b.action) - prio(a.action);\n      if (d !== 0) return d;\n      const ca = this.active(a.side);\n      const cb = this.active(b.side);\n      if (!ca || !cb) return 0;\n      const sd = effStat(cb, 'spd') - effStat(ca, 'spd');\n      if (sd !== 0) return sd;\n      return this.rng.next() < 0.5 ? -1 : 1;\n    });\n    return entries;\n  }\n\n  /** Execute one side's action, appending events. */\n  execute(key, action, events) {\n    const side = this.sides[key];\n    const actor = this.active(key);\n    const other = key === SIDE.ALLY ? SIDE.FOE : SIDE.ALLY;\n\n    switch (action.type) {\n      case 'move': {\n        if (!actor) return;\n        if (!this.preMoveStatus(key, actor, events)) return;\n        const move = getMove(action.moveId);\n        const target = this.active(other);\n        if (!target) return;\n\n        actor.participated = true;\n        events.push(this.emit({ t: 'move', side: key, moveId: action.moveId, name: move.name, actor: nameOf(actor) }));\n\n        if (move.power > 0) {\n          const res = computeDamage(actor, target, move, this.rng);\n          if (!res.hit) {\n            events.push(this.emit({ t: 'miss', side: key, name: nameOf(actor) }));\n            return;\n          }\n          this.applyDamage(other, res.damage, events, { eff: res.eff, crit: res.crit });\n\n          // Secondary effects (drain / recoil) resolved off the damage dealt.\n          if (move.effect?.kind === 'drain') {\n            const healed = Math.max(1, Math.floor(res.damage * move.effect.pct));\n            this.applyHeal(key, healed, events, { source: 'drain' });\n          }\n          if (move.effect?.kind === 'recoil') {\n            const hurt = Math.max(1, Math.floor(res.damage * move.effect.pct));\n            this.applyDamage(key, hurt, events, { source: 'recoil' });\n          }\n        } else if (move.effect?.kind === 'heal') {\n          const healed = Math.max(1, Math.floor(actor.maxHp * move.effect.pct));\n          if (actor.hp >= actor.maxHp) {\n            events.push(this.emit({ t: 'msg', text: `${nameOf(actor)}'s HP is already full!` }));\n          } else {\n            this.applyHeal(key, healed, events, { source: 'move' });\n          }\n        } else if (move.effect?.kind === 'stat') {\n          const delta = this.modifyStage(key, action.targetSide ?? key, move.effect.stat, move.effect.stages);\n          if (delta === 0) {\n            events.push(this.emit({ t: 'msg', text: `${nameOf(actor)}'s ${move.effect.stat.toUpperCase()} won't go higher!` }));\n          } else {\n            events.push(this.emit({\n              t: 'stat', side: key, stat: move.effect.stat, delta, name: nameOf(actor),\n              text: `${nameOf(actor)}'s ${statLabel(move.effect.stat)} ${delta > 0 ? 'rose' : 'fell'}!`,\n            }));\n          }\n        }\n\n        // Non-volatile status application.\n        if (move.effect?.kind === 'status' && !this.active(other)?.status) {\n          const t = this.active(other);\n          if (t && this.rng.next() < (move.effect.chance ?? 0)) {\n            this.applyStatus(other, move.effect.status, events);\n          }\n        }\n        break;\n      }\n\n      case 'switch': {\n        const incoming = side.team[action.index];\n        if (!incoming || incoming.fainted) return;\n        side.index = action.index;\n        incoming.participated = true;\n        events.push(this.emit({\n          t: 'switch', side: key, index: action.index,\n          name: nameOf(incoming),\n          text: key === SIDE.ALLY ? `Go, ${nameOf(incoming)}!` : `${side.name} sends out ${nameOf(incoming)}!`,\n        }));\n        if (this.pendingSwitch === key) this.pendingSwitch = null;\n        break;\n      }\n\n      case 'item': {\n        if (action.empty) {\n          events.push(this.emit({ t: 'msg', text: 'You don’t have any of those left.' }));\n          return;\n        }\n        this.inventory[action.itemId] = (this.inventory[action.itemId] ?? 0) - 1;\n        const target = this.active(key);\n        if (action.itemId === 'healPatch' && target) {\n          const healed = Math.max(1, Math.floor(target.maxHp * 0.6));\n          this.applyHeal(key, healed, events, { source: 'item' });\n        } else if (action.itemId === 'statusPatch' && target) {\n          target.status = null; target.statusTurns = 0;\n          events.push(this.emit({ t: 'cure', side: key, name: nameOf(target), text: `${nameOf(target)} was restored!` }));\n        }\n        events.push(this.emit({ t: 'item', side: key, itemId: action.itemId }));\n        break;\n      }\n\n      case 'ball': {\n        if (action.empty) {\n          events.push(this.emit({ t: 'msg', text: 'You don’t have any of those left.' }));\n          return;\n        }\n        const target = this.active(SIDE.FOE);\n        if (!target) return;\n        this.inventory[action.ballId] = (this.inventory[action.ballId] ?? 0) - 1;\n        const res = attemptCapture({\n          hp: target.hp, maxHp: target.maxHp, rate: target.species.capture,\n          ballId: action.ballId, level: target.level, status: target.status, rand: this.rng,\n        });\n        events.push(this.emit({\n          t: 'ball', ballId: action.ballId, chance: res.chance, shakes: res.shakes, success: res.success,\n          text: `${BALLS[action.ballId].name} thrown at ${nameOf(target)}!`,\n        }));\n        if (res.success) {\n          target.fainted = true;\n          target.captured = true;\n          this.capturedUid = target.uid;\n          this.finish('caught', events);\n        } else {\n          events.push(this.emit({ t: 'msg', text: `Argh! It broke free after ${res.shakes} shake${res.shakes === 1 ? '' : 's'}!` }));\n        }\n        break;\n      }\n\n      case 'flee': {\n        if (this.kind !== 'wild') {\n          events.push(this.emit({ t: 'msg', text: 'You can’t flee from a trainer battle!' }));\n          return;\n        }\n        const me = this.active(key);\n        const them = this.active(other);\n        const speedEdge = me && them ? effStat(me, 'spd') / (effStat(me, 'spd') + effStat(them, 'spd')) : 0.5;\n        const ok = this.rng.next() < 0.55 + speedEdge * 0.4;\n        events.push(this.emit({ t: 'flee', ok, text: ok ? 'Got away safely!' : 'Can’t escape!' }));\n        if (ok) this.finish(key === SIDE.ALLY ? 'flee' : 'win', events);\n        break;\n      }\n      default:\n        break;\n    }\n  }\n\n  /** Sleep/freeze/paralysis gate at the start of a move. Returns false if the turn is consumed. */\n  preMoveStatus(key, actor, events) {\n    if (!actor.status) return true;\n    if (actor.status === 'sleep') {\n      actor.statusTurns -= 1;\n      if (actor.statusTurns > 0) {\n        events.push(this.emit({ t: 'msg', text: `${nameOf(actor)} is fast asleep…` }));\n        return false;\n      }\n      actor.status = null;\n      events.push(this.emit({ t: 'cure', side: key, name: nameOf(actor), text: `${nameOf(actor)} woke up!` }));\n      return true;\n    }\n    if (actor.status === 'freeze') {\n      if (this.rng.next() < STATUSES.freeze.thawChance) {\n        actor.status = null;\n        events.push(this.emit({ t: 'cure', side: key, name: nameOf(actor), text: `${nameOf(actor)} thawed out!` }));\n        return true;\n      }\n      events.push(this.emit({ t: 'msg', text: `${nameOf(actor)} is frozen solid!` }));\n      return false;\n    }\n    if (actor.status === 'paralyze' && this.rng.next() < STATUSES.paralyze.skipChance) {\n      events.push(this.emit({ t: 'msg', text: `${nameOf(actor)} is paralysed! It can’t move!` }));\n      return false;\n    }\n    return true;\n  }\n\n  /** Apply damage to a side's active combatant and persist it to the creature. */\n  applyDamage(key, amount, events, meta = {}) {\n    const target = this.active(key);\n    if (!target) return;\n    const dealt = Math.min(target.hp, Math.max(1, Math.floor(amount)));\n    target.hp -= dealt;\n    target.ref.hp = target.hp; // persist immediately (crash-safe local-first)\n    events.push(this.emit({\n      t: 'damage', side: key, amount: dealt, hp: target.hp, maxHp: target.maxHp,\n      eff: meta.eff ?? 1, crit: !!meta.crit, source: meta.source || 'move',\n      text: meta.eff !== undefined && meta.eff !== 1 ? effectivenessLabel(meta.eff) : '',\n    }));\n    if (target.hp <= 0) {\n      target.hp = 0;\n      target.ref.hp = 0;\n    }\n  }\n\n  /** Heal a side's active combatant (never above max) and persist. */\n  applyHeal(key, amount, events, meta = {}) {\n    const target = this.active(key);\n    if (!target) return;\n    const healed = Math.min(target.maxHp - target.hp, Math.max(1, Math.floor(amount)));\n    if (healed <= 0) return;\n    target.hp += healed;\n    target.ref.hp = target.hp;\n    events.push(this.emit({\n      t: 'heal', side: key, amount: healed, hp: target.hp, maxHp: target.maxHp, source: meta.source || 'item',\n    }));\n  }\n\n  /** Apply a non-volatile status if the target has none. */\n  applyStatus(key, status, events) {\n    const target = this.active(key);\n    if (!target || target.status || !STATUSES[status]) return false;\n    target.status = status;\n    target.statusTurns = status === 'sleep' ? this.rng.int(...STATUSES.sleep.turns) : 0;\n    events.push(this.emit({\n      t: 'status', side: key, status, name: nameOf(target),\n      text: `${nameOf(target)} was ${statusVerb(status)}!`,\n    }));\n    return true;\n  }\n\n  /** Shift a combat stage, clamped. Returns the actual delta applied. */\n  modifyStage(_actorSide, targetSide, stat, stages) {\n    const target = this.active(targetSide);\n    if (!target) return 0;\n    const before = target.stages[stat] ?? 0;\n    const after = Math.max(STAGE_MIN, Math.min(STAGE_MAX, before + stages));\n    target.stages[stat] = after;\n    return after - before;\n  }\n\n  /** End-of-turn residual effects (burn/poison ticks, sleep countdown). */\n  endOfTurn(events) {\n    for (const key of [SIDE.ALLY, SIDE.FOE]) {\n      const c = this.active(key);\n      if (!c || !c.status) continue;\n      const def = STATUSES[c.status];\n      if (def.dot) {\n        const dmg = Math.max(1, Math.floor(c.maxHp * def.dot));\n        events.push(this.emit({ t: 'statusTick', side: key, status: c.status, name: nameOf(c), text: `${nameOf(c)} is hurt by its ${def.name.toLowerCase()}!` }));\n        this.applyDamage(key, dmg, events, { source: 'status' });\n      } else if (c.status === 'sleep') {\n        c.statusTurns -= 1;\n        if (c.statusTurns <= 0) {\n          c.status = null;\n          events.push(this.emit({ t: 'cure', side: key, name: nameOf(c), text: `${nameOf(c)} woke up!` }));\n        }\n      }\n    }\n  }\n\n  /** Detect faints, award XP, and force/auto replacements. */\n  resolveFaints(events) {\n    for (const key of [SIDE.ALLY, SIDE.FOE]) {\n      const side = this.sides[key];\n      const c = side.team[side.index];\n      if (c && c.hp <= 0 && !c.fainted) {\n        c.fainted = true;\n        c.hp = 0;\n        c.ref.hp = 0;\n        events.push(this.emit({\n          t: 'faint', side: key, uid: c.uid, name: nameOf(c),\n          text: key === SIDE.FOE\n            ? (c.captured ? `${nameOf(c)} was captured!` : `Wild ${nameOf(c)} fainted!`)\n            : `${nameOf(c)} fainted!`,\n        }));\n        if (key === SIDE.FOE && !c.captured) this.awardXp(c, events);\n      }\n    }\n\n    const allyAlive = this.sides[SIDE.ALLY].team.some((c) => !c.fainted);\n    const foeAlive = this.sides[SIDE.FOE].team.some((c) => !c.fainted);\n\n    if (this.over) return;\n    if (!foeAlive) { this.finish('win', events); return; }\n    if (!allyAlive) { this.finish('lose', events); return; }\n\n    for (const key of [SIDE.ALLY, SIDE.FOE]) {\n      const side = this.sides[key];\n      const active = side.team[side.index];\n      if (active && active.fainted) {\n        if (side.isPlayer) {\n          this.pendingSwitch = key;\n        } else {\n          const next = side.team.findIndex((c) => !c.fainted);\n          if (next >= 0) {\n            side.index = next;\n            events.push(this.emit({ t: 'switch', side: key, index: next, name: nameOf(side.team[next]), text: `${side.name} sends out ${nameOf(side.team[next])}!` }));\n          }\n        }\n      }\n    }\n  }\n\n  /** Distribute XP from a defeated foe and resolve level-ups/evolutions. */\n  awardXp(defeated, events) {\n    const species = getSpecies(defeated.speciesId);\n    const isTrainer = this.kind === 'trainer';\n    const pool = this.sides[SIDE.ALLY].team.filter((c) => c.participated || !c.fainted);\n    const recipients = pool.length ? pool : [this.active(SIDE.ALLY)].filter(Boolean);\n    for (const member of recipients) {\n      if (!member.ref || member.fainted) continue;\n      const share = member.participated ? 1 : 0.5;\n      const amount = Math.max(1, Math.floor((species.xp * defeated.level) / 7 * (isTrainer ? 1.5 : 1) * share));\n      events.push(this.emit({ t: 'xp', uid: member.uid, name: nameOf(member), amount }));\n      if (member.ref.level >= LEVEL_CAP) continue;\n      const report = gainXp(member.ref, amount);\n      member.participated = true;\n      for (const lv of report.levels) {\n        events.push(this.emit({ t: 'level', uid: member.uid, name: nameOf(member), level: lv, learned: report.learned }));\n        member.level = member.ref.level;\n        member.maxHp = maxHpOf(member.ref);\n        member.stats = statsFor(member.ref);\n        member.hp = member.ref.hp;\n        for (const m of report.learned) {\n          events.push(this.emit({ t: 'learned', uid: member.uid, name: nameOf(member), moveId: m, moveName: getMove(m).name }));\n        }\n        member.moves = [...member.ref.moves];\n      }\n      if (report.evolved) {\n        events.push(this.emit({\n          t: 'evolve', uid: member.uid, from: report.evolved.from, to: report.evolved.to,\n          name: getSpecies(report.evolved.to).name,\n          oldName: getSpecies(report.evolved.from).name,\n          text: `${getSpecies(report.evolved.from).name} is evolving…`,\n        }));\n        member.speciesId = member.ref.speciesId;\n        member.species = getSpecies(member.speciesId);\n        member.moves = [...member.ref.moves];\n        member.maxHp = maxHpOf(member.ref);\n        member.stats = statsFor(member.ref);\n        member.hp = member.ref.hp;\n      }\n    }\n  }\n\n  /** Send in a replacement for the player (also used after a forced switch). */\n  sendIn(index) {\n    const events = [];\n    const side = this.sides[SIDE.ALLY];\n    const target = side.team[index];\n    if (!target || target.fainted || index === side.index) {\n      return [{ t: 'msg', text: 'That creature can’t battle right now.' }];\n    }\n    const start = this.log.length;\n    side.index = index;\n    target.participated = true;\n    this.pendingSwitch = null;\n    events.push(this.emit({ t: 'switch', side: SIDE.ALLY, index, name: nameOf(target), text: `Go, ${nameOf(target)}!` }));\n    return this.log.slice(start);\n  }\n\n  /** Terminate the battle. */\n  finish(outcome, events) {\n    if (this.over) return;\n    this.over = true;\n    this.outcome = outcome;\n    // Persist final HP for every participant.\n    for (const key of [SIDE.ALLY, SIDE.FOE]) {\n      for (const c of this.sides[key].team) c.ref.hp = c.hp;\n    }\n    const text = {\n      win: 'You won the battle!',\n      lose: 'You blacked out… your team was rushed to the nearest Node.',\n      flee: 'You escaped.',\n      caught: 'Capture successful!',\n    }[outcome] || 'The battle ended.';\n    events.push(this.emit({ t: 'end', outcome, text }));\n  }\n\n  /* -------------------------------------------------------------------- AI */\n\n  /** Pick an action for the opposing side. */\n  chooseFoeAction() {\n    const me = this.active(SIDE.FOE);\n    const them = this.active(SIDE.ALLY);\n    if (!me) return { type: 'flee' };\n    if (!them) return { type: 'move', moveId: me.moves[0] };\n\n    const damaging = me.moves.map((id) => ({ id, move: getMove(id) })).filter((m) => m.move.power > 0);\n    if (damaging.length && this.rng.next() < 0.72) {\n      let best = damaging[0];\n      let bestScore = -1;\n      for (const cand of damaging) {\n        const score = expectedDamage(me, them, cand.move);\n        if (score > bestScore) { bestScore = score; best = cand; }\n      }\n      return { type: 'move', moveId: best.id };\n    }\n    // Status / setup moves as a secondary option.\n    const utility = me.moves.filter((id) => {\n      const m = getMove(id);\n      return m.power === 0 && m.effect;\n    });\n    if (utility.length && this.rng.next() < 0.6) {\n      return { type: 'move', moveId: this.rng.pick(utility) };\n    }\n    return { type: 'move', moveId: this.rng.pick(me.moves) || me.moves[0] };\n  }\n\n  /** Debug/test helper: a compact, JSON-safe view of the battle. */\n  snapshot() {\n    const view = (key) => this.sides[key].team.map((c) => ({\n      name: nameOf(c), speciesId: c.speciesId, hp: c.hp, maxHp: c.maxHp,\n      status: c.status, fainted: c.fainted, stages: { ...c.stages },\n    }));\n    return {\n      turn: this.turn, over: this.over, outcome: this.outcome,\n      ally: { index: this.sides[SIDE.ALLY].index, team: view(SIDE.ALLY) },\n      foe: { index: this.sides[SIDE.FOE].index, team: view(SIDE.FOE) },\n    };\n  }\n}\n\n/* --------------------------------------------------------------- utilities */\n\nfunction firstHealthyIndex(team) {\n  const i = team.findIndex((c) => c.hp > 0);\n  return i >= 0 ? i : 0;\n}\n\nfunction nameOf(c) {\n  return c.nickname || c.species?.name || getSpecies(c.speciesId).name;\n}\n\nfunction statusVerb(status) {\n  return { burn: 'burned', poison: 'poisoned', paralyze: 'paralysed', freeze: 'frozen solid', sleep: 'put to sleep' }[status] || status;\n}\n\nfunction statLabel(stat) {\n  return { atk: 'Attack', def: 'Defence', spd: 'Speed' }[stat] || stat;\n}\n\n/**\n * Type-effectiveness hint shown next to move buttons (no RNG, no damage range).\n * @param {string} moveId\n * @param {string[]} defenderTypes\n * @returns {{mult:number, label:string}}\n */\nexport function typeHint(moveId, defenderTypes) {\n  const move = getMove(moveId);\n  const mult = effectiveness(move.type, defenderTypes);\n  return { mult, label: effectivenessLabel(mult) };\n}\n\nexport { displayName };\n"},{"key":"src/ui/dom.js","code":"/**\n * dom.js — Tiny hyperscript helpers.\n *\n * We deliberately avoid a framework: the app is a small set of screens with\n * coarse re-render boundaries, so a 90-line DOM helper keeps the bundle at\n * ~0 dependencies while staying readable.\n *\n *   h('div.card', { onclick }, [ h('h3', 'Hello'), ' world' ])\n *\n * Tag strings support `tag.class.class#id` shorthand. Text children are always\n * escaped (we never assign innerHTML from user data — see security doc).\n *\n * @module ui/dom\n */\n\n/**\n * Create an element.\n * @param {string} tagLike 'div.card.card--pad#main'\n * @param {object|string|null} [props] Attributes, event handlers (`on*`), dataset, style, class.\n * @param {...any} children Strings, nodes, arrays or null/false (ignored).\n * @returns {HTMLElement}\n */\nexport function h(tagLike, props, ...children) {\n  const [tagAndClasses, id] = tagLike.split('#');\n  const parts = tagAndClasses.split('.');\n  const tag = parts.shift() || 'div';\n  const el = document.createElement(tag);\n  if (parts.length) el.classList.add(...parts.filter(Boolean));\n  if (id) el.id = id;\n\n  if (props && typeof props === 'object' && !Array.isArray(props) && !(props instanceof Node)) {\n    for (const [key, value] of Object.entries(props)) {\n      if (value === null || value === undefined || value === false) continue;\n      if (key === 'class' || key === 'className') {\n        el.classList.add(...String(value).split(/\\s+/).filter(Boolean));\n      } else if (key === 'style' && typeof value === 'object') {\n        Object.assign(el.style, value);\n      } else if (key === 'dataset') {\n        Object.assign(el.dataset, value);\n      } else if (key === 'html') {\n        // Trusted markup only (our own sprite generator). Never pass user data.\n        el.innerHTML = value;\n      } else if (key.startsWith('on') && typeof value === 'function') {\n        el.addEventListener(key.slice(2).toLowerCase(), value);\n      } else if (key in el && key !== 'list' && typeof value !== 'object') {\n        el[key] = value;\n      } else {\n        el.setAttribute(key, value === true ? '' : String(value));\n      }\n    }\n  } else if (props !== null && props !== undefined) {\n    // h('p', 'text') form\n    children.unshift(props);\n  }\n\n  append(el, children);\n  return el;\n}\n\n/** Append nested children (arrays flattened, null/false skipped). */\nexport function append(parent, children) {\n  for (const child of children.flat(Infinity)) {\n    if (child === null || child === undefined || child === false || child === true) continue;\n    parent.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));\n  }\n  return parent;\n}\n\n/** Remove all children. */\nexport function clear(el) {\n  while (el.firstChild) el.removeChild(el.firstChild);\n  return el;\n}\n\n/** Replace the entire contents of a container. */\nexport function renderInto(el, ...children) {\n  clear(el);\n  append(el, children);\n  return el;\n}\n\n/** Shorthand query selector. */\nexport function qs(sel, root = document) { return root.querySelector(sel); }\n\n/** Create a DocumentFragment from children (for batch insertion). */\nexport function fragment(...children) {\n  const frag = document.createDocumentFragment();\n  append(frag, children);\n  return frag;\n}\n\n/**\n * Format a number with thousands separators (locale-stable).\n * @param {number} n\n */\nexport function num(n) {\n  return Number(n ?? 0).toLocaleString('en-GB');\n}\n\n/** Percentage helper for bars. */\nexport function pct(value, max) {\n  if (!max) return 0;\n  return Math.max(0, Math.min(100, (value / max) * 100));\n}\n"},{"key":"src/ui/sprite.js","code":"/**\n * sprite.js — Procedural creature renderer (\"living concept art\", zero assets).\n *\n * Every DigiPoke creature is drawn as inline SVG generated from the `art`\n * descriptor on its species record. This is a deliberate product decision:\n *\n *   • 0 KB of image payload — the whole game ships as text.\n *   • Recolouring (Glitch/shiny variants) is a hue rotation, not new art.\n *   • Sprites animate: breathing, blinking, elemental motes, mood expressions.\n *\n * Rendering pipeline (bottom to top):\n *   ground shadow → elemental aura → back appendages (wings/tail) → body with\n *   gradient shading → belly → pattern → limbs → head → face (eyes/mouth) →\n *   crest/spikes → rim light → mood FX\n *\n * All coordinates live in a 120×120 viewBox. Colours are derived from two\n * inputs (body + accent) via HSL manipulation, so a single palette change\n * re-skins an entire species.\n *\n * @module ui/sprite\n */\n\n/** Monotonic counter: guarantees unique gradient ids across many instances. */\nlet instanceCounter = 0;\n\n/**\n * Render a creature as an inline SVG string.\n *\n * @param {object} art Species art descriptor.\n * @param {object} [opts]\n * @param {number} [opts.size=96] Rendered size in px.\n * @param {boolean} [opts.shiny] Glitch (shiny) palette + sparkles.\n * @param {'idle'|'happy'|'attack'|'hurt'|'faint'|'reveal'} [opts.mood]\n * @param {'left'|'right'} [opts.flip] Facing direction.\n * @param {boolean} [opts.animate=true] Include idle/blink animations.\n * @returns {string} SVG markup.\n */\nexport function sprite(art, { size = 96, shiny = false, mood = 'idle', flip = 'right', animate = true } = {}) {\n  const a = normaliseArt(art, shiny);\n  const id = `sp${++instanceCounter}`;\n  const body = renderBody(a, id, mood);\n  const flipAttr = flip === 'left' ? ' transform=\"translate(120,0) scale(-1,1)\"' : '';\n  const animClass = animate ? ` sp--${mood}` : '';\n\n  return `<svg class=\"sprite${animClass}\" width=\"${size}\" height=\"${size}\" viewBox=\"0 0 120 120\" \\\nrole=\"img\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">\\\n${defs(a, id)}\\\n<ellipse class=\"sp-shadow\" cx=\"60\" cy=\"110\" rx=\"32\" ry=\"6.5\" fill=\"#04070e\" opacity=\"0.34\"/>\\\n<circle cx=\"60\" cy=\"62\" r=\"55\" fill=\"url(#aura${id})\"/>\\\n${a.stage === 'mega' || a.stage === 'ultimate' ? motes(a, id) : ''}\\\n<g${flipAttr}>${body}<\/g>\\\n${shiny ? sparkles(a) : ''}\\\n<\/svg>`;\n}\n\n/* --------------------------------------------------------------- normalise */\n\n/** Apply defaults and the Glitch recolour. */\nfunction normaliseArt(art, shiny) {\n  const a = {\n    shape: 'blob', body: '#8ea0c8', accent: '#d9e2f2', eye: 2, tail: 0,\n    spikes: 0, wings: 0, pattern: 'none', aura: '#9aa7c4', stage: 'rookie',\n    ...art,\n  };\n  if (shiny) {\n    a.body = shiftHue(a.body, 165);\n    a.accent = shiftHue(a.accent, 165);\n    a.aura = shiftHue(a.aura, 165);\n    a.glitch = true;\n  }\n  return a;\n}\n\n/* -------------------------------------------------------------------- defs */\n\nfunction defs(a, id) {\n  return `<defs>\\\n<linearGradient id=\"body${id}\" x1=\"0.25\" y1=\"0\" x2=\"0.62\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"${lighten(a.body, 30)}\"/>\\\n<stop offset=\"45%\" stop-color=\"${a.body}\"/>\\\n<stop offset=\"100%\" stop-color=\"${darken(a.body, 26)}\"/>\\\n<\/linearGradient>\\\n<radialGradient id=\"belly${id}\" cx=\"0.5\" cy=\"0.34\" r=\"0.72\">\\\n<stop offset=\"0%\" stop-color=\"${lighten(a.accent, 34)}\" stop-opacity=\"0.96\"/>\\\n<stop offset=\"70%\" stop-color=\"${a.accent}\" stop-opacity=\"0.55\"/>\\\n<stop offset=\"100%\" stop-color=\"${darken(a.accent, 12)}\" stop-opacity=\"0.08\"/>\\\n<\/radialGradient>\\\n<radialGradient id=\"aura${id}\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\">\\\n<stop offset=\"0%\" stop-color=\"${a.aura}\" stop-opacity=\"${a.stage === 'mega' ? 0.5 : 0.34}\"/>\\\n<stop offset=\"62%\" stop-color=\"${a.aura}\" stop-opacity=\"0.12\"/>\\\n<stop offset=\"100%\" stop-color=\"${a.aura}\" stop-opacity=\"0\"/>\\\n<\/radialGradient>\\\n<linearGradient id=\"sheen${id}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"#ffffff\" stop-opacity=\"0.42\"/>\\\n<stop offset=\"100%\" stop-color=\"#ffffff\" stop-opacity=\"0\"/>\\\n<\/linearGradient>\\\n<\/defs>`;\n}\n\n/** Orbiting elemental motes for evolved forms. */\nfunction motes(a, id) {\n  const count = a.stage === 'mega' ? 6 : 3;\n  let out = '';\n  for (let i = 0; i < count; i++) {\n    const angle = (i / count) * Math.PI * 2;\n    const cx = 60 + Math.cos(angle) * 42;\n    const cy = 60 + Math.sin(angle) * 38;\n    out += `<circle cx=\"${cx.toFixed(1)}\" cy=\"${cy.toFixed(1)}\" r=\"${a.stage === 'mega' ? 2.6 : 1.9}\" fill=\"${a.aura}\" opacity=\"0.75\">\\\n<animate attributeName=\"opacity\" values=\"0.2;0.9;0.2\" dur=\"${(2.4 + i * 0.35).toFixed(2)}s\" repeatCount=\"indefinite\" begin=\"${(i * 0.28).toFixed(2)}s\"/>\\\n<animateTransform attributeName=\"transform\" type=\"rotate\" from=\"${(angle * 57).toFixed(0)} 60 60\" to=\"${(angle * 57 + 360).toFixed(0)} 60 60\" dur=\"${14 + i}s\" repeatCount=\"indefinite\"/>\\\n<\/circle>`;\n  }\n  return `<g class=\"sp-motes\">${out}<\/g>`;\n}\n\n/** Glitch-variant sparkles. */\nfunction sparkles(a) {\n  const pts = [[26, 34], [94, 44], [40, 92], [88, 86]];\n  return `<g class=\"sp-sparkles\">${pts.map(([x, y], i) => `<path d=\"M${x} ${y - 5} L${x + 1.6} ${y} L${x + 5} ${y + 1.6} L${x + 1.6} ${y + 3.2} L${x} ${y + 8} L${x - 1.6} ${y + 3.2} L${x - 5} ${y + 1.6} L${x - 1.6} ${y} Z\" fill=\"#fff\" opacity=\"0.85\">\\\n<animate attributeName=\"opacity\" values=\"0;0.95;0\" dur=\"2.2s\" begin=\"${(i * 0.55).toFixed(2)}s\" repeatCount=\"indefinite\"/>\\\n<\/path>`).join('')}<\/g>`;\n}\n\n/* ------------------------------------------------------------------- faces */\n\n/**\n * Big, expressive eyes — the single biggest driver of \"cuteness\".\n * Sclera + iris + pupil + two highlights + eyelid + brow.\n */\nfunction eyes(a, cx, cy, r, mood, count = 2) {\n  const n = Math.max(1, Math.min(6, count || 2));\n  const spread = n === 1 ? 0 : (n <= 2 ? r * 2.05 : r * 1.7);\n  const startX = cx - (spread * (n - 1)) / 2;\n  const irisColor = a.eyeColor || darken(a.accent, 26);\n\n  // Fainted: X X. Hurt: > <. Happy: ^ ^.\n  if (mood === 'faint') {\n    let out = '';\n    for (let i = 0; i < n; i++) {\n      const x = startX + i * spread;\n      out += `<g stroke=\"#2a2f3d\" stroke-width=\"2.6\" stroke-linecap=\"round\">\\\n<line x1=\"${x - r * 0.7}\" y1=\"${cy - r * 0.7}\" x2=\"${x + r * 0.7}\" y2=\"${cy + r * 0.7}\"/>\\\n<line x1=\"${x + r * 0.7}\" y1=\"${cy - r * 0.7}\" x2=\"${x - r * 0.7}\" y2=\"${cy + r * 0.7}\"/>\\\n<\/g>`;\n    }\n    return out;\n  }\n  if (mood === 'happy') {\n    let out = '';\n    for (let i = 0; i < n; i++) {\n      const x = startX + i * spread;\n      out += `<path d=\"M${x - r} ${cy + r * 0.35} Q${x} ${cy - r * 0.95} ${x + r} ${cy + r * 0.35}\" fill=\"none\" stroke=\"#2a2f3d\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>`;\n    }\n    return out;\n  }\n\n  let out = '<g class=\"sp-eyes\">';\n  for (let i = 0; i < n; i++) {\n    const x = startX + i * spread;\n    const er = n > 3 ? r * 0.82 : r;\n    out += `<ellipse cx=\"${x.toFixed(1)}\" cy=\"${cy}\" rx=\"${er}\" ry=\"${(er * 1.1).toFixed(1)}\" fill=\"#ffffff\" stroke=\"${darken(a.body, 46)}\" stroke-width=\"1.4\"/>\\\n<ellipse cx=\"${(x + er * 0.12).toFixed(1)}\" cy=\"${(cy + er * 0.08).toFixed(1)}\" rx=\"${(er * 0.62).toFixed(1)}\" ry=\"${(er * 0.72).toFixed(1)}\" fill=\"${irisColor}\"/>\\\n<ellipse cx=\"${(x + er * 0.12).toFixed(1)}\" cy=\"${(cy + er * 0.05).toFixed(1)}\" rx=\"${(er * 0.3).toFixed(1)}\" ry=\"${(er * 0.4).toFixed(1)}\" fill=\"#141821\"/>\\\n<circle cx=\"${(x - er * 0.24).toFixed(1)}\" cy=\"${(cy - er * 0.3).toFixed(1)}\" r=\"${(er * 0.3).toFixed(1)}\" fill=\"#fff\" opacity=\"0.95\"/>\\\n<circle cx=\"${(x + er * 0.42).toFixed(1)}\" cy=\"${(cy + er * 0.34).toFixed(1)}\" r=\"${(er * 0.15).toFixed(1)}\" fill=\"#fff\" opacity=\"0.7\"/>`;\n    if (mood === 'attack' || mood === 'hurt') {\n      // Angled brow for aggression / pain.\n      const dir = mood === 'attack' ? -1 : 1;\n      out += `<path d=\"M${x - er * 0.95} ${cy - er * (1.05 + dir * 0.12)} L${x + er * 0.95} ${cy - er * (1.45 + dir * 0.12)}\" stroke=\"${darken(a.body, 52)}\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n    }\n  }\n  out += '<\/g>';\n  return out;\n}\n\n/** Mouth: varies by mood. */\nfunction mouth(cx, cy, mood, w = 9) {\n  if (mood === 'faint') {\n    return `<ellipse cx=\"${cx}\" cy=\"${cy + 2}\" rx=\"${w * 0.55}\" ry=\"${w * 0.62}\" fill=\"#3a2f38\" opacity=\"0.85\"/>`;\n  }\n  if (mood === 'hurt') {\n    return `<path d=\"M${cx - w * 0.6} ${cy + 3} Q${cx} ${cy - 3} ${cx + w * 0.6} ${cy + 3}\" fill=\"none\" stroke=\"#3a2f38\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n  }\n  if (mood === 'attack') {\n    return `<path d=\"M${cx - w * 0.7} ${cy} L${cx} ${cy + w * 0.5} L${cx + w * 0.7} ${cy} Z\" fill=\"#3a2f38\"/>`;\n  }\n  return `<path d=\"M${cx - w * 0.55} ${cy} Q${cx} ${cy + w * 0.62} ${cx + w * 0.55} ${cy}\" fill=\"none\" stroke=\"#3a2f38\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n}\n\n/** Soft blush patches — instant appeal on cute creatures. */\nfunction blush(cx, cy, spread, color = '#ff7d9c', o = 0.4) {\n  return `<ellipse cx=\"${cx - spread}\" cy=\"${cy}\" rx=\"6\" ry=\"3.6\" fill=\"${color}\" opacity=\"${o}\"/>\\\n<ellipse cx=\"${cx + spread}\" cy=\"${cy}\" rx=\"6\" ry=\"3.6\" fill=\"${color}\" opacity=\"${o}\"/>`;\n}\n\n/* -------------------------------------------------------------- body parts */\n\n/** Rounded limb with a paw/claw tip. */\nfunction limb(x, y, w, h, color, { rx = null, claw = false, vertical = true } = {}) {\n  const r = rx ?? w / 2;\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${r}\" fill=\"${color}\" stroke=\"${darken(color, 34)}\" stroke-width=\"1.6\"/>\\\n${claw ? `<circle cx=\"${x + w / 2}\" cy=\"${vertical ? y + h - 1.5 : y + h / 2}\" r=\"${w * 0.42}\" fill=\"${lighten(color, 16)}\" stroke=\"${darken(color, 34)}\" stroke-width=\"1.2\"/>` : ''}`;\n}\n\n/** Dorsal spikes / crest. */\nfunction spikes(a, cx, cy, count, scale = 1) {\n  const n = Math.max(0, Math.min(6, count || 0));\n  if (!n) return '';\n  let out = '';\n  for (let i = 0; i < n; i++) {\n    const t = n === 1 ? 0.5 : i / (n - 1);\n    const x = cx - 22 + t * 44;\n    const y = cy - Math.sin(t * Math.PI) * 6;\n    const h = (12 + Math.sin(t * Math.PI) * 8) * scale;\n    out += `<path d=\"M${x - 6 * scale} ${y} L${x} ${y - h} L${x + 6 * scale} ${y} Z\" fill=\"${a.accent}\" stroke=\"${darken(a.body, 40)}\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>`;\n  }\n  return out;\n}\n\n/** Wing pair (behind the body). */\nfunction wings(a, left = true, right = true, y = 56) {\n  let out = '';\n  if (left) {\n    out += `<path class=\"sp-wing sp-wing--l\" d=\"M44 ${y} C18 ${y - 26} 6 ${y - 6} 12 ${y + 16} C22 ${y + 22} 36 ${y + 16} 44 ${y + 10} Z\" fill=\"${a.accent}\" opacity=\"0.94\" stroke=\"${darken(a.body, 38)}\" stroke-width=\"2\" stroke-linejoin=\"round\"/>`;\n  }\n  if (right) {\n    out += `<path class=\"sp-wing sp-wing--r\" d=\"M76 ${y} C102 ${y - 26} 114 ${y - 6} 108 ${y + 16} C98 ${y + 22} 84 ${y + 16} 76 ${y + 10} Z\" fill=\"${a.accent}\" opacity=\"0.94\" stroke=\"${darken(a.body, 38)}\" stroke-width=\"2\" stroke-linejoin=\"round\"/>`;\n  }\n  return out;\n}\n\n/** Tapered tail behind the body. */\nfunction tail(a, x, y, dx = 26, dy = -18) {\n  return `<path class=\"sp-tail\" d=\"M${x} ${y} q${dx * 0.6} ${dy * 0.2} ${dx} ${dy}\" fill=\"none\" stroke=\"${a.body}\" stroke-width=\"9\" stroke-linecap=\"round\"/>\\\n<path d=\"M${x} ${y} q${dx * 0.6} ${dy * 0.2} ${dx} ${dy}\" fill=\"none\" stroke=\"${a.accent}\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\"0.55\"/>`;\n}\n\n/** Skin pattern overlay, clipped to a circle around (cx, cy). */\nfunction pattern(a, cx, cy, r, id) {\n  const clip = `clip${id}`;\n  const open = `<g clip-path=\"url(#${clip})\">`;\n  const close = '<\/g>';\n  const def = `<clipPath id=\"${clip}\"><circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\"/><\/clipPath>`;\n  let inner = '';\n  switch (a.pattern) {\n    case 'stripe':\n      inner = `<path d=\"M${cx - r} ${cy + 6} q${r} -12 ${r * 2} 2\" stroke=\"${a.accent}\" stroke-width=\"4.5\" fill=\"none\" opacity=\"0.8\" stroke-linecap=\"round\"/>\n               <path d=\"M${cx - r} ${cy + 18} q${r} -12 ${r * 2} 2\" stroke=\"${a.accent}\" stroke-width=\"4\" fill=\"none\" opacity=\"0.6\" stroke-linecap=\"round\"/>`;\n      break;\n    case 'spot':\n      inner = `<circle cx=\"${cx - r * 0.42}\" cy=\"${cy + r * 0.1}\" r=\"${r * 0.24}\" fill=\"${a.accent}\" opacity=\"0.85\"/>\n               <circle cx=\"${cx + r * 0.36}\" cy=\"${cy - r * 0.18}\" r=\"${r * 0.17}\" fill=\"${a.accent}\" opacity=\"0.75\"/>\n               <circle cx=\"${cx + r * 0.08}\" cy=\"${cy + r * 0.46}\" r=\"${r * 0.14}\" fill=\"${a.accent}\" opacity=\"0.65\"/>`;\n      break;\n    case 'leaf':\n      inner = `<path d=\"M${cx} ${cy - r * 0.5} q${r * 0.7} -${r * 0.55} ${r * 0.2} ${r * 0.85} q${-r * 0.62} ${r * 0.05} -${r * 0.2} -${r * 0.85}z\" fill=\"${a.accent}\" opacity=\"0.85\"/>\n               <path d=\"M${cx} ${cy - r * 0.2} l${r * 0.4} ${r * 0.42}\" stroke=\"${darken(a.accent, 30)}\" stroke-width=\"1.6\" fill=\"none\" opacity=\"0.6\"/>`;\n      break;\n    case 'bolt':\n      inner = `<path d=\"M${cx + 3} ${cy - r * 0.6} l-${r * 0.42} ${r * 0.6} h${r * 0.28} l-${r * 0.2} ${r * 0.62} l${r * 0.48} -${r * 0.66} h-${r * 0.3} z\" fill=\"${a.accent}\" opacity=\"0.92\"/>`;\n      break;\n    case 'crystal':\n      inner = `<path d=\"M${cx - r * 0.5} ${cy + r * 0.34} l${r * 0.44} -${r * 0.86} l${r * 0.46} ${r * 0.86} z\" fill=\"${a.accent}\" opacity=\"0.8\"/>\n               <path d=\"M${cx - r * 0.06} ${cy - r * 0.52} l${r * 0.28} ${r * 0.86}\" stroke=\"#fff\" stroke-width=\"1.4\" opacity=\"0.5\" fill=\"none\"/>`;\n      break;\n    case 'stone':\n      inner = `<path d=\"M${cx - r * 0.62} ${cy + r * 0.24} l${r * 0.34} -${r * 0.5} l${r * 0.5} ${r * 0.12} l${r * 0.16} ${r * 0.42} z\" fill=\"${darken(a.accent, 10)}\" opacity=\"0.5\"/>`;\n      break;\n    case 'circuit':\n      inner = `<g stroke=\"${a.accent}\" stroke-width=\"1.9\" fill=\"none\" opacity=\"0.9\">\n                 <path d=\"M${cx - r * 0.66} ${cy - r * 0.24} h${r * 1.3}\"/>\n                 <path d=\"M${cx - r * 0.44} ${cy + r * 0.16} h${r}\"/>\n                 <path d=\"M${cx + r * 0.26} ${cy - r * 0.24} v${r * 0.62}\"/>\n               <\/g>\n               <circle cx=\"${cx - r * 0.66}\" cy=\"${cy + r * 0.16}\" r=\"2.6\" fill=\"${a.accent}\"/>\n               <circle cx=\"${cx + r * 0.56}\" cy=\"${cy + r * 0.16}\" r=\"2.2\" fill=\"${a.accent}\"/>`;\n      break;\n    default:\n      inner = '';\n  }\n  return inner ? def + open + inner + close : '';\n}\n\n/** Top-left glossy highlight that makes the body read as 3D. */\nfunction gloss(cx, cy, rx, ry, id) {\n  return `<ellipse cx=\"${cx - rx * 0.34}\" cy=\"${cy - ry * 0.42}\" rx=\"${rx * 0.42}\" ry=\"${ry * 0.26}\" fill=\"url(#sheen${id})\" transform=\"rotate(-24 ${cx - rx * 0.34} ${cy - ry * 0.42})\"/>`;\n}\n\n/* ------------------------------------------------------------------ shapes */\n\nfunction renderBody(a, id, mood) {\n  const builders = {\n    blob: buildBlob, quad: buildQuad, biped: buildBiped, serpent: buildSerpent,\n    winged: buildWinged, aquatic: buildAquatic, mech: buildMech,\n  };\n  return (builders[a.shape] || buildBlob)(a, id, mood);\n}\n\n/** Cute round creature: big head-body, tiny limbs. */\nfunction buildBlob(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 58) : ''}\\\n${a.tail ? tail(a, 82, 82, 24, -16) : ''}\\\n${limb(28, 88, 15, 16, darken(a.body, 12), { claw: true })}\\\n${limb(76, 88, 15, 16, darken(a.body, 12), { claw: true })}\\\n<ellipse cx=\"60\" cy=\"66\" rx=\"38\" ry=\"35\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 60, 70, 34, id)}\\\n<ellipse cx=\"60\" cy=\"80\" rx=\"21\" ry=\"17\" fill=\"url(#belly${id})\"/>\\\n${gloss(60, 66, 38, 35, id)}\\\n${limb(20, 70, 13, 12, darken(a.body, 8), { claw: true })}\\\n${limb(87, 70, 13, 12, darken(a.body, 8), { claw: true })}\\\n${spikes(a, 60, 40, a.spikes, 0.9)}\\\n${eyes(a, 60, 60, 9.5, mood, a.eye)}\\\n${blush(60, 74, 20, '#ff7d9c', mood === 'faint' ? 0.15 : 0.42)}\\\n${mouth(60, 74, mood, 10)}\\\n<\/g>`;\n}\n\n/** Quadruped: beast with a raised head, four legs and a tail. */\nfunction buildQuad(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 56) : ''}\\\n${a.tail ? tail(a, 86, 70, 2
