tion arrowNav(e, group, index, count) {\n  const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };\n  const step = keys[e.key];\n  if (!step) return;\n  e.preventDefault();\n  const next = (index + step + count) % count;\n  const target = document.querySelector(`.opt[data-group=\"${group}\"][data-index=\"${next}\"]`);\n  if (target) { target.focus(); sfx.hover(); }\n}\n\n/** Commit an option: remember focus, animate, re-render. */\nfunction commitOption(group, optId) {\n  if (wizard.tamer[group] === optId) { sfx.select(); return; }\n  wizard.tamer = { ...wizard.tamer, [group]: optId };\n  previewTamer = null;\n  hoverOpt = null;\n  justChanged = true;\n  pendingFocus = `${group}:${optId}`;\n  sfx.select();\n  navigate('/onboarding');\n}\n\n/**\n * A burst of sparks on the pedestal whenever the player accepts a change.\n * Purely decorative, pointer-events: none, and cleaned up after it plays.\n */\nfunction emitSparks() {\n  const host = document.querySelector('.stage__sparks');\n  if (!host) return;\n  for (let i = 0; i < 10; i += 1) {\n    const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.5;\n    const dist = 70 + Math.random() * 60;\n    const spark = h('span.spark', {\n      style: {\n        '--sx': `${Math.cos(angle) * dist}px`,\n        '--sy': `${Math.sin(angle) * dist}px`,\n        '--sd': `${Math.round(Math.random() * 120)}ms`,\n        background: i % 3 === 0 ? 'var(--accent-2)' : 'var(--accent)',\n      },\n    });\n    host.appendChild(spark);\n    setTimeout(() => spark.remove(), 900);\n  }\n  const avatar = document.querySelector('.stage__avatar');\n  if (avatar) {\n    avatar.classList.remove('is-pop');\n    void avatar.offsetWidth;\n    avatar.classList.add('is-pop');\n  }\n}\n\nfunction stepAppearance() {\n  const ctx = {};\n  const stage = h('div.stage', [\n    h('div.stage__ring'),\n    h('div.stage__sparks', { 'aria-hidden': 'true' }),\n    h('div.stage__avatar', tamerEl(wizard.tamer, { size: 230, mood: 'happy' })),\n    h('p.stage__caption', 'Your Tamer'),\n  ]);\n  if (justChanged) stage.classList.add('is-pop');\n\n  return h('div.creator', [\n    h('div.creator__head', [\n      h('h2.creator__title', 'Design your Tamer'),\n      h('p.muted', 'Step 2 of 3 · Appearance'),\n    ]),\n    h('div.creator__grid', [\n      h('div.creator__preview', [\n        stage,\n        h('p.muted.muted--sm', `${combinationCount().toLocaleString('en-GB')} possible Tamers — none of them stored anywhere but here.`),\n      ]),\n      card(null,\n        groupUi('skin', 'Skin tone', ctx),\n        groupUi('hairStyle', 'Hair style', ctx),\n        groupUi('hairColor', 'Hair colour', ctx),\n        groupUi('outfit', 'Outfit', ctx),\n        groupUi('accessory', 'Accessory', ctx),\n        groupUi('eyes', 'Expression', ctx),\n        h('div.row.row--between', [\n          h('button.btn.btn--ghost', { type: 'button', onclick: () => goTo(1, 'back') }, 'Back'),\n          h('div.row', [\n            h('button.btn.btn--ghost', {\n              type: 'button',\n              onclick: () => {\n                wizard.tamer = randomTamer(createRng(Date.now() >>> 0).next);\n                previewTamer = null;\n                hoverOpt = null;\n                focusOpt = null;\n                justChanged = true;\n                sfx.confirm();\n                navigate('/onboarding');\n              },\n            }, '🎲 Surprise me'),\n            h('button.btn.btn--primary.btn--lg', { type: 'button', onclick: () => goTo(3, 'confirm') }, 'Continue'),\n          ]),\n        ]),\n      ),\n    ]),\n  ]);\n}\n/* ------------------------------------------------------------- 3. partner */\n\n/**\n * Playstyle summary derived from the species' base stats.\n *\n * Three cards with near-identical numbers tell the player nothing; a single\n * word (\"Hard hitter\", \"Sturdy\", \"Swift\") is what actually drives the choice.\n *\n * @param {object} species\n * @returns {string}\n */\nfunction playstyleTag(species) {\n  const { atk, def, spd, hp } = species.base;\n  // HP lives on a different scale to the other three (roughly 1.55x), so it is\n  // normalised before comparison — otherwise every species reads as \"Tough\".\n  const scores = [\n    { key: 'atk', value: atk, label: 'Hard hitter' },\n    { key: 'def', value: def, label: 'Sturdy' },\n    { key: 'spd', value: spd, label: 'Swift' },\n    { key: 'hp', value: hp / 1.55, label: 'Tough' },\n  ].sort((a, b) => b.value - a.value);\n  // Within a few points of each other there is no honest speciality.\n  if (scores[0].value - scores[scores.length - 1].value <= 6) return 'All-rounder';\n  return scores[0].label;\n}\n\n/**\n * Stat row for the partner showcase.\n *\n * The bar compares *natural strength* (base stats, normalised into a readable\n * band) rather than the level-5 number, because that is what differs between\n * the three starters. The trailing figure is where the stat lands at level 50,\n * so the player can see what they are growing into.\n */\nfunction partnerStat(label, value, base, potential, color) {\n  const scaled = Math.max(6, Math.min(100, ((base - 28) / 30) * 100));\n  // Start empty and grow on the next frame: the bar is the first thing the eye\n  // lands on, so it has to move rather than simply appear.\n  const fill = h('div.bar__fill', { style: { background: color, width: '0%' } });\n  requestAnimationFrame(() => { fill.style.width = `${scaled}%`; });\n  return h('div.stat-row.partner__stat', [\n    h('div.stat-row__head', [\n      h('span.stat-row__label', label),\n      h('span.stat-row__value', String(value)),\n    ]),\n    h('div.bar.bar--stat', fill),\n    h('span.stat-row__potential', `→ ${potential} at Lv 50`),\n  ]);\n}\n\nfunction stepStarter() {\n  const selected = getSpecies(wizard.starter);\n  const CORES = { hp: 8, atk: 8, def: 8, spd: 8 };\n  const previewStats = statsFor({ speciesId: wizard.starter, level: 5, cores: CORES });\n  const ceiling = statsFor({ speciesId: wizard.starter, level: 50, cores: { hp: 15, atk: 15, def: 15, spd: 15 } });\n  const moves = movesAtLevel({ speciesId: wizard.starter, level: 5, moves: [], cores: CORES });\n  const upcoming = (learnsetFor(wizard.starter) || []).filter((m) => m.level > 5).slice(0, 2);\n\n  const cards = STARTER_IDS.map((id) => {\n    const species = getSpecies(id);\n    const active = wizard.starter === id;\n    return h(`button.starter-card${active ? '.is-selected' : ''}`, {\n      type: 'button',\n      'aria-pressed': active ? 'true' : 'false',\n      dataset: { type: species.types[0] },\n      onclick: () => {\n        if (wizard.starter === id) return;\n        wizard.starter = id;\n        sfx.select();\n        navigate('/onboarding');\n      },\n      onpointerenter: () => sfx.hover(),\n    }, [\n      h('div.starter-card__art', active\n        ? portraitEl(id, { size: 150, mood: 'happy' })\n        : spriteEl(id, { size: 96 })),\n      h('div.starter-card__name', species.name),\n      h('div.starter-card__tag', playstyleTag(species)),\n      typeRow(species.types, { small: true }),\n    ]);\n  });\n\n  return h('div.creator', [\n    h('div.creator__head', [\n      h('h2.creator__title', 'Choose your first partner'),\n      h('p.muted', 'Step 3 of 3 · Partner'),\n    ]),\n    h('div.starter-grid', cards),\n    card(null,\n      sectionHead(selected.name, [\n        badge(playstyleTag(selected), { kind: 'primary' }),\n        typeRow(selected.types),\n      ]),\n      h('div.partner', [\n        h('div.partner__art', portraitEl(wizard.starter, { size: 200, mood: 'happy' })),\n        h('div.partner__info', [\n          h('p.partner__lore', selected.lore),\n          h('div.partner__stats', [\n            partnerStat('HP', previewStats.hp, selected.base.hp, ceiling.hp, '#4fd67c'),\n            partnerStat('ATK', previewStats.atk, selected.base.atk, ceiling.atk, '#ff6b6b'),\n            partnerStat('DEF', previewStats.def, selected.base.def, ceiling.def, '#3db4ff'),\n            partnerStat('SPD', previewStats.spd, selected.base.spd, ceiling.spd, '#ffd93d'),\n          ]),\n          h('p.partner__legend', 'Bars compare natural strength · the arrow is the level 50 ceiling'),\n          h('div.partner__moves', [\n            h('span.pill.pill--label', 'Starts with'),\n            ...moves.map((id) => {\n              const m = getMove(id);\n              return h('span.pill', `${m.name}${m.power ? ` · ${m.power}` : ''}`);\n            }),\n            ...upcoming.map((entry) => {\n              const m = getMove(entry.move);\n              return h('span.pill.pill--next', `${m.name} · Lv ${entry.level}`);\n            }),\n          ]),\n          h('p.muted.muted--sm', `Evolves into ${getSpecies(selected.evolve.to).name} at level ${selected.evolve.level}.`),\n        ]),\n      ]),\n      h('div.row.row--between', [\n        h('button.btn.btn--ghost', { type: 'button', onclick: () => goTo(2, 'back') }, 'Back'),\n        h('button.btn.btn--primary.btn--lg#choose-partner', {\n          type: 'button',\n          onclick: () => confirmStarter(),\n        }, `Choose ${selected.name}`),\n      ]),\n    ),\n  ]);\n}\n\nasync function confirmStarter() {\n  const species = getSpecies(wizard.starter);\n  sfx.open();\n  const ok = await confirmDialog({\n    title: `Partner with ${species.name}?`,\n    message: `${species.name} will join you at level 5 — ${playstyleTag(species).toLowerCase()}, and ready to grow. You can catch more partners immediately; this choice just starts your journey.`,\n    confirmLabel: `Yes, choose ${species.name}`,\n    cancelLabel: 'Let me reconsider',\n  });\n  if (!ok) { sfx.back(); return; }\n  await finishOnboarding();\n}\n\n/* -------------------------------------------------------------- 4. launch */\n\nasync function finishOnboarding() {\n  try {\n    await state.createProfile({\n      displayName: wizard.displayName.trim(),\n      starterId: wizard.starter,\n      tamer: { ...wizard.tamer },\n    });\n    sfx.digitise();\n    goTo(4, 'confirm');\n  } catch (err) {\n    console.error(err);\n    toast(`Could not create your profile: ${err.message}`, 'error');\n  }\n}\n\nfunction stepLaunch() {\n  const lines = [\n    'Allocating digital genome…',\n    'Seeding elemental lattice…',\n    'Bonding Tamer signature…',\n    'Welcome to the Nexus.',\n  ];\n  const name = wizard.displayName.trim() || 'Tamer';\n  const species = getSpecies(wizard.starter);\n  const total = lines.length * 520;\n\n  const lineEl = h('p.launch__line', { 'aria-live': 'polite' }, lines[0]);\n  const fill = h('div.launch__fill');\n  const bar = h('div.launch__bar', {\n    role: 'progressbar', 'aria-label': 'Digitising your Tamer',\n    'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': '0',\n  }, fill);\n  const pctEl = h('p.launch__pct', '0%');\n\n  clearCinematic();\n  let done = false;\n\n  /** Jump straight to the end — a cinematic must never trap the player. */\n  const finish = () => {\n    if (done) return;\n    done = true;\n    clearCinematic();\n    fill.style.width = '100%';\n    pctEl.textContent = '100%';\n    bar.setAttribute('aria-valuenow', '100');\n    lineEl.textContent = lines[lines.length - 1];\n    sfx.victory();\n    toast(`Welcome, ${name}. ${species.name} is eager to begin.`, 'success', 4200);\n    navigate('/');\n  };\n\n  lines.slice(1).forEach((text, i) => {\n    cinematicTimers.push(setTimeout(() => {\n      lineEl.textContent = text;\n      lineEl.classList.remove('is-fresh');\n      void lineEl.offsetWidth;\n      lineEl.classList.add('is-fresh');\n      sfx.notify();\n    }, (i + 1) * 520));\n  });\n\n  // Drive the bar from the clock so the number and the fill never disagree.\n  const started = Date.now();\n  const tick = setInterval(() => {\n    const progress = Math.min(1, (Date.now() - started) / total);\n    fill.style.width = `${progress * 100}%`;\n    pctEl.textContent = `${Math.round(progress * 100)}%`;\n    bar.setAttribute('aria-valuenow', String(Math.round(progress * 100)));\n    if (progress >= 1) clearInterval(tick);\n  }, 60);\n  cinematicIntervals.push(tick);\n  cinematicTimers.push(setTimeout(finish, total + 260));\n\n  // Skipping must work from anywhere, without making the whole screen a\n  // focusable control that screen readers have to announce.\n  skipHandler = (event) => {\n    if (event.key === 'Enter' || event.key === ' ' || event.key === 'Escape') {\n      event.preventDefault();\n      finish();\n    }\n  };\n  document.addEventListener('keydown', skipHandler);\n\n  const view = h('div.launch', {\n    onclick: finish,\n    role: 'status',\n    'aria-label': 'Digitising your Tamer',\n  }, [\n    h('div.launch__avatar', tamerEl(wizard.tamer, { size: 132, mood: 'determined' })),\n    h('h2.launch__title', 'Digitising your Tamer'),\n    lineEl,\n    bar,\n    pctEl,\n    h('div.launch__partner', [\n      spriteEl(wizard.starter, { size: 84, mood: 'happy' }),\n      h('span', `${species.name} has joined your team.`),\n    ]),\n    h('p.launch__skip', 'Tap or press Enter to skip'),\n  ]);\n  return view;\n}\n/* -------------------------------------------------------------- 4. launch */\n\nexport const meta = { title: 'Welcome' };\n"},{"key":"src/ui/screens/battle.js","code":"/**\n * battle.js — Turn-based battle UI on top of the deterministic engine.\n *\n * Separation of concerns\n * -----------------------\n * domain/battle.js decides *what happens* and returns an ordered event list.\n * This module decides *how it feels*: it replays that event list with delays,\n * animations and sound, then re-renders the action menu from engine state.\n * The UI never computes damage, accuracy or AI decisions.\n *\n * @module ui/screens/battle\n */\n\nimport { h, renderInto, pct } from '«src/ui/dom.js»';\nimport { spriteEl, hpBar, typeChip, badge, statusBadge, toast, typeRow, floatText, impact, animateNumber } from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { Battle, SIDE, typeHint } from '«src/domain/battle.js»';\nimport { createRng } from '«src/core/rng.js»';\nimport { getSpecies } from '«src/domain/species.js»';\nimport { getMove } from '«src/domain/moves.js»';\nimport { createCreature, displayName, maxHpOf, statsFor } from '«src/domain/creature.js»';\nimport { BALLS, captureChance } from '«src/domain/capture.js»';\nimport { ZONES, getZone } from '«src/domain/zones.js»';\nimport { sfx, startMusic, stopMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport { emit, EVENTS } from '«src/core/bus.js»';\n\n/* ------------------------------------------------------------ module state */\n\nlet battle = null;\nlet context = null;          // { kind, zoneId, wildCreature, trainerName }\nlet busy = false;\nlet els = {};                // DOM references for in-place updates\n\n/**\n * Last rendered HP per side. Feeding the previous value into the HP bar draws\n * the trailing \"chip\" bar, so damage is readable at a glance.\n */\nconst lastHp = { [SIDE.ALLY]: null, [SIDE.FOE]: null };\n\n/** Reduced-motion aware delay helper. */\nfunction beat(ms) {\n  const fast = !state.getState()?.settings?.motion;\n  return new Promise((resolve) => setTimeout(resolve, fast ? Math.min(ms, 120) : ms));\n}\n\n/* ------------------------------------------------------------------ render */\n\n/**\n * Render (or continue) a battle.\n * @param {HTMLElement} root\n * @param {{query:URLSearchParams}} ctx\n */\nexport function render(root, ctx = { query: new URLSearchParams() }) {\n  const query = ctx.query;\n  const isWild = query.get('wild') === '1';\n  const isTrainer = query.get('trainer') === '1';\n\n  if (!battle || battle.over) {\n    const started = isTrainer ? startTrainer(query) : startWild(query);\n    if (!started) return;\n  } else if (isWild || isTrainer) {\n    // Navigating here with a fresh query while a battle is live: keep the live one.\n    if (context?.kind !== (isTrainer ? 'trainer' : 'wild')) {\n      const started = isTrainer ? startTrainer(query) : startWild(query);\n      if (!started) return;\n    }\n  }\n\n  document.body.classList.add('in-battle');\n\n  const view = h('div.view.view--battle', [\n    h('div.arena', [\n      // Each side is two layers: `.slot__card` is re-rendered on every state\n      // change, `.slot__fx` persists so floating numbers survive the re-render.\n      h('div.arena__foe#foeSlot', [h('div.slot__card#foeCard'), h('div.slot__fx#foeFx')]),\n      h('div.arena__vs', 'VS'),\n      h('div.arena__ally#allySlot', [h('div.slot__card#allyCard'), h('div.slot__fx#allyFx')]),\n    ]),\n    h('div.log#battleLog'),\n    h('div.battle-menu#battleMenu'),\n  ]);\n\n  renderInto(root, view);\n  els = {\n    foe: root.querySelector('#foeSlot'),\n    ally: root.querySelector('#allySlot'),\n    foeCard: root.querySelector('#foeCard'),\n    allyCard: root.querySelector('#allyCard'),\n    foeFx: root.querySelector('#foeFx'),\n    allyFx: root.querySelector('#allyFx'),\n    log: root.querySelector('#battleLog'),\n    menu: root.querySelector('#battleMenu'),\n  };\n\n  renderSide(SIDE.FOE);\n  renderSide(SIDE.ALLY);\n  pushLog(`A ${context.kind === 'trainer' ? 'trainer battle' : 'wild encounter'} begins!`);\n  renderMenu();\n  startMusic('battle');\n  emit(EVENTS.BATTLE_START, { kind: context.kind });\n}\n\n/* ------------------------------------------------------------ battle setup */\n\nfunction startWild(query) {\n  const s = state.getState();\n  const zoneId = query.get('zone') || s.progress.zoneId;\n  const zone = getZone(zoneId);\n  const rng = createRng((s.profile.seed ^ Date.now()) >>> 0);\n\n  const speciesId = query.get('species') || zone.encounters[0].id;\n  const level = Number(query.get('level')) || zone.minLevel;\n\n  const wild = createCreature({\n    speciesId, level, rand: rng,\n    origin: { zone: zoneId, wild: true },\n  });\n\n  const allyTeam = readyTeam();\n  if (!allyTeam.length) return false;\n\n  lastHp[SIDE.ALLY] = null;\n  lastHp[SIDE.FOE] = null;\n  context = { kind: 'wild', zoneId, wildCreature: wild, trainerName: null };\n  battle = new Battle({\n    allyTeam, foeTeam: [wild], kind: 'wild', foeName: `Wild ${getSpecies(speciesId).name}`,\n    rng, inventory: s.inventory, zoneId,\n  });\n  return true;\n}\n\nfunction startTrainer(query) {\n  const s = state.getState();\n  const zoneId = query.get('zone') || s.progress.zoneId;\n  const rng = createRng((s.profile.seed ^ Date.now()) >>> 0);\n\n  const rival = consumePendingRival(zoneId, rng);\n  const foeTeam = rival.members.map((m) => createCreature({\n    speciesId: m.speciesId, level: m.level, rand: rng,\n    origin: { zone: zoneId, wild: false },\n  }));\n\n  const allyTeam = readyTeam();\n  if (!allyTeam.length) return false;\n\n  lastHp[SIDE.ALLY] = null;\n  lastHp[SIDE.FOE] = null;\n  context = { kind: 'trainer', zoneId, wildCreature: null, trainerName: rival.name };\n  battle = new Battle({\n    allyTeam, foeTeam, kind: 'trainer', foeName: rival.name,\n    rng, inventory: s.inventory, zoneId,\n  });\n  return true;\n}\n\n/**\n * Get a battle-ready team, healing (and warning) if the player blacked out.\n * @returns {object[]}\n */\nfunction readyTeam() {\n  const team = state.teamCreatures();\n  if (!team.length) {\n    toast('You have no creatures in your team.', 'error');\n    navigate('/ranch');\n    return [];\n  }\n  if (team.every((c) => c.hp <= 0)) {\n    state.healAllCreatures();\n    toast('Your team was rushed to the nearest Node and restored.', 'warn');\n  }\n  return state.teamCreatures();\n}\n\n/* ------------------------------------------------------------------ panels */\n\n/** Render one side's status card in place. */\n/** The element whose children are replaced on re-render (`.slot__card`). */\nfunction cardLayer(key) { return key === SIDE.FOE ? els.foeCard : els.allyCard; }\n\n/** The persistent effects overlay for a side (`.slot__fx`). */\nfunction fxLayer(key) { return key === SIDE.FOE ? els.foeFx : els.allyFx; }\n\nfunction renderSide(key) {\n  const host = cardLayer(key);\n  if (!host) return;\n  const side = battle.sides[key];\n  const c = battle.active(key);\n  const isFoe = key === SIDE.FOE;\n\n  if (!c) {\n    host.replaceChildren(h('div.combat-card.combat-card--empty', '—'));\n    return;\n  }\n\n  const species = getSpecies(c.speciesId);\n  const card = h(`div.combat-card.combat-card--${isFoe ? 'foe' : 'ally'}`, [\n    h('div.combat-card__id', [\n      h('div.combat-card__name', [\n        c.nickname || species.name,\n        c.shiny ? badge('Glitch', { kind: 'glitch' }) : null,\n        statusBadge(c.status),\n      ]),\n      h('div.combat-card__meta', `Lv ${c.level} · ${side.name}`),\n      typeRow(species.types, { small: true }),\n    ]),\n    h('div.combat-card__sprite', spriteEl(c.speciesId, { size: isFoe ? 112 : 104, shiny: c.shiny, flip: isFoe ? 'left' : 'right' })),\n    hpBar({ ...c.ref, hp: c.hp }, { showNumbers: true, maxHp: c.maxHp, ghostFrom: lastHp[key] }),\n    h('div.combat-card__stages', stagePips(c.stages)),\n  ]);\n  host.replaceChildren(card);\n  lastHp[key] = c.hp;\n}\n\n/** Small +/− indicators for combat stat stages. */\nfunction stagePips(stages) {\n  const cells = Object.entries(stages)\n    .filter(([, v]) => v !== 0)\n    .map(([k, v]) => h('span.pill.pill--stage', `${k.toUpperCase()} ${v > 0 ? `+${v}` : v}`));\n  return cells.length ? h('div.combat-card__stage-row', cells) : null;\n}\n\n/** Append a line to the battle log (auto-scrolled). */\nfunction pushLog(text, kind = '') {\n  if (!els.log || !text) return;\n  const line = h(`div.log__line${kind ? `.log__line--${kind}` : ''}`, text);\n  els.log.appendChild(line);\n  els.log.scrollTop = els.log.scrollHeight;\n  while (els.log.children.length > 60) els.log.removeChild(els.log.firstChild);\n}\n\n/* -------------------------------------------------------------------- menus */\n\nfunction renderMenu() {\n  if (!els.menu) return;\n  if (battle.over) return;\n\n  if (battle.awaitingSwitch()) {\n    els.menu.replaceChildren(teamMenu({ forced: true }));\n    return;\n  }\n\n  const active = battle.active(SIDE.ALLY);\n  const moves = (active?.moves || []).map((id) => {\n    const move = getMove(id);\n    const hint = battle.active(SIDE.FOE)\n      ? typeHint(id, getSpecies(battle.active(SIDE.FOE).speciesId).types)\n      : { mult: 1, label: '' };\n    return h('button.move-btn', {\n      type: 'button',\n      dataset: { type: move.type },\n      title: move.desc,\n      onclick: () => runTurn({ type: 'move', moveId: id }),\n    }, [\n      h('div.move-btn__top', [\n        h('span.move-btn__name', move.name),\n        h('span.move-btn__power', move.power ? move.power : '—'),\n      ]),\n      h('div.move-btn__bottom', [\n        typeChip(move.type, { small: true }),\n        hint.mult > 1 ? h('span.move-btn__eff.move-btn__eff--up', '×' + hint.mult) : null,\n        hint.mult < 1 && hint.mult > 0 ? h('span.move-btn__eff.move-btn__eff--down', '×' + hint.mult) : null,\n        hint.mult === 0 ? h('span.move-btn__eff.move-btn__eff--none', 'No effect') : null,\n      ]),\n    ]);\n  });\n\n  els.menu.replaceChildren(\n    h('div.menu-root', [\n      h('div.move-grid', moves),\n      h('div.menu-actions', [\n        h('button.btn.btn--ghost', { type: 'button', onclick: () => els.menu.replaceChildren(ballMenu()) }, 'Ball'),\n        h('button.btn.btn--ghost', { type: 'button', onclick: () => els.menu.replaceChildren(bagMenu()) }, 'Bag'),\n        h('button.btn.btn--ghost', { type: 'button', onclick: () => els.menu.replaceChildren(teamMenu({})) }, 'Team'),\n        h('button.btn.btn--ghost', { type: 'button', onclick: () => runTurn({ type: 'flee' }) }, 'Flee'),\n      ]),\n    ]),\n  );\n}\n\nfunction ballMenu() {\n  const foe = battle.active(SIDE.FOE);\n  if (!foe || !battle.canCapture()) {\n    return menuWrap([h('p.muted', 'You cannot capture in a trainer battle.')]);\n  }\n  const rows = Object.values(BALLS).map((ball) => {\n    const count = state.getState().inventory[ball.id] ?? 0;\n    const chance = captureChance({\n      hp: foe.hp, maxHp: foe.maxHp, rate: foe.species.capture,\n      ballId: ball.id, level: foe.level, status: foe.status,\n    });\n    return h('button.list-row', {\n      type: 'button',\n      disabled: count <= 0,\n      onclick: () => runTurn({ type: 'ball', ballId: ball.id }),\n    }, [\n      h('span.list-row__name', ball.name),\n      h('span.list-row__meta', `${Math.round(chance * 100)}% · ${count} left`),\n    ]);\n  });\n  return menuWrap(rows, 'Capture');\n}\n\nfunction bagMenu() {\n  const inv = state.getState().inventory;\n  const rows = [\n    { id: 'healPatch', name: 'Heal Patch', desc: 'Restore 60% HP' },\n    { id: 'statusPatch', name: 'Status Patch', desc: 'Cure any status' },\n  ].map((item) => h('button.list-row', {\n    type: 'button',\n    disabled: (inv[item.id] ?? 0) <= 0,\n    onclick: () => runTurn({ type: 'item', itemId: item.id }),\n  }, [\n    h('span.list-row__name', item.name),\n    h('span.list-row__meta', `${item.desc} · ${inv[item.id] ?? 0} left`),\n  ]));\n  return menuWrap(rows, 'Bag');\n}\n\nfunction teamMenu({ forced }) {\n  const team = battle.team(SIDE.ALLY);\n  const rows = team.map((c, index) => {\n    const isActive = index === battle.sides[SIDE.ALLY].index;\n    return h('button.list-row.list-row--team', {\n      type: 'button',\n      disabled: c.fainted || isActive,\n      onclick: () => (forced ? runSwitch(index) : runTurn({ type: 'switch', index })),\n    }, [\n      spriteEl(c.speciesId, { size: 36, shiny: c.shiny }),\n      h('span.list-row__name', `${c.nickname || getSpecies(c.speciesId).name} · Lv ${c.level}`),\n      h('span.list-row__meta', c.fainted ? 'Fainted' : (isActive ? 'In battle' : `${c.hp}/${c.maxHp} HP`)),\n    ]);\n  });\n  return menuWrap(rows, forced ? 'Choose a replacement' : 'Switch');\n}\n\nfunction menuWrap(children, title = 'Back to actions') {\n  return h('div.menu-panel', [\n    h('button.btn.btn--ghost.btn--sm', { type: 'button', onclick: () => renderMenu() }, `← ${title}`),\n    h('div.menu-panel__list', children),\n  ]);\n}\n\n/* ------------------------------------------------------------------ turns */\n\n/** Submit a player action and animate the resulting events. */\nasync function runTurn(action) {\n  if (busy || !battle || battle.over) return;\n  busy = true;\n  els.menu.replaceChildren(h('div.menu-panel', h('p.muted', '…')));\n  const events = battle.submit(action);\n  await playEvents(events);\n  busy = false;\n  afterTurn();\n}\n\n/** Dedicated path for a forced switch (does not consume the opponent's turn). */\nasync function runSwitch(index) {\n  if (busy || !battle || battle.over) return;\n  busy = true;\n  const events = battle.sendIn(index);\n  await playEvents(events);\n  busy = false;\n  afterTurn();\n}\n\n/** Post-turn state resolution: forced switch, end screen, or re-render menu. */\nfunction afterTurn() {\n  if (!battle) return;\n  renderSide(SIDE.ALLY);\n  renderSide(SIDE.FOE);\n  if (battle.over) showResult();\n  else if (battle.awaitingSwitch()) renderMenu();\n  else renderMenu();\n}\n\n/** Replay an engine event list with pacing and feedback. */\nasync function playEvents(events) {\n  for (const ev of events) {\n    await applyEvent(ev);\n  }\n}\n\nasync function applyEvent(ev) {\n  switch (ev.t) {\n    case 'msg':\n      pushLog(ev.text);\n      await beat(420);\n      break;\n\n    case 'move': {\n      pushLog(`${ev.actor} used ${ev.name}!`, 'move');\n      const move = getMove(ev.moveId);\n      if (!move.power) sfx.moveSupport();\n      else if (['byte', 'volt', 'frost', 'aqua', 'virus', 'null'].includes(move.type)) sfx.moveSpecial();\n      else sfx.movePhysical();\n      // Lean the attacker into the strike.\n      impact(cardLayer(ev.side), 'lunge');\n      await beat(420);\n      break;\n    }\n\n    case 'damage': {\n      const slot = ev.side === SIDE.FOE ? els.foe : els.ally;\n\n      // Sound scales with impact: resisted → weak, super → heavy, crit → both.\n      if (ev.eff > 1) sfx.superHit();\n      else if (ev.eff < 1) sfx.weakHit();\n      else sfx.hit();\n      if (ev.crit) sfx.crit();\n\n      pushLog(`${ev.amount} damage.${ev.crit ? ' A critical hit!' : ''}`, ev.eff > 1 ? 'good' : '');\n      if (ev.text) pushLog(ev.text, ev.eff > 1 ? 'good' : 'warn');\n\n      // Re-render first so the chip bar is drawn against the new HP, then\n      // animate the fresh card and float the number on the persistent layer.\n      renderSide(ev.side);\n      impact(cardLayer(ev.side), ev.crit ? 'crit' : 'hit');\n      floatText(fxLayer(ev.side), `${ev.crit ? 'CRIT ' : ''}−${ev.amount}`,\n        ev.crit ? 'crit' : (ev.eff > 1 ? 'super' : (ev.eff < 1 ? 'weak' : 'damage')));\n      if (ev.text) floatText(fxLayer(ev.side), ev.text, ev.eff > 1 ? 'super' : 'weak');\n      if (ev.crit) impact(document.querySelector('.arena'), 'flash');\n      await beat(520);\n      break;\n    }\n\n    case 'miss': {\n      sfx.miss();\n      floatText(fxLayer(SIDE.FOE), 'MISS', 'miss');\n      pushLog(`${ev.name} missed!`, 'warn');\n      await beat(420);\n      break;\n    }\n\n    case 'heal': {\n      sfx.heal();\n      floatText(fxLayer(ev.side), `+${ev.amount}`, 'heal');\n      pushLog(`Recovered ${ev.amount} HP.`, 'good');\n      renderSide(ev.side);\n      await beat(420);\n      break;\n    }\n\n    case 'status': {\n      sfx.status();\n      floatText(fxLayer(ev.side), ev.text, 'status');\n      pushLog(ev.text, 'warn');\n      renderSide(ev.side);\n      await beat(460);\n      break;\n    }\n\n    case 'statusTick': {\n      pushLog(ev.text, 'warn');\n      floatText(fxLayer(ev.side), 'residual', 'status');\n      renderSide(ev.side);\n      await beat(420);\n      break;\n    }\n\n    case 'cure':\n      pushLog(ev.text, 'good');\n      renderSide(ev.side);\n      await beat(360);\n      break;\n\n    case 'stat': {\n      if (ev.delta > 0) sfx.statUp(); else sfx.statDown();\n      floatText(fxLayer(ev.side), `${ev.stat.toUpperCase()} ${ev.delta > 0 ? '▲' : '▼'}`,\n        ev.delta > 0 ? 'heal' : 'weak');\n      pushLog(ev.text, 'good');\n      renderSide(ev.side);\n      await beat(400);\n      break;\n    }\n\n    case 'switch':\n      pushLog(ev.text, 'move');\n      sfx.switchIn();\n      lastHp[ev.side] = null; // a fresh creature has no previous HP to chip from\n      renderSide(ev.side);\n      await beat(480);\n      break;\n\n    case 'faint':\n      sfx.faint();\n      pushLog(ev.text, 'bad');\n      renderSide(ev.side);\n      await beat(700);\n      break;\n\n    case 'ball': {\n      pushLog(ev.text);\n      sfx.ballThrow();\n      floatText(fxLayer(SIDE.FOE), `${BALLS[ev.ballId]?.name || 'Ball'}!`, 'info');\n      impact(cardLayer(SIDE.FOE), 'throw');\n      await beat(620);\n      for (let i = 0; i < ev.shakes; i++) {\n        pushLog('· wobble ·');\n        sfx.ballWobble();\n        impact(cardLayer(SIDE.FOE), 'wobble');\n        await beat(420);\n      }\n      if (ev.success) {\n        sfx.captureSuccess();\n        pushLog('Click! Captured!', 'good');\n        floatText(fxLayer(SIDE.FOE), 'CAUGHT!', 'heal');\n      } else {\n        sfx.captureFail();\n        floatText(fxLayer(SIDE.FOE), 'Broke free!', 'weak');\n      }\n      await beat(340);\n      break;\n    }\n\n    case 'xp':\n      pushLog(`${ev.name} gained ${ev.amount} XP.`, 'good');\n      await beat(360);\n      break;\n\n    case 'level': {\n      sfx.levelUp();\n      floatText(fxLayer(SIDE.ALLY), `LEVEL ${ev.level}!`, 'heal');\n      pushLog(`${ev.name} grew to level ${ev.level}!`, 'good');\n      toast(`${ev.name} reached level ${ev.level}!`, 'success');\n      renderSide(SIDE.ALLY);\n      await beat(620);\n      break;\n    }\n\n    case 'learned':\n      sfx.learn();\n      pushLog(`${ev.name} learned ${ev.moveName}!`, 'good');\n      await beat(420);\n      break;\n\n    case 'evolve': {\n      sfx.evolve();\n      pushLog(`${ev.oldName} is evolving…`, 'good');\n      await beat(700);\n      pushLog(`Congratulations! It evolved into ${ev.name}!`, 'good');\n      toast(`${ev.oldName} evolved into ${ev.name}!`, 'success');\n      state.recordEvolution(ev.uid, ev.from, ev.to);\n      renderSide(SIDE.ALLY);\n      await beat(800);\n      break;\n    }\n\n    case 'item':\n      await beat(200);\n      break;\n\n    case 'flee':\n      if (ev.ok) sfx.flee();\n      pushLog(ev.text, ev.ok ? 'good' : 'warn');\n      await beat(420);\n      break;\n\n    case 'end':\n      if (ev.outcome === 'win' || ev.outcome === 'caught') { sfx.victory(); startMusic('victory'); }\n      if (ev.outcome === 'lose') sfx.defeat();\n      pushLog(ev.text, ev.outcome === 'lose' ? 'bad' : 'good');\n      await beat(400);\n      break;\n\n    default:\n      break;\n  }\n}\n\n/* ------------------------------------------------------------------ result */\n\n/** Show the post-battle summary and commit results to state. */\nfunction showResult() {\n  const outcome = battle.outcome;\n  const isTrainer = context.kind === 'trainer';\n  let captured = null;\n\n  if (outcome === 'caught' && context.wildCreature) {\n    captured = context.wildCreature;\n    captured.hp = maxHpOf(captured); // digitised and restored\n    state.recordCapture(captured, context.zoneId);\n  }\n\n  state.recordBattleResult({ outcome, isTrainer, zoneId: context.zoneId, trainerName: context.trainerName });\n\n  if (outcome === 'win' || outcome === 'caught') sfx.victory();\n  if (outcome === 'lose') {\n    sfx.defeat();\n    state.healAllCreatures();\n  }\n\n  emit(EVENTS.BATTLE_END, { outcome });\n\n  const rewards = [];\n  if (captured) rewards.push(`${getSpecies(captured.speciesId).name} added to your ranch`);\n  if (outcome === 'win' || outcome === 'caught') {\n    rewards.push(`+◈ ${isTrainer ? 12 + ZONES.findIndex((z) => z.id === context.zoneId) * 6 : 3 + ZONES.findIndex((z) => z.id === context.zoneId) * 2} Data Shards`);\n  }\n  if (outcome === 'lose') rewards.push('Your team was restored at the nearest Node');\n\n  const panel = h('div.menu-panel.menu-panel--result', [\n    h(`h3.result__title.result__title--${outcome}`, resultTitle(outcome)),\n    h('ul.result__list', rewards.map((r) => h('li', r))),\n    h('div.row.row--wrap', [\n      h('button.btn.btn--primary', {\n        type: 'button',\n        onclick: () => { leave(); navigate('/explore'); },\n      }, 'Keep exploring'),\n      h('button.btn.btn--ghost', {\n        type: 'button',\n        onclick: () => { leave(); navigate('/ranch'); },\n      }, 'Manage team'),\n      h('button.btn.btn--ghost', {\n        type: 'button',\n        onclick: () => { leave(); navigate('/'); },\n      }, 'Nexus'),\n    ]),\n  ]);\n  els.menu.replaceChildren(panel);\n}\n\nfunction resultTitle(outcome) {\n  return {\n    win: 'Victory!', lose: 'You blacked out…', flee: 'Got away safely', caught: 'Captured!',\n  }[outcome] || 'Battle over';\n}\n\n/** Tear down battle state and restore normal chrome. */\nexport function leave() {\n  battle = null;\n  context = null;\n  busy = false;\n  lastHp[SIDE.ALLY] = null;\n  lastHp[SIDE.FOE] = null;\n  document.body.classList.remove('in-battle');\n  startMusic('menu');\n}\n\n/** True while a battle is live (router guard uses this). */\nexport function isInBattle() { return !!battle && !battle.over; }\n\n/**\n * Rival handoff: `explore.js` stashes the generated rival here so the URL stays\n * clean and the save file is not polluted with transient battle data.\n */\nlet pendingRival = null;\nexport function setPendingRival(rival) { pendingRival = rival; }\n\nfunction consumePendingRival(zoneId, rng) {\n  if (pendingRival && pendingRival.zoneId === zoneId) {\n    const r = pendingRival;\n    pendingRival = null;\n    return r;\n  }\n  // Fallback (e.g. deep link / reload): generate one on the spot.\n  const zone = getZone(zoneId);\n  const pool = zone.encounters;\n  return {\n    name: zone.rivals[0],\n    zoneId,\n    members: Array.from({ length: 3 }, () => {\n      const pick = pool[Math.floor(rng.next() * pool.length)];\n      return { speciesId: pick.id, level: rng.int(zone.minLevel, zone.maxLevel) };\n    }),\n  };\n}\n\nexport const meta = { title: 'Battle' };\nexport { statsFor };\n"},{"key":"src/ui/screens/settings.js","code":"/**\n * settings.js — Settings & data management.\n *\n * This screen is the trust surface of a local-first product: the player can\n * see exactly what is stored, export it in a portable format, move it to\n * another device, or destroy it. Nothing here is hidden behind a network call.\n *\n * @module ui/screens/settings\n */\n\nimport { h, renderInto, num } from '«src/ui/dom.js»';\nimport {\n  card, sectionHead, badge, toast, modal, confirmDialog, promptDialog, emptyState, timeAgo, tamerEl,\n} from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport * as db from '«src/core/db.js»';\nimport {\n  deriveVaultKey, makeVerifier, newSalt, verifyPassphrase, encryptJson, decryptJson, randomId,\n} from '«src/core/crypto.js»';\nimport { sfx, setSoundEnabled, setSfxVolume, setMusicVolume, startMusic, stopMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport * as sync from '«src/sync/syncClient.js»';\nimport { resetOnboarding } from '«src/ui/screens/onboarding.js»';\nimport { TAMER_OPTIONS, DEFAULT_TAMER, randomTamer } from '«src/ui/tamerAvatar.js»';\nimport { leave } from '«src/ui/screens/battle.js»';\n\n/**\n * Render the Settings screen.\n * @param {HTMLElement} root\n */\nexport function render(root) {\n  const view = h('div.view.view--settings', [\n    profileCard(),\n    preferencesCard(),\n    audioCard(),\n    syncCard(),\n    dataCard(),\n    aboutCard(),\n  ]);\n  renderInto(root, view);\n  loadStorageStats();\n}\n\n/* ---------------------------------------------------------------- profile */\n\nfunction profileCard() {\n  const s = state.getState();\n  startMusic('menu');\n\n  return card('Profile',\n    h('div.profile-head', [\n      h('div.profile-head__avatar', tamerEl(s.profile.tamer, { size: 88, mood: 'happy' })),\n      h('div.profile-head__id', [\n        h('div.profile-head__name', s.profile.displayName),\n        h('div.profile-head__meta', `Tamer · joined ${new Date(s.profile.createdAt).toLocaleDateString('en-GB')}`),\n        h('button.btn.btn--sm', { type: 'button', onclick: () => openAvatarEditor() }, 'Edit appearance'),\n      ]),\n    ]),\n    h('div.kv-list', [\n      kvRow('Display name', s.profile.displayName,\n        h('button.btn.btn--sm.btn--ghost', {\n          type: 'button',\n          onclick: async () => {\n            const name = await promptDialog({\n              title: 'Rename Tamer', message: 'Shown on your Nexus dashboard.',\n              value: s.profile.displayName, maxLength: 18,\n            });\n            if (name) { state.mutate((st) => { st.profile.displayName = name; }); toast('Updated.', 'success'); }\n          },\n        }, 'Edit')),\n      kvRow('Tamer ID', s.profile.id,\n        h('button.btn.btn--sm.btn--ghost', {\n          type: 'button',\n          onclick: async () => {\n            try {\n              await navigator.clipboard.writeText(s.profile.id);\n              toast('Tamer ID copied.', 'success');\n            } catch { toast('Copy failed — select the text manually.', 'error'); }\n          },\n        }, 'Copy')),\n      kvRow('Created', new Date(s.profile.createdAt).toLocaleString('en-GB')),\n      kvRow('Last saved', timeAgo(state.lastPersisted() || s.updatedAt),\n        h('button.btn.btn--sm.btn--ghost', {\n          type: 'button',\n          onclick: async () => { await state.flush(); toast('Saved to this device.', 'success'); },\n        }, 'Save now')),\n      kvRow('Vault',\n        h('span.pill.pill--ok', 'Encrypted locally (AES-GCM)'),\n        h('button.btn.btn--sm.btn--ghost', { type: 'button', onclick: () => changePassphrase() }, 'Change passphrase')),\n    ]),\n  );\n}\n\n/** Re-derive the local vault verifier with a new passphrase. */\nasync function changePassphrase() {\n  const record = await db.kvGet('vault', null);\n  if (!record) return toast('No vault found on this device.', 'error');\n\n  const oldPass = await promptDialog({\n    title: 'Current passphrase', message: 'Enter your current vault passphrase.',\n    placeholder: 'Current passphrase', maxLength: 128, confirmLabel: 'Verify',\n  });\n  if (oldPass === null) return;\n  if (!(await verifyPassphrase(oldPass, record.salt, record.verifier))) {\n    sfx.error();\n    return toast('Incorrect passphrase.', 'error');\n  }\n\n  const newPass = await promptDialog({\n    title: 'New passphrase', message: 'At least 8 characters. This encrypts exports and cloud backups.',\n    placeholder: 'New passphrase', maxLength: 128, confirmLabel: 'Set passphrase',\n  });\n  if (!newPass || newPass.length < 8) return toast('Passphrase must be at least 8 characters.', 'error');\n\n  const salt = newSalt();\n  const key = await deriveVaultKey(newPass, salt, record.iterations);\n  const verifier = await makeVerifier(key);\n  await db.kvSet('vault', { ...record, salt, verifier, rotatedAt: new Date().toISOString() });\n  sync.forgetVaultKey();\n  toast('Vault passphrase updated. Remember it — it cannot be recovered.', 'success');\n}\n\n/* ------------------------------------------------------------ preferences */\n\nfunction preferencesCard() {\n  const s = state.getState();\n\n  const toggle = (label, key, onChange) => h('label.toggle', [\n    h('span.toggle__label', label),\n    h('input', {\n      type: 'checkbox',\n      checked: !!s.settings[key],\n      onchange: (e) => {\n        state.updateSettings({ [key]: e.target.checked });\n        onChange?.(e.target.checked);\n        toast(`${label}: ${e.target.checked ? 'on' : 'off'}`, 'info');\n      },\n    }),\n    h('span.toggle__track'),\n  ]);\n\n  return card('Preferences',\n    h('div.field', [\n      h('span.field__label', 'Theme'),\n      h('select.input', {\n        onchange: (e) => {\n          state.updateSettings({ theme: e.target.value });\n          applyTheme(e.target.value);\n        },\n      }, [\n        ['nexus', 'Nexus (default)'], ['ember', 'Ember'], ['abyss', 'Abyss'], ['mono', 'Mono'],\n      ].map(([value, label]) => h('option', { value, selected: s.settings.theme === value }, label))),\n    ]),\n    toggle('Animations', 'motion'),\n    toggle('Autosave', 'autosave', () => state.schedulePersist(0)),\n  );\n}\n\n/** Audio section: master toggles plus separate SFX and music levels. */\nfunction audioCard() {\n  const s = state.getState();\n\n  const slider = (label, value, onInput) => h('label.field', [\n    h('span.field__label', `${label} · ${Math.round(value * 100)}%`),\n    h('input.input.input--range', {\n      type: 'range', min: '0', max: '100', value: String(Math.round(value * 100)),\n      oninput: (e) => {\n        const v = Number(e.target.value) / 100;\n        onInput(v);\n        const lbl = e.target.previousElementSibling;\n        if (lbl) lbl.textContent = `${label} · ${Math.round(v * 100)}%`;\n      },\n    }),\n  ]);\n\n  return card('Audio',\n    h('p.muted.muted--sm', 'Every sound in DigiPoke is synthesised live — no audio files, so the app stays tiny and works offline.'),\n    h('label.toggle', [\n      h('span.toggle__label', 'Sound effects'),\n      h('input', {\n        type: 'checkbox', checked: !!s.settings.sound,\n        onchange: (e) => { state.updateSettings({ sound: e.target.checked }); setSoundEnabled(e.target.checked); if (e.target.checked) sfx.click(); },\n      }),\n      h('span.toggle__track'),\n    ]),\n    h('label.toggle', [\n      h('span.toggle__label', 'Music'),\n      h('input', {\n        type: 'checkbox', checked: !!s.settings.music,\n        onchange: (e) => {\n          state.updateSettings({ music: e.target.checked });\n          if (e.target.checked) { setMusicVolume(s.settings.musicVolume ?? 0.35); startMusic('menu'); }\n          else stopMusic();\n        },\n      }),\n      h('span.toggle__track'),\n    ]),\n    slider('Effects volume', s.settings.sfxVolume ?? 0.7, (v) => { setSfxVolume(v); state.updateSettings({ sfxVolume: v }); }),\n    slider('Music volume', s.settings.musicVolume ?? 0.35, (v) => { setMusicVolume(v); state.updateSettings({ musicVolume: v }); }),\n    h('div.row.row--wrap', [\n      h('button.btn.btn--sm.btn--ghost', { type: 'button', onclick: () => { sfx.hit(); toast('That is a super-effective hit.', 'info'); } }, 'Test a hit'),\n      h('button.btn.btn--sm.btn--ghost', { type: 'button', onclick: () => sfx.captureSuccess() }, 'Test a capture'),\n      h('button.btn.btn--sm.btn--ghost', { type: 'button', onclick: () => sfx.evolve() }, 'Test an evolution'),\n      h('button.btn.btn--sm.btn--ghost', {\n        type: 'button',\n        onclick: () => {\n          state.mutate((st) => { st.profile.tutorial = { nexus: false, ranch: false, lab: false, battle: false }; });\n          toast('Coach marks will show again.', 'info');\n        },\n      }, 'Reset tips'),\n    ]),\n  );\n}\n\n/** Live avatar editor, reusing the character-creator option groups. */\nfunction openAvatarEditor() {\n  const draft = { ...(state.getState().profile.tamer || DEFAULT_TAMER) };\n  const body = h('div.creator__grid');\n\n  function paint() {\n    body.replaceChildren(\n      h('div.creator__preview', [\n        h('div.stage', [\n          h('div.stage__ring'),\n          h('div.stage__avatar', tamerEl(draft, { size: 200, mood: 'happy' })),\n        ]),\n      ]),\n      h('div.editor-groups', Object.keys(TAMER_OPTIONS).map((key) => h('div.opt-group', [\n        h('div.opt-group__label', key.replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase())),\n        h('div.opt-group__options', TAMER_OPTIONS[key].map((opt) => h(\n          `button.opt${draft[key] === opt.id ? '.is-active' : ''}${opt.hex ? '.opt--color' : ''}`,\n          {\n            type: 'button', title: opt.name,\n            style: opt.hex ? { '--swatch': opt.hex } : {},\n            onclick: () => { draft[key] = opt.id; sfx.select(); paint(); },\n          },\n          opt.hex ? '' : opt.name,\n        ))),\n      ]))),\n    );\n  }\n  paint();\n\n  modal({\n    title: 'Edit appearance',\n    size: 'lg',\n    body,\n    actions: [\n      { label: 'Cancel', kind: 'ghost' },\n      { label: '🎲 Surprise me', kind: 'ghost', onClick: () => { Object.assign(draft, randomTamer(Math.random)); sfx.confirm(); paint(); return false; } },\n      {\n        label: 'Save look', kind: 'primary', onClick: () => {\n          state.setTamer({ ...draft });\n          sfx.confirm();\n          toast('Appearance updated.', 'success');\n          navigate('/settings');\n        },\n      },\n    ],\n  });\n}\n\n/* -------------------------------------------------------------------- sync */\n\nfunction syncCard() {\n  const s = state.getState();\n  const account = s.account;\n\n  return card(null,\n    sectionHead('Cloud sync (optional)',\n      account?.token ? badge('Connected', { kind: 'ok' }) : badge('Local only', { kind: 'muted' })),\n    h('p.muted', [\n      'Sync is end-to-end encrypted: your save is sealed with AES-GCM before it leaves the device. ',\n      'The server stores ciphertext and a scrypt hash of your password — it can never read your data.',\n    ]),\n\n    h('label.field', [\n      h('span.field__label', 'Server URL'),\n      h('input.input', {\n        type: 'url',\n        value: s.settings.serverUrl || sync.defaultServerUrl(),\n        placeholder: sync.defaultServerUrl(),\n        onchange: (e) => state.updateSettings({ serverUrl: e.target.value.trim() || null }),\n      }),\n    ]),\n\n    account?.token\n      ? h('div.stack', [\n        h('div.kv-list', [\n          kvRow('Account', account.email),\n          kvRow('Vault revision', String(account.vaultRev ?? 0)),\n          kvRow('Last synced', timeAgo(account.lastSyncedAt)),\n        ]),\n        h('div.row.row--wrap', [\n          h('button.btn.btn--primary', { type: 'button', onclick: () => doSync() }, 'Sync now'),\n          h('button.btn.btn--ghost', { type: 'button', onclick: () => doRestore() }, 'Restore from cloud'),\n          h('button.btn.btn--ghost', { type: 'button', onclick: () => { sync.signOut(); navigate('/settings'); } }, 'Sign out'),\n          h('button.btn.btn--danger', {\n            type: 'button',\n            onclick: async () => {\n              const ok = await confirmDialog({\n                title: 'Delete cloud vault?',\n                message: 'Removes the encrypted backup from the server. Your local save is not affected.',\n                confirmLabel: 'Delete remote data', danger: true,\n              });\n              if (!ok) return;\n              await sync.deleteRemoteAccount();\n              toast('Remote vault deleted.', 'info');\n              navigate('/settings');\n            },\n          }, 'Delete cloud data'),\n        ]),\n      ])\n      : h('div.row.row--end', h('button.btn.btn--primary', {\n        type: 'button',\n        onclick: () => openAuthDialog(),\n      }, 'Create account / sign in')),\n  );\n}\n\n/** Register-or-login dialog (one form, server decides). */\nasync function openAuthDialog() {\n  const email = h('input.input', { type: 'email', placeholder: 'you@example.com', maxLength: 160 });\n  const password = h('input.input', { type: 'password', placeholder: 'Vault passphrase', maxLength: 128 });\n  let error = h('p.form-error');\n\n  modal({\n    title: 'Cloud sync',\n    size: 'sm',\n    body: [\n      h('p.modal__text', 'Use your vault passphrase as the account password. If the email is new, an account is created.'),\n      h('label.field', [h('span.field__label', 'Email'), email]),\n      h('label.field', [h('span.field__label', 'Password'), password]),\n      error,\n    ],\n    actions: [\n      { label: 'Cancel', kind: 'ghost' },\n      {\n        label: 'Connect',\n        kind: 'primary',\n        onClick: async () => {\n          if (!email.value || password.value.length < 8) {\n            error.textContent = 'Enter an email and a password of at least 8 characters.';\n            return false;\n          }\n          try {\n            await sync.register(email.value.trim(), password.value);\n            await sync.push({ passphrase: password.value });\n            toast('Account created and save uploaded.', 'success');\n          } catch (err) {\n            if (err.status === 409) {\n              try {\n                await sync.login(email.value.trim(), password.value);\n                await sync.push({ passphrase: password.value });\n                toast('Signed in and save uploaded.', 'success');\n              } catch (err2) { error.textContent = err2.message; return false; }\n            } else {\n              error.textContent = err.message;\n              return false;\n            }\n          }\n          state.updateSettings({ syncEnabled: true });\n          navigate('/settings');\n          return true;\n        },\n      },\n    ],\n  });\n}\n\n/** Push the local save to the cloud, prompting for the passphrase on demand. */\nasync function doSync() {\n  try {\n    const result = await sync.syncNow({ prompt: () => passphrasePrompt('Unlock vault to sync') });\n    if (result.action === 'conflict') {\n      const takeRemote = await confirmDialog({\n        title: 'Newer cloud save found',\n        message: 'The server holds a newer version of your save. Replace your local data with it? Choosing Cancel uploads your local save instead and overwrites the cloud copy.',\n        confirmLabel: 'Use cloud save', cancelLabel: 'Keep local', danger: false,\n      });\n      if (takeRemote && result.remote) {\n        await state.replaceState(result.remote);\n        toast('Restored from cloud.', 'success');\n      } else {\n        await sync.push({ prompt: () => passphrasePrompt('Unlock vault to upload') });\n        toast('Local save uploaded.', 'success');\n      }\n    } else {\n      toast('Sync complete.', 'success');\n    }\n  } catch (err) {\n    sfx.error();\n    toast(err.message, 'error');\n  }\n  navigate('/settings');\n}\n\n/** Pull and apply the cloud save. */\nasync function doRestore() {\n  const ok = await confirmDialog({\n    title: 'Restore from cloud?',\n    message: 'Your local save will be replaced by the encrypted copy on the server. Export a local backup first if you are unsure.',\n    confirmLabel: 'Restore', danger: true,\n  });\n  if (!ok) return;\n  try {\n    const remote = await sync.pull({ prompt: () => passphrasePrompt('Unlock vault to decrypt') });\n    if (!remote) return;\n    await state.replaceState(remote);\n    sfx.capture();\n    toast('Save restored from cloud.', 'success');\n    navigate('/');\n  } catch (err) {\n    sfx.error();\n    toast(err.message, 'error');\n  }\n}\n\n/** Shared passphrase prompt used by the sync flows. */\nfunction passphrasePrompt(title) {\n  return promptDialog({\n    title,\n    message: 'Your vault passphrase encrypts and decrypts the synced save.',\n    placeholder: 'Vault passphrase',\n    maxLength: 128,\n    confirmLabel: 'Unlock',\n  });\n}\n\n/* -------------------------------------------------------------------- data */\n\nfunction dataCard() {\n  const s = state.getState();\n  const usage = h('div.kv-list', [\n    kvRow('Storage', h('span#storageStat', 'Measuring…')),\n    kvRow('Creatures', String(Object.keys(s.creatures).length)),\n    kvRow('Schema version', `v${s.schema}`),\n  ]);\n\n  const fileInput = h('input', {\n    type: 'file', accept: '.json,.dpvault,application/json', style: { display: 'none' },\n    onchange: (e) => importFile(e.target.files?.[0]),\n  });\n\n  const backups = h('div.backup-list', h('p.muted', 'Loading backups…'));\n\n  return card(null,\n    sectionHead('Data management', h('span.pill', 'Local-first')),\n    h('p.muted', 'Your save lives in this browser’s IndexedDB. Export regularly — clearing site data erases it.'),\n    usage,\n    h('div.row.row--wrap', [\n      h('button.btn', { type: 'button', onclick: () => exportPlain() }, 'Export JSON'),\n      h('button.btn', { type: 'button', onclick: () => exportEncrypted() }, 'Export encrypted'),\n      h('button.btn.btn--primary', { type: 'button', onclick: () => fileInput.click() }, 'Import save'),\n      fileInput,\n    ]),\n    h('h4.detail__sub', 'Automatic backups'),\n    backups,\n    h('div.row.row--wrap', [\n      h('button.btn.btn--danger', {\n        type: 'button',\n        onclick: async () => {\n          const ok = await confirmDialog({\n            title: 'Delete ALL local data?',\n            message: 'This erases your profile, creatures, settings and backups on this device. It cannot be undone. Export a backup first if you are unsure.',\n            confirmLabel: 'Delete everything', danger: true,\n          });\n          if (!ok) return;\n          leave();\n          await state.wipe();\n          resetOnboarding();\n          sync.forgetVaultKey();\n          toast('All local data deleted.', 'info');\n          navigate('/onboarding');\n        },\n      }, 'Delete all data'),\n    ]),\n  );\n}\n\n/* -------------------------------------------------------- export / import */\n\n/** Trigger a browser download. */\nfunction download(filename, text, mime = 'application/json') {\n  const blob = new Blob([text], { type: mime });\n  const url = URL.createObjectURL(blob);\n  const a = h('a', { href: url, download: filename });\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 2000);\n}\n\n/** Plain (unencrypted) export — portable, but readable by anyone. */\nfunction exportPlain() {\n  const payload = state.exportPayload();\n  payload.exportedAt = new Date().toISOString();\n  payload.exportKind = 'digipoke.plain.v1';\n  download(`digipoke-save-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2));\n  toast('Save exported as JSON.', 'success');\n}\n\n/** Encrypted export — safe to email, drop in cloud storage, etc. */\nasync function exportEncrypted() {\n  const record = await db.kvGet('vault', null);\n  if (!record) return toast('No local vault found. Complete onboarding first.', 'error');\n\n  const pass = await promptDialog({\n    title: 'Encrypt export',\n    message: 'This passphrase is required to import the file. It is not stored in the file.',\n    placeholder: 'Passphrase', maxLength: 128, confirmLabel: 'Encrypt',\n  });\n  if (!pass || pass.length < 8) return toast('Passphrase must be at least 8 characters.', 'error');\n\n  const salt = newSalt();\n  const key = await deriveVaultKey(pass, salt, record.iterations);\n  const payload = state.exportPayload();\n  payload.exportedAt = new Date().toISOString();\n  const sealed = await encryptJson(key, payload);\n\n  download(\n    `digipoke-vault-${new Date().toISOString().slice(0, 10)}.dpvault`,\n    JSON.stringify({ kind: 'digipoke.vault.v1', salt, iterations: record.iterations, ...sealed }, null, 2),\n  );\n  toast('Encrypted vault exported.', 'success');\n}\n\n/**\n * Import a save file (plain JSON or encrypted .dpvault).\n * @param {File} file\n */\nasync function importFile(file) {\n  if (!file) return;\n  try {\n    const text = await file.text();\n    const parsed = JSON.parse(text);\n\n    let payload = parsed;\n    if (parsed?.kind === 'digipoke.vault.v1') {\n      const pass = await promptDialog({\n        title: 'Encrypted vault',\n        message: `Enter the passphrase used to encrypt ${file.name}.`,\n        placeholder: 'Passphrase', maxLength: 128, confirmLabel: 'Decrypt',\n      });\n      if (!pass) return;\n      const key = await deriveVaultKey(pass, parsed.salt, parsed.iterations ?? 250000);\n      payload = await decryptJson(key, parsed);\n    }\n\n    if (!payload || !payload.profile || !payload.creatures) {\n      throw new Error('That file is not a DigiPoke save.');\n    }\n\n    const ok = await confirmDialog({\n      title: 'Replace local save?',\n      message: `Importing will replace your current game (${Object.keys(state.getState().creatures).length} creatures) with the imported save (${Object.keys(payload.creatures).length} creatures).`,\n      confirmLabel: 'Import', danger: true,\n    });\n    if (!ok) return;\n\n    await state.replaceState(payload);\n    sfx.capture();\n    toast('Save imported.', 'success');\n    navigate('/');\n  } catch (err) {\n    sfx.error();\n    toast(`Import failed: ${err.message}`, 'error');\n  }\n}\n\n/* ---------------------------------------------------------------- backups */\n\n/** Load storage stats and the backup ring into the rendered card. */\nasync function loadStorageStats() {\n  const el = document.getElementById('storageStat');\n  const estimate = await db.storageEstimate();\n  if (el) {\n    el.textContent = estimate\n      ? `${(estimate.usage / 1024 / 1024).toFixed(2)} MB of ${(estimate.quota / 1024 / 1024).toFixed(0)} MB (${(estimate.pct * 100).toFixed(1)}%)`\n      : 'Unavailable in this browser';\n  }\n\n  const list = document.querySelector('.backup-list');\n  if (!list) return;\n  const backups = await db.listBackups();\n  if (!backups.length) {\n    list.replaceChildren(h('p.muted', 'No backups yet — they are created automatically as you play.'));\n    return;\n  }\n  list.replaceChildren(h('div.stack', backups.map((b) => h('div.list-row', {\n    type: 'button',\n  }, [\n    h('span.list-row__name', new Date(b.at).toLocaleString('en-GB')),\n    h('span.list-row__meta', `${Object.keys(b.snapshot?.creatures || {}).length} creatures`),\n    h('button.btn.btn--sm.btn--ghost', {\n      type: 'button',\n      onclick: async () => {\n        const ok = await confirmDialog({\n          title: 'Restore this backup?',\n          message: 'Your current save will be replaced by this snapshot.',\n          confirmLabel: 'Restore', danger: true,\n        });\n        if (!ok) return;\n        await state.replaceState(b.snapshot);\n        toast('Backup restored.', 'success');\n        navigate('/');\n      },\n    }, 'Restore'),\n  ]))));\n}\n\n/* ------------------------------------------------------------------- about */\n\nfunction aboutCard() {\n  return card('About',\n    h('div.kv-list', [\n      kvRow('Version', '1.0.0'),\n      kvRow('Architecture', 'Local-first PWA · IndexedDB · zero-knowledge sync'),\n      kvRow('Engine', 'Deterministic seeded PRNG (mulberry32)'),\n    ]),\n    h('p.muted.muted--sm', [\n      'Engineering documentation ships with the repository under ',\n      h('code', 'docs/'),\n      ': PRD, system architecture, data model, API spec, security standards and the phased implementation plan.',\n    ]),\n    h('p.muted.muted--sm', 'DigiPoke works fully offline. Installing it as an app keeps the whole experience available without a network.'),\n  );\n}\n\n/* ------------------------------------------------------------------ utils */\n\nfunction kvRow(label, value, action = null) {\n  return h('div.kv-row', [\n    h('span.kv-row__label', label),\n    h('span.kv-row__value', value),\n    action ? h('span.kv-row__action', action) : null,\n  ]);\n}\n\n/** Apply a theme to <html data-theme>. */\nexport function applyTheme(theme) {\n  document.documentElement.dataset.theme = theme || 'nexus';\n}\n\nexport const meta = { title: 'Settings' };\nexport { num, randomId, emptyState };\n"},{"key":"src/ui/screens/dashboard.js","code":"/**\n * dashboard.js — The Nexus: player's home screen and primary workflow hub.\n *\n * Design intent: everything the player needs for a session is one tap away —\n * team state, today's objectives, and the two entry points into the core loop\n * (Explore and Lab). No screen in the app is more than two taps from here.\n *\n * @module ui/screens/dashboard\n */\n\nimport { h, num, renderInto } from '«src/ui/dom.js»';\nimport {\n  card, sectionHead, creatureCard, grid, spriteEl, hpBar, statBar,\n  badge, timeAgo, emptyState, tamerEl,\n} from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { sfx, startMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport { getZone, ZONES, unlockedZones } from '«src/domain/zones.js»';\nimport { getSpecies } from '«src/domain/species.js»';\nimport { STAT_IDS, maxHpOf } from '«src/domain/creature.js»';\n\n/**\n * Render the dashboard.\n * @param {HTMLElement} root\n */\nexport function render(root) {\n  const s = state.getState();\n  const team = state.teamCreatures();\n  const zone = getZone(s.progress.zoneId);\n  const objectives = state.ensureObjectives();\n\n  startMusic('menu');\n\n  // Sequencing: on a brand-new save the objectives card is just three greyed\n  // rows shouting \"locked\". Hold it back until the coach card is dismissed so\n  // the first screen reads as one clear next step instead of five.\n  const firstRun = state.tutorialPending('nexus');\n\n  const view = h('div.view.view--dashboard', [\n    heroCard(s, team, zone),\n    coachCard(),\n    firstRun ? null : objectivesCard(objectives),\n    teamCard(team),\n    quickActionsCard(zone, firstRun),\n  ]);\n  renderInto(root, view);\n}\n\n/* --------------------------------------------------------------- sections */\n\nfunction heroCard(s, team, zone) {\n  const stats = s.profile.stats;\n  const hpTotal = team.reduce((sum, c) => sum + Math.max(0, c.hp), 0);\n  const hpMax = team.reduce((sum, c) => sum + maxHpOf(c), 0);\n\n  return card(null,\n    h('div.hero', [\n      h('div.hero__avatar', tamerEl(s.profile.tamer, { size: 72, mood: 'happy' })),\n      h('div.hero__id', [\n        h('h1.hero__name', s.profile.displayName),\n        h('div.hero__meta', [\n          badge(`Tamer since ${new Date(s.profile.createdAt).toLocaleDateString('en-GB')}`, { kind: 'neutral' }),\n          // \"Last seen just now\" is nonsense on a profile made five seconds ago.\n          Date.now() - new Date(s.profile.createdAt).getTime() < 60_000\n            ? badge('Just started', { kind: 'primary' })\n            : badge(`Last seen ${timeAgo(s.profile.lastSeenAt)}`, { kind: 'neutral' }),\n        ]),\n      ]),\n      h('div.hero__shards', [\n        h('span.hero__shard-value', `◈ ${num(s.profile.shards)}`),\n        h('span.hero__shard-label', 'Data Shards'),\n      ]),\n    ]),\n    h('div.hero__bars', [\n      statBar('Team vitality', hpTotal, hpMax, { color: hpTotal / Math.max(1, hpMax) < 0.3 ? '#ff6b6b' : '#4fd67c' }),\n    ]),\n    h('div.stat-grid', [\n      statBox('Battles', stats.battles),\n      statBox('Wins', stats.battlesWon),\n      statBox('Caught', stats.captures),\n      statBox('Evolutions', stats.evolutions),\n      statBox('Scans', stats.steps),\n      statBox('Zones', `${unlockedZones(state.strongestLevel()).length}/${ZONES.length}`),\n    ]),\n    h('p.muted.muted--sm', `Current zone: ${zone.name} — ${zone.blurb}`),\n  );\n}\n\n/**\n * First-run coach marks. Shown once, then remembered in the save file —\n * a three-line primer is the difference between \"what do I do?\" and playing.\n */\nfunction coachCard() {\n  if (!state.tutorialPending('nexus')) return null;\n  return card(null,\n    sectionHead('Welcome to your Nexus', badge('Getting started', { kind: 'primary' })),\n    h('ol.help-list', [\n      h('li', [h('strong', 'Explore'), ' — scan a zone to meet wild digi-life, weaken it, then throw a Data Ball.']),\n      h('li', [h('strong', 'Lab'), ' — evolve, train cores and tutor moves with the Data Shards you earn.']),\n      h('li', [h('strong', 'Own it'), ' — everything is stored on this device. Export a backup any time from Data.']),\n    ]),\n    h('div.row.row--end', h('button.btn.btn--primary', {\n      type: 'button',\n      onclick: () => { state.markTutorialSeen('nexus'); sfx.confirm(); navigate('/'); },\n    }, 'Got it')),\n  );\n}\n\nfunction statBox(label, value) {\n  return h('div.stat-box', [h('span.stat-box__value', String(value)), h('span.stat-box__label', label)]);\n}\n\nfunction objectivesCard(objectives) {\n  const rows = objectives.items.map((item) => {\n    const done = item.progress >= item.goal;\n    const claimed = objectives.claimed.includes(item.id);\n    return h('div.objective', [\n      h('div.objective__main', [\n        h('div.objective__text', item.text),\n        h('div.bar.bar--thin', h('div.bar__fill', {\n          style: { width: `${(item.progress / item.goal) * 100}%`, background: done ? '#4fd67c' : 'var(--accent)' },\n        })),\n        h('div.objective__meta', `${Math.min(item.progress, item.goal)} / ${item.goal} · +◈${item.reward}`),\n      ]),\n      claimed\n        ? badge('Claimed', { kind: 'muted' })\n        : h('button.btn.btn--sm', {\n          type: 'button',\n          disabled: !done,\n          onclick: () => {\n            const res = state.claimObjective(item.id);\n            if (res.ok) { sfx.capture(); navigate('/'); } else sfx.error();\n          },\n        }, done ? 'Claim' : 'Locked'),\n    ]);\n  });\n\n  return card('Daily objectives',\n    h('p.muted.muted--sm', `Resets daily · ${objectives.dateKey}`),\n    h('div.objective-list', rows),\n  );\n}\n\nfunction teamCard(team) {\n  const slots = Array.from({ length: 6 }, (_, i) => {\n    const c = team[i];\n    if (!c) return h('div.team-slot.team-slot--empty', h('span', 'Empty'));\n    return h('button.team-slot', {\n      type: 'button',\n      title: `${getSpecies(c.speciesId).name} · Lv ${c.level}`,\n      onclick: () => { sfx.select(); navigate(`/ranch?focus=${c.uid}`); },\n    }, [\n      spriteEl(c.speciesId, { size: 64, shiny: c.shiny }),\n      h('div.team-slot__name', getSpecies(c.speciesId).name),\n      hpBar(c, { showNumbers: false }),\n    ]);\n  });\n\n  return card(null,\n    sectionHead('Active team',\n      h('button.btn.btn--sm', { type: 'button', onclick: () => { sfx.heal(); state.healAllCreatures(); } }, 'Heal team')),\n    h('div.team-grid', slots),\n    team.length === 0\n      ? emptyState('No creatures in your team. Visit the Ranch to assign some.')\n      : null,\n  );\n}\n\nfunction quickActionsCard(zone, firstRun = false) {\n  const actions = [\n    {\n      icon: '➤', title: 'Explore', text: `Scan ${zone.name} for wild digi-life.`,\n      kind: 'primary', hint: firstRun, onClick: () => navigate('/explore'),\n    },\n    {\n      icon: '⚗', title: 'Lab', text: 'Evolve, train cores and tutor moves.',\n      kind: 'ghost', onClick: () => navigate('/lab'),\n    },\n    {\n      icon: '❖', title: 'Ranch', text: 'Manage your roster and team order.',\n      kind: 'ghost', onClick: () => navigate('/ranch'),\n    },\n    {\n      icon: '⚙', title: 'Data', text: 'Export, import and sync your vault.',\n      kind: 'ghost', onClick: () => navigate('/settings'),\n    },\n  ];\n\n  return card('Quick actions',\n    grid(actions.map((a) => h(`button.quick-action.quick-action--${a.kind}${a.hint ? '.is-hint' : ''}`, {\n      type: 'button',\n      onclick: () => { sfx.click(); a.onClick(); },\n    }, [\n      h('span.quick-action__icon', a.icon),\n      h('div', [h('div.quick-action__title', a.title), h('div.quick-action__text', a.text)]),\n      a.hint ? badge('Start here', { kind: 'primary' }) : null,\n    ])), { cols: '2' }),\n  );\n}\n\n/* ---------------------------------------------------------------- art */\n\n/** Re-exported for the router title. */\nexport const meta = { title: 'Nexus' };\n"},{"key":"src/ui/screens/ranch.js","code":"/**\n * ranch.js — Roster management: browse, inspect, rename, team-up, release.\n *\n * The Ranch is the \"collection\" surface. It reads straight from state and\n * performs every mutation through a named action in core/state.js, so the\n * persistence and sync layers stay unaware of the UI.\n *\n * @module ui/screens/ranch\n */\n\nimport { h, renderInto, num } from '«src/ui/dom.js»';\nimport {\n  card, sectionHead, creatureCard, grid, spriteEl, hpBar, statBar,\n  typeRow, badge, modal, confirmDialog, promptDialog, toast, emptyState, statusBadge,\n} from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { sfx, startMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport { getSpecies, STAGE_ORDER } from '«src/domain/species.js»';\nimport { getMove } from '«src/domain/moves.js»';\nimport {\n  statsFor, maxHpOf, displayName, corePotential, healCreature,\n  canEvolve, evolutionBlocker, hpRatio, STAT_IDS,\n} from '«src/domain/creature.js»';\nimport { bondTier, CORE_CAP, xpToNext } from '«src/domain/progression.js»';\n\n/** View filters are module-scoped so they survive re-renders. */\nconst filters = { view: 'all', sort: 'level', focus: null };\n\n/**\n * Render the Ranch.\n * @param {HTMLElement} root\n * @param {{query:URLSearchParams}} [ctx]\n */\nexport function render(root, ctx = { query: new URLSearchParams() }) {\n  startMusic('menu');\n  const focusUid = ctx.query?.get('focus');\n  const creatures = filterAndSort(state.allCreatures());\n\n  const view = h('div.view.view--ranch', [\n    controlsBar(),\n    creatures.length\n      ? grid(creatures.map((c) => creatureCard(c, {\n        selected: state.getState().team.includes(c.uid),\n        note: state.getState().team.includes(c.uid) ? 'In active team' : null,\n        onClick: () => openDetail(c.uid),\n      })), { cols: 'auto' })\n      : emptyState('Your ranch is empty. Head to Explore to meet wild digi-life.'),\n  ]);\n\n  renderInto(root, view);\n\n  if (focusUid && state.getCreature(focusUid)) {\n    filters.focus = focusUid;\n    openDetail(focusUid);\n  }\n}\n\n/* ---------------------------------------------------------------- controls */\n\nfunction controlsBar() {\n  const s = state.getState();\n  const seg = (id, label) => h(`button.seg-btn${filters.view === id ? '.is-active' : ''}`, {\n    type: 'button',\n    onclick: () => { filters.view = id; sfx.click(); navigate('/ranch'); },\n  }, label);\n\n  return card(null,\n    sectionHead(`Ranch · ${Object.keys(s.creatures).length} creatures`,\n      h('button.btn.btn--sm.btn--primary', {\n        type: 'button',\n        onclick: () => { sfx.heal(); state.healAllCreatures(); toast('Roster restored to full health.', 'success'); navigate('/ranch'); },\n      }, 'Heal all')),\n    h('div.row.row--wrap', [\n      h('div.seg', [\n        seg('all', 'All'), seg('team', 'Team'), seg('hurt', 'Hurt'), seg('fainted', 'Fainted'),\n      ]),\n      h('label.field.field--inline', [\n        h('span.field__label', 'Sort'),\n        h('select.input.input--sm', {\n          onchange: (e) => { filters.sort = e.target.value; navigate('/ranch'); },\n        }, [\n          h('option', { value: 'level', selected: filters.sort === 'level' }, 'Level'),\n          h('option', { value: 'species', selected: filters.sort === 'species' }, 'Species'),\n          h('option', { value: 'recent', selected: filters.sort === 'recent' }, 'Recently caught'),\n          h('option', { value: 'potential', selected: filters.sort === 'potential' }, 'Core potential'),\n        ]),\n      ]),\n    ]),\n  );\n}\n\nfunction filterAndSort(list) {\n  const s = state.getState();\n  let out = list;\n  if (filters.view === 'team') out = out.filter((c) => s.team.includes(c.uid));\n  if (filters.view === 'hurt') out = out.filter((c) => c.hp > 0 && hpRatio(c) < 0.6);\n  if (filters.view === 'fainted') out = out.filter((c) => c.hp <= 0);\n\n  const cmp = {\n    level: (a, b) => b.level - a.level,\n    species: (a, b) => getSpecies(a.speciesId).name.localeCompare(getSpecies(b.speciesId).name),\n    recent: (a, b) => (a.origin.at < b.origin.at ? 1 : -1),\n    potential: (a, b) => corePotential(b).total - corePotential(a).total,\n  }[filters.sort];\n  return [...out].sort(cmp);\n}\n\n/* ------------------------------------------------------------------ detail */\n\n/** Open the creature inspector modal. */\nexport function openDetail(uid) {\n  const creature = state.getCreature(uid);\n  if (!creature) return;\n  const species = getSpecies(creature.speciesId);\n  const stats = statsFor(creature);\n  const pot = corePotential(creature);\n  const tier = bondTier(creature.bond);\n  const inTeam = state.getState().team.includes(uid);\n  const evo = canEvolve(creature);\n  const blocker = evolutionBlocker(creature);\n\n  const body = h('div.detail', [\n    h('div.detail__head', [\n      spriteEl(creature.speciesId, { size: 118, shiny: creature.shiny }),\n      h('div.detail__id', [\n        h('div.detail__name', [\n          displayName(creature),\n          creature.shiny ? badge('Glitch', { kind: 'glitch' }) : null,\n          statusBadge(null),\n        ]),\n        h('div.detail__species', `${species.name} · ${species.stage} · Lv ${creature.level}`),\n        typeRow(species.types),\n        h('p.detail__lore', species.lore),\n      ]),\n    ]),\n\n    hpBar(creature),\n    h('div.detail__xp', [\n      h('span', `XP ${num(creature.xp)} / ${num(xpToNext(creature.level))}`),\n      h('div.bar.bar--thin', h('div.bar__fill.bar__fill--xp', {\n        style: { width: `${(creature.xp / Math.max(1, xpToNext(creature.level))) * 100}%` },\n      })),\n    ]),\n\n    h('h4.detail__sub', 'Stats'),\n    h('div.detail__stats', [\n      statBar('HP', `${Math.max(0, Math.round(creature.hp))} / ${maxHpOf(creature)}`, null, { color: '#4fd67c' }),\n      statBar('ATK', stats.atk, 220, { color: '#ff6b6b' }),\n      statBar('DEF', stats.def, 220, { color: '#3db4ff' }),\n      statBar('SPD', stats.spd, 220, { color: '#ffd93d' }),\n    ]),\n\n    h('h4.detail__sub', `Cores · ${pot.total}/${pot.max}`),\n    h('div.detail__cores', STAT_IDS.map((id) => h('div.core-cell', [\n      h('span.core-cell__label', id.toUpperCase()),\n      h('span.core-cell__value', `${creature.cores[id]}/${CORE_CAP}`),\n      h('div.bar.bar--thin', h('div.bar__fill', {\n        style: { width: `${(creature.cores[id] / CORE_CAP) * 100}%`, background: 'var(--accent-2)' },\n      })),\n    ]))),\n\n    h('h4.detail__sub', 'Moves'),\n    h('div.detail__moves', creature.moves.map((id) => {\n      const m = getMove(id);\n      return h('div.move-row', [\n        h('span.move-row__name', m.name),\n        typeRow([m.type], { small: true }),\n        h('span.move-row__power', m.power ? `PWR ${m.power}` : 'Support'),\n        h('span.move-row__desc', m.desc),\n      ]);\n    })),\n\n    evo || blocker ? h('div.detail__evo', [\n      h('span', evo ? `Ready to evolve into ${getSpecies(evo.to).name}.` : blocker),\n      evo ? h('button.btn.btn--sm.btn--primary', {\n        type: 'button',\n        onclick: () => { modal.close(); navigate(`/lab?evolve=${uid}`); },\n      }, 'Open Lab') : null,\n    ]) : null,\n\n    h('div.detail__footer', [\n      h('span.pill', { style: { color: tier.color } }, `Bond ${creature.bond} · ${tier.label}`),\n      h('span.pill', `Caught ${new Date(creature.origin.at).toLocaleDateString('en-GB')}`),\n      h('span.pill', `Zone: ${creature.origin.zone}`),\n    ]),\n  ]);\n\n  const modal = modal({\n    title: displayName(creature),\n    size: 'md',\n    body,\n    actions: [\n      {\n        label: inTeam ? 'Remove from team' : 'Add to team',\n        kind: inTeam ? 'ghost' : 'primary',\n        onClick: () => {\n          if (inTeam) {\n            state.removeFromTeam(uid);\n            toast(`${displayName(creature)} benched.`, 'info');\n          } else if (state.getState().team.length >= 6) {\n            toast('Your team is full (6 maximum).', 'error');\n          } else {\n            state.addToTeam(uid);\n            toast(`${displayName(creature)} joined your team.`, 'success');\n          }\n        },\n      },\n      {\n        label: 'Rename',\n        kind: 'ghost',\n        onClick: async () => {\n          const name = await promptDialog({\n            title: 'Rename creature',\n            message: 'Leave blank to revert to the species name.',\n            value: creature.nickname || '',\n            maxLength: 18,\n          });\n          if (name !== null) { state.renameCreature(uid, name); toast('Renamed.', 'success'); }\n        },\n      },\n      {\n        label: 'Rest',\n        kind: 'ghost',\n        onClick: () => {\n          state.mutate((s) => healCreature(s.creatures[uid]));\n          sfx.heal();\n          toast(`${displayName(creature)} is fully rested.`, 'success');\n        },\n      },\n      {\n        label: 'Release',\n        kind: 'danger',\n        onClick: async () => {\n          const species2 = getSpecies(creature.speciesId);\n          const ok = await confirmDialog({\n            title: `Release ${displayName(creature)}?`,\n            message: `This permanently removes it from your ranch in exchange for Data Shards. This cannot be undone.`,\n            confirmLabel: 'Release',\n            danger: true,\n          });\n          if (!ok) return;\n          const res = state.releaseCreature(uid);\n          if (!res.ok) { toast(res.reason, 'error'); return; }\n          sfx.faint();\n          toast(`Released. +◈${res.shards} Data Shards.`, 'info');\n          navigate('/ranch');\n        },\n      },\n    ],\n  });\n}\n\nexport const meta = { title: 'Ranch' };\nexport { STAGE_ORDER };\n"},{"key":"src/ui/screens/explore.js","code":"/**\n * explore.js — Zone selection, scanning and encounter generation.\n *\n * Scanning is the core \"gacha-free\" loop: each scan burns one step, accrues\n * objective progress, and rolls for an encounter using the profile's seeded\n * RNG. Encounters hand off to the battle screen via the router, which keeps\n * the (large) battle UI out of memory until it is actually needed.\n *\n * @module ui/screens/explore\n */\n\nimport { h, renderInto } from '«src/ui/dom.js»';\nimport { card, sectionHead, spriteEl, badge, toast, emptyState, typeRow } from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { createRng } from '«src/core/rng.js»';\nimport { sfx, startMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport { ZONES, getZone, rollEncounter, rollRival, unlockedZones } from '«src/domain/zones.js»';\nimport { getSpecies } from '«src/domain/species.js»'
