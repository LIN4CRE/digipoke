velope.iv) },\n    key,\n    fromB64(envelope.ct),\n  );\n  return JSON.parse(dec.decode(plain));\n}\n\n/* ---------------------------------------------------------------- verifier */\n\n/** Constant marker encrypted under the vault key, used to validate passphrases. */\nconst VERIFIER_MARKER = 'digipoke.vault.v1';\n\n/**\n * Create a verifier envelope for a derived key.\n * Storing this lets the app confirm a passphrase without persisting it.\n */\nexport async function makeVerifier(key) {\n  return encryptJson(key, { marker: VERIFIER_MARKER });\n}\n\n/**\n * Check a passphrase against a stored verifier.\n * @returns {Promise<boolean>}\n */\nexport async function verifyPassphrase(passphrase, saltB64, verifier) {\n  try {\n    const key = await deriveVaultKey(passphrase, saltB64);\n    const data = await decryptJson(key, verifier);\n    return data?.marker === VERIFIER_MARKER;\n  } catch {\n    return false;\n  }\n}\n\n/* ------------------------------------------------------------------ hashing */\n\n/** SHA-256 hex digest (e.g. fingerprinting a vault before upload). */\nexport async function sha256Hex(text) {\n  const digest = await subtle().digest('SHA-256', enc.encode(text));\n  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');\n}\n\n/**\n * Build the opaque sync payload uploaded to the server.\n * The server sees only this: an IV, ciphertext, and a schema version.\n */\nexport async function sealVault(key, payload) {\n  return {\n    schema: payload.schema ?? 1,\n    updatedAt: payload.updatedAt ?? new Date().toISOString(),\n    ...(await encryptJson(key, payload)),\n  };\n}\n\n/** Inverse of `sealVault`. Throws on tampering or a wrong passphrase. */\nexport async function openVault(key, sealed) {\n  return decryptJson(key, { alg: sealed.alg, iv: sealed.iv, ct: sealed.ct });\n}\n"},{"key":"src/core/db.js","code":"/**\n * db.js — IndexedDB persistence layer (the \"local\" in local-first).\n *\n * Stores\n * ------\n *  kv      – key/value: 'state' (the whole save), 'account', 'vault'\n *  dex     – per-species discovery records (never rolled back by sync)\n *  outbox  – queued sync operations awaiting a network round-trip\n *  backups – rolling ring of the last N save snapshots (crash recovery)\n *\n * Everything is promise-wrapped. Every write is a single transaction, so a\n * mid-write tab crash cannot produce a half-written save. IndexedDB's own\n * durability (relaxed by default) is upgraded to \"strict\" where supported so a\n * power loss cannot lose a completed write.\n *\n * @module core/db\n */\n\nconst DB_NAME = 'digipoke';\nconst DB_VERSION = 1;\nexport const STORES = { KV: 'kv', DEX: 'dex', OUTBOX: 'outbox', BACKUPS: 'backups' };\n\n/** How many rolling snapshots to keep. */\nconst BACKUP_LIMIT = 5;\n\nlet dbPromise = null;\n\n/** Open (and lazily create) the database. */\nexport function openDb() {\n  if (dbPromise) return dbPromise;\n  dbPromise = new Promise((resolve, reject) => {\n    if (!globalThis.indexedDB) {\n      reject(new Error('IndexedDB is unavailable in this environment.'));\n      return;\n    }\n    const req = indexedDB.open(DB_NAME, DB_VERSION);\n    req.onupgradeneeded = () => {\n      const db = req.result;\n      if (!db.objectStoreNames.contains(STORES.KV)) db.createObjectStore(STORES.KV);\n      if (!db.objectStoreNames.contains(STORES.DEX)) db.createObjectStore(STORES.DEX, { keyPath: 'id' });\n      if (!db.objectStoreNames.contains(STORES.OUTBOX)) db.createObjectStore(STORES.OUTBOX, { keyPath: 'id', autoIncrement: true });\n      if (!db.objectStoreNames.contains(STORES.BACKUPS)) db.createObjectStore(STORES.BACKUPS, { keyPath: 'id' });\n    };\n    req.onsuccess = () => {\n      req.result.onversionchange = () => { req.result.close(); dbPromise = null; };\n      resolve(req.result);\n    };\n    req.onerror = () => reject(req.error);\n    req.onblocked = () => reject(new Error('DigiPoke database is blocked by another tab. Close other tabs and retry.'));\n  });\n  return dbPromise;\n}\n\n/** Run `fn` inside a transaction, resolving with its result. */\nasync function tx(storeNames, mode, fn) {\n  const db = await openDb();\n  return new Promise((resolve, reject) => {\n    const names = Array.isArray(storeNames) ? storeNames : [storeNames];\n    let transaction;\n    try {\n      // 'strict' durability where available: flush before the success event.\n      transaction = db.transaction(names, mode, { durability: 'strict' });\n    } catch {\n      transaction = db.transaction(names, mode);\n    }\n    const stores = names.map((n) => transaction.objectStore(n));\n    let result;\n    try {\n      result = fn(stores.length === 1 ? stores[0] : stores, transaction);\n    } catch (err) {\n      transaction.abort();\n      reject(err);\n      return;\n    }\n    transaction.oncomplete = () => resolve(result);\n    transaction.onerror = () => reject(transaction.error);\n    transaction.onabort = () => reject(transaction.error || new Error('Transaction aborted'));\n  });\n}\n\n/** Wrap an IDBRequest in a promise. */\nfunction wrap(request) {\n  return new Promise((resolve, reject) => {\n    request.onsuccess = () => resolve(request.result);\n    request.onerror = () => reject(request.error);\n  });\n}\n\n/* -------------------------------------------------------------- kv helpers */\n\nexport async function kvGet(key, fallback = null) {\n  const value = await tx(STORES.KV, 'readonly', (store) => wrap(store.get(key)));\n  return value === undefined ? fallback : value;\n}\n\nexport async function kvSet(key, value) {\n  await tx(STORES.KV, 'readwrite', (store) => wrap(store.put(structuredClone(value), key)));\n  return value;\n}\n\nexport async function kvDelete(key) {\n  await tx(STORES.KV, 'readwrite', (store) => wrap(store.delete(key)));\n}\n\n/* ------------------------------------------------------------ save files */\n\n/** Load the last persisted save file. */\nexport async function loadState() {\n  try {\n    return await kvGet('state', null);\n  } catch (err) {\n    console.error('[db] failed to load state:', err);\n    return null;\n  }\n}\n\n/**\n * Persist a save file and rotate the backup ring.\n * Backups are written with the current snapshot *before* the new state lands,\n * so recovery can always step one version back.\n */\nexport async function saveState(state, { backup = true } = {}) {\n  const previous = backup ? await kvGet('state', null).catch(() => null) : null;\n  await kvSet('state', state);\n  if (backup && previous) await pushBackup(previous);\n  return state;\n}\n\n/** Append a snapshot to the rolling backup ring. */\nexport async function pushBackup(snapshot) {\n  const id = `bk_${Date.now().toString(36)}`;\n  await tx(STORES.BACKUPS, 'readwrite', (store) => wrap(store.put({ id, at: new Date().toISOString(), snapshot })));\n  const ids = await tx(STORES.BACKUPS, 'readonly', (store) => wrap(store.getAllKeys()));\n  if (ids.length > BACKUP_LIMIT) {\n    const stale = ids.sort().slice(0, ids.length - BACKUP_LIMIT);\n    await tx(STORES.BACKUPS, 'readwrite', (store) => Promise.all(stale.map((k) => wrap(store.delete(k)))));\n  }\n}\n\n/** List available backups, newest first. */\nexport async function listBackups() {\n  const rows = await tx(STORES.BACKUPS, 'readonly', (store) => wrap(store.getAll())).catch(() => []);\n  return rows.sort((a, b) => (a.id < b.id ? 1 : -1));\n}\n\n/* --------------------------------------------------------------- dex store */\n\n/** Record that a species was seen or caught. */\nexport async function recordDex(speciesId, { caught = false } = {}) {\n  const existing = await tx(STORES.DEX, 'readonly', (store) => wrap(store.get(speciesId))).catch(() => null);\n  const row = existing || { id: speciesId, seen: 0, caught: 0, firstSeenAt: new Date().toISOString() };\n  row.seen += 1;\n  if (caught) {\n    row.caught += 1;\n    row.firstCaughtAt = row.firstCaughtAt || new Date().toISOString();\n  }\n  await tx(STORES.DEX, 'readwrite', (store) => wrap(store.put(row)));\n  return row;\n}\n\n/** Whole Pokedex-equivalent, keyed by species id. */\nexport async function readDex() {\n  const rows = await tx(STORES.DEX, 'readonly', (store) => wrap(store.getAll())).catch(() => []);\n  return Object.fromEntries(rows.map((r) => [r.id, r]));\n}\n\n/* ------------------------------------------------------------ sync outbox */\n\n/** Queue an operation for the next sync pass. */\nexport async function enqueueOp(op) {\n  return tx(STORES.OUTBOX, 'readwrite', (store) => wrap(store.add({ ...op, queuedAt: new Date().toISOString() })));\n}\n\n/** Read every queued operation, oldest first. */\nexport async function readOutbox() {\n  return tx(STORES.OUTBOX, 'readonly', (store) => wrap(store.getAll())).catch(() => []);\n}\n\n/** Remove a queued operation by id. */\nexport async function dequeueOp(id) {\n  await tx(STORES.OUTBOX, 'readwrite', (store) => wrap(store.delete(id)));\n}\n\n/* ------------------------------------------------------------------ admin */\n\n/** Wipe every DigiPoke store (used by \"Delete all data\"). */\nexport async function clearAll() {\n  const names = Object.values(STORES);\n  await tx(names, 'readwrite', (stores) => Promise.all(stores.map((s) => wrap(s.clear()))));\n}\n\n/** Best-effort storage estimate for the Settings > Data panel. */\nexport async function storageEstimate() {\n  if (typeof navigator === 'undefined' || !navigator.storage?.estimate) return null;\n  try {\n    const { usage = 0, quota = 0 } = await navigator.storage.estimate();\n    return { usage, quota, pct: quota ? usage / quota : 0 };\n  } catch {\n    return null;\n  }\n}\n\n/** Ask the browser to keep IndexedDB alive under storage pressure. */\nexport async function requestPersistence() {\n  if (typeof navigator === 'undefined' || !navigator.storage?.persist) return false;\n  try {\n    if (await navigator.storage.persisted()) return true;\n    return await navigator.storage.persist();\n  } catch {\n    return false;\n  }\n}\n"},{"key":"src/core/rng.js","code":"/**\n * rng.js — Deterministic, serialisable pseudo-random number generation.\n *\n * DigiPoke is local-first and replayable: every randomised outcome (encounters,\n * capture rolls, critical hits, core values) flows through a seeded generator so\n * that a save file plus a seed reproduces an identical run. That makes bug\n * reports reproducible and enables deterministic unit tests without mocks.\n *\n * Implementation: mulberry32 — a 32-bit PRNG with good distribution, tiny\n * state (a single integer) and no external dependencies.\n *\n * @module core/rng\n */\n\n/**\n * Create a mulberry32 generator.\n * @param {number} seed 32-bit integer seed.\n * @returns {() => number} Uniform random function returning values in [0, 1).\n */\nexport function mulberry32(seed) {\n  let a = seed >>> 0;\n  return function next() {\n    a = (a + 0x6d2b79f5) >>> 0;\n    let t = a;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\n/** Produce a random 32-bit seed from the platform CSPRNG. */\nexport function randomSeed() {\n  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {\n    return crypto.getRandomValues(new Uint32Array(1))[0] >>> 0;\n  }\n  return Math.floor(Math.random() * 4294967296) >>> 0;\n}\n\n/**\n * Mix a string into a 32-bit integer (FNV-1a). Used to derive stable seeds\n * from stable inputs (e.g. daily objectives keyed by date).\n * @param {string} str\n * @returns {number}\n */\nexport function hashString(str) {\n  let h = 0x811c9dc5;\n  for (let i = 0; i < str.length; i++) {\n    h ^= str.charCodeAt(i);\n    h = Math.imul(h, 0x01000193);\n  }\n  return h >>> 0;\n}\n\n/**\n * A tiny helper object bundling the common dice rolls the game needs,\n * so call sites read clearly (`rng.int(3, 7)`, `rng.chance(0.2)`).\n */\nexport function createRng(seed = randomSeed()) {\n  const next = mulberry32(seed);\n  const api = {\n    seed,\n    /** Raw uniform float in [0,1). */\n    next,\n    /** Uniform float in [min, max). */\n    float: (min, max) => min + next() * (max - min),\n    /** Uniform integer in [min, max] inclusive. */\n    int: (min, max) => Math.floor(min + next() * (max - min + 1)),\n    /** True with probability p. */\n    chance: (p) => next() < p,\n    /** Uniformly pick one element. */\n    pick: (arr) => arr[Math.floor(next() * arr.length)],\n    /** In-place Fisher–Yates shuffle (returns the same array). */\n    shuffle: (arr) => {\n      for (let i = arr.length - 1; i > 0; i--) {\n        const j = Math.floor(next() * (i + 1));\n        [arr[i], arr[j]] = [arr[j], arr[i]];\n      }\n      return arr;\n    },\n    /** Weighted pick: entries need a numeric `w` field. */\n    weighted: (entries) => {\n      const total = entries.reduce((s, e) => s + e.w, 0);\n      let roll = next() * total;\n      for (const e of entries) {\n        roll -= e.w;\n        if (roll <= 0) return e;\n      }\n      return entries[entries.length - 1];\n    },\n  };\n  return api;\n}\n"},{"key":"src/core/router.js","code":"/**\n * router.js — Hash-based client router.\n *\n * Hash routing is deliberate: the PWA is served as static files from any\n * origin (including `file://` and a sub-path of a CDN), so we cannot rely on\n * server-side rewrites. Routes are declared as patterns like `#/ranch/:uid`.\n *\n * @module core/router\n */\n\nconst routes = [];\nlet currentHandler = null;\nlet currentMatch = null;\nlet notFoundHandler = null;\n\n/**\n * Register a route.\n * @param {string} pattern Hash path, e.g. '/ranch' or '/creature/:uid'.\n * @param {(ctx:{params:object, query:URLSearchParams, path:string}) => void} handler\n * @param {{title?:string, guard?:() => boolean|string}} [opts]\n *   `guard`: return true to allow, false to block, or a path to redirect to.\n */\nexport function route(pattern, handler, opts = {}) {\n  const { regex, keys } = compile(pattern);\n  routes.push({ pattern, handler, regex, keys, ...opts });\n}\n\n/** Handler used when nothing matches. */\nexport function setNotFound(handler) { notFoundHandler = handler; }\n\n/** Turn '/a/:b' into a regex plus ordered param names. */\nfunction compile(pattern) {\n  const keys = [];\n  const source = pattern\n    .replace(/\\/$/, '')\n    .replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')\n    .replace(/:([A-Za-z0-9_]+)/g, (_, key) => {\n      keys.push(key);\n      return '([^/]+)';\n    });\n  return { regex: new RegExp(`^${source || '\\\\/'}\\\\/?$`), keys };\n}\n\n/** Read the current hash path (defaults to '/'). */\nexport function currentPath() {\n  const raw = location.hash.replace(/^#/, '');\n  if (!raw) return '/';\n  const [path] = raw.split('?');\n  return path || '/';\n}\n\n/** Match a path against registered routes, extracting named params. */\nfunction match(path) {\n  for (const r of routes) {\n    const found = r.regex.exec(path);\n    if (!found) continue;\n    const params = {};\n    r.keys.forEach((key, i) => { params[key] = decodeURIComponent(found[i + 1]); });\n    return { route: r, params };\n  }\n  return null;\n}\n\n/**\n * Navigate to a path.\n * @param {string} path\n * @param {{replace?:boolean}} [opts]\n */\nexport function navigate(path, { replace = false } = {}) {\n  const target = `#${path.startsWith('/') ? path : `/${path}`}`;\n  if (location.hash === target) { resolve(); return; }\n  if (replace) history.replaceState(null, '', target);\n  else location.hash = target;\n  if (replace) resolve();\n}\n\n/** Replace the current URL without triggering navigation (e.g. to strip query). */\nexport function replacePath(path) {\n  history.replaceState(null, '', `#${path}`);\n}\n\n/** Resolve the current hash: run guards, then the handler. */\nexport function resolve() {\n  const path = currentPath();\n  const query = new URLSearchParams(location.hash.split('?')[1] || '');\n  const found = match(path);\n\n  if (!found) {\n    if (notFoundHandler) notFoundHandler({ path, query, params: {} });\n    return;\n  }\n\n  const { route: r, params } = found;\n  if (r.guard) {\n    const verdict = r.guard();\n    if (verdict === false) return;\n    if (typeof verdict === 'string') { navigate(verdict, { replace: true }); return; }\n  }\n\n  currentHandler = r.handler;\n  currentMatch = { path, params, query };\n  if (r.title) document.title = `${r.title} · DigiPoke`;\n  r.handler({ params, query, path });\n}\n\n/** Re-render the active route (called after state changes that affect the view). */\nexport function refresh() {\n  if (currentHandler && currentMatch) currentHandler(currentMatch);\n}\n\n/** Begin listening to hash changes. */\nexport function startRouter() {\n  window.addEventListener('hashchange', resolve);\n  if (!location.hash) history.replaceState(null, '', '#/');\n  resolve();\n}\n\n/** Currently matched path (useful for nav highlighting). */\nexport function activePath() { return currentPath(); }\n"},{"key":"src/core/sfx.js","code":"/**\n * sfx.js — Procedural audio engine: sound effects AND adaptive music.\n *\n * Zero assets: every sound is synthesised from oscillators and noise buffers at\n * runtime, which keeps the PWA tiny and fully offline while still giving the\n * game a complete audio identity.\n *\n * Signal graph\n * ------------\n *   osc/noise → envelope → sfxGain ┐\n *                                   ├→ master → destination\n *   pad/arp/bass → musicGain ───────┘\n *\n * Separate SFX and music buses allow independent volume sliders (Settings) and\n * let music duck during a battle without touching effect levels.\n *\n * Autoplay policy: the AudioContext is created lazily on the first user gesture\n * (`unlockAudio()`), and stays suspended until then.\n *\n * @module core/sfx\n */\n\nlet ctx = null;\nlet master = null;\nlet sfxBus = null;\nlet musicBus = null;\n\n/** User-controlled levels (0..1), mirrored into Settings. */\nconst levels = { sfx: 0.7, music: 0.35, muted: false };\n\n/**\n * Timestamp of the last synthesised effect. The app uses this to decide\n * whether an interaction already produced its own sound, so a global\n * \"click anything\" fallback never double-triggers over a bespoke cue.\n */\nlet lastSoundAt = 0;\nconst markSound = () => { lastSoundAt = (typeof performance !== 'undefined' ? performance.now() : Date.now()); };\n\n/** Milliseconds since the last sound effect played. */\nexport function sinceLastSound() {\n  return (typeof performance !== 'undefined' ? performance.now() : Date.now()) - lastSoundAt;\n}\n\n/** Create (or return) the audio context and buses. */\nfunction context() {\n  if (ctx) return ctx;\n  const Ctor = window.AudioContext || window.webkitAudioContext;\n  if (!Ctor) return null;\n  ctx = new Ctor();\n  master = ctx.createGain();\n  master.gain.value = 0.9;\n  master.connect(ctx.destination);\n\n  sfxBus = ctx.createGain();\n  sfxBus.gain.value = levels.muted ? 0 : levels.sfx;\n  sfxBus.connect(master);\n\n  musicBus = ctx.createGain();\n  musicBus.gain.value = levels.muted ? 0 : levels.music;\n  musicBus.connect(master);\n  return ctx;\n}\n\n/** Resume a suspended context (call from the first pointer/keydown). */\nexport function unlockAudio() {\n  const c = context();\n  if (c && c.state === 'suspended') c.resume().catch(() => {});\n}\n\n/** Set SFX volume (0..1). */\nexport function setSfxVolume(v) {\n  levels.sfx = Math.max(0, Math.min(1, v));\n  if (sfxBus) sfxBus.gain.value = levels.muted ? 0 : levels.sfx;\n}\n\n/** Set music volume (0..1). */\nexport function setMusicVolume(v) {\n  levels.music = Math.max(0, Math.min(1, v));\n  if (musicBus) musicBus.gain.value = levels.muted ? 0 : levels.music;\n}\n\n/** Master mute toggle (also used by the reduced-motion / quiet preference). */\nexport function setSoundEnabled(next) {\n  levels.muted = !next;\n  if (sfxBus) sfxBus.gain.value = levels.muted ? 0 : levels.sfx;\n  if (musicBus) musicBus.gain.value = levels.muted ? 0 : levels.music;\n  if (levels.muted) stopMusic();\n}\n\n/* ----------------------------------------------------------------- helpers */\n\n/** Convert a MIDI note number to Hz. */\nconst mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);\n\n/**\n * Core tone primitive.\n * @param {object} o\n * @param {number} o.freq\n * @param {number} [o.dur]\n * @param {OscillatorType} [o.type]\n * @param {number} [o.slide] Glide target frequency.\n * @param {number} [o.gain]\n * @param {number} [o.delay] Seconds from now.\n * @param {number} [o.attack]\n * @param {AudioNode} [o.bus] Destination bus (defaults to SFX).\n */\nfunction tone({ freq, dur = 0.14, type = 'square', slide = null, gain = 0.5, delay = 0, attack = 0.008, bus = null }) {\n  markSound();\n  if (levels.muted) return;\n  const c = context();\n  if (!c) return;\n  const t0 = c.currentTime + delay;\n  const osc = c.createOscillator();\n  const env = c.createGain();\n  osc.type = type;\n  osc.frequency.setValueAtTime(Math.max(20, freq), t0);\n  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);\n  env.gain.setValueAtTime(0.0001, t0);\n  env.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + attack);\n  env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n  osc.connect(env).connect(bus || sfxBus);\n  osc.start(t0);\n  osc.stop(t0 + dur + 0.03);\n}\n\n/** Filtered noise burst for impacts, whooshes and textures. */\nfunction noise({ dur = 0.18, gain = 0.4, delay = 0, freq = 1200, type = 'lowpass', sweep = null } = {}) {\n  markSound();\n  if (levels.muted) return;\n  const c = context();\n  if (!c) return;\n  const t0 = c.currentTime + delay;\n  const frames = Math.max(1, Math.floor(c.sampleRate * dur));\n  const buffer = c.createBuffer(1, frames, c.sampleRate);\n  const data = buffer.getChannelData(0);\n  for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);\n  const src = c.createBufferSource();\n  src.buffer = buffer;\n  const filter = c.createBiquadFilter();\n  filter.type = type;\n  filter.frequency.setValueAtTime(freq, t0);\n  if (sweep) filter.frequency.exponentialRampToValueAtTime(Math.max(60, sweep), t0 + dur);\n  const env = c.createGain();\n  env.gain.setValueAtTime(gain, t0);\n  env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n  src.connect(filter).connect(env).connect(sfxBus);\n  src.start(t0);\n}\n\n/** Play a short arpeggio of MIDI notes. */\nfunction arp(notes, { type = 'triangle', step = 0.07, dur = 0.16, gain = 0.34 } = {}) {\n  notes.forEach((n, i) => tone({ freq: mtof(n), dur, type, gain, delay: i * step }));\n}\n\n/** Haptic feedback where supported (mobile). */\nfunction vibrate(pattern) {\n  if (levels.muted) return;\n  try { if (typeof navigator !== 'undefined') navigator.vibrate?.(pattern); } catch { /* unsupported */ }\n}\n\n/* ---------------------------------------------------------- sound library */\n\n/**\n * Named cues. Every interaction in the game maps to one of these — there is no\n * silent button anywhere in DigiPoke.\n */\nexport const sfx = {\n  /* ---- interface ---- */\n  hover:    () => tone({ freq: 720, dur: 0.035, type: 'sine', gain: 0.1 }),\n  click:    () => { tone({ freq: 560, dur: 0.06, type: 'square', gain: 0.26 }); tone({ freq: 840, dur: 0.05, type: 'sine', gain: 0.16, delay: 0.02 }); },\n  select:   () => arp([72, 79], { step: 0.05, dur: 0.1, gain: 0.24 }),\n  back:     () => tone({ freq: 400, slide: 260, dur: 0.09, type: 'square', gain: 0.22 }),\n  confirm:  () => arp([67, 74, 79], { step: 0.055, dur: 0.14, gain: 0.3 }),\n  open:     () => tone({ freq: 320, slide: 640, dur: 0.14, type: 'sine', gain: 0.24 }),\n  close:    () => tone({ freq: 640, slide: 300, dur: 0.13, type: 'sine', gain: 0.2 }),\n  toggle:   () => tone({ freq: 480, dur: 0.05, type: 'square', gain: 0.2 }),\n  tab:      () => tone({ freq: 620, dur: 0.045, type: 'triangle', gain: 0.18 }),\n  type:     () => tone({ freq: 900 + Math.random() * 200, dur: 0.02, type: 'square', gain: 0.07 }),\n  error:    () => { tone({ freq: 200, dur: 0.11, type: 'square', gain: 0.28 }); tone({ freq: 150, dur: 0.15, type: 'square', gain: 0.26, delay: 0.09 }); vibrate(60); },\n  deny:     () => tone({ freq: 180, slide: 120, dur: 0.18, type: 'sawtooth', gain: 0.24 }),\n\n  /* ---- exploration ---- */\n  scan:     () => { tone({ freq: 1200, slide: 600, dur: 0.5, type: 'sine', gain: 0.16 }); noise({ dur: 0.4, gain: 0.08, freq: 2400, sweep: 400 }); },\n  encounter:() => { tone({ freq: 880, slide: 1320, dur: 0.16, type: 'sawtooth', gain: 0.3 }); tone({ freq: 1320, dur: 0.22, type: 'square', gain: 0.22, delay: 0.14 }); vibrate([30, 40, 30]); },\n  appear:   () => { noise({ dur: 0.34, gain: 0.28, freq: 300, sweep: 3600, type: 'bandpass' }); tone({ freq: 180, slide: 900, dur: 0.34, type: 'triangle', gain: 0.24 }); },\n  step:     () => noise({ dur: 0.07, gain: 0.1, freq: 700, sweep: 300 }),\n\n  /* ---- battle ---- */\n  movePhysical: () => { noise({ dur: 0.16, gain: 0.26, freq: 2600, sweep: 700 }); tone({ freq: 340, slide: 160, dur: 0.13, type: 'sawtooth', gain: 0.2 }); },\n  moveSpecial:  () => { tone({ freq: 520, slide: 1240, dur: 0.2, type: 'square', gain: 0.24 }); noise({ dur: 0.22, gain: 0.16, freq: 1400, sweep: 3000 }); },\n  moveSupport:  () => arp([64, 69, 72], { type: 'sine', step: 0.06, dur: 0.2, gain: 0.22 }),\n  hit:          () => { noise({ dur: 0.13, gain: 0.42, freq: 1500, sweep: 300 }); tone({ freq: 190, slide: 80, dur: 0.14, type: 'square', gain: 0.26 }); vibrate(18); },\n  superHit:     () => { noise({ dur: 0.18, gain: 0.52, freq: 2400, sweep: 400 }); tone({ freq: 320, slide: 110, dur: 0.2, type: 'sawtooth', gain: 0.3 }); vibrate([12, 20, 12]); },\n  weakHit:      () => { noise({ dur: 0.1, gain: 0.2, freq: 700, sweep: 200 }); tone({ freq: 150, slide: 90, dur: 0.1, type: 'triangle', gain: 0.18 }); },\n  crit:         () => { noise({ dur: 0.22, gain: 0.6, freq: 3200, sweep: 500 }); arp([84, 88], { type: 'square', step: 0.05, dur: 0.12, gain: 0.3 }); vibrate([20, 30, 20]); },\n  miss:         () => { noise({ dur: 0.2, gain: 0.16, freq: 900, sweep: 2400, type: 'highpass' }); },\n  status:       () => { tone({ freq: 300, slide: 200, dur: 0.24, type: 'sawtooth', gain: 0.22 }); noise({ dur: 0.3, gain: 0.12, freq: 500 }); },\n  heal:         () => arp([65, 69, 72, 77], { type: 'sine', step: 0.07, dur: 0.26, gain: 0.24 }),\n  cure:         () => arp([72, 76, 79], { type: 'sine', step: 0.06, dur: 0.2, gain: 0.2 }),\n  statUp:       () => { tone({ freq: 480, slide: 720, dur: 0.18, type: 'triangle', gain: 0.24 }); },\n  statDown:     () => { tone({ freq: 480, slide: 300, dur: 0.2, type: 'triangle', gain: 0.22 }); },\n  faint:        () => { tone({ freq: 460, slide: 70, dur: 0.55, type: 'sine', gain: 0.34 }); noise({ dur: 0.4, gain: 0.14, freq: 600, sweep: 120 }); vibrate(120); },\n  switchIn:     () => { tone({ freq: 300, slide: 620, dur: 0.16, type: 'square', gain: 0.24 }); noise({ dur: 0.14, gain: 0.14, freq: 900, sweep: 2200 }); },\n\n  /* ---- capture ---- */\n  ballThrow:    () => { noise({ dur: 0.2, gain: 0.22, freq: 600, sweep: 2600 }); tone({ freq: 700, slide: 300, dur: 0.22, type: 'sine', gain: 0.22 }); },\n  ballWobble:   () => { tone({ freq: 240, dur: 0.1, type: 'square', gain: 0.24 }); tone({ freq: 180, dur: 0.1, type: 'square', gain: 0.2, delay: 0.09 }); },\n  captureSuccess: () => { arp([72, 76, 79, 84], { type: 'triangle', step: 0.08, dur: 0.3, gain: 0.32 }); noise({ dur: 0.5, gain: 0.12, freq: 1200, sweep: 300 }); vibrate([20, 60, 20, 60, 40]); },\n  captureFail:  () => { tone({ freq: 260, slide: 150, dur: 0.28, type: 'sawtooth', gain: 0.26 }); },\n\n  /* ---- progression ---- */\n  xp:           () => tone({ freq: 1040, dur: 0.06, type: 'sine', gain: 0.12 }),\n  levelUp:      () => arp([67, 71, 74, 79], { type: 'square', step: 0.07, dur: 0.2, gain: 0.28 }),\n  learn:        () => arp([72, 79, 84], { type: 'triangle', step: 0.06, dur: 0.18, gain: 0.24 }),\n  evolve:       () => {\n    arp([60, 64, 67, 72, 76, 79, 84], { type: 'triangle', step: 0.085, dur: 0.4, gain: 0.3 });\n    noise({ dur: 1.1, gain: 0.18, freq: 400, sweep: 5200, type: 'bandpass' });\n    vibrate([30, 60, 30, 60, 120]);\n  },\n  victory:      () => { arp([67, 71, 74, 79, 83], { type: 'square', step: 0.11, dur: 0.34, gain: 0.3 }); tone({ freq: 98, dur: 0.9, type: 'triangle', gain: 0.22, delay: 0.05 }); },\n  defeat:       () => { arp([67, 63, 60, 55], { type: 'triangle', step: 0.16, dur: 0.4, gain: 0.26 }); },\n  flee:         () => { noise({ dur: 0.35, gain: 0.2, freq: 1800, sweep: 300 }); tone({ freq: 520, slide: 200, dur: 0.3, type: 'sine', gain: 0.2 }); },\n\n  /* ---- economy / meta ---- */\n  purchase:     () => arp([79, 84], { type: 'square', step: 0.06, dur: 0.14, gain: 0.26 }),\n  reward:       () => arp([76, 81, 88], { type: 'triangle', step: 0.07, dur: 0.24, gain: 0.26 }),\n  objective:    () => arp([72, 77, 84, 89], { type: 'sine', step: 0.06, dur: 0.26, gain: 0.24 }),\n  release:      () => { tone({ freq: 400, slide: 120, dur: 0.4, type: 'sine', gain: 0.24 }); },\n  notify:       () => tone({ freq: 880, dur: 0.09, type: 'sine', gain: 0.16 }),\n  boot:         () => { arp([60, 67, 72, 79], { type: 'triangle', step: 0.09, dur: 0.4, gain: 0.22 }); },\n  digitise:     () => { noise({ dur: 0.8, gain: 0.2, freq: 200, sweep: 6000, type: 'bandpass' }); arp([64, 71, 76, 83], { type: 'sine', step: 0.07, dur: 0.5, gain: 0.22 }); },\n};\n\n/* ------------------------------------------------------------------ music */\n\n/**\n * Track definitions. Each has a tempo, a four-bar chord progression (MIDI),\n * an arpeggio pattern, and a bass line derived from the chord roots.\n */\nconst TRACKS = {\n  menu: {\n    bpm: 72,\n    chords: [[57, 64, 67, 71], [53, 60, 64, 67], [55, 62, 65, 69], [52, 59, 64, 67]],\n    arp: [0, 2, 3, 2],\n    padType: 'triangle', arpType: 'sine', bass: true, gain: 0.5,\n  },\n  explore: {\n    bpm: 88,\n    chords: [[57, 61, 64, 68], [59, 62, 66, 69], [53, 57, 60, 64], [55, 59, 62, 66]],\n    arp: [0, 1, 2, 3, 2, 1],\n    padType: 'triangle', arpType: 'triangle', bass: true, gain: 0.5,\n  },\n  lab: {\n    bpm: 80,\n    chords: [[60, 64, 67, 72], [57, 64, 67, 71], [62, 65, 69, 72], [55, 62, 66, 71]],\n    arp: [0, 3, 1, 3],\n    padType: 'sine', arpType: 'sine', bass: true, gain: 0.45,\n  },\n  battle: {\n    bpm: 116,\n    chords: [[45, 52, 57, 60], [43, 50, 55, 58], [41, 48, 53, 56], [40, 47, 52, 55]],\n    arp: [0, 2, 3, 2, 1, 3],\n    padType: 'sawtooth', arpType: 'square', bass: true, gain: 0.42,\n  },\n  victory: {\n    bpm: 100,\n    chords: [[60, 64, 67, 72], [62, 65, 69, 74], [64, 67, 71, 76], [67, 71, 74, 79]],\n    arp: [0, 1, 2, 3],\n    padType: 'triangle', arpType: 'triangle', bass: true, gain: 0.45,\n  },\n};\n\nlet music = { name: null, timer: null, step: 0, nextTime: 0 };\n\n/**\n * Start (or switch to) a music track. Safe to call repeatedly with the same\n * name — it will not restart.\n * @param {'menu'|'explore'|'lab'|'battle'|'victory'} name\n */\nexport function startMusic(name) {\n  if (!TRACKS[name]) return;\n  if (music.name === name && music.timer) return;\n  stopMusic();\n  if (levels.muted || levels.music <= 0) { music.name = name; return; }\n\n  const c = context();\n  if (!c) return;\n  music.name = name;\n  music.step = 0;\n  music.nextTime = c.currentTime + 0.08;\n  music.timer = setInterval(() => scheduleMusic(), 25);\n}\n\n/** Stop music immediately. */\nexport function stopMusic() {\n  if (music.timer) clearInterval(music.timer);\n  music.timer = null;\n}\n\n/** Lookahead scheduler: queue notes slightly ahead of the audio clock. */\nfunction scheduleMusic() {\n  const c = ctx;\n  const track = TRACKS[music.name];\n  if (!c || !track) return;\n  const secondsPerStep = 60 / track.bpm / 4; // 16th notes\n\n  while (music.nextTime < c.currentTime + 0.25) {\n    playStep(track, music.step, music.nextTime, secondsPerStep);\n    music.step += 1;\n    music.nextTime += secondsPerStep;\n  }\n}\n\n/** Render one 16th-note step. */\nfunction playStep(track, step, when, sps) {\n  const bar = Math.floor(step / 16) % track.chords.length;\n  const inBar = step % 16;\n  const chord = track.chords[bar];\n\n  // Pad: sustained chord at the start of each bar.\n  if (inBar === 0) {\n    for (const note of chord) {\n      pad(mtof(note + 12), when, sps * 15, 0.055 * track.gain, track.padType);\n    }\n    if (track.bass) pad(mtof(chord[0] - 12), when, sps * 8, 0.10 * track.gain, 'sine');\n  }\n\n  // Arpeggio: bright counter-melody on off-beats.\n  const arpIndex = track.arp[inBar % track.arp.length];\n  if (inBar % 2 === 0) {\n    const note = chord[arpIndex % chord.length] + 12;\n    blip(mtof(note), when, sps * 1.6, 0.05 * track.gain, track.arpType);\n  }\n\n  // Battle pulse: a soft percussive tick on the beat.\n  if (track.bpm > 110 && inBar % 4 === 0) {\n    tick(when, inBar === 0 ? 0.09 : 0.05);\n  }\n}\n\n/** Long, soft chord voice. */\nfunction pad(freq, when, dur, gain, type) {\n  const osc = ctx.createOscillator();\n  const env = ctx.createGain();\n  const filter = ctx.createBiquadFilter();\n  filter.type = 'lowpass';\n  filter.frequency.value = 1800;\n  osc.type = type;\n  osc.frequency.value = freq;\n  env.gain.setValueAtTime(0.0001, when);\n  env.gain.linearRampToValueAtTime(gain, when + 0.35);\n  env.gain.linearRampToValueAtTime(0.0001, when + dur);\n  osc.connect(filter).connect(env).connect(musicBus);\n  osc.start(when);\n  osc.stop(when + dur + 0.05);\n}\n\n/** Short arpeggio note. */\nfunction blip(freq, when, dur, gain, type) {\n  const osc = ctx.createOscillator();\n  const env = ctx.createGain();\n  osc.type = type;\n  osc.frequency.value = freq;\n  env.gain.setValueAtTime(0.0001, when);\n  env.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), when + 0.02);\n  env.gain.exponentialRampToValueAtTime(0.0001, when + dur);\n  osc.connect(env).connect(musicBus);\n  osc.start(when);\n  osc.stop(when + dur + 0.02);\n}\n\n/** Percussive tick (battle pulse). */\nfunction tick(when, gain) {\n  const frames = Math.floor(ctx.sampleRate * 0.07);\n  const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);\n  const data = buffer.getChannelData(0);\n  for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / frames, 3);\n  const src = ctx.createBufferSource();\n  src.buffer = buffer;\n  const filter = ctx.createBiquadFilter();\n  filter.type = 'lowpass';\n  filter.frequency.value = 320;\n  const env = ctx.createGain();\n  env.gain.value = gain;\n  src.connect(filter).connect(env).connect(musicBus);\n  src.start(when);\n}\n\n/** Which track is cued (used by the Settings screen). */\nexport function currentTrack() { return music.name; }\n"},{"key":"src/domain/species.js","code":"/**\n * species.js — Creature species catalogue (the \"Dex\").\n *\n * 34 species across 10 evolution lines (3 stages each) plus 4 Mega forms.\n * Each record is pure data:\n *\n *   id       – permanent save-data key (never rename/remove)\n *   name     – display name\n *   stage    – rookie | champion | ultimate | mega  (drives evolution UI)\n *   types    – 1–2 element ids\n *   base     – base stats { hp, atk, def, spd }\n *   moves    – learnset pool, indexed against LEARN_LEVELS\n *   evolve   – { to, level, bond? } or null\n *   capture  – capture difficulty 0–255 (higher = easier)\n *   xp       – base XP yielded when defeated\n *   art      – procedural sprite descriptor (see ui/sprite.js)\n *   lore     – in-world flavour text\n *\n * @module domain/species\n */\n\n/** Learnset levels applied positionally to each species' `moves` array. */\nexport const LEARN_LEVELS = [1, 8, 16, 26, 36, 46];\n\n/** @type {Record<string, object>} */\nexport const SPECIES = {\n  /* ============================================================ FLAME LINE */\n  emberling: {\n    id: 'emberling', name: 'Emberling', stage: 'rookie', types: ['flame'],\n    base: { hp: 50, atk: 42, def: 32, spd: 40 },\n    moves: ['strike', 'cinderLash', 'focus', 'flameVeil'],\n    evolve: { to: 'flarion', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'quad', body: '#ff7a45', accent: '#ffd166', eye: 2, tail: 1, spikes: 0, wings: 0, pattern: 'stripe', aura: '#ff6b3d' },\n    lore: 'A coal-fed hatchling. Its tail flame gutters when it sulks.',\n  },\n  flarion: {\n    id: 'flarion', name: 'Flarion', stage: 'champion', types: ['flame'],\n    base: { hp: 72, atk: 66, def: 50, spd: 58 },\n    moves: ['rend', 'cinderLash', 'pyroFang', 'focus'],\n    evolve: { to: 'pyrovern', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'quad', body: '#f2612c', accent: '#ffcf5c', eye: 2, tail: 1, spikes: 2, wings: 0, pattern: 'stripe', aura: '#ff6b3d' },\n    lore: 'Its mane burns hot enough to anneal steel; it sleeps in ash beds.',\n  },\n  pyrovern: {\n    id: 'pyrovern', name: 'Pyrovern', stage: 'ultimate', types: ['flame', 'aero'],\n    base: { hp: 92, atk: 92, def: 68, spd: 82 },\n    moves: ['rend', 'pyroFang', 'novaBurst', 'cycloneWing'],\n    evolve: { to: 'solarion', level: 46, bond: 80 },\n    capture: 45, xp: 236,\n    art: { shape: 'winged', body: '#e04a1f', accent: '#ffd15c', eye: 2, tail: 1, spikes: 2, wings: 2, pattern: 'stripe', aura: '#ff6b3d' },\n    lore: 'A solar furnace with wings. Villages time their harvests by its migration.',\n  },\n  solarion: {\n    id: 'solarion', name: 'Solarion', stage: 'mega', types: ['flame', 'aero'],\n    base: { hp: 108, atk: 115, def: 84, spd: 96 },\n    moves: ['novaBurst', 'pyroFang', 'cycloneWing', 'focus'],\n    evolve: null, capture: 20, xp: 320,\n    art: { shape: 'winged', body: '#ff8a1f', accent: '#fff2a8', eye: 2, tail: 2, spikes: 3, wings: 2, pattern: 'circuit', aura: '#ffb03d' },\n    lore: 'Mega form. It carries a captured star in its chest core.',\n  },\n\n  /* ============================================================= AQUA LINE */\n  drizzle: {\n    id: 'drizzle', name: 'Drizzle', stage: 'rookie', types: ['aqua'],\n    base: { hp: 54, atk: 38, def: 38, spd: 36 },\n    moves: ['strike', 'aquaJet', 'barrier', 'coolMist'],\n    evolve: { to: 'tidecub', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'aquatic', body: '#3fa9f5', accent: '#a8e6ff', eye: 2, tail: 1, spikes: 0, wings: 0, pattern: 'spot', aura: '#3db4ff' },\n    lore: 'Stores rainwater in its cheeks and sprays it when startled.',\n  },\n  tidecub: {\n    id: 'tidecub', name: 'Tidecub', stage: 'champion', types: ['aqua'],\n    base: { hp: 78, atk: 60, def: 60, spd: 52 },\n    moves: ['rend', 'aquaJet', 'tideSlam', 'coolMist'],\n    evolve: { to: 'leviaroc', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'aquatic', body: '#2b86d6', accent: '#7fdcff', eye: 2, tail: 1, spikes: 1, wings: 0, pattern: 'spot', aura: '#3db4ff' },\n    lore: 'Surfs tidal bores for sport; fishers read its wake to predict storms.',\n  },\n  leviaroc: {\n    id: 'leviaroc', name: 'Leviaroc', stage: 'ultimate', types: ['aqua', 'terra'],\n    base: { hp: 100, atk: 88, def: 84, spd: 66 },\n    moves: ['tideSlam', 'seismicSlam', 'maelstrom', 'barrier'],\n    evolve: { to: 'abyssalord', level: 46, bond: 80 },\n    capture: 45, xp: 236,\n    art: { shape: 'serpent', body: '#1f6cb0', accent: '#9fe8ff', eye: 2, tail: 2, spikes: 3, wings: 0, pattern: 'spot', aura: '#3db4ff' },\n    lore: 'Older than the continental shelf it coils around.',\n  },\n  abyssalord: {\n    id: 'abyssalord', name: 'Abyssalord', stage: 'mega', types: ['aqua', 'terra'],\n    base: { hp: 118, atk: 104, def: 102, spd: 78 },\n    moves: ['maelstrom', 'tideSlam', 'seismicSlam', 'coolMist'],\n    evolve: null, capture: 20, xp: 320,\n    art: { shape: 'serpent', body: '#124f8a', accent: '#d6f4ff', eye: 4, tail: 3, spikes: 4, wings: 0, pattern: 'circuit', aura: '#3db4ff' },\n    lore: 'Mega form. Pressure at its depth would crush diamond to dust.',\n  },\n\n  /* =========================================================== VERDANT LINE */\n  sproutle: {\n    id: 'sproutle', name: 'Sproutle', stage: 'rookie', types: ['verdant'],\n    base: { hp: 56, atk: 36, def: 44, spd: 30 },\n    moves: ['strike', 'vineWhip', 'rootGuard', 'restProtocol'],\n    evolve: { to: 'thornox', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'blob', body: '#5ac46a', accent: '#2f8f4e', eye: 2, tail: 0, spikes: 1, wings: 0, pattern: 'leaf', aura: '#4fd67c' },\n    lore: 'Photosynthesises while asleep. Grows visibly after rain.',\n  },\n  thornox: {\n    id: 'thornox', name: 'Thornox', stage: 'champion', types: ['verdant', 'terra'],\n    base: { hp: 82, atk: 62, def: 70, spd: 42 },\n    moves: ['rend', 'vineWhip', 'thornBarrage', 'rootGuard'],\n    evolve: { to: 'verdantross', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'quad', body: '#3f9c53', accent: '#7bd88f', eye: 2, tail: 1, spikes: 3, wings: 0, pattern: 'leaf', aura: '#4fd67c' },\n    lore: 'Its thorn plates are harvested, carefully, by hedge-witches.',\n  },\n  verdantross: {\n    id: 'verdantross', name: 'Verdantross', stage: 'ultimate', types: ['verdant', 'terra'],\n    base: { hp: 104, atk: 84, def: 96, spd: 54 },\n    moves: ['thornBarrage', 'bloomNova', 'seismicSlam', 'restProtocol'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'quad', body: '#2e7d46', accent: '#a6f0b6', eye: 2, tail: 1, spikes: 4, wings: 0, pattern: 'leaf', aura: '#4fd67c' },\n    lore: 'A walking grove. Entire ecosystems nest in its canopy.',\n  },\n\n  /* ============================================================== VOLT LINE */\n  sparkit: {\n    id: 'sparkit', name: 'Sparkit', stage: 'rookie', types: ['volt'],\n    base: { hp: 46, atk: 40, def: 30, spd: 52 },\n    moves: ['strike', 'staticNip', 'quickStep', 'overcharge'],\n    evolve: { to: 'voltusk', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'quad', body: '#f2c53d', accent: '#3a2f10', eye: 2, tail: 1, spikes: 1, wings: 0, pattern: 'bolt', aura: '#ffd93d' },\n    lore: 'Charges itself by rolling down hills. Occasionally overdoes it.',\n  },\n  voltusk: {\n    id: 'voltusk', name: 'Voltusk', stage: 'champion', types: ['volt'],\n    base: { hp: 70, atk: 70, def: 48, spd: 74 },\n    moves: ['rend', 'staticNip', 'voltFang', 'overcharge'],\n    evolve: { to: 'thunderion', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'quad', body: '#e0a92a', accent: '#2b2409', eye: 2, tail: 2, spikes: 2, wings: 0, pattern: 'bolt', aura: '#ffd93d' },\n    lore: 'Its tusks arc continuously; the air tastes of ozone nearby.',\n  },\n  thunderion: {\n    id: 'thunderion', name: 'Thunderion', stage: 'ultimate', types: ['volt', 'aero'],\n    base: { hp: 88, atk: 96, def: 62, spd: 96 },\n    moves: ['voltFang', 'thunderLance', 'cycloneWing', 'overcharge'],\n    evolve: { to: 'raijinix', level: 46, bond: 80 },\n    capture: 45, xp: 236,\n    art: { shape: 'winged', body: '#d99a14', accent: '#fff3b0', eye: 2, tail: 2, spikes: 3, wings: 2, pattern: 'bolt', aura: '#ffd93d' },\n    lore: 'Lives inside thunderheads; only descends to challenge rivals.',\n  },\n  raijinix: {\n    id: 'raijinix', name: 'Raijinix', stage: 'mega', types: ['volt', 'aero'],\n    base: { hp: 100, atk: 118, def: 76, spd: 116 },\n    moves: ['thunderLance', 'voltFang', 'tempestHowl', 'overcharge'],\n    evolve: null, capture: 20, xp: 320,\n    art: { shape: 'winged', body: '#ffd93d', accent: '#ffffff', eye: 2, tail: 3, spikes: 4, wings: 2, pattern: 'circuit', aura: '#ffd93d' },\n    lore: 'Mega form. It arrives before its own thunder.',\n  },\n\n  /* ============================================================= TERRA LINE */\n  pebblit: {\n    id: 'pebblit', name: 'Pebblit', stage: 'rookie', types: ['terra'],\n    base: { hp: 60, atk: 40, def: 48, spd: 22 },\n    moves: ['strike', 'rockThrow', 'barrier', 'restProtocol'],\n    evolve: { to: 'roccolith', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'blob', body: '#a8834f', accent: '#6b4f2a', eye: 2, tail: 0, spikes: 1, wings: 0, pattern: 'stone', aura: '#c98a4b' },\n    lore: 'Moss grows on whichever side it forgets to turn.',\n  },\n  roccolith: {\n    id: 'roccolith', name: 'Roccolith', stage: 'champion', types: ['terra'],\n    base: { hp: 86, atk: 66, def: 78, spd: 34 },\n    moves: ['rend', 'rockThrow', 'seismicSlam', 'barrier'],\n    evolve: { to: 'mountanix', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'quad', body: '#8c6a3c', accent: '#5c421f', eye: 2, tail: 1, spikes: 3, wings: 0, pattern: 'stone', aura: '#c98a4b' },\n    lore: 'Used as a landmark by cartographers; it resents being climbed.',\n  },\n  mountanix: {\n    id: 'mountanix', name: 'Mountanix', stage: 'ultimate', types: ['terra', 'byte'],\n    base: { hp: 110, atk: 86, def: 104, spd: 44 },\n    moves: ['seismicSlam', 'tectonicRage', 'byteSnap', 'firewall'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'mech', body: '#6f5530', accent: '#b48cff', eye: 2, tail: 1, spikes: 4, wings: 0, pattern: 'circuit', aura: '#c98a4b' },\n    lore: 'Sediment layers record ten thousand years in its back plates.',\n  },\n\n  /* ============================================================== AERO LINE */\n  zephyrling: {\n    id: 'zephyrling', name: 'Zephyrling', stage: 'rookie', types: ['aero'],\n    base: { hp: 48, atk: 38, def: 30, spd: 56 },\n    moves: ['strike', 'gust', 'quickStep', 'tailwind'],\n    evolve: { to: 'galewing', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'blob', body: '#bfe9ff', accent: '#5fa8d3', eye: 2, tail: 0, spikes: 0, wings: 1, pattern: 'none', aura: '#9fe8ff' },\n    lore: 'Weighs less than the air it displaces. Hates closed windows.',\n  },\n  galewing: {\n    id: 'galewing', name: 'Galewing', stage: 'champion', types: ['aero', 'frost'],\n    base: { hp: 72, atk: 64, def: 48, spd: 80 },\n    moves: ['rend', 'gust', 'cycloneWing', 'frostNip'],\n    evolve: { to: 'tempestrix', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'winged', body: '#9ad4f5', accent: '#e8faff', eye: 2, tail: 1, spikes: 1, wings: 2, pattern: 'stripe', aura: '#9fe8ff' },\n    lore: 'Rides thermal columns for weeks without landing.',\n  },\n  tempestrix: {\n    id: 'tempestrix', name: 'Tempestrix', stage: 'ultimate', types: ['aero', 'frost'],\n    base: { hp: 90, atk: 90, def: 66, spd: 100 },\n    moves: ['cycloneWing', 'tempestHowl', 'glacierSpear', 'tailwind'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'winged', body: '#7cc3ec', accent: '#ffffff', eye: 2, tail: 2, spikes: 2, wings: 2, pattern: 'stripe', aura: '#9fe8ff' },\n    lore: 'Storm fronts follow it like a retinue.',\n  },\n\n  /* ============================================================= FROST LINE */\n  frostkit: {\n    id: 'frostkit', name: 'Frostkit', stage: 'rookie', types: ['frost'],\n    base: { hp: 52, atk: 40, def: 38, spd: 38 },\n    moves: ['strike', 'frostNip', 'barrier', 'restProtocol'],\n    evolve: { to: 'glacion', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'quad', body: '#bfefff', accent: '#4aa3c9', eye: 2, tail: 1, spikes: 1, wings: 0, pattern: 'crystal', aura: '#7fdcff' },\n    lore: 'Leaves perfect little paw-prints that melt by noon.',\n  },\n  glacion: {\n    id: 'glacion', name: 'Glacion', stage: 'champion', types: ['frost'],\n    base: { hp: 76, atk: 68, def: 60, spd: 56 },\n    moves: ['rend', 'frostNip', 'glacierSpear', 'barrier'],\n    evolve: { to: 'cryophinx', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'quad', body: '#86d7f2', accent: '#2f7f9e', eye: 2, tail: 1, spikes: 3, wings: 0, pattern: 'crystal', aura: '#7fdcff' },\n    lore: 'Builds elaborate ice lairs, then abandons them out of boredom.',\n  },\n  cryophinx: {\n    id: 'cryophinx', name: 'Cryophinx', stage: 'ultimate', types: ['frost', 'byte'],\n    base: { hp: 96, atk: 90, def: 78, spd: 72 },\n    moves: ['glacierSpear', 'absoluteZero', 'overclockBeam', 'firewall'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'serpent', body: '#63bfe0', accent: '#b48cff', eye: 2, tail: 2, spikes: 3, wings: 0, pattern: 'circuit', aura: '#7fdcff' },\n    lore: 'Poses riddles in a language of cracking ice. Nobody has answered.',\n  },\n\n  /* ============================================================== BYTE LINE */\n  bitling: {\n    id: 'bitling', name: 'Bitling', stage: 'rookie', types: ['byte'],\n    base: { hp: 50, atk: 44, def: 36, spd: 42 },\n    moves: ['strike', 'byteSnap', 'focus', 'firewall'],\n    evolve: { to: 'datamite', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'mech', body: '#9c86d8', accent: '#d9ccff', eye: 1, tail: 0, spikes: 1, wings: 0, pattern: 'circuit', aura: '#b48cff' },\n    lore: 'A fragment of a larger program, happily unaware of that fact.',\n  },\n  datamite: {\n    id: 'datamite', name: 'Datamite', stage: 'champion', types: ['byte', 'virus'],\n    base: { hp: 74, atk: 72, def: 54, spd: 62 },\n    moves: ['rend', 'byteSnap', 'dataLeech', 'venomBite'],\n    evolve: { to: 'cipherax', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'mech', body: '#7f63c9', accent: '#ff5fa2', eye: 2, tail: 1, spikes: 2, wings: 0, pattern: 'circuit', aura: '#b48cff' },\n    lore: 'Compiles itself mid-fight, adding features as needed.',\n  },\n  cipherax: {\n    id: 'cipherax', name: 'Cipherax', stage: 'ultimate', types: ['byte', 'virus'],\n    base: { hp: 92, atk: 98, def: 70, spd: 84 },\n    moves: ['overclockBeam', 'dataLeech', 'corruptRay', 'firewall'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'mech', body: '#5b3fa0', accent: '#7dffe4', eye: 3, tail: 2, spikes: 4, wings: 0, pattern: 'circuit', aura: '#b48cff' },\n    lore: 'Speaks only in encrypted packets. It is being polite.',\n  },\n\n  /* ============================================================= VIRUS LINE */\n  shadling: {\n    id: 'shadling', name: 'Shadling', stage: 'rookie', types: ['virus'],\n    base: { hp: 48, atk: 46, def: 32, spd: 44 },\n    moves: ['strike', 'venomBite', 'focus', 'glitchStep'],\n    evolve: { to: 'venomire', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'blob', body: '#5d3b5c', accent: '#ff5fa2', eye: 2, tail: 1, spikes: 0, wings: 0, pattern: 'none', aura: '#ff5fa2' },\n    lore: 'Hides in the shadow of larger creatures and mimics their gait.',\n  },\n  venomire: {\n    id: 'venomire', name: 'Venomire', stage: 'champion', types: ['virus'],\n    base: { hp: 72, atk: 76, def: 50, spd: 68 },\n    moves: ['rend', 'venomBite', 'corruptRay', 'glitchStep'],\n    evolve: { to: 'oblivionix', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'serpent', body: '#432a48', accent: '#ff87bd', eye: 2, tail: 2, spikes: 2, wings: 0, pattern: 'spot', aura: '#ff5fa2' },\n    lore: 'Its bite installs a polite, persistent advertisement.',\n  },\n  oblivionix: {\n    id: 'oblivionix', name: 'Oblivionix', stage: 'ultimate', types: ['virus', 'null'],\n    base: { hp: 94, atk: 100, def: 68, spd: 80 },\n    moves: ['corruptRay', 'oblivionWave', 'lastResort', 'focus'],\n    evolve: { to: 'voidmaw', level: 46, bond: 80 },\n    capture: 45, xp: 236,\n    art: { shape: 'serpent', body: '#2a1730', accent: '#ff5fa2', eye: 4, tail: 3, spikes: 4, wings: 0, pattern: 'circuit', aura: '#ff5fa2' },\n    lore: 'Things deleted by it are remembered by nobody, including it.',\n  },\n  voidmaw: {\n    id: 'voidmaw', name: 'Voidmaw', stage: 'mega', types: ['virus', 'null'],\n    base: { hp: 106, atk: 124, def: 80, spd: 92 },\n    moves: ['oblivionWave', 'corruptRay', 'lastResort', 'glitchStep'],\n    evolve: null, capture: 20, xp: 320,\n    art: { shape: 'serpent', body: '#160a1c', accent: '#ff2d8f', eye: 6, tail: 4, spikes: 5, wings: 2, pattern: 'circuit', aura: '#ff5fa2' },\n    lore: 'Mega form. An absence with an appetite.',\n  },\n\n  /* ============================================================== NULL LINE */\n  nulkit: {\n    id: 'nulkit', name: 'Nulkit', stage: 'rookie', types: ['null'],\n    base: { hp: 54, atk: 38, def: 38, spd: 40 },\n    moves: ['strike', 'quickStep', 'barrier', 'restProtocol'],\n    evolve: { to: 'driftling', level: 16 },\n    capture: 190, xp: 62,\n    art: { shape: 'blob', body: '#cdd4e4', accent: '#8b96b0', eye: 2, tail: 1, spikes: 0, wings: 0, pattern: 'none', aura: '#c8cfe0' },\n    lore: 'Perfectly average in every measurable way. Thriving.',\n  },\n  driftling: {\n    id: 'driftling', name: 'Driftling', stage: 'champion', types: ['null', 'aero'],\n    base: { hp: 76, atk: 62, def: 58, spd: 70 },\n    moves: ['rend', 'gust', 'barrier', 'restProtocol'],\n    evolve: { to: 'aetherion', level: 34 },\n    capture: 90, xp: 142,\n    art: { shape: 'winged', body: '#b6c0d8', accent: '#ffffff', eye: 2, tail: 1, spikes: 1, wings: 1, pattern: 'none', aura: '#c8cfe0' },\n    lore: 'Drifts between zones, belonging to neither.',\n  },\n  aetherion: {\n    id: 'aetherion', name: 'Aetherion', stage: 'ultimate', types: ['null'],\n    base: { hp: 98, atk: 86, def: 82, spd: 88 },\n    moves: ['lastResort', 'restProtocol', 'focus', 'quickStep'],\n    evolve: null, capture: 45, xp: 236,\n    art: { shape: 'biped', body: '#dfe6f5', accent: '#9aa7c4', eye: 2, tail: 1, spikes: 2, wings: 2, pattern: 'none', aura: '#c8cfe0' },\n    lore: 'Neutral in all things, including the type chart. It finds that restful.',\n  },\n};\n\n/** Dex ordering for the Ranch / Lab / Dex listings. */\nexport const SPECIES_IDS = Object.keys(SPECIES);\n\n/** The three creatures offered during onboarding. */\nexport const STARTER_IDS = ['emberling', 'drizzle', 'sproutle'];\n\n/** Human-readable stage ordering, used for sorting and evolution checks. */\nexport const STAGE_ORDER = ['rookie', 'champion', 'ultimate', 'mega'];\n\n/**\n * Safe species lookup that survives corrupted or outdated save data.\n * @param {string} id\n * @returns {object} Species record (falls back to `nulkit`).\n */\nexport function getSpecies(id) {\n  return SPECIES[id] || SPECIES.nulkit;\n}\n\n/**\n * Build the level-keyed learnset for a species.\n * @param {string} id Species id.\n * @returns {{level:number, move:string}[]} Sorted by level.\n */\nexport function learnsetFor(id) {\n  const s = getSpecies(id);\n  return s.moves.map((move, i) => ({ level: LEARN_LEVELS[i] ?? 99, move }));\n}\n\n/** Total base stat value (used for sorting and \"potential\" displays). */\nexport function baseStatTotal(id) {\n  const b = getSpecies(id).base;\n  return b.hp + b.atk + b.def + b.spd;\n}\n"},{"key":"src/domain/moves.js","code":"/**\n * moves.js — Move (technique) catalogue.\n *\n * A move is a pure data record consumed by the battle engine in `battle.js`.\n * No behaviour is defined here: the engine interprets `effect` descriptors,\n * which keeps the catalogue editable by non-engineers (balance/design).\n *\n * Effect descriptor shapes:\n *   { kind: 'status', status, chance }   — inflict a non-volatile status\n *   { kind: 'heal',   pct }              — restore % of max HP to the user\n *   { kind: 'stat',   stat, stages }     — raise/lower a combat stage\n *   { kind: 'recoil', pct }              — user takes % of damage dealt\n *   { kind: 'drain',  pct }              — user heals % of damage dealt\n *\n * @module domain/moves\n */\n\n/** @typedef {'burn'|'poison'|'paralyze'|'freeze'|'sleep'} StatusId */\n\n/** Persistent (non-volatile) status registry: name, colour, tick behaviour. */\nexport const STATUSES = {\n  burn:     { name: 'Burned',   color: '#ff6b3d', dot: 1 / 16, atkMult: 0.5, note: 'Attack halved, chips HP each turn.' },\n  poison:   { name: 'Poisoned', color: '#a45cff', dot: 1 / 8,  atkMult: 1.0, note: 'Loses HP each turn.' },\n  paralyze: { name: 'Paralysed',color: '#ffd93d', dot: 0,      atkMult: 1.0, spdMult: 0.5, skipChance: 0.25, note: 'Speed halved, may lose a turn.' },\n  freeze:   { name: 'Frozen',   color: '#7fdcff', dot: 0,      atkMult: 1.0, thawChance: 0.2, note: 'Cannot act; may thaw each turn.' },\n  sleep:    { name: 'Asleep',   color: '#8ea0c8', dot: 0,      atkMult: 1.0, turns: [1, 3], note: 'Cannot act for 1–3 turns.' },\n};\n\n/**\n * Move catalogue keyed by stable id. Ids are permanent save-data references:\n * never rename or remove an id, only deprecate it.\n */\nexport const MOVES = {\n  /* ---------------------------------------------------------------- Null */\n  strike:      { name: 'Strike',        type: 'null',    power: 40,  acc: 100, pp: 35, desc: 'A plain shoulder charge.' },\n  rend:        { name: 'Rend',          type: 'null',    power: 60,  acc: 95,  pp: 25, desc: 'Claws tear through the target.' },\n  quickStep:   { name: 'Quick Step',    type: 'null',    power: 0,   acc: 100, pp: 20, effect: { kind: 'stat', stat: 'spd', stages: 1 }, desc: 'Sharply raises Speed.' },\n  focus:       { name: 'Focus',         type: 'null',    power: 0,   acc: 100, pp: 20, effect: { kind: 'stat', stat: 'atk', stages: 1 }, desc: 'Sharply raises Attack.' },\n  barrier:     { name: 'Barrier',       type: 'null',    power: 0,   acc: 100, pp: 20, effect: { kind: 'stat', stat: 'def', stages: 1 }, desc: 'Sharply raises Defence.' },\n  restProtocol:{ name: 'Rest Protocol', type: 'null',    power: 0,   acc: 100, pp: 10, effect: { kind: 'heal', pct: 0.5 }, desc: 'Recovers half of max HP.' },\n  lastResort:  { name: 'Last Resort',   type: 'null',    power: 90,  acc: 90,  pp: 10, effect: { kind: 'recoil', pct: 0.25 }, desc: 'Heavy hit with recoil damage.' },\n\n  /* --------------------------------------------------------------- Flame */\n  cinderLash:  { name: 'Cinder Lash',   type: 'flame',   power: 45,  acc: 100, pp: 30, effect: { kind: 'status', status: 'burn', chance: 0.15 }, desc: 'A whip of flame that may burn.' },\n  pyroFang:    { name: 'Pyro Fang',     type: 'flame',   power: 75,  acc: 95,  pp: 20, effect: { kind: 'status', status: 'burn', chance: 0.2 }, desc: 'Searing bite; often burns.' },\n  novaBurst:   { name: 'Nova Burst',    type: 'flame',   power: 110, acc: 90,  pp: 8,  desc: 'Detonates a miniature star.' },\n  flameVeil:   { name: 'Flame Veil',    type: 'flame',   power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'def', stages: 1 }, desc: 'A veil of heat bolsters defence.' },\n\n  /* ---------------------------------------------------------------- Aqua */\n  aquaJet:     { name: 'Aqua Jet',      type: 'aqua',    power: 45,  acc: 100, pp: 30, desc: 'Fires a lance of pressurised water.' },\n  tideSlam:    { name: 'Tide Slam',     type: 'aqua',    power: 75,  acc: 95,  pp: 20, desc: 'A crushing wave slams the target.' },\n  maelstrom:   { name: 'Maelstrom',     type: 'aqua',    power: 110, acc: 85,  pp: 8,  desc: 'Summons a churning vortex.' },\n  coolMist:    { name: 'Cool Mist',     type: 'aqua',    power: 0,   acc: 100, pp: 15, effect: { kind: 'heal', pct: 0.4 }, desc: 'Soothing mist restores HP.' },\n\n  /* -------------------------------------------------------------- Verdant */\n  vineWhip:    { name: 'Vine Whip',     type: 'verdant', power: 45,  acc: 100, pp: 30, desc: 'Lashing vines strike the foe.' },\n  thornBarrage:{ name: 'Thorn Barrage', type: 'verdant', power: 75,  acc: 95,  pp: 20, effect: { kind: 'drain', pct: 0.4 }, desc: 'Drains HP from the target.' },\n  bloomNova:   { name: 'Bloom Nova',    type: 'verdant', power: 105, acc: 90,  pp: 8,  effect: { kind: 'heal', pct: 0.3 }, desc: 'A blossoming burst that heals the user.' },\n  rootGuard:   { name: 'Root Guard',    type: 'verdant', power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'def', stages: 1 }, desc: 'Roots anchor and protect.' },\n\n  /* ----------------------------------------------------------------- Volt */\n  staticNip:   { name: 'Static Nip',    type: 'volt',    power: 45,  acc: 100, pp: 30, effect: { kind: 'status', status: 'paralyze', chance: 0.2 }, desc: 'A static shock that may paralyse.' },\n  voltFang:    { name: 'Volt Fang',     type: 'volt',    power: 75,  acc: 95,  pp: 20, effect: { kind: 'status', status: 'paralyze', chance: 0.25 }, desc: 'An electrified bite.' },\n  thunderLance:{ name: 'Thunder Lance', type: 'volt',    power: 110, acc: 85,  pp: 8,  desc: 'Calls down a lance of lightning.' },\n  overcharge:  { name: 'Overcharge',    type: 'volt',    power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'spd', stages: 2 }, desc: 'Massively raises Speed.' },\n\n  /* ---------------------------------------------------------------- Terra */\n  rockThrow:   { name: 'Rock Throw',    type: 'terra',   power: 50,  acc: 90,  pp: 25, desc: 'Hurls a jagged stone.' },\n  seismicSlam: { name: 'Seismic Slam',  type: 'terra',   power: 85,  acc: 90,  pp: 15, desc: 'Slams the ground to shake the foe.' },\n  tectonicRage:{ name: 'Tectonic Rage', type: 'terra',   power: 115, acc: 80,  pp: 6,  desc: 'Splits the floor beneath the target.' },\n\n  /* ----------------------------------------------------------------- Aero */\n  gust:        { name: 'Gust',          type: 'aero',    power: 45,  acc: 100, pp: 30, desc: 'A blade of compressed air.' },\n  cycloneWing: { name: 'Cyclone Wing',  type: 'aero',    power: 75,  acc: 95,  pp: 20, desc: 'Wings whip up a cutting cyclone.' },\n  tempestHowl: { name: 'Tempest Howl',  type: 'aero',    power: 105, acc: 90,  pp: 8,  desc: 'A howling storm batters the foe.' },\n  tailwind:    { name: 'Tailwind',      type: 'aero',    power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'spd', stages: 2 }, desc: 'Greatly raises Speed.' },\n\n  /* ---------------------------------------------------------------- Frost */\n  frostNip:    { name: 'Frost Nip',     type: 'frost',   power: 45,  acc: 100, pp: 30, effect: { kind: 'status', status: 'freeze', chance: 0.15 }, desc: 'A freezing bite.' },\n  glacierSpear:{ name: 'Glacier Spear', type: 'frost',   power: 75,  acc: 95,  pp: 20, effect: { kind: 'status', status: 'freeze', chance: 0.15 }, desc: 'Impales with sharpened ice.' },\n  absoluteZero:{ name: 'Absolute Zero', type: 'frost',   power: 110, acc: 85,  pp: 6,  effect: { kind: 'status', status: 'freeze', chance: 0.2 }, desc: 'Drops the field to absolute zero.' },\n\n  /* ----------------------------------------------------------------- Byte */\n  byteSnap:    { name: 'Byte Snap',     type: 'byte',    power: 50,  acc: 100, pp: 30, desc: 'Corrupts target bytes directly.' },\n  dataLeech:   { name: 'Data Leech',    type: 'byte',    power: 70,  acc: 100, pp: 20, effect: { kind: 'drain', pct: 0.5 }, desc: 'Siphons data to restore HP.' },\n  overclockBeam:{name: 'Overclock Beam',type: 'byte',    power: 110, acc: 90,  pp: 8,  desc: 'An unstable, over-volted beam.' },\n  firewall:    { name: 'Firewall',      type: 'byte',    power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'def', stages: 2 }, desc: 'Greatly raises Defence.' },\n\n  /* ---------------------------------------------------------------- Virus */\n  venomBite:   { name: 'Venom Bite',    type: 'virus',   power: 45,  acc: 100, pp: 30, effect: { kind: 'status', status: 'poison', chance: 0.3 }, desc: 'A bite that injects corrupt code.' },\n  corruptRay:  { name: 'Corrupt Ray',   type: 'virus',   power: 75,  acc: 95,  pp: 20, effect: { kind: 'status', status: 'poison', chance: 0.25 }, desc: 'A ray of malicious data.' },\n  oblivionWave:{ name: 'Oblivion Wave', type: 'virus',   power: 110, acc: 85,  pp: 6,  desc: 'Erases the target’s integrity.' },\n  glitchStep:  { name: 'Glitch Step',   type: 'virus',   power: 0,   acc: 100, pp: 15, effect: { kind: 'stat', stat: 'spd', stages: 1 }, desc: 'Desyncs the user forward in time.' },\n};\n\n/** Stable ordering for UI pickers. */\nexport const MOVE_IDS = Object.keys(MOVES);\n\n/**\n * Safe accessor that never throws on unknown ids (guards corrupt save data).\n * @param {string} id\n * @returns {object} Move record, or a defensive fallback.\n */\nexport function getMove(id) {\n  return MOVES[id] || { name: 'Struggle', type: 'null', power: 50, acc: 100, pp: 99, desc: 'A desperate last-ditch strike.' };\n}\n"},{"key":"src/domain/progression.js","code":"/**\n * progression.js — Curves for experience, bonding, currencies and objectives.\n *\n * All numbers live here so balance passes never require touching engine code.\n *\n * Curve choice: \"medium-fast\" (cumulative XP to reach level L = L³).\n * It keeps early levels snappy while still making level 50 feel earned.\n *\n * @module domain/progression\n */\n\n/** Maximum reachable level. Evolution thresholds are tuned against this. */\nexport const LEVEL_CAP = 50;\n\n/** Maximum bond value (bond gates Mega evolution and some flavour text). */\nexport const BOND_CAP = 100;\n\n/** Maximum value of a single core (IV) stat. */\nexport const CORE_CAP = 15;\n\n/** Cumulative XP required to reach a given level. */\nexport function xpToReach(level) {\n  return Math.pow(Math.max(1, level), 3);\n}\n\n/** XP required to go from `level` to `level + 1`. */\nexport function xpToNext(level) {\n  if (level >= LEVEL_CAP) return 0;\n  return xpToReach(level + 1) - xpToReach(level);\n}\n\n/**\n * XP yielded when a creature is defeated.\n * @param {object} species Species record.\n * @param {number} level Defeated creature's level.\n * @param {boolean} isTrainer Trainer battles pay a 1.5× premium.\n */\nexport function xpReward(species, level, isTrainer = false) {\n  const base = Math.floor((species.xp * level) / 7);\n  return Math.max(1, Math.floor(base * (isTrainer ? 1.5 : 1)));\n}\n\n/** Bond gained for a given event. */\nexport const BOND_GAIN = {\n  battleWon: 2,\n  levelUp: 2,\n  captured: 5,\n  trained: 1, // Lab: core synthesis / move tutoring\n};\n\n/** Data Shards awarded for releasing a creature. */\nexport function shardValue(species, level) {\n  const stageBonus = { rookie: 0, champion: 12, ultimate: 30, mega: 60 }[species.stage] ?? 0;\n  return 4 + stageBonus + Math.floor(level / 4);\n}\n\n/** Shard cost to raise one core point at its current value. */\nexport function coreCost(currentCore) {\n  return 6 + currentCore * 3;\n}\n\n/** Shard cost to tutor (relearn) a move. */\nexport const MOVE_TUTOR_COST = 18;\n\n/** Bond tier labels shown in the Ranch inspector. */\nexport function bondTier(bond) {\n  if (bond >= 80) return { label: 'Sovereign', color: '#ffd93d' };\n  if (bond >= 60) return { label: 'Devoted', color: '#4fd67c' };\n  if (bond >= 35) return { label: 'Trusting', color: '#3db4ff' };\n  if (bond >= 15) return { label: 'Wary', color: '#c8cfe0' };\n  return { label: 'Feral', color: '#ff5fa2' };\n}\n\n/** Battle rewards paid out for a victory. */\nexport function victoryRewards(isTrainer, zoneTier = 0) {\n  return {\n    shards: isTrainer ? 12 + zoneTier * 6 : 3 + zoneTier * 2,\n  };\n}\n\n/**\n * Daily objectives. Derived deterministically from the calendar date so all\n * players see the same set on the same day, and so a reload never rerolls them.\n *\n * @param {string} dateKey ISO date, e.g. \"2026-09-07\".\n * @param {import('../core/rng.js').createRng} _rng Unused; kept for parity.\n * @returns {{id:string, text:string, goal:number, reward:number, stat:string}[]}\n */\nexport function dailyObjectives(dateKey) {\n  const templates = [\n    { id: 'battles', text: 'Win battles', goal: 3, reward: 20, stat: 'battlesWon' },\n    { id: 'captures', text: 'Capture creatures', goal: 2, reward: 25, stat: 'captures' },\n    { id: 'evolutions', text: 'Trigger evolutions', goal: 1, reward: 40, stat: 'evolutions' },\n    { id: 'steps', text: 'Scan the wilds', goal: 12, reward: 12, stat: 'steps' },\n    { id: 'train', text: 'Defeat a trainer', goal: 1, reward: 30, stat: 'trainersBeaten' },\n  ];\n  // Rotate the template list by the day number so the mix varies daily.\n  const day = Number(dateKey.slice(8, 10)) || 1;\n  const rotated = templates.map((_, i) => templates[(i + day) % templates.length]);\n  return rotated.slice(0, 3);\n}\n"},{"key":"src/domain/creature.js","code":"/**\n * creature.js — Creature entity: construction, stat derivation, levelling,\n * learnsets and evolution.\n *\n * A creature is a plain, structured-clonable object so it can be persisted\n * directly into IndexedDB and exported as JSON without adapters:\n *\n *   {\n *     uid, speciesId, nickname, level, xp, bond, hp,\n *     cores: { hp, atk, def, spd },   // 0..15, aka IVs\n *     moves: string[],                // active moves (max 4)\n *     origin: { zone, at, wild },\n *     shiny: boolean,\n *     stats: { battles, wins }\n *   }\n *\n * All functions here are pure except where explicitly noted (mutating helpers\n * return a change report so callers can emit UI events).\n *\n * @module domain/creature\n */\n\nimport { getSpecies, learnsetFor } from '«src/domain/species.js»';\nimport { getMove } from '«src/domain/moves.js»';\nimport { LEVEL_CAP, BOND_CAP, CORE_CAP, xpToNext, BOND_GAIN } from '«src/domain/progression.js»';\nimport { randomSeed } from '«src/core/rng.js»';\n\n/** Probability that a freshly encountered creature is a \"Glitch\" (shiny). */\nexport const GLITCH_RATE = 1 / 512;\n\n/** Stat ids in canonical display order. */\nexport const STAT_IDS = ['hp', 'atk', 'def', 'spd'];\n\n/**\n * Derive a creature's maximum stats from species base stats, level and cores.\n * Standard formula: floor((2 * base + core) * level / 100) + offset.\n *\n * @param {object} creature\n * @returns {{hp:number, atk:number, def:number, spd:number}}\n */\nexport function statsFor(creature) {\n  const base = getSpecies(creature.speciesId).base;\n  const lv = creature.level;\n  const c = creature.cores;\n  return {\n    hp: Math.floor(((2 * base.hp + c.hp) * lv) / 100) + lv + 10,\n    atk: Math.floor(((2 * base.atk + c.atk) * lv) / 100) + 5,\n    def: Math.floor(((2 * base.def + c.def) * lv) / 100) + 5,\n    spd: Math.floor(((2 * base.spd + c.spd) * lv) / 100) + 5,\n  };\n}\n\n/** Convenience: max HP only (hot path in battle rendering). */\nexport function maxHpOf(creature) {\n  return statsFor(creature).hp;\n}\n\n/** Roll a fresh set of core values using the provided RNG. */\nexport function rollCores(rand) {\n  return {\n    hp: rand.int(0, CORE_CAP),\n    atk: rand.int(0, CORE_CAP),\n    def: rand.int(0, CORE_CAP),\n    spd: rand.int(0, CORE_CAP),\n  };\n}\n\n/** Sum of cores / maximum possible — shown as \"potential\" in the UI. */\nexport function corePotential(creature) {\n  const total = STAT_IDS.reduce((s, k) => s + creature.cores[k], 0);\n  return { total, max: STAT_IDS.length * CORE_CAP, pct: total / (STAT_IDS.length * CORE_CAP) };\n}\n\n/**\n * Determine which moves a creature knows at its current level.\n * Falls back to the first four learnset entries if nothing is learned yet.\n *\n * @param {object} creature\n * @returns {string[]} Up to four move ids.\n */\nexport function movesAtLevel(creature) {\n  const set = learnsetFor(creature.speciesId)\n    .filter((e) => e.level <= creature.level)\n    .map((e) => e.move);\n  // Preserve any tutored/legacy moves the creature already has.\n  const preserved = (creature.moves || []).filter((m) => !set.includes(m));\n  const merged = [...set, ...preserved];\n  return merged.slice(-4);\n}\n\n/** Create a new creature instance.\n *\n * @param {object} opts\n * @param {string} opts.speciesId\n * @param {number} [opts.level=5]\n * @param {object} [opts.rand] RNG from core/rng.js (needs .int/.chance).\n * @param {object} [opts.cores] Explicit cores (overrides rolling).\n * @param {string} [opts.nickname]\n * @param {object} [opts.origin] Provenance metadata.\n * @param {boolean} [opts.shiny] Force glitch variant.\n * @returns {object} A fresh creature record.\n */\nexport function createCreature({\n  speciesId,\n  level = 5,\n  rand = { int: (a, b) => Math.floor(a + Math.random() * (b - a + 1)), chance: (p) => Math.random() < p },\n  cores = null,\n  nickname = null,\n  origin = {},\n  shiny = null,\n}) {\n  const lv = Math.max(1, Math.min(LEVEL_CAP, Math.floor(level)));\n  const creature = {\n    uid: `cr_${Date.now().toString(36)}_${Math.floor(Math.random() * 1e6).toString(36)}`,\n    speciesId,\n    nickname,\n    level: lv,\n    xp: 0,\n    bond: 10,\n    hp: 0,\n    cores: cores || rollCores(rand),\n    moves: [],\n    origin: { zone: origin.zone || 'unknown', at: origin.at || new Date().toISOString(), wild: origin.wild ?? false },\n    shiny: shiny ?? rand.chance(GLITCH_RATE),\n    stats: { battles: 0, wins: 0 },\n  };\n  creature.moves = movesAtLevel(creature);\n  creature.hp = maxHpOf(creature);\n  return creature;\n}\n\n/** Display name: nickname if set, otherwise the species name. */\nexport function displayName(creature) {\n  return creature.nickname || getSpecies(creature.speciesId).name;\n}\n\n/** Restore a creature to full health and clear volatile battle state. */\nexport function healCreature(creature) {\n  creature.hp = maxHpOf(creature);\n  return creature;\n}\n\n/** Percentage of remaining HP (0..1), floored at 0. */\nexport function hpRatio(creature) {\n  const max = maxHpOf(creature);\n  if (!max) return 0;\n  return Math.max(0, Math.min(1, creature.hp / max));\n}\n\n/** Coarse health bucket used for UI colouring. */\nexport function healthState(creature) {\n  const r = hpRatio(creature);\n  if (r <= 0) return 'fainted';\n  if (r < 0.25) return 'critical';\n  if (r < 0.55) return 'hurt';\n  return 'healthy';\n}\n\n/** True when a creature can no longer battle. */\nexport function isFainted(creature) {\n  return creature.hp <= 0;\n}\n\n/**\n * Grant XP and resolve any number of level-ups, learnset changes and\n * evolutions. Mutates `creature`.\n *\n * @param {object} creature\n * @param {number} amount\n * @returns {{gained:number, levels:number[], learned:string[], evolved:null|{from:string,to:string}}}\n */\nexport function gainXp(creature, amount) {\n  const report = { gained: amount, levels: [], learned: [], evolved: null };\n  if (creature.level >= LEVEL_CAP) return report;\n\n  creature.xp += amount;\n  while (creature.level < LEVEL_CAP && creature.xp >= xpToNext(creature.level)) {\n    creature.xp -= xpToNext(creature.level);\n    creature.level += 1;\n    creature.bond = Math.min(BOND_CAP, creature.bond + BOND_GAIN.levelUp);\n    report.levels.push(creature.level);\n\n    const before = new Set(creature.moves);\n    creature.moves = movesAtLevel(creature);\n    for (const m of creature.moves) if (!before.has(m)) report.learned.push(m);\n\n    // HP gained from levelling is granted immediately (feels good, matches genre).\n    creature.hp = Math.min(maxHpOf(creature), creature.hp + Math.max(1, Math.floor((maxHpOf(creature) - creature.hp) * 0.15)) + 2);\n  }\n  if (creature.level >= LEVEL_CAP) creature.xp = 0;\n\n  const evo = canEvolve(creature);\n  if (evo) {\n    const from = creature.speciesId;\n    applyEvolution(creature, evo.to);\n    report.evolved = { from, to: evo.to };\n  }\n  return report;\n}\n\n/**\n * Check whether a creature currently satisfies its evolution conditions.\n * @param {object} creature\n * @returns {{to:string, level:number, bond?:number}|null}\n */\nexport function canEvolve(creature) {\n  const species = getSpecies(creature.speciesId);\n  if (!species.evolve) return null;\n  const { to, level, bond } = species.evolve;\n  if (creature.level < level) return null;\n  if (bond && creature.bond < bond) return null;\n  return species.evolve;\n}\n\n/**\n * Describe *why* an evolution is not yet available, for the Lab UI.\n * @param {object} creature\n * @returns {string|null} Null when evolution is ready right now.\n */\nexport function evolutionBlocker(creature) {\n  const species = getSpecies(creature.speciesId);\n  if (!species.evolve) return 'Final form reached.';\n  const { level, bond } = species.evolve;\n  if (creature.level < level) return `Needs level ${level} (currently ${creature.level}).`;\n  if (bond && creature.bond < bond) return `Needs bond ${bond} (currently ${creature.bond}).`;\n  return null;\n}\n\n/**\n * Mutate a creature into its next form. Recomputes moves and tops up HP so the\n * transformation is never a downgrade.\n *\n * @param {object} creature\n * @param {string} toSpeciesId\n * @returns {object} The mutated creature.\n */\nexport function applyEvolution(creature, toSpeciesId) {\n  const ratio = hpRatio(creature);\n  creature.speciesId = toSpeciesId;\n  creature.moves = movesAtLevel(creature);\n  creature.hp = Math.max(1, Math.round(maxHpOf(creature) * Math.max(ratio, 0.35)));\n  creature.bond = Math.min(BOND_CAP, creature.bond + 5);\n  return creature;\n}\n\n/** Raise one core stat by a point, respecting the cap. Mutates. */\nexport function raiseCore(creature, statId) {\n  if (!STAT_IDS.includes(statId)) return false;\n  if (creature.cores[statId] >= CORE_CAP) return false;\n  creature.cores[statId] += 1;\n  if (statId === 'hp') creature.hp = Math.min(maxHpOf(creature), creature.hp + 1);\n  creature.bond = Math.min(BOND_CAP, creature.bond + BOND_GAIN.trained);\n  return true;\n}\n\n/**\n * Teach (or re-teach) a move from the species learnset. Mutates.\n * Returns false when the move is unknown to this species or already held.\n */\nexport function teachMove(creature, moveId) {\n  const legal = learnsetFor(creature.speciesId).map((e) => e.move);\n  const alsoLegal = getSpecies(creature.speciesId).moves;\n  if (!legal.includes(moveId) && !alsoLegal.includes(moveId)) return false;\n  if (creature.moves.includes(moveId)) return false;\n  if (creature.moves.length >= 4) creature.moves.shift(); // drop the oldest\n  creature.moves.push(moveId);\n  creature.bond = Math.min(BOND_CAP, creature.bond + BOND_GAIN.trained);\n  return true;\n}\n\n/** Battle-ready snapshot consumed by the engine (never mutated by the UI). */\nexport function toCombatSnapshot(creature) {\n  return {\n    uid: creature.uid,\n    speciesId: creature.speciesId,\n    level: creature.level,\n    hp: creature.hp,\n    maxHp: maxHpOf(creature),\n    stats: statsFor(creature),\n    moves: [...creature.moves],\n    shiny: creature.shiny,\n    nickname: creature.nickname,\n  };\n}\n\n/** Human-readable move summary for cards and tooltips. */\nexport function moveSummary(moveId) {\n  const m = getMove(moveId);\n  return `${m.name} · ${m.type} · PWR ${m.power || '—'} · ACC ${m.acc}`;\n}\n\n/** Deterministic per-creature \"personality\" seed used for idle animations. */\nexport function personaSeed(creature) {\n  return randomSeed();\n}\n"},{"key":"src/domain/capture.js","code":"/**\n * capture.js — Capture resolution.\n *\n * A pure function of (target HP, species catch rate, ball multiplier, level,\n * status). Kept separate from the battle engine so it can be unit-tested and\n * rebalanced in isolation, and so the UI can show a live catch-probability\n * estimate before the player commits a ball.\n *\n * Formula (genre-standard shape):\n *   a = (3*maxHp - 2*hp) * rate * ball / (3*maxHp)\n *   p = a * levelFactor * statusBonus, clamped to [0.01, 0.97]\n *\n * @module domain/capture\n */\n\n/** Ball catalogue. `mult` multiplies the base catch rate. */\nexport const BALLS = {\n  dataBall:   { id: 'dataBall',   name: 'Data Ball',   mult: 1.0, color: '#7fdcff', desc: 'Standard issue. Reliable, unremarkable.' },\n  cipherBall: { id: 'cipherBall', name: 'Cipher Ball', mult: 1.6, color: '#b48cff', desc: 'Encrypts the target’s escape routines.' },\n  matrixBall: { id: 'matrixBall', name: 'Matrix Ball', mult: 2.6, color: '#ffd93d', desc: 'Near-certain capture. Reserve for legends.' },\n};\n\n/** Status bonuses applied to the catch roll. */\nconst STATUS_BONUS = { sleep: 2.2, freeze: 2.2, paralyze: 1.6, poison: 1.4, burn: 1.4 };\n\n/**\n * Compute the probability (0..1) of capturing a target right now.\n *\n * @param {object} o\n * @param {number} o.hp Current HP of the target.\n * @param {number} o.maxHp Maximum HP of the target.\n * @param {number} o.rate Species capture rate (0–255).\n * @param {string} o.ballId Ball id.\n * @param {number} o.level Target level.\n * @param {string|null} [o.status] Volatile status id.\n * @returns {number} Probability in [0.01, 0.97].\n */\nexport function captureChance({ hp, maxHp, rate, ballId, level, status = null }) {\n  const ball = BALLS[ballId] || BALLS.dataBall;\n  const safeMax = Math.max(1, maxHp);\n  const safeHp = Math.max(0, Math.min(maxHp, hp));\n\n  // Health term: full HP ≈
