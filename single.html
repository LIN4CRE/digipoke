6, -22) : ''}\\\n${limb(34, 84, 14, 24, darken(a.body, 14), { claw: true })}\\\n${limb(50, 86, 14, 22, darken(a.body, 20), { claw: true })}\\\n${limb(68, 86, 14, 22, darken(a.body, 20), { claw: true })}\\\n${limb(82, 84, 14, 24, darken(a.body, 14), { claw: true })}\\\n<ellipse cx=\"56\" cy=\"70\" rx=\"36\" ry=\"24\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 50, 74, 30, id)}\\\n<ellipse cx=\"58\" cy=\"82\" rx=\"24\" ry=\"12\" fill=\"url(#belly${id})\"/>\\\n${gloss(56, 70, 36, 24, id)}\\\n<ellipse cx=\"86\" cy=\"50\" rx=\"21\" ry=\"19\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${spikes(a, 52, 48, a.spikes, 0.95)}\\\n<path d=\"M74 62 q11 9 22 3\" stroke=\"${stroke}\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.65\"/>\\\n${eyes(a, 90, 46, 8, mood, a.eye)}\\\n${mouth(94, 60, mood, 9)}\\\n<\/g>`;\n}\n\n/** Upright humanoid creature. */\nfunction buildBiped(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 52) : ''}\\\n${a.tail ? tail(a, 40, 76, -26, -14) : ''}\\\n${limb(42, 88, 15, 22, darken(a.body, 16), { claw: true })}\\\n${limb(64, 88, 15, 22, darken(a.body, 16), { claw: true })}\\\n<path d=\"M40 58 q20 -10 40 0 l4 34 q-24 8 -48 0 z\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 60, 74, 22, id)}\\\n<ellipse cx=\"60\" cy=\"80\" rx=\"15\" ry=\"12\" fill=\"url(#belly${id})\"/>\\\n${gloss(60, 72, 22, 20, id)}\\\n${limb(26, 60, 13, 26, darken(a.body, 6), { claw: true, rx: 6 })}\\\n${limb(82, 60, 13, 26, darken(a.body, 6), { claw: true, rx: 6 })}\\\n<circle cx=\"60\" cy=\"38\" r=\"23\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${spikes(a, 60, 20, a.spikes, 0.85)}\\\n${eyes(a, 60, 36, 8.5, mood, a.eye)}\\\n${blush(60, 48, 13, '#ff7d9c', 0.3)}\\\n${mouth(60, 50, mood, 9)}\\\n<\/g>`;\n}\n\n/** Coiled serpentine body with a large head. */\nfunction buildSerpent(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 54) : ''}\\\n<path d=\"M22 96 q16 -10 26 -26 q10 -18 30 -18 q20 0 18 18\" fill=\"none\" stroke=\"${darken(a.body, 18)}\" stroke-width=\"19\" stroke-linecap=\"round\"/>\\\n<path d=\"M22 96 q16 -10 26 -26 q10 -18 30 -18 q20 0 18 18\" fill=\"none\" stroke=\"url(#body${id})\" stroke-width=\"14\" stroke-linecap=\"round\"/>\\\n<path d=\"M22 96 q16 -10 26 -26 q10 -18 30 -18 q20 0 18 18\" fill=\"none\" stroke=\"${a.accent}\" stroke-width=\"4.6\" stroke-linecap=\"round\" opacity=\"0.5\"/>\\\n${spikes(a, 60, 44, a.spikes, 0.9)}\\\n<ellipse cx=\"88\" cy=\"46\" rx=\"24\" ry=\"21\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 92, 50, 20, id)}\\\n${gloss(88, 46, 24, 21, id)}\\\n${eyes(a, 94, 42, 8, mood, a.eye)}\\\n${mouth(100, 56, mood, 10)}\\\n<\/g>`;\n}\n\n/** Winged creature (body + big wing pair + crest). */\nfunction buildWinged(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${wings(a, true, true, 54)}\\\n${a.tail ? tail(a, 44, 84, -24, -12) : ''}\\\n${limb(44, 88, 14, 18, darken(a.body, 14), { claw: true })}\\\n${limb(62, 88, 14, 18, darken(a.body, 14), { claw: true })}\\\n<ellipse cx=\"60\" cy=\"70\" rx=\"27\" ry=\"30\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 60, 74, 26, id)}\\\n<ellipse cx=\"60\" cy=\"80\" rx=\"16\" ry=\"19\" fill=\"url(#belly${id})\"/>\\\n${gloss(60, 70, 27, 30, id)}\\\n<circle cx=\"60\" cy=\"38\" r=\"20\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${spikes(a, 60, 20, a.spikes, 0.8)}\\\n<path d=\"M46 34 l-12 -10 l14 2 z\" fill=\"${a.accent}\" stroke=\"${stroke}\" stroke-width=\"1.6\"/>\n<path d=\"M74 34 l12 -10 l-14 2 z\" fill=\"${a.accent}\" stroke=\"${stroke}\" stroke-width=\"1.6\"/>\\\n${eyes(a, 60, 36, 8.5, mood, a.eye)}\\\n${mouth(60, 50, mood, 9)}\\\n<\/g>`;\n}\n\n/** Aquatic creature with fins and a fluke. */\nfunction buildAquatic(a, id, mood) {\n  const stroke = darken(a.body, 44);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 58) : ''}\\\n<path d=\"M92 66 q-30 -34 -60 0 q30 34 60 0z\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n${pattern(a, 66, 68, 24, id)}\\\n<path d=\"M32 66 l-16 -14 v28 z\" fill=\"${a.accent}\" stroke=\"${stroke}\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\\\n<path d=\"M62 40 q-6 -18 10 -22 q2 12 -4 20 z\" fill=\"${a.accent}\" stroke=\"${stroke}\" stroke-width=\"1.8\"/>\\\n${spikes(a, 66, 44, a.spikes, 0.8)}\\\n<ellipse cx=\"60\" cy=\"76\" rx=\"24\" ry=\"10\" fill=\"url(#belly${id})\"/>\\\n${gloss(66, 62, 28, 20, id)}\\\n${eyes(a, 84, 58, 8.5, mood, a.eye)}\\\n${blush(84, 72, 18, '#ff7d9c', 0.28)}\\\n${mouth(90, 72, mood, 9)}\\\n<\/g>`;\n}\n\n/** Mechanical / data creature with a glowing visor. */\nfunction buildMech(a, id, mood) {\n  const stroke = darken(a.body, 46);\n  return `<g class=\"sp-body\">\\\n${a.wings ? wings(a, true, true, 52) : ''}\\\n${a.tail ? tail(a, 40, 78, -26, -12) : ''}\\\n<rect x=\"36\" y=\"86\" width=\"15\" height=\"16\" rx=\"5\" fill=\"${darken(a.body, 24)}\" stroke=\"${stroke}\" stroke-width=\"2\"/>\n<rect x=\"69\" y=\"86\" width=\"15\" height=\"16\" rx=\"5\" fill=\"${darken(a.body, 24)}\" stroke=\"${stroke}\" stroke-width=\"2\"/>\\\n<rect x=\"34\" y=\"52\" width=\"52\" height=\"40\" rx=\"12\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n<rect x=\"34\" y=\"52\" width=\"52\" height=\"11\" rx=\"6\" fill=\"${a.accent}\" opacity=\"0.7\"/>\\\n${pattern(a, 60, 74, 24, id)}\\\n${gloss(60, 70, 26, 20, id)}\\\n<rect x=\"26\" y=\"58\" width=\"12\" height=\"20\" rx=\"6\" fill=\"${darken(a.body, 10)}\" stroke=\"${stroke}\" stroke-width=\"2\"/>\n<rect x=\"82\" y=\"58\" width=\"12\" height=\"20\" rx=\"6\" fill=\"${darken(a.body, 10)}\" stroke=\"${stroke}\" stroke-width=\"2\"/>\\\n<rect x=\"38\" y=\"20\" width=\"44\" height=\"32\" rx=\"11\" fill=\"url(#body${id})\" stroke=\"${stroke}\" stroke-width=\"2.6\"/>\\\n<line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"9\" stroke=\"${a.accent}\" stroke-width=\"2.6\"/>\n<circle cx=\"60\" cy=\"7\" r=\"4\" fill=\"${a.accent}\"/>\\\n<rect x=\"45\" y=\"30\" width=\"30\" height=\"12\" rx=\"6\" fill=\"#0a0f1c\" opacity=\"0.92\"/>\\\n${eyes(a, 60, 36, 5.6, mood === 'faint' ? 'faint' : 'idle', Math.max(1, Math.min(3, a.eye)))}\\\n${spikes(a, 60, 18, a.spikes, 0.8)}\\\n<\/g>`;\n}\n\n/* ------------------------------------------------------------ colour utils */\n\n/** Blend toward white. */\nexport function lighten(hex, amount) { return mix(hex, '#ffffff', amount / 100); }\n\n/** Blend toward black. */\nexport function darken(hex, amount) { return mix(hex, '#000000', amount / 100); }\n\nfunction mix(hex, target, ratio) {\n  const a = parseHex(hex);\n  const b = parseHex(target);\n  const r = Math.round(a[0] + (b[0] - a[0]) * ratio);\n  const g = Math.round(a[1] + (b[1] - a[1]) * ratio);\n  const bl = Math.round(a[2] + (b[2] - a[2]) * ratio);\n  return `#${[r, g, bl].map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('')}`;\n}\n\n/** Rotate hue by degrees. */\nexport function shiftHue(hex, deg) {\n  const [r, g, b] = parseHex(hex).map((v) => v / 255);\n  const max = Math.max(r, g, b);\n  const min = Math.min(r, g, b);\n  const l = (max + min) / 2;\n  const d = max - min;\n  if (!d) return hex;\n  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);\n  let hDeg = 0;\n  if (max === r) hDeg = ((g - b) / d + (g < b ? 6 : 0)) * 60;\n  else if (max === g) hDeg = ((b - r) / d + 2) * 60;\n  else hDeg = ((r - g) / d + 4) * 60;\n  return hslToHex((hDeg + deg + 360) % 360, s, l);\n}\n\nfunction hslToHex(h, s, l) {\n  const c = (1 - Math.abs(2 * l - 1)) * s;\n  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));\n  const m = l - c / 2;\n  const seg = Math.floor(h / 60) % 6;\n  const rgb = [\n    [c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x],\n  ][seg].map((v) => Math.round((v + m) * 255));\n  return `#${rgb.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('')}`;\n}\n\nfunction parseHex(hex) {\n  const s = String(hex).replace('#', '');\n  const full = s.length === 3 ? s.split('').map((c) => c + c).join('') : s.padEnd(6, '0').slice(0, 6);\n  return [\n    parseInt(full.slice(0, 2), 16),\n    parseInt(full.slice(2, 4), 16),\n    parseInt(full.slice(4, 6), 16),\n  ];\n}\n\n/* ---------------------------------------------------------- presentation */\n\n/**\n * Build a standalone \"portrait\" card for a species — used by the starter\n * showcase. Larger, with a platform, aura ring and species name plate.\n *\n * @param {object} art\n * @param {object} [opts] Same options as `sprite()` plus `platform`.\n */\nexport function portrait(art, { size = 220, shiny = false, mood = 'idle', flip = 'right', platform = true } = {}) {\n  const inner = sprite(art, { size, shiny, mood, flip });\n  if (!platform) return inner;\n  return `<div class=\"portrait\" style=\"--aura:${art.aura || '#7c5cff'}\">\n    <div class=\"portrait__ring\"><\/div>\n    <div class=\"portrait__platform\"><\/div>\n    <div class=\"portrait__art\">${inner}<\/div>\n  <\/div>`;\n}\n"},{"key":"src/ui/tamerAvatar.js","code":"/**\n * tamerAvatar.js — Procedural Tamer portrait & character creator artwork.\n *\n * The player's own avatar is generated from a small config object\n * (skin, hair style/colour, outfit, accessory). It is used:\n *   • large and animated during character creation,\n *   • as the dashboard hero portrait,\n *   • as a 28px badge in the top bar.\n *\n * Everything is SVG built from primitives with gradient shading, so the\n * creator can offer thousands of combinations with zero image assets and\n * instant live preview.\n *\n * @module ui/tamerAvatar\n */\n\nlet avatarCounter = 0;\n\n/** Selectable options for the character creator. */\nexport const TAMER_OPTIONS = {\n  skin: [\n    { id: 'porcelain', name: 'Porcelain', hex: '#f7ddcf' },\n    { id: 'sand',      name: 'Sand',      hex: '#eec3a3' },\n    { id: 'honey',     name: 'Honey',     hex: '#d79a6a' },\n    { id: 'umber',     name: 'Umber',     hex: '#a86a41' },\n    { id: 'cocoa',     name: 'Cocoa',     hex: '#6f4128' },\n    { id: 'espresso',  name: 'Espresso',  hex: '#43281a' },\n    { id: 'aqua',      name: 'Refract',   hex: '#8fd9ff' },\n    { id: 'lilac',     name: 'Glitch',    hex: '#d3b6ff' },\n  ],\n  hairStyle: [\n    { id: 'spike',    name: 'Spiked' },\n    { id: 'bob',      name: 'Bob' },\n    { id: 'long',     name: 'Long' },\n    { id: 'ponytail', name: 'Ponytail' },\n    { id: 'afro',     name: 'Cloud' },\n    { id: 'braid',    name: 'Braid' },\n    { id: 'crop',     name: 'Crop' },\n    { id: 'mohawk',   name: 'Mohawk' },\n  ],\n  hairColor: [\n    { id: 'ink',     name: 'Ink',     hex: '#2b2f3d' },\n    { id: 'chestnut',name: 'Chestnut',hex: '#6b3f2a' },\n    { id: 'amber',   name: 'Amber',   hex: '#d8a13a' },\n    { id: 'ash',     name: 'Ash',     hex: '#c9cfda' },\n    { id: 'flame',   name: 'Flame',   hex: '#e2542c' },\n    { id: 'tide',    name: 'Tide',    hex: '#2f7fd1' },\n    { id: 'virus',   name: 'Virus',   hex: '#c33ea0' },\n    { id: 'mint',    name: 'Mint',    hex: '#4fd6a8' },\n  ],\n  outfit: [\n    { id: 'nexus',  name: 'Nexus',  hex: '#5b6cff' },\n    { id: 'ember',  name: 'Ember',  hex: '#e2542c' },\n    { id: 'moss',   name: 'Moss',   hex: '#3f9c53' },\n    { id: 'frost',  name: 'Frost',  hex: '#3aa7d6' },\n    { id: 'void',   name: 'Void',   hex: '#2b2f3d' },\n    { id: 'solar',  name: 'Solar',  hex: '#e0b32a' },\n    { id: 'orchid', name: 'Orchid', hex: '#a34ec9' },\n    { id: 'rose',   name: 'Rose',   hex: '#d9557d' },\n  ],\n  accessory: [\n    { id: 'none',    name: 'None' },\n    { id: 'visor',   name: 'Visor' },\n    { id: 'band',    name: 'Band' },\n    { id: 'goggles', name: 'Goggles' },\n    { id: 'cans',    name: 'Headset' },\n    { id: 'halo',    name: 'Halo' },\n  ],\n  eyes: [\n    { id: 'resolve', name: 'Resolve' },\n    { id: 'bright',  name: 'Bright' },\n    { id: 'calm',    name: 'Calm' },\n    { id: 'glitch',  name: 'Glitch' },\n  ],\n};\n\n/** Default avatar used until the player customises. */\nexport const DEFAULT_TAMER = {\n  skin: 'sand',\n  hairStyle: 'spike',\n  hairColor: 'ink',\n  outfit: 'nexus',\n  accessory: 'visor',\n  eyes: 'resolve',\n};\n\n/** Look up a palette entry, falling back to the first option. */\nfunction pick(group, id) {\n  return TAMER_OPTIONS[group].find((o) => o.id === id) || TAMER_OPTIONS[group][0];\n}\n\n/**\n * Render a Tamer portrait as inline SVG.\n *\n * @param {object} [config] Avatar config (see TAMER_OPTIONS).\n * @param {object} [opts]\n * @param {number} [opts.size=140] Rendered size in px.\n * @param {'idle'|'happy'|'determined'|'wink'} [opts.mood]\n * @param {boolean} [opts.animate=true] Blink + float animations.\n * @param {boolean} [opts.frame=false] Draw the circular badge background.\n * @returns {string} SVG markup.\n */\nexport function tamerAvatar(config = DEFAULT_TAMER, { size = 140, mood = 'idle', animate = true, frame = true } = {}) {\n  const skin = pick('skin', config.skin).hex;\n  const hair = pick('hairColor', config.hairColor).hex;\n  const outfit = pick('outfit', config.outfit).hex;\n  const style = pick('hairStyle', config.hairStyle).id;\n  const accessory = pick('accessory', config.accessory).id;\n  const eyes = pick('eyes', config.eyes).id;\n\n  const id = `av${++avatarCounter}`;\n  const skinDark = shade(skin, -18);\n  const hairDark = shade(hair, -22);\n  const hairLight = shade(hair, 22);\n  const outfitDark = shade(outfit, -26);\n  const outfitLight = shade(outfit, 26);\n\n  // Eye colour by personality.\n  const eyeColors = {\n    resolve: '#2f6fd0', bright: '#3fa97a', calm: '#7a6bd6', glitch: '#d63ea0',\n  };\n  const iris = eyeColors[eyes] || eyeColors.resolve;\n\n  return `<svg class=\"avatar${animate ? ' avatar--anim' : ''}\" width=\"${size}\" height=\"${size}\" viewBox=\"0 0 120 120\" \\\nrole=\"img\" aria-label=\"Tamer portrait\" xmlns=\"http://www.w3.org/2000/svg\">\\\n<defs>\\\n<linearGradient id=\"bg${id}\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"${shade(outfit, 34)}\"/>\\\n<stop offset=\"100%\" stop-color=\"${shade(outfit, -34)}\"/>\\\n<\/linearGradient>\\\n<linearGradient id=\"skin${id}\" x1=\"0.3\" y1=\"0\" x2=\"0.7\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"${shade(skin, 14)}\"/>\\\n<stop offset=\"70%\" stop-color=\"${skin}\"/>\\\n<stop offset=\"100%\" stop-color=\"${skinDark}\"/>\\\n<\/linearGradient>\\\n<linearGradient id=\"hair${id}\" x1=\"0.2\" y1=\"0\" x2=\"0.8\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"${hairLight}\"/>\\\n<stop offset=\"60%\" stop-color=\"${hair}\"/>\\\n<stop offset=\"100%\" stop-color=\"${hairDark}\"/>\\\n<\/linearGradient>\\\n<linearGradient id=\"cloth${id}\" x1=\"0\" y1=\"0\" x2=\"0.6\" y2=\"1\">\\\n<stop offset=\"0%\" stop-color=\"${outfitLight}\"/>\\\n<stop offset=\"55%\" stop-color=\"${outfit}\"/>\\\n<stop offset=\"100%\" stop-color=\"${outfitDark}\"/>\\\n<\/linearGradient>\\\n<clipPath id=\"clip${id}\"><circle cx=\"60\" cy=\"60\" r=\"58\"/><\/clipPath>\\\n<\/defs>\\\n<g clip-path=\"url(#clip${id})\">\\\n${frame ? `<circle cx=\"60\" cy=\"60\" r=\"58\" fill=\"url(#bg${id})\"/>` : ''}\\\n${frame ? `<circle cx=\"60\" cy=\"60\" r=\"58\" fill=\"none\" stroke=\"#ffffff\" stroke-opacity=\"0.16\" stroke-width=\"6\"/>` : ''}\\\n${frame ? `<circle cx=\"42\" cy=\"34\" r=\"30\" fill=\"#fff\" opacity=\"0.10\"/>` : ''}\\\n<g class=\"avatar__body\">\\\n${hairBack(style, hair, hairDark, id)}\\\n<path d=\"M14 120 q6 -30 46 -30 q40 0 46 30 z\" fill=\"url(#cloth${id})\"/>\\\n<path d=\"M46 90 l14 16 l14 -16 l-6 -4 h-16 z\" fill=\"${shade(skin, 6)}\"/>\\\n<path d=\"M40 92 q20 16 40 0 l6 6 q-26 20 -52 0 z\" fill=\"${outfitLight}\" opacity=\"0.85\"/>\\\n<rect x=\"52\" y=\"86\" width=\"16\" height=\"12\" rx=\"5\" fill=\"url(#skin${id})\"/>\\\n<ellipse cx=\"60\" cy=\"60\" rx=\"26\" ry=\"29\" fill=\"url(#skin${id})\"/>\\\n<ellipse cx=\"38\" cy=\"62\" rx=\"5\" ry=\"7\" fill=\"${skinDark}\"/>\\\n<ellipse cx=\"82\" cy=\"62\" rx=\"5\" ry=\"7\" fill=\"${skinDark}\"/>\\\n${hairFront(style, hair, hairLight, hairDark, id)}\\\n${eyesGroup(iris, mood, eyes)}\\\n<path d=\"M54 70 q6 4 12 0\" stroke=\"${shade(skin, -40)}\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.7\"/>\\\n${mouth(mood)}\\\n<ellipse cx=\"45\" cy=\"70\" rx=\"6\" ry=\"3.4\" fill=\"#ff7d9c\" opacity=\"0.35\"/>\\\n<ellipse cx=\"75\" cy=\"70\" rx=\"6\" ry=\"3.4\" fill=\"#ff7d9c\" opacity=\"0.35\"/>\\\n${accessoryLayer(accessory, outfit, outfitLight)}\\\n<\/g>\\\n<\/g>\\\n<\/svg>`;\n}\n\n/* ------------------------------------------------------------------- parts */\n\nfunction hairBack(style, hair, hairDark, id) {\n  const fill = `url(#hair${id})`;\n  switch (style) {\n    case 'long':\n      return `<path d=\"M28 66 q-6 34 8 54 h48 q14 -20 8 -54 z\" fill=\"${fill}\"/>`;\n    case 'ponytail':\n      return `<path d=\"M84 44 q22 6 18 34 q-4 22 -20 20 q10 -22 2 -54 z\" fill=\"${fill}\"/>\n              <circle cx=\"86\" cy=\"46\" r=\"7\" fill=\"${hairDark}\"/>`;\n    case 'afro':\n      return `<circle cx=\"60\" cy=\"46\" r=\"34\" fill=\"${fill}\"/>`;\n    case 'braid':\n      return `<path d=\"M40 58 q-10 30 4 62 h14 q-10 -32 0 -62 z\" fill=\"${fill}\"/>`;\n    default:\n      return '';\n  }\n}\n\nfunction hairFront(style, hair, hairLight, hairDark, id) {\n  const fill = `url(#hair${id})`;\n  switch (style) {\n    case 'spike':\n      return `<path d=\"M32 52 q4 -34 28 -34 q26 0 28 34 q-8 -14 -18 -8 q-4 -12 -12 -4 q-8 -10 -14 4 q-8 -6 -12 8 z\" fill=\"${fill}\"/>\n              <path d=\"M40 40 l4 -16 l8 12 z\" fill=\"${hairLight}\" opacity=\"0.75\"/>`;\n    case 'bob':\n      return `<path d=\"M30 54 q0 -36 30 -36 q30 0 30 36 q-6 -10 -14 -12 l-4 22 q-12 8 -24 0 l-4 -22 q-10 2 -14 12 z\" fill=\"${fill}\"/>`;\n    case 'long':\n      return `<path d=\"M30 54 q2 -36 30 -36 q28 0 30 36 q-10 -14 -16 -14 l-4 26 q-10 8 -20 0 l-4 -26 q-8 0 -16 14 z\" fill=\"${fill}\"/>`;\n    case 'ponytail':\n      return `<path d=\"M32 52 q6 -34 28 -34 q24 0 26 32 q-12 -12 -20 -8 q-10 -10 -18 2 q-10 -4 -16 8 z\" fill=\"${fill}\"/>`;\n    case 'afro':\n      return `<circle cx=\"60\" cy=\"46\" r=\"30\" fill=\"${fill}\"/>\n              <circle cx=\"46\" cy=\"34\" r=\"9\" fill=\"${hairLight}\" opacity=\"0.5\"/>\n              <circle cx=\"72\" cy=\"38\" r=\"7\" fill=\"${hairLight}\" opacity=\"0.35\"/>`;\n    case 'braid':\n      return `<path d=\"M32 52 q4 -32 28 -32 q24 0 26 32 q-12 -12 -22 -10 q-8 -8 -16 2 q-10 -2 -16 8 z\" fill=\"${fill}\"/>\n              <path d=\"M34 54 q-6 10 -2 20\" stroke=\"${hairDark}\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    case 'crop':\n      return `<path d=\"M33 50 q3 -28 27 -28 q24 0 27 28 q-14 -8 -27 -8 q-13 0 -27 8 z\" fill=\"${fill}\"/>`;\n    case 'mohawk':\n      return `<path d=\"M46 44 q14 -34 28 0 q-6 -6 -14 -6 q-8 0 -14 6 z\" fill=\"${fill}\"/>\n              <path d=\"M36 52 q2 -22 8 -26\" stroke=\"${hairDark}\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/>\n              <path d=\"M84 52 q-2 -22 -8 -26\" stroke=\"${hairDark}\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    default:\n      return `<path d=\"M32 52 q4 -32 28 -32 q24 0 28 32 q-14 -10 -28 -10 q-14 0 -28 10 z\" fill=\"${fill}\"/>`;\n  }\n}\n\nfunction eyesGroup(iris, mood, personality) {\n  const wink = mood === 'wink';\n  const left = wink\n    ? `<path d=\"M44 58 q6 -6 12 0\" stroke=\"#2b2f3d\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>`\n    : eye(48, 58, iris, 5.6, personality);\n  const right = eye(72, 58, iris, 5.6, personality);\n  const browY = mood === 'determined' ? 44 : 47;\n  const tilt = mood === 'determined' ? 3 : 0;\n  return `<g class=\"avatar__eyes\">\n    ${left}${right}\n    <path d=\"M41 ${browY + tilt} q7 -3 13 0\" stroke=\"#2b2f3d\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n    <path d=\"M66 ${browY} q7 -3 13 ${tilt}\" stroke=\"#2b2f3d\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <\/g>`;\n}\n\nfunction eye(cx, cy, iris, r, personality) {\n  const glitch = personality === 'glitch';\n  return `<ellipse cx=\"${cx}\" cy=\"${cy}\" rx=\"${r}\" ry=\"${r * 1.15}\" fill=\"#fff\"/>\n  <circle cx=\"${cx + 0.6}\" cy=\"${cy + 0.4}\" r=\"${r * 0.62}\" fill=\"${iris}\"/>\n  <circle cx=\"${cx + 0.6}\" cy=\"${cy + 0.2}\" r=\"${r * 0.3}\" fill=\"#10131c\"/>\n  <circle cx=\"${cx - 1.6}\" cy=\"${cy - 1.8}\" r=\"${r * 0.26}\" fill=\"#fff\" opacity=\"0.95\"/>\n  ${glitch ? `<rect x=\"${cx - r}\" y=\"${cy - r * 0.2}\" width=\"${r * 2}\" height=\"1.6\" fill=\"#fff\" opacity=\"0.6\"/>` : ''}`;\n}\n\nfunction mouth(mood) {\n  switch (mood) {\n    case 'happy':\n      return `<path d=\"M50 76 q10 10 20 0 q-10 5 -20 0 z\" fill=\"#8c3a4a\"/>\n              <path d=\"M50 76 q10 10 20 0\" stroke=\"#6d2b39\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    case 'determined':\n      return `<path d=\"M52 78 q8 4 16 -2\" stroke=\"#7d3543\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    case 'wink':\n      return `<path d=\"M50 76 q10 9 20 -2\" stroke=\"#7d3543\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>`;\n    default:\n      return `<path d=\"M52 77 q8 6 16 0\" stroke=\"#7d3543\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>`;\n  }\n}\n\nfunction accessoryLayer(accessory, outfit, outfitLight) {\n  switch (accessory) {\n    case 'visor':\n      return `<path d=\"M34 52 h52 v13 h-52 z\" rx=\"6\" fill=\"#0e1424\" opacity=\"0.9\"/>\n              <path d=\"M36 55 h48 v4 h-48 z\" fill=\"${outfitLight}\" opacity=\"0.85\"/>\n              <circle cx=\"38\" cy=\"52\" r=\"4\" fill=\"${outfit}\"/>\n              <circle cx=\"82\" cy=\"52\" r=\"4\" fill=\"${outfit}\"/>`;\n    case 'band':\n      return `<path d=\"M31 50 q29 -12 58 0 v9 q-29 -10 -58 0 z\" fill=\"${outfit}\"/>\n              <path d=\"M31 50 q29 -12 58 0\" stroke=\"${outfitLight}\" stroke-width=\"2\" fill=\"none\"/>`;\n    case 'goggles':\n      return `<circle cx=\"48\" cy=\"56\" r=\"10\" fill=\"none\" stroke=\"${outfitLight}\" stroke-width=\"3.4\"/>\n              <circle cx=\"72\" cy=\"56\" r=\"10\" fill=\"none\" stroke=\"${outfitLight}\" stroke-width=\"3.4\"/>\n              <circle cx=\"48\" cy=\"56\" r=\"7.4\" fill=\"#7fdcff\" opacity=\"0.45\"/>\n              <circle cx=\"72\" cy=\"56\" r=\"7.4\" fill=\"#7fdcff\" opacity=\"0.45\"/>\n              <path d=\"M58 56 h4\" stroke=\"${outfitLight}\" stroke-width=\"3\"/>`;\n    case 'cans':\n      return `<path d=\"M28 56 q0 -30 32 -30 q32 0 32 30\" fill=\"none\" stroke=\"${outfit}\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n              <rect x=\"24\" y=\"50\" width=\"12\" height=\"18\" rx=\"6\" fill=\"${outfitLight}\"/>\n              <rect x=\"84\" y=\"50\" width=\"12\" height=\"18\" rx=\"6\" fill=\"${outfitLight}\"/>\n              <path d=\"M92 62 q8 4 6 12\" stroke=\"${outfitLight}\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>\n              <circle cx=\"99\" cy=\"77\" r=\"3.4\" fill=\"${outfitLight}\"/>`;\n    case 'halo':\n      return `<ellipse cx=\"60\" cy=\"24\" rx=\"20\" ry=\"6\" fill=\"none\" stroke=\"#ffe27a\" stroke-width=\"3.4\" opacity=\"0.95\"/>\n              <ellipse cx=\"60\" cy=\"24\" rx=\"20\" ry=\"6\" fill=\"none\" stroke=\"#fff6c9\" stroke-width=\"1.2\" opacity=\"0.8\"/>`;\n    default:\n      return '';\n  }\n}\n\n/* ------------------------------------------------------------------ utils */\n\n/** Shade a hex colour by amount (-100…100). */\nfunction shade(hex, amount) {\n  const s = String(hex).replace('#', '');\n  const full = s.length === 3 ? s.split('').map((c) => c + c).join('') : s;\n  const target = amount >= 0 ? 255 : 0;\n  const ratio = Math.abs(amount) / 100;\n  const rgb = [0, 2, 4].map((i) => {\n    const v = parseInt(full.slice(i, i + 2), 16);\n    return Math.round(v + (target - v) * ratio);\n  });\n  return `#${rgb.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('')}`;\n}\n\n/**\n * Deterministic random avatar (used for the \"Surprise me\" button).\n * @param {() => number} rand\n */\nexport function randomTamer(rand = Math.random) {\n  const pickOne = (arr) => arr[Math.floor(rand() * arr.length)].id;\n  return {\n    skin: pickOne(TAMER_OPTIONS.skin),\n    hairStyle: pickOne(TAMER_OPTIONS.hairStyle),\n    hairColor: pickOne(TAMER_OPTIONS.hairColor),\n    outfit: pickOne(TAMER_OPTIONS.outfit),\n    accessory: pickOne(TAMER_OPTIONS.accessory),\n    eyes: pickOne(TAMER_OPTIONS.eyes),\n  };\n}\n\n/** Count of possible combinations (shown in the creator UI). */\nexport function combinationCount() {\n  return Object.values(TAMER_OPTIONS).reduce((n, group) => n * group.length, 1);\n}\n"},{"key":"src/ui/components.js","code":"/**\n * components.js — Shared presentational components.\n *\n * Screens are composed from these primitives so the visual language stays\n * consistent and each screen file only contains its own logic. Everything here\n * is a pure DOM factory: no global state is mutated except the toast queue and\n * the modal stack (both of which are UI-local).\n *\n * @module ui/components\n */\n\nimport { h, clear, renderInto, num, pct } from '«src/ui/dom.js»';\nimport { sprite, portrait } from '«src/ui/sprite.js»';\nimport { tamerAvatar } from '«src/ui/tamerAvatar.js»';\nimport { TYPES } from '«src/domain/types.js»';\nimport { getSpecies, STAGE_ORDER } from '«src/domain/species.js»';\nimport { maxHpOf, statsFor, displayName, healthState, corePotential, hpRatio } from '«src/domain/creature.js»';\nimport { bondTier } from '«src/domain/progression.js»';\nimport { STATUSES } from '«src/domain/moves.js»';\nimport * as state from '«src/core/state.js»';\nimport { on, emit, EVENTS } from '«src/core/bus.js»';\nimport { sfx } from '«src/core/sfx.js»';\nimport { navigate, activePath } from '«src/core/router.js»';\n\n/* ------------------------------------------------------------------ toasts */\n\nlet toastRoot = null;\nlet syncLabel = 'Local only';\nlet syncKind = 'idle';\n\n/** Wire global UI listeners. Called once from main.js. */\nexport function initUi() {\n  toastRoot = document.getElementById('toast-root');\n  on(EVENTS.TOAST, ({ message, kind }) => toast(message, kind));\n  on(EVENTS.SYNC_STATUS, ({ label, kind }) => { syncLabel = label; syncKind = kind; });\n}\n\n/**\n * Show a transient toast.\n * @param {string} message\n * @param {'info'|'success'|'error'|'warn'} [kind]\n * @param {number} [ms]\n */\nexport function toast(message, kind = 'info', ms = 2800) {\n  if (!toastRoot) toastRoot = document.getElementById('toast-root');\n  if (!toastRoot) return;\n  const el = h(`div.toast.toast--${kind}`, { role: 'status' }, message);\n  toastRoot.appendChild(el);\n  requestAnimationFrame(() => el.classList.add('is-in'));\n  setTimeout(() => {\n    el.classList.remove('is-in');\n    setTimeout(() => el.remove(), 260);\n  }, ms);\n}\n\n/* ------------------------------------------------------------------ modals */\n\nlet modalStack = 0;\n\n/**\n * Open a modal dialog.\n *\n * @param {object} o\n * @param {string} o.title\n * @param {Node|Node[]} o.body\n * @param {{label:string, kind?:string, value?:any, onClick?:Function}[]} [o.actions]\n * @param {'sm'|'md'|'lg'} [o.size]\n * @param {boolean} [o.dismissible] Allow backdrop/Esc close (default true).\n * @returns {{close:(result?:any)=>void, el:HTMLElement}}\n */\nexport function modal({ title, body, actions = [], size = 'md', dismissible = true }) {\n  const root = document.getElementById('modal-root');\n  let closed = false;\n\n  const panel = h(`div.modal__panel.modal__panel--${size}`, { role: 'dialog', 'aria-modal': 'true', 'aria-label': title });\n  panel.appendChild(h('h2.modal__title', title));\n\n  const bodyEl = h('div.modal__body');\n  [].concat(body).forEach((n) => n && bodyEl.appendChild(n));\n  panel.appendChild(bodyEl);\n\n  const actionsEl = h('div.modal__actions');\n  for (const action of actions) {\n    const btn = h(`button.btn${action.kind ? `.btn--${action.kind}` : ''}`, {\n      type: 'button',\n      onclick: () => {\n        if (closed) return;\n        const result = action.onClick ? action.onClick() : action.value;\n        // A handler returning exactly `false` keeps the modal open (validation).\n        if (result !== false) close(result);\n      },\n    }, action.label);\n    actionsEl.appendChild(btn);\n  }\n  if (!actions.length) {\n    actionsEl.appendChild(h('button.btn.btn--primary', { type: 'button', onclick: () => close() }, 'Close'));\n  }\n  panel.appendChild(actionsEl);\n\n  const backdrop = h('div.modal__backdrop', {\n    onclick: (e) => { if (dismissible && e.target === backdrop) close(); },\n  }, panel);\n\n  const onKey = (e) => {\n    if (e.key === 'Escape' && dismissible) close();\n  };\n\n  function close(result) {\n    if (closed) return;\n    closed = true;\n    document.removeEventListener('keydown', onKey);\n    backdrop.classList.remove('is-in');\n    setTimeout(() => backdrop.remove(), 180);\n    modalStack = Math.max(0, modalStack - 1);\n    if (typeof result !== 'undefined') emit('modal:closed', result);\n  }\n\n  document.addEventListener('keydown', onKey);\n  root.appendChild(backdrop);\n  modalStack += 1;\n  requestAnimationFrame(() => backdrop.classList.add('is-in'));\n  (panel.querySelector('button') || panel).focus?.();\n  return { close, el: panel };\n}\n\n/**\n * Promise-based confirmation dialog.\n * @returns {Promise<boolean>}\n */\nexport function confirmDialog({ title, message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {\n  return new Promise((resolve) => {\n    modal({\n      title,\n      body: h('p.modal__text', message),\n      size: 'sm',\n      actions: [\n        { label: cancelLabel, kind: 'ghost', onClick: () => { resolve(false); } },\n        { label: confirmLabel, kind: danger ? 'danger' : 'primary', onClick: () => { resolve(true); } },\n      ],\n    });\n  });\n}\n\n/**\n * Promise-based text prompt.\n * @returns {Promise<string|null>} Entered value, or null when cancelled.\n */\nexport function promptDialog({ title, message, value = '', placeholder = '', maxLength = 18, confirmLabel = 'Save' }) {\n  return new Promise((resolve) => {\n    const input = h('input.input', { type: 'text', value, placeholder, maxLength, spellcheck: 'false' });\n    modal({\n      title,\n      size: 'sm',\n      body: [h('p.modal__text', message), input],\n      actions: [\n        { label: 'Cancel', kind: 'ghost', onClick: () => resolve(null) },\n        { label: confirmLabel, kind: 'primary', onClick: () => resolve(input.value.trim() || null) },\n      ],\n    });\n    setTimeout(() => input.focus(), 40);\n  });\n}\n\n/* ------------------------------------------------------------------- chips */\n\n/** Elemental type chip. */\nexport function typeChip(typeId, { small = false } = {}) {\n  const t = TYPES[typeId] || TYPES.null;\n  return h(`span.chip.chip--type${small ? '.chip--sm' : ''}`, {\n    dataset: { type: typeId },\n    style: { '--chip': t.color },\n    title: `${t.name} type`,\n  }, `${t.glyph} ${t.name}`);\n}\n\n/** Row of type chips. */\nexport function typeRow(types, opts) {\n  return h('div.chip-row', types.map((t) => typeChip(t, opts)));\n}\n\n/** Stage / status badge. */\nexport function badge(text, { kind = 'neutral', title = '' } = {}) {\n  return h(`span.badge.badge--${kind}`, { title }, text);\n}\n\n/** Status condition badge, or null when healthy. */\nexport function statusBadge(status) {\n  if (!status || !STATUSES[status]) return null;\n  return h('span.badge.badge--status', {\n    style: { '--chip': STATUSES[status].color },\n    title: STATUSES[status].note,\n  }, STATUSES[status].name);\n}\n\n/* -------------------------------------------------------------------- bars */\n\n/**\n * Labelled stat bar with an animated fill and tabular value read-out.\n * The fill animates from 0 on first paint so stats always feel alive.\n */\nexport function statBar(label, value, max, { color = 'var(--accent)', showValue = true, animate = true } = {}) {\n  const numeric = typeof value === 'number' ? value : parseFloat(value) || 0;\n  const ceiling = max || Math.max(numeric, 1);\n  const fill = h('div.bar__fill', { style: { background: color, width: animate ? '0%' : `${pct(numeric, ceiling)}%` } });\n  if (animate) {\n    requestAnimationFrame(() => { fill.style.width = `${pct(numeric, ceiling)}%`; });\n  }\n  return h('div.stat-row', [\n    h('div.stat-row__head', [\n      h('span.stat-row__label', label),\n      showValue ? h('span.stat-row__value', String(value)) : null,\n    ]),\n    h('div.bar.bar--stat', fill),\n  ]);\n}\n\n/**\n * Health bar with a \"chip\" ghost layer.\n *\n * The ghost bar holds the previous HP value for a moment before collapsing to\n * the real value, so the player sees *how much* damage was just taken — a\n * genre-standard readability trick that makes damage legible at a glance.\n *\n * @param {object} creature Anything with `hp` (plus a species/base for max HP).\n * @param {object} [opts]\n * @param {boolean} [opts.showNumbers]\n * @param {boolean} [opts.compact]\n * @param {number} [opts.ghostFrom] Previous HP; renders the trailing damage bar.\n * @param {number} [opts.maxHp] Override max HP (avoids recomputing in hot paths).\n */\nexport function hpBar(creature, { showNumbers = true, compact = false, ghostFrom = null, maxHp = null } = {}) {\n  const max = maxHp ?? maxHpOf(creature);\n  const hp = Math.max(0, Math.min(max, creature.hp));\n  const st = healthState(creature);\n  const width = pct(hp, max);\n\n  const fill = h(`div.hp__fill.hp__fill--${st}`, { style: { width: `${width}%` } });\n  const track = h('div.hp__track', fill);\n\n  if (ghostFrom != null && ghostFrom > hp) {\n    const ghost = h('div.hp__ghost', { style: { width: `${pct(Math.min(ghostFrom, max), max)}%` } });\n    track.insertBefore(ghost, fill);\n    // Collapse the ghost after the eye has registered the delta.\n    setTimeout(() => { ghost.style.width = `${width}%`; }, 260);\n  }\n\n  const numbers = showNumbers\n    ? h('div.hp__numbers', h('span.hp__value', `${Math.max(0, Math.round(hp))}`), h('span.hp__sep', ' / '), h('span.hp__max', `${max}`))\n    : null;\n\n  return h(`div.hp${compact ? '.hp--compact' : ''}${st === 'critical' ? '.hp--pulse' : ''}`, [track, numbers]);\n}\n\n/**\n * Smoothly count an element's text from one number to another.\n * @param {HTMLElement} el\n * @param {number} from\n * @param {number} to\n * @param {number} [ms]\n */\nexport function animateNumber(el, from, to, ms = 420) {\n  if (!el) return;\n  const start = performance.now();\n  const delta = to - from;\n  if (!delta) { el.textContent = String(to); return; }\n  function frame(now) {\n    const t = Math.min(1, (now - start) / ms);\n    const eased = 1 - Math.pow(1 - t, 3);\n    el.textContent = String(Math.round(from + delta * eased));\n    if (t < 1) requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n}\n\n/**\n * Spawn floating combat text (damage, crits, healing) above a target.\n * @param {HTMLElement} host Positioned container (the combat card).\n * @param {string} text\n * @param {'damage'|'crit'|'heal'|'info'|'miss'|'status'} [kind]\n */\nexport function floatText(host, text, kind = 'damage') {\n  if (!host) return;\n  // Slight horizontal drift so stacked floaters stay readable.\n  const drift = Math.round((Math.random() * 2 - 1) * 14);\n  const el = h(`div.floater.floater--${kind}`, { style: { '--drift': `${drift}px` } }, text);\n  host.appendChild(el);\n  requestAnimationFrame(() => el.classList.add('is-up'));\n  setTimeout(() => el.remove(), 1150);\n}\n\n/** Shake + flash an element (impacts, capture wobbles). */\nexport function impact(el, kind = 'hit') {\n  if (!el) return;\n  el.classList.remove(`is-${kind}`);\n  void el.offsetWidth; // force reflow so the animation can restart\n  el.classList.add(`is-${kind}`);\n  setTimeout(() => el.classList.remove(`is-${kind}`), 620);\n}\n\n/** XP bar for a creature. */\nexport function xpBar(creature) {\n  return h('div.bar.bar--xp', h('div.bar__fill.bar__fill--xp', {\n    style: { width: `${pct(creature.xp, Math.max(1, xpNeeded(creature)))}%` },\n  }));\n}\n\n/** Local helper: XP required for the next level (imported lazily to avoid cycles). */\nfunction xpNeeded(creature) {\n  // Imported from progression via a cached reference set by creature module.\n  return Math.max(1, Math.pow(creature.level + 1, 3) - Math.pow(creature.level, 3));\n}\n\n/* ----------------------------------------------------------------- sprites */\n\n/** Inline-SVG creature sprite element. */\nexport function spriteEl(speciesId, { size = 96, shiny = false, mood = 'idle', flip = 'right', animate = true } = {}) {\n  const art = getSpecies(speciesId).art;\n  return h('div.sprite-wrap', {\n    html: sprite(art, { size, shiny, mood, flip, animate }),\n    style: { width: `${size}px`, height: `${size}px` },\n  });\n}\n\n/** Large framed portrait used by the starter showcase. */\nexport function portraitEl(speciesId, { size = 220, shiny = false, mood = 'idle', flip = 'right' } = {}) {\n  const art = getSpecies(speciesId).art;\n  return h('div.portrait-wrap', {\n    html: portrait(art, { size, shiny, mood, flip }),\n  });\n}\n\n/** Circular tamer portrait from a saved avatar config. */\nexport function tamerEl(config, { size = 64, mood = 'idle' } = {}) {\n  return h('div.avatar-wrap', {\n    html: tamerAvatar(config, { size, mood }),\n    style: { width: `${size}px`, height: `${size}px` },\n  });\n}\n\n/* ------------------------------------------------------------------- cards */\n\n/** Titled surface panel. */\nexport function card(title, ...children) {\n  const el = h('section.card.card--pad');\n  if (title) el.appendChild(h('h2.card__title', title));\n  children.flat().forEach((c) => c && el.appendChild(c));\n  return el;\n}\n\n/** Empty-state placeholder with an optional action. */\nexport function emptyState(text, action = null) {\n  return h('div.empty', [h('p.empty__text', text), action]);\n}\n\n/**\n * Creature summary card used across Ranch, Lab and team pickers.\n *\n * @param {object} creature\n * @param {object} [opts]\n * @param {() => void} [opts.onClick]\n * @param {Node[]} [opts.actions] Buttons rendered in the footer.\n * @param {boolean} [opts.compact] Hide stats rows.\n * @param {boolean} [opts.selected] Highlight (team/selected state).\n * @param {string} [opts.note] Extra line under the name.\n */\nexport function creatureCard(creature, { onClick, actions = [], compact = false, selected = false, note = null } = {}) {\n  const species = getSpecies(creature.speciesId);\n  const pot = corePotential(creature);\n  const tier = bondTier(creature.bond);\n\n  const el = h(`div.creature-card${selected ? '.is-selected' : ''}${onClick ? '.is-clickable' : ''}`, {\n    onclick: onClick ? () => { sfx.select(); onClick(); } : null,\n  }, [\n    h('div.creature-card__top', [\n      spriteEl(creature.speciesId, { size: compact ? 56 : 76, shiny: creature.shiny, flip: 'right' }),\n      h('div.creature-card__id', [\n        h('div.creature-card__name', [\n          displayName(creature),\n          creature.shiny ? badge('Glitch', { kind: 'glitch', title: 'Rare colour variant (1 in 512)' }) : null,\n        ]),\n        h('div.creature-card__meta', `Lv ${creature.level} · ${species.name}`),\n        typeRow(species.types, { small: true }),\n      ]),\n    ]),\n    hpBar(creature),\n    compact ? null : h('div.creature-card__stats', [\n      statBar('ATK', statsFor(creature).atk, 200, { color: '#ff6b6b' }),\n      statBar('DEF', statsFor(creature).def, 200, { color: '#4fd67c' }),\n      statBar('SPD', statsFor(creature).spd, 200, { color: '#3db4ff' }),\n    ]),\n    h('div.creature-card__footer', [\n      h('span.pill', { title: 'Core potential (IVs)' }, `Core ${pot.total}/${pot.max}`),\n      h('span.pill', { style: { color: tier.color }, title: 'Bond' }, `${tier.label} ${creature.bond}`),\n    ]),\n    note ? h('div.creature-card__note', note) : null,\n    actions.length ? h('div.creature-card__actions', actions) : null,\n  ]);\n  return el;\n}\n\n/* ------------------------------------------------------------------ chrome */\n\n/** Top application bar: brand, tamer, currency, sync state. */\nexport function renderTopbar(el) {\n  const s = state.getState();\n  const strongest = state.strongestLevel();\n  renderInto(el,\n    h('div.topbar__brand', { onclick: () => navigate('/') }, [\n      h('span.topbar__mark', { html: logoSvg(20) }),\n      h('span.topbar__name', 'DigiPoke'),\n    ]),\n    h('div.topbar__stats', [\n      h('span.pill.pill--shards', { title: 'Data Shards' }, `◈ ${num(s.profile.shards)}`),\n      h('span.pill', { title: 'Highest creature level' }, `Lv ${strongest}`),\n      h(`span.pill.pill--sync.is-${syncKind}`, { title: 'Sync status' }, syncLabel),\n    ]),\n    h('button.icon-btn', {\n      type: 'button', title: 'Settings', 'aria-label': 'Settings',\n      onclick: () => { sfx.click(); navigate('/settings'); },\n    }, '⚙'),\n  );\n}\n\n/** Bottom tab navigation (mobile-first, also used on desktop). */\nexport function renderTabbar(el) {\n  const tabs = [\n    { path: '/', label: 'Nexus', icon: '◈' },\n    { path: '/ranch', label: 'Ranch', icon: '❖' },\n    { path: '/explore', label: 'Explore', icon: '➤' },\n    { path: '/lab', label: 'Lab', icon: '⚗' },\n    { path: '/settings', label: 'Data', icon: '⚙' },\n  ];\n  const current = activePath();\n  renderInto(el, tabs.map((tab) => h(`button.tabbar__item${current === tab.path ? '.is-active' : ''}`, {\n    type: 'button',\n    onclick: () => {\n      sfx.click();\n      if (current === tab.path) return;\n      navigate(tab.path);\n    },\n  }, [\n    h('span.tabbar__icon', tab.icon),\n    h('span.tabbar__label', tab.label),\n  ])));\n}\n\n/** Inline brand mark (no external assets). */\nexport function logoSvg(size = 24) {\n  return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 32 32\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n    <defs><linearGradient id=\"lg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#7c5cff\"/><stop offset=\"100%\" stop-color=\"#23d5ff\"/>\n    <\/linearGradient><\/defs>\n    <circle cx=\"16\" cy=\"16\" r=\"14\" fill=\"url(#lg)\"/>\n    <path d=\"M16 5 L26 11 V21 L16 27 L6 21 V11 Z\" fill=\"none\" stroke=\"#0b1020\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/>\n    <circle cx=\"16\" cy=\"16\" r=\"4\" fill=\"#0b1020\"/>\n  <\/svg>`;\n}\n\n/* ------------------------------------------------------------------ misc */\n\n/** Section heading with an optional right-hand action. */\nexport function sectionHead(title, action = null) {\n  return h('div.section-head', [h('h3.section-head__title', title), action]);\n}\n\n/** Grid wrapper. */\nexport function grid(children, { cols = 'auto' } = {}) {\n  return h(`div.grid.grid--${cols}`, children.flat().filter(Boolean));\n}\n\n/** Format a relative time (\"3 minutes ago\"). */\nexport function timeAgo(iso) {\n  if (!iso) return 'never';\n  const diff = Date.now() - new Date(iso).getTime();\n  const mins = Math.floor(diff / 60000);\n  if (mins < 1) return 'just now';\n  if (mins < 60) return `${mins} min ago`;\n  const hours = Math.floor(mins / 60);\n  if (hours < 24) return `${hours} h ago`;\n  const days = Math.floor(hours / 24);\n  return days === 1 ? 'yesterday' : `${days} days ago`;\n}\n\n/** Re-export convenience used by several screens. */\nexport { num, pct, clear, renderInto, hpRatio, STAGE_ORDER, state };\n"},{"key":"src/sync/syncClient.js","code":"/**\n * syncClient.js — Optional cloud sync client (zero-knowledge).\n *\n * The server is a dumb blob store: it authenticates the player with a scrypt\n * hash and stores an opaque AES-GCM envelope it cannot open. Encryption keys\n * are derived in the browser with PBKDF2 and never transmitted, so a server\n * breach (or a malicious operator) yields ciphertext only.\n *\n * Conflict policy: last-write-wins on a monotonic revision counter, with the\n * server rejecting stale pushes (HTTP 409). The client resolves a 409 by\n * pulling the newer vault and letting the player choose (see settings.js).\n *\n * @module sync/syncClient\n */\n\nimport { emit, EVENTS } from '«src/core/bus.js»';\nimport * as state from '«src/core/state.js»';\nimport { deriveVaultKey, sealVault, openVault, verifyPassphrase } from '«src/core/crypto.js»';\nimport * as db from '«src/core/db.js»';\n\n/** Cached vault key for the session (never persisted). */\nlet vaultKey = null;\nlet vaultSalt = null;\n\n/**\n * Resolve the sync API base URL.\n * Order: explicit setting → sibling sandbox host (preview) → localhost.\n */\nexport function serverUrl() {\n  const configured = state.getState?.()?.settings?.serverUrl;\n  if (configured) return configured.replace(/\\/$/, '');\n  return defaultServerUrl();\n}\n\n/**\n * In the sandbox/IDE preview the PWA is served from `https://<port>-<id>.e2b.app`.\n * The API runs on port 4000 of the same sandbox, so we derive its origin.\n */\nexport function defaultServerUrl() {\n  const match = location.hostname.match(/^(\\d+)-(.*)$/);\n  if (match) return `${location.protocol}//4000-${match[2]}/v1`;\n  return `${location.protocol}//${location.hostname}:4000/v1`;\n}\n\n/** Status broadcast helper. */\nfunction status(label, kind = 'idle') {\n  emit(EVENTS.SYNC_STATUS, { label, kind });\n  return { label, kind };\n}\n\n/**\n * Low-level JSON request wrapper.\n * @throws {Error} with a human-readable message from the API.\n */\nasync function request(path, { method = 'GET', body = null, token = null, timeout = 12000 } = {}) {\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), timeout);\n  try {\n    const res = await fetch(`${serverUrl()}${path}`, {\n      method,\n      headers: {\n        'Content-Type': 'application/json',\n        ...(token ? { Authorization: `Bearer ${token}` } : {}),\n      },\n      body: body ? JSON.stringify(body) : undefined,\n      signal: controller.signal,\n    });\n\n    const text = await res.text();\n    let data = null;\n    try { data = text ? JSON.parse(text) : null; } catch { data = { error: text?.slice(0, 200) || 'Malformed response' }; }\n\n    if (!res.ok) {\n      const err = new Error(data?.error || `HTTP ${res.status}`);\n      err.status = res.status;\n      err.data = data;\n      throw err;\n    }\n    return data;\n  } catch (err) {\n    if (err.name === 'AbortError') throw new Error('Request timed out. Check the server URL.');\n    if (err instanceof TypeError) throw new Error('Cannot reach the sync server. Check the server URL and that the API is running.');\n    throw err;\n  } finally {\n    clearTimeout(timer);\n  }\n}\n\n/* ------------------------------------------------------------------- vault */\n\n/** Read the local vault record (salt + verifier), creating nothing. */\nexport async function readVaultRecord() {\n  if (vaultSalt) return vaultSalt;\n  vaultSalt = await db.kvGet('vault', null);\n  return vaultSalt;\n}\n\n/**\n * Derive and cache the vault key by prompting for the passphrase.\n *\n * @param {object} [opts]\n * @param {string} [opts.passphrase] Skip the prompt when already known.\n * @param {() => Promise<string|null>} [opts.prompt] Prompt implementation\n *        (injected so this module stays UI-free and testable).\n * @returns {Promise<CryptoKey|null>}\n */\nexport async function ensureVaultKey({ passphrase = null, prompt = null } = {}) {\n  if (vaultKey) return vaultKey;\n  const record = await readVaultRecord();\n  if (!record) throw new Error('No local vault found. Complete onboarding first.');\n\n  let secret = passphrase;\n  if (!secret) {\n    if (!prompt) throw new Error('A passphrase is required to unlock the vault.');\n    secret = await prompt();\n  }\n  if (!secret) return null;\n\n  const ok = await verifyPassphrase(secret, record.salt, record.verifier);\n  if (!ok) throw new Error('Incorrect passphrase.');\n\n  vaultKey = await deriveVaultKey(secret, record.salt, record.iterations);\n  return vaultKey;\n}\n\n/** Forget the cached key (logout / screen lock). */\nexport function forgetVaultKey() { vaultKey = null; }\n\n/**\n * Seed the cached key (used immediately after onboarding derives it, so the\n * first export/sync does not ask for the passphrase again in the same session).\n */\nexport function cacheVaultKey(key) { vaultKey = key; }\n\n/** True when an encrypted vault can be produced without prompting. */\nexport function hasCachedKey() { return !!vaultKey; }\n\n/* ------------------------------------------------------------------- API */\n\n/** Liveness probe used by the Settings screen. */\nexport async function health() {\n  return request('/health');\n}\n\n/**\n * Create a cloud account.\n * @param {string} email\n * @param {string} password\n */\nexport async function register(email, password) {\n  const res = await request('/auth/register', { method: 'POST', body: { email, password } });\n  state.setAccount({ email, token: res.token, vaultRev: res.vaultRev ?? 0 });\n  status('Registered', 'ok');\n  return res;\n}\n\n/** Log into an existing account. */\nexport async function login(email, password) {\n  const res = await request('/auth/login', { method: 'POST', body: { email, password } });\n  state.setAccount({ email, token: res.token, vaultRev: res.vaultRev ?? 0 });\n  status('Signed in', 'ok');\n  return res;\n}\n\n/** Push the current save file as an encrypted envelope. */\nexport async function push({ passphrase = null, prompt = null } = {}) {\n  const account = state.getState().account;\n  if (!account?.token) throw new Error('Sign in first.');\n  const key = await ensureVaultKey({ passphrase, prompt });\n  if (!key) return null;\n\n  status('Encrypting…', 'busy');\n  const sealed = await sealVault(key, state.exportPayload());\n  status('Uploading…', 'busy');\n  const res = await request('/vault', {\n    method: 'PUT',\n    token: account.token,\n    body: { vault: sealed, rev: account.vaultRev ?? 0 },\n  });\n  state.setAccount({ vaultRev: res.rev, lastSyncedAt: new Date().toISOString() });\n  status('Synced', 'ok');\n  return res;\n}\n\n/** Pull the remote envelope and decrypt it. Returns the parsed save file. */\nexport async function pull({ passphrase = null, prompt = null } = {}) {\n  const account = state.getState().account;\n  if (!account?.token) throw new Error('Sign in first.');\n  status('Downloading…', 'busy');\n  const res = await request('/vault', { token: account.token });\n  if (!res?.vault) return null;\n  const key = await ensureVaultKey({ passphrase, prompt });\n  if (!key) return null;\n  status('Decrypting…', 'busy');\n  const payload = await openVault(key, res.vault);\n  state.setAccount({ vaultRev: res.rev });\n  status('Downloaded', 'ok');\n  return payload;\n}\n\n/**\n * Two-way sync: pull, and if the remote is newer than our last known revision,\n * surface it for the player to accept; otherwise push.\n *\n * @returns {Promise<{action:'pushed'|'pulled'|'conflict'|'unchanged', remote?:object}>}\n */\nexport async function syncNow(opts = {}) {\n  const account = state.getState().account;\n  if (!account?.token) throw new Error('Sign in first.');\n  const res = await request('/vault', { token: account.token }).catch(() => null);\n  if (!res?.vault) {\n    await push(opts);\n    return { action: 'pushed' };\n  }\n  if ((res.rev ?? 0) > (account.vaultRev ?? 0)) {\n    status('Conflict', 'warn');\n    const key = await ensureVaultKey(opts);\n    const remote = key ? await openVault(key, res.vault) : null;\n    return { action: 'conflict', remote, rev: res.rev };\n  }\n  await push(opts);\n  return { action: 'pushed' };\n}\n\n/** Delete the remote account and vault. Local data is untouched. */\nexport async function deleteRemoteAccount() {\n  const account = state.getState().account;\n  if (!account?.token) return;\n  await request('/account', { method: 'DELETE', token: account.token });\n  state.clearAccount();\n  forgetVaultKey();\n  status('Local only', 'idle');\n}\n\n/** Sign out locally (keeps the remote account and data). */\nexport function signOut() {\n  state.clearAccount();\n  forgetVaultKey();\n  status('Local only', 'idle');\n}\n"},{"key":"src/ui/screens/onboarding.js","code":"/**\n * onboarding.js — The first five minutes.\n *\n * This screen is the single highest-leverage surface in DigiPoke: it is where a\n * player decides whether to stay. It is therefore built as a proper\n * title-sequence → character-creation → partner-selection flow rather than a\n * form:\n *\n *   0  SPLASH      Animated title, audio unlock, \"Press Start\"\n *   1  IDENTITY    Name + vault passphrase, with a live Tamer ID preview\n *   2  APPEARANCE  Full avatar creator (7×8×8×8×6×4 ≈ 86k combinations)\n *   3  PARTNER     Starter showcase: portraits, stats, lore, confirm\n *   4  LAUNCH      \"Digitising…\" cinematic, then hand-off to the Nexus\n *\n * No network call happens anywhere in this file. The passphrase derives an\n * AES-GCM vault key entirely on-device.\n *\n * @module ui/screens/onboarding\n */\n\nimport { h, renderInto } from '«src/ui/dom.js»';\nimport {\n  card, badge, toast, typeRow, statBar, portraitEl, tamerEl, spriteEl,\n  confirmDialog, sectionHead,\n} from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport * as db from '«src/core/db.js»';\nimport { deriveVaultKey, makeVerifier, newSalt } from '«src/core/crypto.js»';\nimport { sfx, unlockAudio, setSoundEnabled, setSfxVolume, setMusicVolume, startMusic, stopMusic } from '«src/core/sfx.js»';\nimport { TAMER_OPTIONS, DEFAULT_TAMER, randomTamer, combinationCount } from '«src/ui/tamerAvatar.js»';\nimport { sprite as spriteMarkup, portrait as portraitMarkup } from '«src/ui/sprite.js»';\nimport { STARTER_IDS, getSpecies, learnsetFor } from '«src/domain/species.js»';\nimport { statsFor, movesAtLevel } from '«src/domain/creature.js»';\nimport { getMove } from '«src/domain/moves.js»';\nimport { createRng } from '«src/core/rng.js»';\nimport { navigate } from '«src/core/router.js»';\n\n/** Wizard state, module-scoped so re-renders never lose input. */\nconst wizard = {\n  step: 0,\n  displayName: '',\n  passphrase: '',\n  confirm: '',\n  tamer: { ...DEFAULT_TAMER },\n  starter: STARTER_IDS[0],\n  showHelp: false,\n  error: '',\n};\n\n/** Timers owned by the launch cinematic, cleared on teardown. */\nlet cinematicTimers = [];\n\n/** Intervals owned by the cinematic (cleared separately — clearTimeout on an\n *  interval id is not something to rely on). */\nlet cinematicIntervals = [];\n\n/** Keyboard handler that lets the player skip the cinematic. */\nlet skipHandler = null;\n\n/** Reset the wizard (used when a profile is wiped). */\nexport function resetOnboarding() {\n  clearCinematic();\n  identityBusy = false;\n  previewTamer = null;\n  pendingFocus = null;\n  pendingSelector = null;\n  justChanged = false;\n  lastStep = null;\n  Object.assign(wizard, {\n    step: 0, displayName: '', passphrase: '', confirm: '',\n    tamer: { ...DEFAULT_TAMER }, starter: STARTER_IDS[0], showHelp: false, error: '',\n  });\n}\n\n/** Which step the wizard is on (router guard uses this). */\nexport function currentStep() { return wizard.step; }\n\nfunction clearCinematic() {\n  cinematicTimers.forEach(clearTimeout);\n  cinematicTimers = [];\n  cinematicIntervals.forEach(clearInterval);\n  cinematicIntervals = [];\n  if (skipHandler) {\n    document.removeEventListener('keydown', skipHandler);\n    skipHandler = null;\n  }\n}\n\n/** Advance to a step with a sound cue. */\nfunction goTo(step, sound = 'select') {\n  wizard.step = step;\n  // Leaving the identity step always releases the submit guard; otherwise\n  // Back → Continue would meet a dead button.\n  if (step !== 1) identityBusy = false;\n  sfx[sound]?.();\n  navigate('/onboarding');\n}\n\n/* ------------------------------------------------------------------- render */\n\n/**\n * Render the onboarding flow.\n * @param {HTMLElement} root\n */\nexport function render(root) {\n  const view = h('div.view.view--onboarding');\n  const steps = {\n    0: stepSplash,\n    1: stepIdentity,\n    2: stepAppearance,\n    3: stepStarter,\n    4: stepLaunch,\n  };\n  const step = steps[wizard.step] || stepSplash;\n  view.classList.add(`is-step-${wizard.step}`);\n  view.appendChild(step());\n  renderInto(root, view);\n\n  const entering = lastStep !== wizard.step;\n  lastStep = wizard.step;\n\n  // Focus management, but only on ENTRY. A re-render of the same step (the\n  // help box, a validation update) must never yank the caret out of the field\n  // the player is typing in.\n  if (entering && wizard.step === 1) setTimeout(() => document.querySelector('#tamer-name')?.focus(), 60);\n  // The title screen has exactly one affordance: put the keyboard on it.\n  if (entering && wizard.step === 0) setTimeout(() => document.querySelector('.splash__start')?.focus?.({ preventScroll: true }), 320);\n  if (pendingSelector) {\n    document.querySelector(pendingSelector)?.focus?.({ preventScroll: true });\n    pendingSelector = null;\n  }\n  if (pendingFocus) {\n    const [group, optId] = pendingFocus.split(':');\n    const el = document.querySelector(`.opt[data-group=\"${group}\"][data-opt=\"${optId}\"]`);\n    el?.focus?.({ preventScroll: true });\n    // jsdom (and some older engines) do not implement scrollIntoView.\n    if (typeof el?.scrollIntoView === 'function') {\n      try { el.scrollIntoView({ block: 'nearest' }); } catch { /* ignore */ }\n    }\n    pendingFocus = null;\n  }\n  if (justChanged) {\n    // Sparks fire once per accepted change, then the flag clears itself.\n    requestAnimationFrame(() => emitSparks());\n    setTimeout(() => { justChanged = false; }, 520);\n  }\n}\n\n/* -------------------------------------------------------------- 0. splash */\n\nfunction stepSplash() {\n  return h('div.splash', [\n    h('div.splash__sky'),\n    h('div.splash__beam', { 'aria-hidden': 'true' }),\n    h('div.splash__vignette', { 'aria-hidden': 'true' }),\n    h('div.splash__logo', { html: bigLogo() }),\n    h('h1.splash__title', 'DigiPoke'),\n    h('p.splash__tagline', 'Raise, battle and evolve digital life — entirely on your device.'),\n    // The starters are the promise of the game, so they get a pedestal each\n    // and their names — a title screen should introduce the cast, not just\n    // show a logo.\n    h('div.splash__creatures', STARTER_IDS.map((id, i) => {\n      const species = getSpecies(id);\n      return h(`div.splash__creature.splash__creature--${i}`, [\n        h('div.splash__creature-art', {\n          html: portraitMarkup(species.art, { size: 124, mood: 'idle', platform: true }),\n        }),\n        h('div.splash__creature-name', species.name),\n        h('div.splash__creature-type', species.types.join(' · ')),\n      ]);\n    })),\n    h('button.btn.btn--primary.btn--xl.splash__start.is-ready', {\n      type: 'button',\n      onclick: () => {\n        unlockAudio();\n        setSoundEnabled(true);\n        const s = state.isReady() ? state.getState() : null;\n        if (s?.settings) {\n          setSfxVolume(s.settings.sfxVolume ?? 0.7);\n          setMusicVolume(s.settings.musicVolume ?? 0.35);\n        }\n        sfx.boot();\n        startMusic('menu');\n        goTo(1, 'confirm');\n      },\n    }, 'Press Start'),\n    h('div.splash__meta', [\n      badge('Works offline', { kind: 'ok' }),\n      badge('No account needed', { kind: 'neutral' }),\n      badge('Your data stays here', { kind: 'neutral' }),\n    ]),\n    h('p.splash__keys', { html: 'Press <kbd>Enter<\/kbd> or tap to begin' }),\n    h('p.splash__hint', 'Tip: sound is synthesised live — switch it off any time in Settings.'),\n  ]);\n}\n\n/** Large animated wordmark. */\nfunction bigLogo() {\n  return `<svg width=\"148\" height=\"148\" viewBox=\"0 0 120 120\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n    <defs>\n      <linearGradient id=\"lgA\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n        <stop offset=\"0%\" stop-color=\"#7c5cff\"/><stop offset=\"55%\" stop-color=\"#4a7cff\"/><stop offset=\"100%\" stop-color=\"#23d5ff\"/>\n      <\/linearGradient>\n    <\/defs>\n    <g class=\"logo-spin\">\n      <circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"url(#lgA)\" stroke-width=\"2\" opacity=\"0.5\" stroke-dasharray=\"6 10\"/>\n      <circle cx=\"60\" cy=\"60\" r=\"42\" fill=\"none\" stroke=\"url(#lgA)\" stroke-width=\"1.4\" opacity=\"0.28\"/>\n    <\/g>\n    <path d=\"M60 16 L96 36 V76 L60 96 L24 76 V36 Z\" fill=\"rgba(124,92,255,0.14)\" stroke=\"url(#lgA)\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    <path class=\"logo-pulse\" d=\"M60 30 L84 44 V70 L60 84 L36 70 V44 Z\" fill=\"url(#lgA)\" opacity=\"0.28\"/>\n    <ellipse cx=\"48\" cy=\"56\" rx=\"8\" ry=\"10\" fill=\"#0b1020\"/>\n    <ellipse cx=\"72\" cy=\"56\" rx=\"8\" ry=\"10\" fill=\"#0b1020\"/>\n    <circle cx=\"50.5\" cy=\"52\" r=\"3\" fill=\"#7fdcff\"/>\n    <circle cx=\"74.5\" cy=\"52\" r=\"3\" fill=\"#7fdcff\"/>\n    <circle class=\"logo-core\" cx=\"60\" cy=\"70\" r=\"8\" fill=\"#23d5ff\"/>\n  <\/svg>`;\n}\n\n/** Local sprite helper (kept thin: components already re-export it). */\nfunction requireSprite(art, opts) { return spriteMarkup(art, opts); }\n\n/* ------------------------------------------------------------ 1. identity */\n\n/**\n * A stable, human-friendly Tamer ID derived from the name itself.\n *\n * The card has to feel like it belongs to *this* player the moment they type,\n * so the number is a deterministic hash of the name rather than a random\n * value — it changes as they type and then settles, which reads as the system\n * recognising them.\n *\n * @param {string} name\n * @returns {string} e.g. \"DP-4F92\"\n */\nfunction tamerId(name) {\n  const clean = name.trim().toUpperCase();\n  if (!clean) return 'DP-····';\n  let hash = 0x811c9dc5; // FNV-1a\n  for (let i = 0; i < clean.length; i += 1) {\n    hash ^= clean.charCodeAt(i);\n    hash = Math.imul(hash, 0x01000193) >>> 0;\n  }\n  return `DP-${hash.toString(16).toUpperCase().padStart(8, '0').slice(-4)}`;\n}\n\n/**\n * Requirements the player must satisfy to continue. Rendered as a checklist\n * that ticks itself off as they type, so a disabled button is never a mystery.\n */\nconst IDENTITY_RULES = [\n  { id: 'name', label: 'A name — 2 characters or more', test: () => wizard.displayName.trim().length >= 2 },\n  { id: 'pass', label: 'A vault passphrase — 8 characters or more', test: () => wizard.passphrase.length >= 8 },\n  { id: 'match', label: 'Both passphrases identical', test: () => wizard.passphrase.length >= 8 && wizard.passphrase === wizard.confirm },\n];\n\n/** Guards against double-submits while the vault key is being derived. */\nlet identityBusy = false;\n\n/** Move focus to the next field — Enter should walk the form, not submit it. */\nconst focusField = (selector) => document.querySelector(selector)?.focus();\n\n/** Yield to the browser so a busy state is painted before we block on PBKDF2. */\nconst nextPaint = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));\n\nfunction stepIdentity() {\n  const idValue = h('span.idcard__id-value', tamerId(wizard.displayName));\n  const idRow = h('div.idcard__id', [\n    h('span.idcard__id-label', 'Tamer ID'),\n    idValue,\n  ]);\n\n  const preview = h('div.idcard', [\n    h('div.idcard__frame', tamerEl(wizard.tamer, { size: 168, mood: 'happy' })),\n    h('div.idcard__body', [\n      h('div.idcard__label', 'Tamer'),\n      h('div.idcard__name', wizard.displayName.trim() || 'Unnamed'),\n      idRow,\n      h('div.idcard__row', [\n        badge(wizard.displayName.trim() ? 'Provisional licence' : 'Awaiting name', {\n          kind: wizard.displayName.trim() ? 'primary' : 'muted',\n        }),\n      ]),\n    ]),\n  ]);\n\n  const nameError = h('p.form-error#name-error', { role: 'alert' }, wizard.error);\n  const counter = h('span.field__counter', `${wizard.displayName.length}/18`);\n\n  const nameInput = h('input.input.input--lg#tamer-name', {\n    type: 'text',\n    value: wizard.displayName,\n    placeholder: 'e.g. Ada',\n    maxLength: 18,\n    spellcheck: 'false',\n    autocomplete: 'off',\n    autocapitalize: 'words',\n    'aria-describedby': 'name-error',\n    'aria-invalid': wizard.error ? 'true' : 'false',\n    oninput: (e) => {\n      const cleaned = e.target.value.replace(/[^A-Za-z0-9 '\\-]/g, '');\n      e.target.value = cleaned;\n      wizard.displayName = cleaned;\n      if (wizard.error) { wizard.error = ''; nameError.textContent = ''; e.target.setAttribute('aria-invalid', 'false'); }\n      counter.textContent = `${cleaned.length}/18`;\n      sfx.type();\n      refreshName(idValue);\n      syncValidity();\n    },\n    onkeydown: (e) => {\n      if (e.key === 'Enter') { e.preventDefault(); focusField('#tamer-pass'); }\n    },\n    onblur: () => {\n      const value = wizard.displayName.trim();\n      if (value.length === 1) {\n        wizard.error = 'Just one more character — names need at least two.';\n        nameError.textContent = wizard.error;\n        nameInput.setAttribute('aria-invalid', 'true');\n      }\n    },\n  });\n\n  const strength = h('div.pass-strength', h('div.pass-strength__fill'));\n  const strengthLabel = h('span.pass-strength__label', { 'aria-live': 'polite' }, '');\n\n  const passInput = h('input.input#tamer-pass', {\n    type: 'password',\n    value: wizard.passphrase,\n    placeholder: 'At least 8 characters',\n    maxLength: 128,\n    autocomplete: 'new-password',\n    spellcheck: 'false',\n    oninput: (e) => { wizard.passphrase = e.target.value; sfx.type(); updateStrength(); syncValidity(); },\n    onkeydown: (e) => {\n      if (e.key === 'Enter') { e.preventDefault(); focusField('#tamer-pass2'); }\n    },\n  });\n\n  const confirmInput = h('input.input#tamer-pass2', {\n    type: 'password',\n    value: wizard.confirm,\n    placeholder: 'Repeat passphrase',\n    maxLength: 128,\n    autocomplete: 'new-password',\n    spellcheck: 'false',\n    oninput: (e) => { wizard.confirm = e.target.value; sfx.type(); syncValidity(); },\n    onkeydown: (e) => { if (e.key === 'Enter' && !nextBtn.disabled) submitIdentity(nextBtn); },\n  });\n\n  function updateStrength() {\n    const p = wizard.passphrase;\n    let score = 0;\n    if (p.length >= 8) score += 1;\n    if (p.length >= 12) score += 1;\n    if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score += 1;\n    if (/[0-9]/.test(p) || /[^A-Za-z0-9]/.test(p)) score += 1;\n    const labels = ['Too short', 'Weak', 'Fair', 'Good', 'Strong'];\n    // Looked up live, not captured: this step can re-render underneath us\n    // (the help box, a Back navigation) and a captured node would quietly\n    // detach, leaving a meter that never moves again.\n    const meter = document.querySelector('.pass-strength');\n    const label = document.querySelector('.pass-strength__label');\n    if (meter) {\n      const fill = meter.querySelector('.pass-strength__fill');\n      if (fill) fill.style.width = `${(score / 4) * 100}%`;\n      meter.dataset.score = String(score);\n    }\n    if (label) {\n      label.textContent = p ? labels[score] : '';\n      label.style.color = ['var(--danger)', 'var(--danger)', 'var(--warn)', '#9ae66e', 'var(--ok)'][score];\n    }\n  }\n\n  /** Live-update the ID card without re-rendering (keeps the caret in place). */\n  function refreshName(idEl) {\n    const target = idEl || idValue;\n    const nameEl = document.querySelector('.idcard__name');\n    if (nameEl) nameEl.textContent = wizard.displayName.trim() || 'Unnamed';\n    const next = tamerId(wizard.displayName);\n    if (target.textContent !== next) {\n      target.textContent = next;\n      // Replay the flicker so the number reads as \"recalculating\".\n      target.classList.remove('is-rolling');\n      void target.offsetWidth;\n      target.classList.add('is-rolling');\n    }\n    const badgeEl = document.querySelector('.idcard__row');\n    if (badgeEl) {\n      badgeEl.replaceChildren(badge(wizard.displayName.trim() ? 'Provisional licence' : 'Awaiting name', {\n        kind: wizard.displayName.trim() ? 'primary' : 'muted',\n      }));\n    }\n  }\n\n  // Checklist rows; ticked live so the Continue button is never a dead end.\n  const doneRules = new Set();\n  const checklist = h('ul.checklist', IDENTITY_RULES.map((rule) => h(`li.checklist__item#check-${rule.id}`, [\n    h('span.checklist__mark', { 'aria-hidden': 'true' }, ''),\n    h('span.checklist__label', rule.label),\n  ])));\n\n  const nextBtn = h('button.btn.btn--primary.btn--lg#identity-next', {\n    type: 'button',\n    disabled: true,\n    onclick: () => submitIdentity(nextBtn),\n  }, 'Continue');\n\n  const form = h('div.identity-form', [\n    h('label.field', [\n      h('span.field__label', [h('span', 'Display name'), counter]),\n      nameInput,\n      nameError,\n    ]),\n    h('label.field', [\n      h('span.field__label', 'Vault passphrase'),\n      passInput,\n      h('div.pass-strength-row', [strength, strengthLabel]),\n    ]),\n    h('label.field', [h('span.field__label', 'Confirm passphrase'), confirmInput]),\n  ]);\n\n  /**\n   * Re-evaluate the rules in place. Called on every keystroke: no re-render,\n   * so focus and caret position survive.\n   */\n  function syncValidity() {\n    let all = true;\n    for (const rule of IDENTITY_RULES) {\n      const ok = rule.test();\n      const el = document.getElementById(`check-${rule.id}`);\n      if (el) {\n        el.classList.toggle('is-done', ok);\n        const mark = el.querySelector('.checklist__mark');\n        if (mark) mark.textContent = ok ? '✓' : '';\n      }\n      if (ok && !doneRules.has(rule.id)) {\n        doneRules.add(rule.id);\n        sfx.xp(); // a soft tick: something was just earned\n      } else if (!ok) {\n        doneRules.delete(rule.id);\n      }\n      if (!ok) all = false;\n    }\n    const button = document.querySelector('#identity-next') || nextBtn;\n    button.disabled = !all;\n    button.classList.toggle('is-ready', all);\n    // Even a disabled button should say what it is waiting for.\n    button.title = all\n      ? 'Continue to appearance'\n      : `Still needed: ${IDENTITY_RULES.filter((r) => !r.test()).map((r) => r.label.split('—')[0].trim().toLowerCase()).join(', ')}`;\n  }\n\n  const view = h('div.creator', [\n    h('div.creator__head', [\n      h('h2.creator__title', 'Create your Tamer'),\n      h('p.muted', 'Step 1 of 3 · Identity'),\n    ]),\n    h('div.creator__grid', [\n      h('div.creator__preview', [\n        preview,\n        h('p.muted.muted--sm', 'Your portrait is generated live — you can restyle it next.'),\n      ]),\n      card(null,\n        form,\n        checklist,\n        h('button.btn.btn--ghost.btn--sm.help-toggle', {\n          type: 'button',\n          'aria-expanded': wizard.showHelp ? 'true' : 'false',\n          onclick: () => {\n            wizard.showHelp = !wizard.showHelp;\n            pendingSelector = '.help-toggle'; // the step re-renders; keep the caret there\n            sfx.toggle();\n            navigate('/onboarding');\n          },\n        }, wizard.showHelp ? 'Hide explanation' : 'Why do I need a passphrase?'),\n        wizard.showHelp ? h('div.helpbox', [\n          h('p', 'DigiPoke is local-first: your save lives in this browser, not on our servers.'),\n          h('p', 'The passphrase encrypts your backups and any optional cloud sync. It is never stored or sent — which also means ',\n            h('strong', 'we cannot reset it'), ' if you forget it.'),\n          h('p.muted', 'Write it down somewhere safe, then continue.'),\n        ]) : null,\n        h('div.row.row--between', [\n          h('button.btn.btn--ghost', { type: 'button', onclick: () => goTo(0, 'back') }, 'Back'),\n          nextBtn,\n        ]),\n      ),\n    ]),\n  ]);\n\n  // Prime the checklist and button from any state restored by a re-render.\n  requestAnimationFrame(() => {\n    updateStrength();\n    doneRules.clear();\n    for (const rule of IDENTITY_RULES) if (rule.test()) doneRules.add(rule.id);\n    syncValidity();\n  });\n\n  return view;\n}\n\n/**\n * Derive the vault key and advance.\n *\n * The click must feel instant, so: cue the sound and paint the busy state\n * *first*, yield to the browser, and only then run PBKDF2 — which blocks the\n * main thread for a few hundred milliseconds on a phone.\n *\n * @param {HTMLButtonElement} button\n */\nasync function submitIdentity(button) {\n  if (identityBusy) return;\n  const name = wizard.displayName.trim();\n\n  if (name.length < 2) {\n    wizard.error = 'Please enter at least 2 characters.';\n    sfx.error();\n    const err = document.querySelector('#name-error');\n    if (err) err.textContent = wizard.error;\n    const input = document.querySelector('#tamer-name');\n    input?.setAttribute('aria-invalid', 'true');\n    input?.classList.add('is-shake');\n    setTimeout(() => input?.classList.remove('is-shake'), 420);\n    input?.focus();\n    return;\n  }\n  if (wizard.passphrase.length < 8) return toast('Passphrase must be at least 8 characters.', 'error');\n  if (wizard.passphrase !== wizard.confirm) return toast('Passphrases do not match.', 'error');\n\n  identityBusy = true;\n  sfx.confirm(); // immediate acknowledgement — never leave a click unanswered\n  const label = button?.textContent;\n  if (button) {\n    button.disabled = true;\n    button.classList.add('is-busy');\n    button.setAttribute('aria-busy', 'true');\n    button.replaceChildren(h('span.spinner', { 'aria-hidden': 'true' }), h('span', 'Securing your vault…'));\n  }\n  document.querySelectorAll('#tamer-name, #tamer-pass, #tamer-pass2').forEach((el) => { el.readOnly = true; });\n\n  await nextPaint();\n\n  try {\n    const salt = newSalt();\n    const key = await deriveVaultKey(wizard.passphrase, salt);\n    const verifier = await makeVerifier(key);\n    await db.kvSet('vault', { salt, verifier, createdAt: new Date().toISOString(), iterations: 250000 });\n    // Cache the key for this session so encrypted export/sync need no re-prompt.\n    (await import('«src/sync/syncClient.js»')).cacheVaultKey?.(key);\n    sfx.reward();\n    identityBusy = false;\n    goTo(2, 'confirm');\n  } catch (err) {\n    console.error(err);\n    identityBusy = false;\n    if (button) {\n      button.disabled = false;\n      button.classList.remove('is-busy');\n      button.removeAttribute('aria-busy');\n      button.textContent = label || 'Continue';\n    }\n    document.querySelectorAll('#tamer-name, #tamer-pass, #tamer-pass2').forEach((el) => { el.readOnly = false; });\n    toast(`Could not create the vault: ${err.message}`, 'error');\n  }\n}\n\n/* ---------------------------------------------------------- 2. appearance */\n\n/**\n * Transient preview state for the avatar editor.\n *\n * Hovering or focusing an option shows the player what it would look like\n * without committing to it. Because that must not disturb what they have\n * already chosen, the preview lives outside `wizard.tamer` and is discarded on\n * pointer-leave / blur.\n */\nlet previewTamer = null;\n/** Which option is hovered / focused, as `group:optId`. */\nlet hoverOpt = null;\nlet focusOpt = null;\n\n/** Option to re-focus after the next re-render (`group:optionId`). */\nlet pendingFocus = null;\n\n/** Set when an option was just committed, so the stage can react. */\nlet justChanged = false;\n\n/** Selector to re-focus after the next re-render (generic form of pendingFocus). */\nlet pendingSelector = null;\n\n/** Last step that was mounted, so entry effects only fire on entry. */\nlet lastStep = null;\n\n/**\n * Build one option group.\n *\n * @param {string} key TAMER_OPTIONS key (also the wizard.tamer key).\n * @param {string} label Group heading.\n * @param {object} ctx Shared step state: the live avatar element and caption.\n */\nfunction groupUi(key, label, ctx) {\n  const options = TAMER_OPTIONS[key];\n  return h('div.opt-group', [\n    h(`div.opt-group__label#grp-${key}`, label),\n    h('div.opt-group__options', {\n      role: 'radiogroup',\n      'aria-labelledby': `grp-${key}`,\n    }, options.map((opt, index) => h(\n      `button.opt${wizard.tamer[key] === opt.id ? '.is-active' : ''}${opt.hex ? '.opt--color' : ''}`,\n      {\n        type: 'button',\n        title: opt.name,\n        'aria-checked': wizard.tamer[key] === opt.id ? 'true' : 'false',\n        'aria-label': `${label}: ${opt.name}`,\n        role: 'radio',\n        // Roving tabindex: one stop per group, arrows move within it. Tab\n        // through 42 swatches would be hostile.\n        tabindex: wizard.tamer[key] === opt.id ? '0' : '-1',\n        dataset: { group: key, opt: opt.id, index: String(index) },\n        style: opt.hex ? { '--swatch': opt.hex } : {},\n        // Preview on hover/focus so choosing is exploratory rather than blind.\n        onpointerenter: () => showPreview(key, opt.id),\n        onpointerleave: () => clearPreview(),\n        onfocus: () => focusPreview(key, opt.id),\n        onblur: () => blurPreview(),\n        onkeydown: (e) => arrowNav(e, key, index, options.length),\n        onclick: () => commitOption(key, opt.id),\n      },\n      opt.hex ? '' : opt.name,\n    ))),\n  ]);\n}\n\n/**\n * Recompute the preview from the hover and focus slots. Either one can drive\n * it; the committed look returns only when both are empty.\n */\nfunction updatePreview(source) {\n  const selection = hoverOpt || focusOpt;\n  if (!selection) {\n    if (!previewTamer) return;\n    previewTamer = null;\n    paintAvatar(wizard.tamer, { preview: false });\n    return;\n  }\n  const [group, optId] = selection.split(':');\n  const next = { ...wizard.tamer, [group]: optId };\n  if (previewTamer && previewTamer[group] === optId) return;\n  previewTamer = next;\n  paintAvatar(next, { caption: captionFor(group, optId), preview: true });\n  // Only the pointer gets a hover tick; the global handler already covers it.\n  if (source === 'pointer') sfx.hover();\n}\n\n/** Pointer entered an option — preview it. */\nfunction showPreview(group, optId) {\n  hoverOpt = `${group}:${optId}`;\n  updatePreview('pointer');\n}\n\n/** Pointer left an option — fall back to focus, if any. */\nfunction clearPreview() {\n  hoverOpt = null;\n  updatePreview('focus');\n}\n\n/** Keyboard focus entered an option — preview it. */\nfunction focusPreview(group, optId) {\n  focusOpt = `${group}:${optId}`;\n  updatePreview('focus');\n}\n\n/** Keyboard focus left an option. */\nfunction blurPreview() {\n  focusOpt = null;\n  updatePreview('pointer');\n}\n\n/** Human-readable caption for the option under the cursor. */\nfunction captionFor(group, optId) {\n  const opt = (TAMER_OPTIONS[group] || []).find((o) => o.id === optId);\n  return opt ? opt.name : '';\n}\n\n/**\n * Redraw the stage avatar in place (no re-render, no focus loss).\n * @param {object} tamer\n * @param {{caption?:string, preview?:boolean}} [opts]\n */\nfunction paintAvatar(tamer, { caption = '', preview = false } = {}) {\n  const host = document.querySelector('.stage__avatar');\n  if (host) {\n    host.replaceChildren(tamerEl(tamer, { size: 230, mood: 'happy' }));\n    host.classList.toggle('is-preview', preview);\n  }\n  const cap = document.querySelector('.stage__caption');\n  if (cap) {\n    const idle = wizard.displayName.trim() ? wizard.displayName.trim() : 'Your Tamer';\n    cap.textContent = caption || (preview ? '' : idle);\n    cap.classList.toggle('is-visible', Boolean(caption));\n  }\n}\n\n/** Arrow-key navigation inside an option group (roving with real focus). */\nfunc
