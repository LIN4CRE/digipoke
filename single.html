;\nimport { createCreature } from '«src/domain/creature.js»';\nimport { setPendingRival } from '«src/ui/screens/battle.js»';\n\n/** Per-profile RNG, seeded from the save file so runs are reproducible. */\nlet rng = null;\nfunction worldRng() {\n  if (!rng) rng = createRng(state.getState().profile.seed ^ Date.now());\n  return rng;\n}\n\n/** Scanning guard so a double-tap cannot spawn two battles. */\nlet scanning = false;\n\n/**\n * Render the Explore screen.\n * @param {HTMLElement} root\n */\nexport function render(root) {\n  const s = state.getState();\n  const zone = getZone(s.progress.zoneId);\n  startMusic('explore');\n\n  const view = h('div.view.view--explore', [\n    card(null,\n      sectionHead('Explore', h('span.pill', `${s.profile.stats.steps} scans`)),\n      h('p.muted', 'Choose a zone, then scan it to stir up wild digi-life. Stronger zones unlock as your team levels up.'),\n    ),\n    h('div.zone-grid', ZONES.map((z) => zoneCard(z))),\n    zonePanel(zone),\n  ]);\n\n  renderInto(root, view);\n}\n\n/* ------------------------------------------------------------------- zones */\n\n/**\n * A zone is playable when the team is strong enough. We derive this from the\n * level rather than trusting `progress.unlocked`, so a save that missed an\n * unlock tick (or an imported file) never gets permanently stuck.\n */\nfunction isUnlocked(zone, strongest) {\n  return unlockedZones(strongest).some((z) => z.id === zone.id);\n}\n\nfunction zoneCard(zone) {\n  const s = state.getState();\n  const strongest = state.strongestLevel();\n  const unlocked = isUnlocked(zone, strongest);\n  const selected = s.progress.zoneId === zone.id;\n\n  return h(`button.zone-card${selected ? '.is-selected' : ''}${unlocked ? '' : '.is-locked'}`, {\n    type: 'button',\n    disabled: !unlocked,\n    style: { '--zone': zone.accent },\n    onclick: () => {\n      if (!unlocked) return;\n      sfx.select();\n      state.mutate((st) => { st.progress.zoneId = zone.id; });\n      navigate('/explore');\n    },\n  }, [\n    h('div.zone-card__head', [\n      h('span.zone-card__name', zone.name),\n      unlocked ? badge(`Lv ${zone.minLevel}–${zone.maxLevel}`, { kind: 'neutral' }) : badge('Locked', { kind: 'muted' }),\n    ]),\n    h('p.zone-card__blurb', unlocked ? zone.blurb : `Reach level ${Math.max(0, zone.recommended - 4)} to unlock (you: ${strongest}).`),\n    h('div.zone-card__pool', unlocked\n      ? zone.encounters.map((e) => spriteEl(e.id, { size: 40 }))\n      : [h('span.zone-card__lock', '🔒')]),\n  ]);\n}\n\nfunction zonePanel(zone) {\n  const s = state.getState();\n  return card(null,\n    sectionHead(zone.name,\n      h('span.pill', { style: { color: zone.accent } }, `Lv ${zone.minLevel}–${zone.maxLevel}`)),\n    h('p.muted', zone.blurb),\n    h('div.row.row--wrap', [\n      h('button.btn.btn--primary.btn--lg', {\n        type: 'button',\n        onclick: () => scan(zone),\n      }, `Scan area (1 step)`),\n      h('button.btn.btn--ghost.btn--lg', {\n        type: 'button',\n        onclick: () => challengeTrainer(zone),\n      }, 'Challenge a trainer'),\n    ]),\n    h('p.muted.muted--sm', [\n      'Trainers appear once you have scanned a few steps and pay 1.5× XP plus bonus Data Shards. ',\n      `Defeated here: ${s.progress.defeatedTrainers.length}`,\n    ]),\n    h('h4.detail__sub', 'Likely encounters'),\n    h('div.encounter-list', zone.encounters.map((e) => {\n      const species = getSpecies(e.id);\n      return h('div.encounter-row', [\n        spriteEl(e.id, { size: 44 }),\n        h('div', [\n          h('div.encounter-row__name', species.name),\n          typeRow(species.types, { small: true }),\n        ]),\n        h('span.encounter-row__weight', `${Math.round((e.w / zone.encounters.reduce((a, b) => a + b.w, 0)) * 100)}%`),\n      ]);\n    })),\n  );\n}\n\n/* ------------------------------------------------------------------ actions */\n\n/** Perform one scan step, rolling for an encounter. */\nasync function scan(zone) {\n  if (scanning) return;\n  const team = state.teamCreatures().filter((c) => c.hp > 0);\n  if (!team.length) {\n    sfx.error();\n    toast('Your team is knocked out. Heal at the Ranch or Nexus first.', 'error');\n    return;\n  }\n\n  scanning = true;\n  sfx.scan();\n  const scanBtn = document.querySelector('.view--explore .btn--primary');\n  if (scanBtn) { scanBtn.classList.add('is-scanning'); scanBtn.disabled = true; }\n  state.recordSteps(1);\n\n  // Encounter probability rises with consecutive scans since the last battle.\n  const r = worldRng();\n  const chance = 0.42;\n  await wait(420);\n\n  if (r.next() < chance) {\n    const speciesId = rollEncounter(zone, () => r.next());\n    const level = r.int(zone.minLevel, zone.maxLevel);\n    const wild = createCreature({\n      speciesId, level, rand: r,\n      origin: { zone: zone.id, wild: true },\n    });\n    sfx.encounter();\n    const flash = document.querySelector('.view--explore');\n    if (flash) { flash.classList.add('is-encounter'); setTimeout(() => flash.classList.remove('is-encounter'), 700); }\n    state.mutate((s) => { s.profile.stats.steps = s.profile.stats.steps; });\n    navigate(`/battle?wild=1&zone=${zone.id}&species=${speciesId}&level=${level}`);\n  } else {\n    sfx.select();\n    toast('Nothing but stray data… try another scan.', 'info');\n  }\n  scanning = false;\n  const scanBtn2 = document.querySelector('.view--explore .btn--primary');\n  if (scanBtn2) { scanBtn2.classList.remove('is-scanning'); scanBtn2.disabled = false; }\n}\n\n/** Generate and start a trainer battle. */\nfunction challengeTrainer(zone) {\n  const team = state.teamCreatures().filter((c) => c.hp > 0);\n  if (!team.length) {\n    sfx.error();\n    toast('Your team is knocked out. Heal first.', 'error');\n    return;\n  }\n  sfx.confirm();\n  const r = worldRng();\n  const rival = rollRival(zone, state.strongestLevel(), () => r.next());\n  setPendingRival({ name: rival.name, members: rival.members, zoneId: zone.id });\n  navigate(`/battle?trainer=1&zone=${zone.id}`);\n}\n\nconst wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\nexport const meta = { title: 'Explore' };\n"},{"key":"src/ui/screens/lab.js","code":"/**\n * lab.js — Progression workshop: evolution, core training, move tutoring,\n * and the Data Shard fabricator.\n *\n * Every action here spends a resource (levels, bond, shards), so each handler\n * validates affordability *before* mutating state and reports failures with a\n * toast rather than throwing.\n *\n * @module ui/screens/lab\n */\n\nimport { h, renderInto, num } from '«src/ui/dom.js»';\nimport {\n  card, sectionHead, creatureCard, spriteEl, badge, toast, modal,\n  confirmDialog, emptyState, typeRow, statBar,\n} from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { sfx, startMusic } from '«src/core/sfx.js»';\nimport { navigate } from '«src/core/router.js»';\nimport { getSpecies, learnsetFor } from '«src/domain/species.js»';\nimport { getMove } from '«src/domain/moves.js»';\nimport {\n  canEvolve, applyEvolution, evolutionBlocker, raiseCore, teachMove,\n  displayName, corePotential, statsFor, STAT_IDS,\n} from '«src/domain/creature.js»';\nimport {\n  coreCost, MOVE_TUTOR_COST, CORE_CAP, bondTier,\n} from '«src/domain/progression.js»';\nimport { BALLS, BALL_PRICES } from '«src/domain/capture.js»';\n\n/** Lab tab + selection state, preserved across re-renders. */\nconst lab = { tab: 'evolve', uid: null, stat: 'atk', moveId: null, evolveUid: null };\n\n/**\n * Render the Lab.\n * @param {HTMLElement} root\n * @param {{query:URLSearchParams}} [ctx]\n */\nexport function render(root, ctx = { query: new URLSearchParams() }) {\n  startMusic('lab');\n  const evolveUid = ctx.query?.get('evolve');\n  if (evolveUid && state.getCreature(evolveUid)) {\n    lab.tab = 'evolve';\n    lab.evolveUid = evolveUid;\n  }\n\n  const creatures = state.allCreatures();\n  if (!lab.uid || !state.getCreature(lab.uid)) lab.uid = creatures[0]?.uid || null;\n\n  const tabBtn = (id, label) => h(`button.seg-btn${lab.tab === id ? '.is-active' : ''}`, {\n    type: 'button',\n    onclick: () => { lab.tab = id; sfx.click(); navigate('/lab'); },\n  }, label);\n\n  const view = h('div.view.view--lab', [\n    card(null,\n      sectionHead('Lab', h('span.pill', `◈ ${num(state.getState().profile.shards)} Data Shards`)),\n      h('p.muted', 'Train cores, tutor moves and evolve your partners. Everything here costs time, bond or shards.'),\n      h('div.seg', [\n        tabBtn('evolve', 'Evolution'),\n        tabBtn('cores', 'Core training'),\n        tabBtn('moves', 'Move tutor'),\n        tabBtn('fabricate', 'Fabricator'),\n      ]),\n    ),\n    lab.tab === 'evolve' ? evolvePanel(creatures)\n      : lab.tab === 'cores' ? coresPanel(creatures)\n        : lab.tab === 'moves' ? movesPanel(creatures)\n          : fabricatePanel(),\n  ]);\n\n  renderInto(root, view);\n\n  // Deep link: open the evolution confirmation straight away.\n  if (lab.evolveUid) {\n    const uid = lab.evolveUid;\n    lab.evolveUid = null;\n    openEvolveDialog(uid);\n  }\n}\n\n/* ----------------------------------------------------------------- evolve */\n\nfunction evolvePanel(creatures) {\n  const ready = creatures.filter((c) => canEvolve(c));\n  const pending = creatures.filter((c) => !canEvolve(c) && c.species && getSpecies(c.speciesId).evolve);\n\n  return h('div.stack', [\n    card('Ready to evolve',\n      ready.length\n        ? h('div.grid.grid--auto', ready.map((c) => creatureCard(c, {\n          note: `→ ${getSpecies(getSpecies(c.speciesId).evolve.to).name}`,\n          onClick: () => openEvolveDialog(c.uid),\n          actions: [\n            h('button.btn.btn--sm.btn--primary', {\n              type: 'button',\n              onclick: (e) => { e.stopPropagation(); openEvolveDialog(c.uid); },\n            }, 'Evolve'),\n          ],\n        })))\n        : emptyState('No creature is ready to evolve right now. Level and bond them up!')),\n\n    card('Evolution paths',\n      pending.length\n        ? h('div.path-list', pending.map((c) => {\n          const species = getSpecies(c.speciesId);\n          const next = getSpecies(species.evolve.to);\n          const blocker = evolutionBlocker(c);\n          return h('div.path-row', [\n            spriteEl(c.speciesId, { size: 44, shiny: c.shiny }),\n            h('div.path-row__main', [\n              h('div.path-row__names', `${displayName(c)} → ${next.name}`),\n              h('div.bar.bar--thin', h('div.bar__fill', {\n                style: {\n                  width: `${Math.min(100, (c.level / species.evolve.level) * 100)}%`,\n                  background: blocker ? 'var(--accent-2)' : '#4fd67c',\n                },\n              })),\n              h('div.path-row__meta', blocker || 'Ready'),\n            ]),\n            h('div.path-row__types', typeRow(next.types, { small: true })),\n          ]);\n        }))\n        : emptyState('Every creature that can evolve already has.')),\n  ]);\n}\n\nasync function openEvolveDialog(uid) {\n  const creature = state.getCreature(uid);\n  if (!creature) return;\n  const evo = canEvolve(creature);\n  if (!evo) {\n    toast(evolutionBlocker(creature) || 'This creature cannot evolve further.', 'error');\n    return;\n  }\n  const from = getSpecies(creature.speciesId);\n  const to = getSpecies(evo.to);\n\n  const ok = await confirmDialog({\n    title: `Evolve ${displayName(creature)}?`,\n    message: `${from.name} will become ${to.name}. Its moves are recalculated for the new form and it gains a bond boost. Evolutions are permanent.`,\n    confirmLabel: 'Evolve',\n  });\n  if (!ok) return;\n\n  state.mutate((s) => applyEvolution(s.creatures[uid], evo.to));\n  state.recordEvolution(uid, from.id, to.id);\n  sfx.evolve();\n  toast(`${from.name} evolved into ${to.name}!`, 'success');\n  navigate('/lab');\n}\n\n/* ------------------------------------------------------------------ cores */\n\nfunction coresPanel(creatures) {\n  if (!creatures.length) return card('Core training', emptyState('No creatures yet.'));\n  const creature = state.getCreature(lab.uid);\n  const pot = corePotential(creature);\n\n  const statButtons = STAT_IDS.map((id) => {\n    const value = creature.cores[id];\n    const cost = coreCost(value);\n    const maxed = value >= CORE_CAP;\n    const affordable = state.getState().profile.shards >= cost;\n    return h(`button.core-btn${lab.stat === id ? '.is-selected' : ''}`, {\n      type: 'button',\n      disabled: maxed || !affordable,\n      onclick: () => trainCore(creature, id, cost),\n    }, [\n      h('span.core-btn__label', id.toUpperCase()),\n      h('span.core-btn__value', `${value}/${CORE_CAP}`),\n      h('div.bar.bar--thin', h('div.bar__fill', {\n        style: { width: `${(value / CORE_CAP) * 100}%`, background: 'var(--accent)' },\n      })),\n      h('span.core-btn__cost', maxed ? 'MAX' : `◈ ${cost}`),\n    ]);\n  });\n\n  return h('div.stack', [\n    card('Core training',\n      h('p.muted', 'Cores are the genetic ceiling of a creature. Each point permanently raises a stat. Cost scales with the current value.'),\n      creaturePicker(creatures),\n      creature ? h('div.core-panel', [\n        h('div.core-panel__head', [\n          spriteEl(creature.speciesId, { size: 84, shiny: creature.shiny }),\n          h('div', [\n            h('div.core-panel__name', `${displayName(creature)} · Lv ${creature.level}`),\n            h('div.pill', `Potential ${pot.total}/${pot.max}`),\n            statBar('ATK', statsFor(creature).atk, 220, { color: '#ff6b6b' }),\n            statBar('DEF', statsFor(creature).def, 220, { color: '#3db4ff' }),\n            statBar('SPD', statsFor(creature).spd, 220, { color: '#ffd93d' }),\n          ]),\n        ]),\n        h('div.core-grid', statButtons),\n      ]) : null),\n  ]);\n}\n\nfunction trainCore(creature, statId, cost) {\n  if (!state.spendShards(cost)) {\n    sfx.error();\n    toast('Not enough Data Shards.', 'error');\n    return;\n  }\n  state.mutate((s) => raiseCore(s.creatures[creature.uid], statId));\n  sfx.levelUp();\n  toast(`${displayName(creature)}’s ${statId.toUpperCase()} core rose to ${creature.cores[statId]}.`, 'success');\n  navigate('/lab');\n}\n\n/* ------------------------------------------------------------------ moves */\n\nfunction movesPanel(creatures) {\n  if (!creatures.length) return card('Move tutor', emptyState('No creatures yet.'));\n  const creature = state.getCreature(lab.uid);\n  const learnset = learnsetFor(creature.speciesId);\n  const known = new Set(creature.moves);\n  const options = learnset.filter((e) => !known.has(e.move));\n  const affordable = state.getState().profile.shards >= MOVE_TUTOR_COST;\n\n  return h('div.stack', [\n    card('Move tutor',\n      h('p.muted', `Relearn a technique this species knows but has forgotten. Costs ◈${MOVE_TUTOR_COST}. If all four slots are full, the oldest move is replaced.`),\n      creaturePicker(creatures),\n      creature ? h('div.stack', [\n        h('h4.detail__sub', 'Known moves'),\n        h('div.detail__moves', creature.moves.map((id) => {\n          const m = getMove(id);\n          return h('div.move-row', [\n            h('span.move-row__name', m.name),\n            typeRow([m.type], { small: true }),\n            h('span.move-row__power', m.power ? `PWR ${m.power}` : 'Support'),\n            h('span.move-row__desc', m.desc),\n          ]);\n        })),\n        h('h4.detail__sub', 'Available to tutor'),\n        options.length\n          ? h('div.tutor-list', options.map((e) => {\n            const m = getMove(e.move);\n            return h('button.list-row', {\n              type: 'button',\n              disabled: !affordable,\n              onclick: () => tutorMove(creature, e.move),\n            }, [\n              h('span.list-row__name', `${m.name} (Lv ${e.level})`),\n              h('span.list-row__meta', `${m.power ? `PWR ${m.power}` : 'Support'} · ACC ${m.acc} · ◈${MOVE_TUTOR_COST}`),\n            ]);\n          }))\n          : emptyState('This creature already knows everything it can learn.'),\n      ]) : null),\n  ]);\n}\n\nfunction tutorMove(creature, moveId) {\n  if (!state.spendShards(MOVE_TUTOR_COST)) {\n    sfx.error();\n    toast('Not enough Data Shards.', 'error');\n    return;\n  }\n  const ok = state.mutate((s) => teachMove(s.creatures[creature.uid], moveId));\n  if (!ok) {\n    state.addShards(MOVE_TUTOR_COST); // refund: nothing was taught\n    sfx.error();\n    toast('That move cannot be tutored to this creature.', 'error');\n    return;\n  }\n  sfx.levelUp();\n  toast(`${displayName(creature)} learned ${getMove(moveId).name}!`, 'success');\n  navigate('/lab');\n}\n\n/* -------------------------------------------------------------- fabricator */\n\nfunction fabricatePanel() {\n  const s = state.getState();\n  const rows = Object.values(BALLS).map((ball) => {\n    const price = BALL_PRICES[ball.id];\n    const owned = s.inventory[ball.id] ?? 0;\n    return h('div.shop-row', [\n      h('div.shop-row__main', [\n        h('div.shop-row__name', ball.name),\n        h('p.shop-row__desc', ball.desc),\n        h('span.pill', `×${owned} owned`),\n      ]),\n      h('div.shop-row__buy', [\n        h('button.btn.btn--sm', {\n          type: 'button',\n          disabled: s.profile.shards < price,\n          onclick: () => buy(ball.id, 1),\n        }, `◈ ${price}`),\n        h('button.btn.btn--sm.btn--ghost', {\n          type: 'button',\n          disabled: s.profile.shards < price * 5,\n          onclick: () => buy(ball.id, 5),\n        }, `×5 ◈${price * 5}`),\n      ]),\n    ]);\n  });\n\n  return card('Fabricator',\n    h('p.muted', 'Convert Data Shards into capture hardware. Shards come from battles, objectives and releasing creatures.'),\n    h('div.shop-list', rows),\n  );\n}\n\nfunction buy(ballId, count) {\n  const res = state.buyBall(ballId, count);\n  if (!res.ok) {\n    sfx.error();\n    toast(res.reason, 'error');\n    return;\n  }\n  sfx.capture();\n  toast(`Fabricated ${count}× ${BALLS[ballId].name}.`, 'success');\n  navigate('/lab');\n}\n\n/* ------------------------------------------------------------------ shared */\n\nfunction creaturePicker(creatures) {\n  return h('div.picker', creatures.map((c) => h(`button.picker__item${lab.uid === c.uid ? '.is-selected' : ''}`, {\n    type: 'button',\n    title: `${displayName(c)} · Lv ${c.level}`,\n    onclick: () => { lab.uid = c.uid; sfx.click(); navigate('/lab'); },\n  }, [\n    spriteEl(c.speciesId, { size: 40, shiny: c.shiny }),\n    h('span.picker__label', `Lv ${c.level}`),\n  ])));\n}\n\nexport const meta = { title: 'Lab' };\nexport { bondTier };\n"},{"key":"src/main.js","code":"/**\n * main.js — Application bootstrap.\n *\n * Boot order is deliberate:\n *   1. Open IndexedDB and hydrate state (never block the first paint on network).\n *   2. Wire UI infrastructure (toasts, chrome, routes).\n *   3. Start the router — it owns which screen is mounted.\n *   4. Register the service worker so the *next* visit is offline-capable.\n *   5. Install lifecycle hooks (autosave on hide, install prompt, connectivity).\n *\n * @module main\n */\n\nimport { qs, h } from '«src/ui/dom.js»';\nimport { initUi, renderTopbar, renderTabbar, toast } from '«src/ui/components.js»';\nimport * as state from '«src/core/state.js»';\nimport { on, EVENTS } from '«src/core/bus.js»';\nimport * as routerModule from '«src/core/router.js»';\nimport { sfx, setSoundEnabled, setSfxVolume, setMusicVolume, startMusic, unlockAudio, sinceLastSound } from '«src/core/sfx.js»';\nimport { applyTheme } from '«src/ui/screens/settings.js»';\n\nimport * as onboarding from '«src/ui/screens/onboarding.js»';\nimport * as dashboard from '«src/ui/screens/dashboard.js»';\nimport * as ranch from '«src/ui/screens/ranch.js»';\nimport * as explore from '«src/ui/screens/explore.js»';\nimport * as battle from '«src/ui/screens/battle.js»';\nimport * as lab from '«src/ui/screens/lab.js»';\nimport * as settings from '«src/ui/screens/settings.js»';\n\n// Destructured after import for readability at call sites.\nconst { route, startRouter, activePath, navigate } = routerModule;\n\n/** Deferred PWA install prompt. */\nlet installEvent = null;\n\n/** DOM handles, resolved once at boot. */\nlet view = null;\nlet topbar = null;\nlet tabbar = null;\n\n/**\n * Mount a screen: update the chrome, then render into the view container.\n * @param {(root:HTMLElement, ctx?:object) => void} screen\n * @param {object} [ctx]\n */\nfunction mount(screen, ctx = { query: new URLSearchParams() }) {\n  const path = activePath();\n  const bare = path === '/onboarding';\n  document.body.classList.toggle('is-bare', bare);\n  if (!bare) {\n    renderTopbar(topbar);\n    renderTabbar(tabbar);\n  }\n  screen.render(view, ctx);\n  window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });\n}\n\n/** Register every route with its guard. */\nfunction registerRoutes() {\n  const requiresProfile = () => (state.hasProfile() ? true : '/onboarding');\n  // Allow the wizard's final \"ready\" step to render for a brand-new profile;\n  // any other visit to /onboarding with a save file goes to the dashboard.\n  const requiresNoProfile = () => {\n    if (!state.hasProfile()) return true;\n    return onboarding.currentStep() >= 4 ? true : '/';\n  };\n\n  route('/onboarding', (ctx) => mount(onboarding, ctx), { title: 'Welcome', guard: requiresNoProfile });\n  route('/', (ctx) => mount(dashboard, ctx), { title: 'Nexus', guard: requiresProfile });\n  route('/ranch', (ctx) => mount(ranch, ctx), { title: 'Ranch', guard: requiresProfile });\n  route('/explore', (ctx) => mount(explore, ctx), { title: 'Explore', guard: requiresProfile });\n  route('/battle', (ctx) => mount(battle, ctx), { title: 'Battle', guard: requiresProfile });\n  route('/lab', (ctx) => mount(lab, ctx), { title: 'Lab', guard: requiresProfile });\n  route('/settings', (ctx) => mount(settings, ctx), { title: 'Settings', guard: requiresProfile });\n}\n\n/** Re-render the current screen (skipped for stateful screens). */\nfunction refreshCurrent() {\n  const path = activePath();\n  // The battle screen owns an animation loop and must not be re-rendered\n  // underneath itself; settings owns focused inputs.\n  if (path === '/battle' || path === '/settings' || path === '/onboarding') {\n    if (path !== '/onboarding') renderTopbar(topbar);\n    return;\n  }\n  if (topbar) renderTopbar(topbar);\n  const { refresh } = routerModule;\n  refresh();\n}\n\n/** Imported router functions used by refreshCurrent. */\n/** Register the service worker (progressive enhancement). */\nasync function registerServiceWorker() {\n  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;\n  const secure = location.protocol === 'https:' || location.hostname === 'localhost';\n  if (!secure) {\n    console.info('[pwa] service worker requires HTTPS or localhost; skipping.');\n    return;\n  }\n  try {\n    const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });\n    reg.addEventListener('updatefound', () => {\n      const worker = reg.installing;\n      if (!worker) return;\n      worker.addEventListener('statechange', () => {\n        if (worker.state === 'installed' && navigator.serviceWorker.controller) {\n          toast('DigiPoke updated — reload to get the new version.', 'info', 6000);\n        }\n      });\n    });\n  } catch (err) {\n    console.warn('[pwa] service worker registration failed:', err);\n  }\n}\n\n/** Persist pending writes when the tab is hidden or closed. */\nfunction installLifecycleHooks() {\n  window.addEventListener('pagehide', () => { state.flush().catch(() => {}); });\n  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'hidden') state.flush().catch(() => {});\n  });\n\n  // First gesture unlocks the WebAudio context (browser autoplay policy).\n  const unlock = () => {\n    unlockAudio();\n    const st = state.isReady() ? state.getState() : null;\n    if (st?.settings) {\n      setSoundEnabled(st.settings.sound !== false);\n      setSfxVolume(st.settings.sfxVolume ?? 0.7);\n      setMusicVolume(st.settings.musicVolume ?? 0.35);\n      if (st.settings.music !== false && !document.body.classList.contains('in-onboarding')) startMusic('menu');\n    }\n    window.removeEventListener('pointerdown', unlock);\n    window.removeEventListener('keydown', unlock);\n  };\n  window.addEventListener('pointerdown', unlock, { once: true });\n  window.addEventListener('keydown', unlock, { once: true });\n\n  window.addEventListener('online', () => toast('Back online. Sync is available in Settings.', 'success'));\n  window.addEventListener('offline', () => toast('Offline — DigiPoke keeps working locally.', 'warn'));\n\n  window.addEventListener('beforeinstallprompt', (e) => {\n    e.preventDefault();\n    installEvent = e;\n    showInstallButton();\n  });\n\n  window.addEventListener('appinstalled', () => {\n    installEvent = null;\n    hideInstallButton();\n    toast('DigiPoke installed. It now works fully offline.', 'success');\n  });\n\n  window.addEventListener('error', (e) => console.error('[app] uncaught error:', e.error || e.message));\n  window.addEventListener('unhandledrejection', (e) => console.error('[app] unhandled rejection:', e.reason));\n\n  installAmbientSound();\n}\n\n/**\n * Global interaction audio.\n *\n * Screens cue their own bespoke sounds; this safety net guarantees that no\n * control is ever silent. Both handlers run in the bubble phase, after the\n * element's own handler, so `sinceLastSound()` tells us whether a specific cue\n * already fired — if it did, we stay out of the way instead of doubling up.\n */\nfunction installAmbientSound() {\n  const HOVER_MS = 90;\n  const CLICK_MS = 60;\n  let lastHover = null;\n\n  document.addEventListener('click', (e) => {\n    const el = e.target.closest?.('button, .is-clickable, .list-row, .tabbar__item, input[type=\"checkbox\"]');\n    if (!el || el.disabled) return;\n    if (sinceLastSound() > CLICK_MS) sfx.click();\n  });\n\n  document.addEventListener('pointerover', (e) => {\n    const el = e.target.closest?.('button, .is-clickable, .list-row, .tabbar__item');\n    if (!el || el.disabled || el === lastHover) return;\n    lastHover = el;\n    if (sinceLastSound() > HOVER_MS) sfx.hover();\n  });\n\n  document.addEventListener('pointerout', (e) => {\n    if (e.target === lastHover) lastHover = null;\n  });\n}\n\n/** Offer the native install prompt when the browser supports it. */\nfunction showInstallButton() {\n  if (document.getElementById('install-btn')) return;\n  const bar = topbar;\n  if (!bar) return;\n  bar.appendChild(h('button#install-btn.icon-btn', {\n    type: 'button', title: 'Install DigiPoke', 'aria-label': 'Install DigiPoke',\n    onclick: async () => {\n      if (!installEvent) return;\n      installEvent.prompt();\n      const { outcome } = await installEvent.userChoice;\n      if (outcome === 'accepted') toast('Installing…', 'success');\n      installEvent = null;\n      hideInstallButton();\n    },\n  }, '⤓'));\n}\n\nfunction hideInstallButton() {\n  document.getElementById('install-btn')?.remove();\n}\n\n/**\n * Boot the application.\n * @returns {Promise<void>}\n */\nexport async function boot() {\n  view = qs('#view');\n  topbar = qs('#topbar');\n  tabbar = qs('#tabbar');\n\n  initUi();\n\n  try {\n    await state.init();\n  } catch (err) {\n    console.error('[boot] failed to load save:', err);\n    toast('Could not open local storage. Private browsing may be blocking IndexedDB.', 'error', 8000);\n  }\n\n  registerRoutes();\n\n  // Keep chrome and screens in sync with state changes.\n  on(EVENTS.STATE_CHANGED, () => {\n    if (!state.hasProfile()) {\n      // e.g. after \"delete all data\": never render a screen against a null save.\n      if (activePath() !== '/onboarding') navigate('/onboarding');\n      return;\n    }\n    applyTheme(state.getState().settings.theme);\n    refreshCurrent();\n  });\n\n  if (state.hasProfile()) {\n    applyTheme(state.getState().settings.theme);\n    setSoundEnabled(state.getState().settings.sound);\n  }\n\n  startRouter();\n  installLifecycleHooks();\n  await registerServiceWorker();\n\n  console.info('%cDigiPoke ready', 'color:#7c5cff;font-weight:bold', '— local-first, offline-capable.');\n}\n\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', boot);\n} else {\n  boot();\n}\n"}]}
  </script>

<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1">
      <div class="boot-screen">
        <div class="boot-screen__mark"></div>
        <p>Booting DigiPoke…</p>
      </div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">
      <h1>JavaScript required</h1>
      <p>DigiPoke is a local-first app: all of your data stays on this device, which means it runs entirely in your browser. Please enable JavaScript to continue.</p>
    </div>
  </noscript>
  <script type="module">
  /**
   * Blob-URL module loader for the single-file build.
   *
   * Creates one blob URL per module, in dependency order, substituting the
   * «key» placeholders with the URLs created before it, then boots the app by
   * importing the entry module. Same code, same semantics — just no files.
   */
  const payload = JSON.parse(document.getElementById('digipoke-modules').textContent);
  const urls = new Map();

  for (const mod of payload.modules) {
    let code = mod.code;
    for (const [key, url] of urls) {
      code = code.split('«' + key + '»').join(url);
    }
    if (code.includes('«')) {
      throw new Error('Unresolved module placeholder in ' + mod.key);
    }
    urls.set(mod.key, URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  }

  const entryUrl = urls.get(payload.entry);
  if (!entryUrl) throw new Error('Entry module not found: ' + payload.entry);
  import(entryUrl).catch((err) => {
    console.error(err);
    document.body.innerHTML = '<pre style="padding:24px;color:#ff8f7a;white-space:pre-wrap">'
      + 'DigiPoke failed to start:\n' + (err && err.stack ? err.stack : err) + '</pre>';
  });
  </script>

</html>
