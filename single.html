/**
 * tokens.css — Design tokens.
 *
 * Every visual constant in DigiPoke lives here: colours, spacing, radii,
 * typography, motion and elevation. Themes are pure token overrides keyed off
 * [data-theme], so adding a palette never touches component CSS.
 */

:root {
  /* ------------------------------------------------------------ palette */
  --bg:            #070b16;
  --bg-elev-1:     #0d1324;
  --bg-elev-2:     #141c33;
  --bg-elev-3:     #1c2745;
  --surface:       rgba(255, 255, 255, 0.045);
  --surface-hover: rgba(255, 255, 255, 0.085);
  --border:        rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.18);

  --text:          #e8edf9;
  --text-dim:      #a8b3cc;
  --text-faint:    #6f7d99;

  --accent:        #7c5cff;
  --accent-2:      #23d5ff;
  --accent-soft:   rgba(124, 92, 255, 0.16);
  --ok:            #4fd67c;
  --warn:          #ffd166;
  --danger:        #ff5f6d;
  --glitch:        #ff5fa2;

  /* --------------------------------------------------------- typography */
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-md: 0.95rem;
  --fs-lg: 1.1rem;
  --fs-xl: 1.4rem;
  --fs-2xl: 1.9rem;

  /* ------------------------------------------------------------ spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;
  --sp-7: 44px;

  /* -------------------------------------------------------------- shape */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 26px;
  --r-full: 999px;

  /* ----------------------------------------------------------- elevation */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 22px 60px rgba(0, 0, 0, 0.55);

  /* -------------------------------------------------------------- motion */
  --dur-fast: 120ms;
  --dur: 190ms;
  --dur-slow: 340ms;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);

  /* --------------------------------------------------------------- chrome */
  --topbar-h: 58px;
  --tabbar-h: 62px;
  --content-max: 1180px;
}

/* ---------------------------------------------------------------- themes */

[data-theme="ember"] {
  --bg: #120806;
  --bg-elev-1: #1c0e0a;
  --bg-elev-2: #2a1610;
  --bg-elev-3: #3a1d14;
  --accent: #ff7a45;
  --accent-2: #ffd166;
  --accent-soft: rgba(255, 122, 69, 0.18);
}

[data-theme="abyss"] {
  --bg: #03080f;
  --bg-elev-1: #061420;
  --bg-elev-2: #0a2032;
  --bg-elev-3: #0e2c44;
  --accent: #00e0c6;
  --accent-2: #3db4ff;
  --accent-soft: rgba(0, 224, 198, 0.14);
}

[data-theme="mono"] {
  --bg: #0a0a0b;
  --bg-elev-1: #131316;
  --bg-elev-2: #1c1c21;
  --bg-elev-3: #27272e;
  --accent: #d4d4d8;
  --accent-2: #a1a1aa;
  --accent-soft: rgba(212, 212, 216, 0.12);
  --ok: #a1a1aa;
  --danger: #e4e4e7;
}

/* Respect the OS reduced-motion preference globally; the app also has its own
   "Animations" setting, which scales durations rather than removing motion. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur: 0ms;
    --dur-slow: 0ms;
  }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================ extended design vocabulary
   Tokens added for the opening sequence, the character creator and the
   polished battle feedback layer. Kept separate from the core palette so the
   themes above stay readable.
   ====================================================================== */
:root {
  /* Type ramp */
  --fs-2xs: 11px;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 24px;
  --fs-2xl: 32px;
  --fs-3xl: clamp(34px, 9vw, 60px);

  /* Layout */
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shell-max: 1080px;
  --creator-max: 1120px;

  /* Feedback colours (used by floating numbers, ghost bars, coach cards) */
  --crit: #ffcf5c;
  --super: #ffd27a;
  --weak: #8aa0c0;
  --heal: #57e39b;
  --ghost: rgba(255, 255, 255, 0.28);

  /* Effects */
  --glow: 0 0 30px var(--accent-soft);
  --ring-shadow: 0 0 0 1px var(--border);

  /* Motion */
  --dur-fast: 120ms;
  --dur: 240ms;
  --dur-slow: 480ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-motion="off"] *,
[data-motion="off"] *::before,
[data-motion="off"] *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}


/* --------------------------------------------------------------- */

/**
 * app.css — Component and layout styles.
 *
 * Organised top-down: reset → chrome → primitives → screens → overlays →
 * utilities. All values come from tokens.css; no component defines a raw
 * colour except where a type palette is applied via the --chip custom property.
 */

/* ============================================================== 1. reset */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(124, 92, 255, 0.16), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(35, 213, 255, 0.12), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 var(--sp-3); }
button { font: inherit; color: inherit; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--surface); padding: 1px 5px; border-radius: 5px; }
ul, ol { margin: 0; padding-left: 1.1rem; }

::selection { background: var(--accent); color: #fff; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.skip-link {
  position: absolute; left: -999px; top: 0; z-index: 100;
  background: var(--accent); color: #fff; padding: var(--sp-2) var(--sp-4);
  border-radius: 0 0 var(--r-md) 0;
}
.skip-link:focus { left: 0; }

.noscript {
  max-width: 32rem; margin: 18vh auto; padding: var(--sp-5);
  background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: var(--r-lg);
}

/* ============================================================= 2. chrome */

.app-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg-elev-1) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.topbar__brand {
  display: flex; align-items: center; gap: var(--sp-2);
  cursor: pointer; background: none; border: 0; padding: var(--sp-1);
}
.topbar__mark { display: flex; width: 26px; height: 26px; }
.topbar__mark svg { width: 100%; height: 100%; }
.topbar__name { font-weight: 750; letter-spacing: -0.02em; font-size: var(--fs-lg); }

.topbar__stats { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); }

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer;
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-hover); transform: translateY(-1px); }

.view {
  flex: 1;
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) calc(var(--tabbar-h) + var(--sp-6) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}
.view:focus { outline: none; }

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  background: color-mix(in srgb, var(--bg-elev-1) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
.tabbar__item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  background: none; border: 0; cursor: pointer;
  color: var(--text-faint);
  transition: color var(--dur) var(--ease);
}
.tabbar__item.is-active { color: var(--accent-2); }
.tabbar__icon { font-size: 1.15rem; line-height: 1; }
.tabbar__label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.02em; }

body.in-battle .tabbar,
body.is-bare .tabbar,
body.is-bare .topbar { display: none; }
body.in-battle .view { padding-bottom: var(--sp-5); }

.boot-screen { margin: 22vh auto; text-align: center; color: var(--text-faint); }
.boot-screen__mark {
  width: 44px; height: 44px; margin: 0 auto var(--sp-3);
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========================================================= 3. primitives */

.card {
  background: linear-gradient(180deg, var(--surface), transparent);
  background-color: color-mix(in srgb, var(--bg-elev-1) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card--pad { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.card__title { font-size: var(--fs-lg); }

.stack { display: flex; flex-direction: column; gap: var(--sp-4); }

.grid { display: grid; gap: var(--sp-3); }
.grid--auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.row { display: flex; gap: var(--sp-2); align-items: center; }
.row--wrap { flex-wrap: wrap; }
.row--end { justify-content: flex-end; }
.row--between { justify-content: space-between; }

.muted { color: var(--text-dim); }
.muted--sm { font-size: var(--fs-sm); }

.section-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
}
.section-head__title { font-size: var(--fs-lg); }

.empty {
  padding: var(--sp-5);
  text-align: center;
  color: var(--text-faint);
  border: 1px dashed var(--border);
  border-radius: var(--r-md);
  display: flex; flex-direction: column; gap: var(--sp-3); align-items: center;
}

/* ------------------------------------------------------------- buttons */

.btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 9px 15px;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--dur) var(--ease), transform var(--dur-fast) var(--ease),
              border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn:hover:not(:disabled) { background: var(--surface-hover); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.985); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }

.btn--primary {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, var(--accent-2)));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 32%, transparent);
}
.btn--primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn--ghost { background: transparent; }
.btn--danger { background: color-mix(in srgb, var(--danger) 18%, transparent); border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: #ffd9dc; }
.btn--sm { padding: 6px 11px; font-size: var(--fs-xs); }
.btn--lg { padding: 12px 20px; font-size: var(--fs-md); }
.btn--block { width: 100%; }

.seg {
  display: inline-flex;
  padding: 3px;
  gap: 3px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  flex-wrap: wrap;
}
.seg-btn {
  border: 0; background: transparent; color: var(--text-dim);
  padding: 7px 14px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg-btn.is-active { background: var(--accent); color: #fff; }

/* -------------------------------------------------------------- inputs */

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: var(--sp-3); }
.field--inline { flex-direction: row; align-items: center; gap: var(--sp-2); margin-bottom: 0; }
.field__label { font-size: var(--fs-sm); color: var(--text-dim); font-weight: 600; }

.input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font: inherit;
  font-size: var(--fs-sm);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input--sm { padding: 6px 10px; width: auto; }

.pass-strength { height: 5px; margin-top: 6px; background: var(--bg-elev-2); border-radius: var(--r-full); overflow: hidden; }
.pass-strength__fill { height: 100%; width: 0; background: var(--danger); transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }
.pass-strength[data-score="2"] .pass-strength__fill { background: var(--warn); }
.pass-strength[data-score="3"] .pass-strength__fill { background: #9ae66e; }
.pass-strength[data-score="4"] .pass-strength__fill { background: var(--ok); }

.toggle { display: flex; align-items: center; gap: var(--sp-3); cursor: pointer; padding: 4px 0; }
.toggle__label { flex: 1; font-size: var(--fs-sm); }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle__track {
  width: 42px; height: 24px; border-radius: var(--r-full);
  background: var(--bg-elev-3); border: 1px solid var(--border);
  position: relative; transition: background var(--dur) var(--ease);
}
.toggle__track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--text-dim);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.toggle input:checked + .toggle__track { background: var(--accent); }
.toggle input:checked + .toggle__track::after { transform: translateX(18px); background: #fff; }
.toggle input:focus-visible + .toggle__track { box-shadow: 0 0 0 3px var(--accent-soft); }

.form-error { color: var(--danger); font-size: var(--fs-sm); min-height: 1.2em; }

/* ------------------------------------------------- chips, pills, badges */

.chip-row { display: flex; flex-wrap: wrap; gap: 5px; }

.chip {
  --chip: var(--accent);
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
  background: color-mix(in srgb, var(--chip) 22%, transparent);
  color: color-mix(in srgb, var(--chip) 78%, #ffffff);
  border: 1px solid color-mix(in srgb, var(--chip) 42%, transparent);
  white-space: nowrap;
}
.chip--sm { padding: 2px 7px; font-size: 0.68rem; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border-radius: var(--r-full);
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-dim);
  white-space: nowrap;
}
.pill--shards { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 35%, transparent); }
.pill--sync { color: var(--text-faint); }
.pill--sync.is-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.pill--sync.is-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill--sync.is-busy { color: var(--accent-2); }
.pill--stage { font-size: 0.66rem; padding: 1px 6px; background: var(--accent-soft); border-color: transparent; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--r-full);
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
}
.badge--primary { background: var(--accent); color: #fff; border-color: transparent; }
.badge--ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge--muted { color: var(--text-faint); }
.badge--glitch {
  background: linear-gradient(90deg, var(--glitch), var(--accent-2));
  color: #0b1020; border-color: transparent;
}
.badge--status { --chip: var(--warn); background: color-mix(in srgb, var(--chip) 20%, transparent); color: color-mix(in srgb, var(--chip) 80%, #fff); border-color: color-mix(in srgb, var(--chip) 40%, transparent); }

/* ----------------------------------------------------------------- bars */

.bar {
  height: 8px;
  background: var(--bg-elev-3);
  border-radius: var(--r-full);
  overflow: hidden;
  border: 1px solid rgba(0, 0, 0, 0.25);
}
.bar--thin { height: 5px; }
.bar__fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: var(--r-full);
  transition: width var(--dur-slow) var(--ease);
}
.bar--xp .bar__fill, .bar__fill--xp { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }

.stat-row { display: flex; flex-direction: column; gap: 3px; }
.stat-row__head { display: flex; justify-content: space-between; font-size: var(--fs-xs); }
.stat-row__label { color: var(--text-dim); font-weight: 600; }
.stat-row__value { color: var(--text); font-variant-numeric: tabular-nums; }

.hp { display: flex; flex-direction: column; gap: 3px; }
.hp__track { height: 9px; background: var(--bg-elev-3); border-radius: var(--r-full); overflow: hidden; border: 1px solid rgba(0,0,0,.25); }
.hp__fill {
  height: 100%; border-radius: var(--r-full);
  transition: width var(--dur-slow) var(--ease), background var(--dur) var(--ease);
}
.hp__fill--healthy { background: linear-gradient(90deg, #2fbf5f, var(--ok)); }
.hp__fill--hurt { background: linear-gradient(90deg, #d8a12a, var(--warn)); }
.hp__fill--critical { background: linear-gradient(90deg, #c8372f, var(--danger)); }
.hp__fill--fainted { background: #4a4a55; }
.hp__numbers { font-size: var(--fs-xs); color: var(--text-dim); font-variant-numeric: tabular-nums; }
.hp--compact .hp__track { height: 6px; }

/* -------------------------------------------------------------- sprites */

.sprite-wrap { display: grid; place-items: center; line-height: 0; }
.sprite { display: block; overflow: visible; }
.sprite--idle { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.sprite--attack { animation: lunge 420ms var(--ease); }
.sprite--hurt { animation: shake 320ms var(--ease); }
.sprite--faint { animation: faint 620ms var(--ease) forwards; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }
@keyframes lunge { 0% { transform: translateX(0); } 40% { transform: translateX(14%) scale(1.04); } 100% { transform: translateX(0); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7%); }
  40% { transform: translateX(6%); }
  60% { transform: translateX(-4%); }
  80% { transform: translateX(3%); }
}
@keyframes faint {
  to { transform: translateY(24%) scale(0.86); opacity: 0.25; filter: grayscale(1); }
}
body:not(.motion-off) .sprite--idle { animation-play-state: running; }

/* -------------------------------------------------------- creature card */

.creature-card {
  background: color-mix(in srgb, var(--bg-elev-1) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.creature-card.is-clickable { cursor: pointer; }
.creature-card.is-clickable:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: var(--shadow-2); }
.creature-card.is-selected { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 1px var(--accent-soft); }
.creature-card__top { display: flex; gap: var(--sp-3); align-items: center; }
.creature-card__id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.creature-card__name { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-md); flex-wrap: wrap; }
.creature-card__meta { font-size: var(--fs-xs); color: var(--text-faint); }
.creature-card__stats { display: flex; flex-direction: column; gap: 5px; }
.creature-card__footer { display: flex; gap: 6px; flex-wrap: wrap; }
.creature-card__note { font-size: var(--fs-xs); color: var(--accent-2); }
.creature-card__actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ========================================================= 4. onboarding */

.view--onboarding { max-width: 720px; }
.onboard__head { text-align: center; padding: var(--sp-5) 0 var(--sp-3); }
.onboard__title {
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: -0.035em;
}
.onboard__sub { color: var(--text-dim); }
.onboard__steps { display: flex; gap: var(--sp-2); justify-content: center; margin-top: var(--sp-3); }
.onboard__step {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: var(--fs-xs); font-weight: 700;
  background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text-faint);
}
.onboard__step.is-active { background: var(--accent); color: #fff; border-color: transparent; }
.onboard__step.is-done { background: var(--ok); color: #06210f; border-color: transparent; }

.starter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-3); }
.starter-card {
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  cursor: pointer; text-align: center;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.starter-card:hover { transform: translateY(-4px); background: var(--bg-elev-3); }
.starter-card.is-selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.starter-card__name { font-weight: 750; font-size: var(--fs-lg); }
.starter-card__lore { font-size: var(--fs-xs); color: var(--text-dim); min-height: 2.6em; }
.starter-card__stats { display: flex; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }

.help-list { display: flex; flex-direction: column; gap: var(--sp-2); margin: 0 0 var(--sp-4); padding-left: 1.2rem; color: var(--text-dim); font-size: var(--fs-sm); }
.help-list li::marker { color: var(--accent-2); }
.ready-starter { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3); background: var(--bg-elev-2); border-radius: var(--r-md); }
.ready-starter__name { font-weight: 700; }

/* ========================================================== 5. dashboard */

.hero { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.hero__avatar { width: 64px; height: 64px; border-radius: var(--r-md); overflow: hidden; background: var(--bg-elev-2); flex: none; }
.hero__avatar svg { width: 100%; height: 100%; display: block; }
.hero__id { flex: 1; min-width: 180px; }
.hero__name { font-size: var(--fs-xl); }
.hero__meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.hero__shards { text-align: right; }
.hero__shard-value { display: block; font-size: var(--fs-xl); font-weight: 750; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.hero__shard-label { font-size: var(--fs-xs); color: var(--text-faint); }
.hero__bars { margin-top: var(--sp-2); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: var(--sp-2); }
.stat-box {
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--sp-2); text-align: center;
}
.stat-box__value { display: block; font-size: var(--fs-lg); font-weight: 750; font-variant-numeric: tabular-nums; }
.stat-box__label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }

.objective-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.objective { display: flex; align-items: center; gap: var(--sp-3); }
.objective__main { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.objective__text { font-size: var(--fs-sm); font-weight: 600; }
.objective__meta { font-size: var(--fs-xs); color: var(--text-faint); }

.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--sp-2); }
.team-slot {
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--sp-2);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.team-slot:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.team-slot__name { font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.team-slot--empty { color: var(--text-faint); font-size: var(--fs-xs); min-height: 96px; display: grid; place-items: center; cursor: default; border-style: dashed; }

.quick-action {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3);
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; text-align: left;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
/* First run: one obvious door. The Explore tile breathes until it is used. */
.quick-action.is-hint {
  position: relative;
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  animation: hint-glow 2.6s var(--ease) infinite;
}
@keyframes hint-glow {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 38%, transparent); }
  70%      { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); }
}

.quick-action:hover { transform: translateY(-2px); background: var(--bg-elev-3); }
.quick-action--primary { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.quick-action__icon { font-size: 1.3rem; }
.quick-action__title { font-weight: 700; font-size: var(--fs-sm); }
.quick-action__text { font-size: var(--fs-xs); color: var(--text-dim); }

/* ============================================================== 6. ranch */

.detail { display: flex; flex-direction: column; gap: var(--sp-3); }
.detail__head { display: flex; gap: var(--sp-4); align-items: center; }
.detail__id { display: flex; flex-direction: column; gap: 5px; }
.detail__name { display: flex; align-items: center; gap: 6px; font-size: var(--fs-lg); font-weight: 750; flex-wrap: wrap; }
.detail__species { font-size: var(--fs-sm); color: var(--text-dim); }
.detail__lore { font-size: var(--fs-xs); color: var(--text-faint); font-style: italic; margin: 0; }
.detail__xp { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); color: var(--text-dim); }
.detail__sub { font-size: var(--fs-sm); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.detail__stats { display: flex; flex-direction: column; gap: 6px; }
.detail__cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: var(--sp-2); }
.core-cell { background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.core-cell__label { font-size: 0.64rem; color: var(--text-faint); font-weight: 700; letter-spacing: 0.06em; }
.core-cell__value { font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; }
.detail__moves { display: flex; flex-direction: column; gap: 5px; }
.move-row {
  display: grid; grid-template-columns: 1.3fr auto auto; gap: var(--sp-2);
  align-items: center;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 7px 10px;
}
.move-row__name { font-weight: 650; font-size: var(--fs-sm); }
.move-row__power { font-size: var(--fs-xs); color: var(--text-dim); font-variant-numeric: tabular-nums; }
.move-row__desc { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--text-faint); }
.detail__evo { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); background: var(--accent-soft); border-radius: var(--r-md); font-size: var(--fs-sm); }
.detail__footer { display: flex; gap: 6px; flex-wrap: wrap; }

/* ============================================================ 7. explore */

.zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }
.zone-card {
  --zone: var(--accent);
  text-align: left;
  background: color-mix(in srgb, var(--zone) 8%, var(--bg-elev-1));
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
  cursor: pointer;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.zone-card:hover:not(.is-locked) { transform: translateY(-3px); border-color: color-mix(in srgb, var(--zone) 55%, transparent); }
.zone-card.is-selected { border-color: var(--zone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--zone) 18%, transparent); }
.zone-card.is-locked { opacity: 0.55; cursor: not-allowed; }
.zone-card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.zone-card__name { font-weight: 700; }
.zone-card__blurb { font-size: var(--fs-xs); color: var(--text-dim); margin: 0; }
.zone-card__pool { display: flex; gap: 2px; flex-wrap: wrap; }
.zone-card__lock { font-size: 1.4rem; }

.encounter-list { display: flex; flex-direction: column; gap: 5px; }
.encounter-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 6px 10px;
  background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: var(--r-sm);
}
.encounter-row__name { font-weight: 650; font-size: var(--fs-sm); }
.encounter-row__weight { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }

/* ============================================================= 8. battle */

.arena {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--sp-3);
  padding: var(--sp-4);
  background:
    radial-gradient(600px 300px at 20% 10%, rgba(124, 92, 255, 0.14), transparent 65%),
    radial-gradient(500px 260px at 85% 90%, rgba(35, 213, 255, 0.12), transparent 60%),
    var(--bg-elev-1);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  position: relative;
  overflow: hidden;
}
.arena__vs {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: var(--fs-xs); letter-spacing: 0.3em; color: var(--text-faint);
  background: var(--bg); border-radius: var(--r-full); padding: 2px 10px;
  border: 1px solid var(--border);
}
.arena__foe { display: flex; justify-content: flex-end; }
.arena__ally { display: flex; justify-content: flex-start; }

.combat-card {
  width: min(100%, 340px);
  background: color-mix(in srgb, var(--bg-elev-2) 92%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.combat-card--foe { align-items: flex-start; }
.combat-card__id { display: flex; flex-direction: column; gap: 4px; }
.combat-card__name { display: flex; align-items: center; gap: 6px; font-weight: 700; flex-wrap: wrap; }
.combat-card__meta { font-size: var(--fs-xs); color: var(--text-faint); }
.combat-card__sprite { align-self: center; }
.combat-card__sprite .sprite { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5)); }
.combat-card__stage-row { display: flex; gap: 4px; flex-wrap: wrap; }
.combat-card.is-hit { animation: shake 300ms var(--ease); }
.combat-card--empty { opacity: 0.4; display: grid; place-items: center; min-height: 80px; }

.log {
  height: 132px;
  overflow-y: auto;
  padding: var(--sp-3);
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  display: flex; flex-direction: column; gap: 3px;
  scroll-behavior: smooth;
}
.log__line { color: var(--text-dim); }
.log__line--move { color: var(--text); font-weight: 600; }
.log__line--good { color: var(--ok); }
.log__line--bad { color: var(--danger); }
.log__line--warn { color: var(--warn); }

.battle-menu { min-height: 190px; }
.menu-root { display: flex; flex-direction: column; gap: var(--sp-3); }
.move-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--sp-2); }
.move-btn {
  --chip: var(--accent);
  text-align: left;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 9px 11px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 5px;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.move-btn:hover { transform: translateY(-2px); background: var(--bg-elev-3); border-color: var(--border-strong); }
.move-btn__top { display: flex; justify-content: space-between; gap: var(--sp-2); }
.move-btn__name { font-weight: 700; font-size: var(--fs-sm); }
.move-btn__power { font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.move-btn__bottom { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.move-btn__eff { font-size: 0.68rem; font-weight: 800; padding: 1px 6px; border-radius: var(--r-full); }
.move-btn__eff--up { background: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
.move-btn__eff--down { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.move-btn__eff--none { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.menu-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.menu-panel { display: flex; flex-direction: column; gap: var(--sp-2); }
.menu-panel__list { display: flex; flex-direction: column; gap: 5px; }

.list-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 9px 12px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer; text-align: left; width: 100%;
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.list-row:hover:not(:disabled) { background: var(--bg-elev-3); transform: translateX(2px); }
.list-row:disabled { opacity: 0.42; cursor: not-allowed; }
.list-row__name { font-size: var(--fs-sm); font-weight: 650; }
.list-row__meta { margin-left: auto; font-size: var(--fs-xs); color: var(--text-faint); }
.list-row--team { gap: var(--sp-2); }

.menu-panel--result { gap: var(--sp-3); padding: var(--sp-3); background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: var(--r-lg); }
.result__title { font-size: var(--fs-xl); }
.result__title--win, .result__title--caught { color: var(--ok); }
.result__title--lose { color: var(--danger); }
.result__title--flee { color: var(--warn); }
.result__list { color: var(--text-dim); font-size: var(--fs-sm); }

/* ================================================================= 9. lab */

.path-list { display: flex; flex-direction: column; gap: 6px; }
.path-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-3); align-items: center;
  padding: 8px 10px; background: var(--bg-elev-2);
  border: 1px solid var(--border); border-radius: var(--r-sm);
}
.path-row__main { display: flex; flex-direction: column; gap: 4px; }
.path-row__names { font-size: var(--fs-sm); font-weight: 650; }
.path-row__meta { font-size: var(--fs-xs); color: var(--text-faint); }

.core-panel { display: flex; flex-direction: column; gap: var(--sp-3); }
.core-panel__head { display: flex; gap: var(--sp-4); align-items: center; flex-wrap: wrap; }
.core-panel__head > div { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
.core-panel__name { font-weight: 700; }
.core-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--sp-2); }
.core-btn {
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--sp-2);
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
  cursor: pointer; transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.core-btn:hover:not(:disabled) { background: var(--bg-elev-3); border-color: var(--border-strong); }
.core-btn.is-selected { border-color: var(--accent); }
.core-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.core-btn__label { font-size: 0.66rem; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 800; }
.core-btn__value { font-size: var(--fs-lg); font-weight: 750; font-variant-numeric: tabular-nums; }
.core-btn__cost { font-size: var(--fs-xs); color: var(--accent-2); }

.tutor-list { display: flex; flex-direction: column; gap: 5px; }

.picker { display: flex; gap: 6px; flex-wrap: wrap; }
.picker__item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 5px 8px; cursor: pointer;
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.picker__item:hover { transform: translateY(-2px); }
.picker__item.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.picker__label { font-size: 0.66rem; color: var(--text-faint); }

.shop-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.shop-row {
  display: flex; gap: var(--sp-3); align-items: center; justify-content: space-between;
  padding: var(--sp-3); background: var(--bg-elev-2);
  border: 1px solid var(--border); border-radius: var(--r-md); flex-wrap: wrap;
}
.shop-row__main { display: flex; flex-direction: column; gap: 4px; }
.shop-row__name { font-weight: 700; }
.shop-row__desc { font-size: var(--fs-xs); color: var(--text-dim); margin: 0; }
.shop-row__buy { display: flex; gap: 6px; }

/* =========================================================== 10. settings */

.kv-list { display: flex; flex-direction: column; }
.kv-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.kv-row:last-child { border-bottom: 0; }
.kv-row__label { min-width: 130px; color: var(--text-dim); font-size: var(--fs-sm); }
.kv-row__value { flex: 1; font-variant-numeric: tabular-nums; word-break: break-all; }
.kv-row__action { flex: none; }

.backup-list { display: flex; flex-direction: column; gap: 5px; }

/* ============================================== 11. overlays: modal/toast */

.modal__backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4, 7, 14, 0.72);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
  padding: var(--sp-4);
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
}
.modal__backdrop.is-in { opacity: 1; }
.modal__panel {
  width: 100%;
  max-height: min(86dvh, 760px);
  overflow: auto;
  background: var(--bg-elev-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  padding: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
  transform: translateY(14px) scale(0.98);
  transition: transform var(--dur) var(--ease);
}
.modal__backdrop.is-in .modal__panel { transform: none; }
.modal__panel--sm { max-width: 380px; }
.modal__panel--md { max-width: 560px; }
.modal__panel--lg { max-width: 780px; }
.modal__title { font-size: var(--fs-lg); }
.modal__text { color: var(--text-dim); font-size: var(--fs-sm); }
.modal__actions { display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--sp-2); }

.toast-root {
  position: fixed;
  left: 50%; bottom: calc(var(--tabbar-h) + var(--sp-3) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 80;
  display: flex; flex-direction: column; gap: var(--sp-2);
  width: min(92vw, 420px);
  pointer-events: none;
}
.toast {
  padding: 10px 14px;
  border-radius: var(--r-md);
  background: var(--bg-elev-3);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast.is-in { opacity: 1; transform: none; }
.toast--success { border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.toast--error { border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.toast--warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
body.in-battle .toast-root { bottom: var(--sp-4); }


/* ------------------------------------- classes the UI relies on (audit) */

/* Wrapper for the identity/appearance/partner steps of the wizard. */
.creator {
  max-width: var(--creator-max);
  margin: 0 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-6);
}
.helpbox {
  margin-top: var(--sp-4);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--bg-elev-1);
  color: var(--text-dim);
  font-size: var(--fs-sm);
  line-height: 1.6;
}
.helpbox p { margin: 0 0 var(--sp-2); }
.helpbox p:last-child { margin-bottom: 0; }

.launch__fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  border-radius: var(--r-full);
  transition: width 300ms linear;
  box-shadow: 0 0 18px var(--accent-soft);
}

/* Splash logo: the mark is drawn in SVG, the life is added here. */
.logo-spin { transform-origin: 60px 60px; animation: spin 18s linear infinite; }
.logo-pulse { transform-origin: 60px 60px; animation: ring-breathe 2.6s ease-in-out infinite; }
.logo-core { animation: core-glow 2.2s ease-in-out infinite; }
@keyframes core-glow {
  0%, 100% { opacity: .8; }
  50% { opacity: 1; filter: drop-shadow(0 0 8px #23d5ff); }
}

.combat-card__stages { display: flex; flex-wrap: wrap; gap: 4px; min-height: 4px; }
.chip--type { letter-spacing: .06em; text-transform: uppercase; font-size: 0.64rem; }
.empty__text { max-width: 42ch; margin: 0; }
.modal__body { display: flex; flex-direction: column; gap: var(--sp-3); }
.pass-strength { flex: 1; }
.pass-strength__label { font-size: var(--fs-xs); font-weight: 700; min-width: 54px; text-align: right; }
.pill--ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.path-row__types { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ============================================ 11b. opening sequence
   Splash → identity → appearance → partner → launch. Everything here is
   self-contained: no images, no web fonts, no external requests.
   ====================================================================== */

/* ---------------------------------------------------------------- splash */

.splash {
  position: relative;
  min-height: calc(100dvh - 56px);
  display: grid;
  place-items: center;
  text-align: center;
  padding: var(--sp-5) var(--sp-4) 96px;
  overflow: hidden;
  isolation: isolate;
}
.splash__sky {
  position: absolute;
  inset: -20% -10% 0;
  z-index: -2;
  background:
    radial-gradient(60% 50% at 20% 15%, var(--accent-soft), transparent 70%),
    radial-gradient(50% 45% at 82% 25%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 72%),
    radial-gradient(70% 60% at 50% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  filter: blur(6px);
  animation: sky-drift 26s ease-in-out infinite alternate;
}
/* Slow-drifting starfield; two layers give parallax without any assets. */
.splash__sky::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 34% 68%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(2px 2px at 68% 18%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 84% 62%, rgba(255,255,255,.3) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 52% 86%, rgba(255,255,255,.3) 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,.4) 50%, transparent 51%);
  animation: twinkle 5.5s ease-in-out infinite alternate;
}
@keyframes sky-drift {
  0%   { transform: translate3d(-2%, 0, 0) scale(1.02); }
  100% { transform: translate3d(2%, -2%, 0) scale(1.08); }
}
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

/* Light shaft behind the wordmark: one slow sweep is enough to make a static
   title screen feel staged rather than assembled. */
.splash__beam {
  position: absolute; left: 50%; top: -18%;
  width: min(560px, 90vw); height: 120%;
  z-index: -1; pointer-events: none;
  transform: translateX(-50%) rotate(6deg);
  background: linear-gradient(100deg,
    transparent 38%,
    color-mix(in srgb, var(--accent-2) 14%, transparent) 48%,
    color-mix(in srgb, var(--accent) 16%, transparent) 52%,
    transparent 62%);
  filter: blur(14px);
  animation: beam-sweep 9s ease-in-out infinite alternate;
}
@keyframes beam-sweep {
  0%   { transform: translateX(-54%) rotate(4deg); opacity: .7; }
  100% { transform: translateX(-46%) rotate(9deg); opacity: 1; }
}
/* Vignette: pulls the eye to the centre and hides the seams of the gradient. */
.splash__vignette {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%);
}

.splash__logo { line-height: 0; margin-bottom: var(--sp-3); filter: drop-shadow(0 10px 30px var(--accent-soft)); }
.splash__logo .logo { width: clamp(112px, 26vw, 176px); height: auto; }

.splash__title {
  margin: 0;
  font-size: var(--fs-3xl);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  background: linear-gradient(180deg, var(--text), var(--accent-2) 70%, var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rise 620ms var(--ease-out) both;
}
.splash__tagline {
  margin: var(--sp-3) auto 0;
  max-width: 34ch;
  color: var(--text-dim);
  font-size: var(--fs-md);
  animation: rise 620ms 90ms var(--ease-out) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.splash__creatures {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(4px, 3vw, 26px);
  margin: var(--sp-4) 0 var(--sp-2);
  animation: rise 700ms 180ms var(--ease-out) both;
}
.splash__creature {
  filter: drop-shadow(0 14px 22px rgba(0,0,0,.45));
  transform-origin: 50% 85%;
  /* Three across has to survive a 320px screen. */
  width: clamp(76px, 25vw, 128px);
}
.splash__creature svg { width: 100%; height: auto; }
.splash__creature .portrait__ring,
.splash__creature .portrait__platform { animation-delay: inherit; }
.splash__creature-art { line-height: 0; }
.splash__creature-name {
  margin-top: 2px; font-size: var(--fs-2xs); font-weight: 700;
  letter-spacing: .06em; color: var(--text);
}
.splash__creature-type {
  font-size: 9px; text-transform: uppercase; letter-spacing: .14em;
  color: var(--text-faint);
}
.splash__creature--0 { animation: bob 4.4s ease-in-out infinite; }
.splash__creature--1 { animation: bob 4.0s .5s ease-in-out infinite; }
.splash__creature--2 { animation: bob 4.8s .9s ease-in-out infinite; }

.splash__start { animation: rise 700ms 260ms var(--ease-out) both; }
.splash__meta {
  display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap;
  margin-top: var(--sp-3);
  animation: rise 700ms 340ms var(--ease-out) both;
}
.splash__hint {
  margin-top: var(--sp-4); font-size: var(--fs-xs); color: var(--text-dim); opacity: .75;
  animation: rise 700ms 420ms var(--ease-out) both;
}
/* Short viewports (landscape phones, small laptops): the title screen has to
   fit without scrolling, so the least important layers drop out first. */
@media (max-height: 640px) {
  .splash { min-height: calc(100dvh - 48px); padding-bottom: 64px; }
  .splash__logo { margin-bottom: var(--sp-1); }
  .splash__logo svg { width: 96px; height: 96px; }
  .splash__title { font-size: clamp(28px, 7vw, 40px); }
  .splash__tagline { margin-top: var(--sp-2); font-size: var(--fs-sm); }
  .splash__creatures { gap: clamp(2px, 2vw, 14px); }
  .splash__creature { width: clamp(58px, 17vw, 86px); }
  .splash__hint { display: none; }
  .splash__keys { display: none; }
}

.btn--xl { font-size: var(--fs-lg); padding: 14px 34px; border-radius: var(--r-full); }
/* The button is the only affordance on the title screen, so it keeps a slow
   heartbeat until the player notices it. Box-shadow rather than transform —
   the entry animation already owns transform. */
@keyframes start-glow {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 46%, transparent), var(--shadow-2); }
  70%      { box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 0%, transparent), var(--shadow-2); }
}
.splash__start.is-ready {
  animation: rise 700ms 260ms var(--ease-out) both, start-glow 2.4s 1.1s ease-in-out infinite;
}
.splash__keys {
  margin-top: var(--sp-2); font-size: var(--fs-2xs); color: var(--text-faint);
}
.splash__keys kbd {
  display: inline-block; padding: 1px 6px; margin: 0 2px;
  border: 1px solid var(--border-strong); border-radius: 5px;
  background: var(--bg-elev-2); font-family: var(--font-mono); font-size: 10px;
  color: var(--text-dim);
}

/* --------------------------------------------------------------- creator */

/* Each wizard step slides in rather than snapping, which is most of what makes
   the sequence feel directed instead of merely sequential. */
@keyframes step-in {
  from { opacity: 0; transform: translateY(12px) scale(.995); }
  to   { opacity: 1; transform: none; }
}
.view--onboarding.is-step-1 .creator,
.view--onboarding.is-step-2 .creator,
.view--onboarding.is-step-3 .creator { animation: step-in 360ms var(--ease-out) both; }
.view--onboarding.is-step-2 .creator__preview,
.view--onboarding.is-step-3 .creator__preview { animation: step-in 360ms 60ms var(--ease-out) both; }
.view--onboarding.is-step-3 .starter-grid { animation: step-in 360ms 40ms var(--ease-out) both; }

.creator__head { text-align: center; margin-bottom: var(--sp-4); }
.creator__title { margin: 0 0 4px; font-size: var(--fs-2xl); letter-spacing: -0.02em; }
.creator__grid {
  display: grid;
  gap: var(--sp-5);
  align-items: start;
}
.creator__preview { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }

/* Portrait stage: a lit pedestal so the avatar reads as a character. */
.stage { position: relative; display: grid; place-items: center; padding: var(--sp-4); }
.stage__ring {
  position: absolute;
  width: min(78%, 300px); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, var(--accent-soft), transparent 62%);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  animation: ring-breathe 5s ease-in-out infinite;
}
.stage__ring::after {
  content: '';
  position: absolute; inset: 8%;
  border-radius: 50%;
  border: 1px dashed color-mix(in srgb, var(--accent-2) 28%, transparent);
  animation: spin 26s linear infinite;
}
.stage__avatar { position: relative; filter: drop-shadow(0 16px 26px rgba(0,0,0,.45)); }

/* Character editor: the pedestal reacts to every accepted change, previews on
   hover/focus, and names the option under the cursor. */
.stage__sparks {
  position: absolute; inset: 0; display: grid; place-items: center;
  pointer-events: none; z-index: 2;
}
.spark {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  opacity: 0; transform: translate(0, 0) scale(.6);
  animation: spark-fly 760ms var(--ease-out) var(--sd, 0ms) forwards;
  box-shadow: 0 0 10px currentColor;
}
@keyframes spark-fly {
  0%   { opacity: 0; transform: translate(0, 0) scale(.5); }
  25%  { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(1); }
}
.stage__avatar.is-pop { animation: avatar-pop 460ms var(--ease-spring); }
@keyframes avatar-pop {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.07) translateY(-4px); }
  100% { transform: scale(1); }
}
.stage__avatar.is-preview { filter: drop-shadow(0 16px 26px rgba(0,0,0,.45)) drop-shadow(0 0 22px var(--accent-soft)); }
.stage__caption {
  margin: var(--sp-3) 0 0; min-height: 1.2em;
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: .02em;
  color: var(--text-dim); opacity: .6;
  transition: opacity var(--dur) var(--ease), color var(--dur) var(--ease);
}
.stage__caption.is-visible { opacity: 1; color: var(--accent-2); }

/* On a phone the pedestal stays with you while you scroll the options. */
@media (max-width: 899px) {
  .creator__preview {
    position: sticky; top: 0; z-index: 3;
    padding: var(--sp-2) 0;
    background: linear-gradient(180deg, var(--bg) 72%, transparent);
  }
  .stage { padding: 0; }
  .stage__avatar svg { width: 150px; height: 150px; }
}
@keyframes ring-breathe { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.04); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }

.opt-group + .opt-group { margin-top: var(--sp-4); }
.opt-group__label {
  display: block; font-size: var(--fs-xs); font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-dim); margin-bottom: var(--sp-2);
}
.opt-group__options { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  min-width: 62px;
  padding: 8px 12px;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  background: var(--bg-elev-2);
  color: var(--text);
  font: inherit; font-size: var(--fs-sm); font-weight: 600;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-spring), background var(--dur-fast), border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.opt:hover { background: var(--bg-elev-3); transform: translateY(-1px); }
.opt:active { transform: translateY(0) scale(.97); }
.opt.is-active {
  background: var(--accent); border-color: transparent; color: #06121a;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
}
.opt--color {
  min-width: 0; width: 34px; height: 34px; padding: 0;
  border-radius: 50%;
  background: var(--swatch);
  box-shadow: inset 0 -6px 10px rgba(0,0,0,.28);
}
.opt--color.is-active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.editor-groups { max-height: 56vh; overflow-y: auto; padding-right: 4px; }

.input--lg { font-size: var(--fs-lg); padding: 14px 16px; }
.pass-strength-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: 6px; }
.pass-strength__fill { height: 100%; border-radius: var(--r-full); transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }

/* ------------------------------------------------------------- id card */

.idcard {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, var(--bg-elev-2), var(--bg-elev-1) 60%);
  box-shadow: var(--ring-shadow), 0 12px 30px rgba(0,0,0,.28);
}
.idcard__frame {
  position: relative; flex: 0 0 auto;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(from 140deg, var(--accent), var(--accent-2), var(--accent));
  box-shadow: 0 0 22px var(--accent-soft);
}
.idcard__body { min-width: 0; text-align: left; }
.idcard__label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .16em; color: var(--text-dim); }
.idcard__name {
  font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.idcard__row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
/* The ID card is a row on a desk and a column in a pocket. */
@media (max-width: 430px) {
  .idcard { flex-direction: column; text-align: center; gap: var(--sp-2); }
  .idcard__body { text-align: center; }
  .idcard__row, .idcard__id { justify-content: center; }
}

/* Identity step: the ID card is live, and the checklist means a disabled
   Continue button is never a mystery — the player can always see what is left. */
.idcard__id { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.idcard__id-label {
  font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .14em;
  color: var(--text-faint);
}
.idcard__id-value {
  font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 700;
  letter-spacing: .08em; color: var(--accent-2);
}
.idcard__id-value.is-rolling { animation: id-roll 320ms var(--ease-out); }
@keyframes id-roll {
  0%   { opacity: .25; transform: translateY(-3px); filter: blur(1.5px); }
  100% { opacity: 1; transform: none; filter: none; }
}

.identity-form { display: grid; gap: var(--sp-4); }
.help-toggle { align-self: flex-start; }
.field__label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
.field__counter {
  font-size: var(--fs-2xs); color: var(--text-faint);
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
}

.checklist { list-style: none; margin: var(--sp-4) 0 0; padding: 0; display: grid; gap: 7px; }
.checklist__item {
  display: flex; align-items: center; gap: 9px;
  font-size: var(--fs-sm); color: var(--text-dim);
  transition: color var(--dur) var(--ease);
}
.checklist__mark {
  width: 18px; height: 18px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elev-3);
  font-size: 11px; line-height: 1; font-weight: 700; color: transparent;
  transition: background var(--dur) var(--ease-spring), border-color var(--dur),
              color var(--dur), transform var(--dur) var(--ease-spring);
}
.checklist__label { min-width: 0; }
.checklist__item.is-done { color: var(--text); }
.checklist__item.is-done .checklist__mark {
  background: var(--ok); border-color: transparent; color: #06121a;
  animation: check-pop 340ms var(--ease-spring);
}
@keyframes check-pop {
  0%   { transform: scale(.55); }
  60%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* The moment Continue becomes available it should catch the eye. */
.btn.is-ready {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent),
              0 10px 28px color-mix(in srgb, var(--accent) 26%, transparent);
}
.btn.is-busy { display: inline-flex; align-items: center; gap: 9px; }
.spinner {
  width: 14px; height: 14px; flex: 0 0 auto;
  border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent;
  animation: spin 700ms linear infinite;
}
.is-shake { animation: shake 420ms var(--ease); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(5px); }
  60%      { transform: translateX(-3px); }
  80%      { transform: translateX(2px); }
}

/* --------------------------------------------------------------- partner */

.starter-card__art { display: grid; place-items: center; padding: var(--sp-2) 0; min-height: 132px; }
/* Starter cards: a type-tinted halo marks the choice, and a one-word
   playstyle tag does the comparing that raw numbers cannot. */
.starter-card__tag {
  margin-top: 2px; font-size: var(--fs-2xs); font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint);
}
.starter-card.is-selected .starter-card__tag { color: var(--accent-2); }
.starter-card.is-selected {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),
              0 14px 34px color-mix(in srgb, var(--accent) 22%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, var(--bg-elev-1)), var(--bg-elev-1));
}
.starter-card.is-selected .starter-card__art svg { animation: avatar-pop 520ms var(--ease-spring); }

.partner {
  display: grid; gap: var(--sp-4);
  margin-top: var(--sp-4);
  padding: var(--sp-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent-2) 8%, var(--bg-elev-1)), var(--bg-elev-1));
}
.partner__art { display: grid; place-items: center; }
.partner__info { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.partner__lore { margin: 0; color: var(--text-dim); font-size: var(--fs-sm); line-height: 1.6; }
.partner__stats { display: grid; gap: 8px; }
.partner__moves { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.partner__stat { display: grid; gap: 4px; }
.stat-row__potential {
  font-size: var(--fs-2xs); color: var(--text-faint);
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.partner__legend {
  margin: 2px 0 0; font-size: var(--fs-2xs); color: var(--text-faint);
}
.pill--label {
  background: transparent; border: 1px dashed var(--border-strong);
  color: var(--text-dim); text-transform: uppercase;
  font-size: var(--fs-2xs); letter-spacing: .08em;
}
.pill--next { background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); }


/* ---------------------------------------------------------------- launch */

.launch {
  min-height: calc(100dvh - 56px);
  display: grid; place-content: center; justify-items: center;
  gap: var(--sp-3); text-align: center; padding: var(--sp-5);
}
.launch__avatar { filter: drop-shadow(0 12px 24px var(--accent-soft)); animation: pulse-in 900ms var(--ease-out) both; }
/* A scan line passes over the Tamer while the profile is being written — the
   one moment in the sequence that should feel like machinery, not a menu. */
.launch__avatar { position: relative; overflow: hidden; border-radius: 50%; }
.launch__avatar::after {
  content: ''; position: absolute; left: 0; right: 0; height: 26%;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent-2) 55%, transparent), transparent);
  animation: scan-pass 1.5s var(--ease) infinite;
}
@keyframes scan-pass {
  0%   { top: -30%; opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { top: 105%; opacity: 0; }
}
.launch__title {
  margin: 0; font-size: var(--fs-xl); letter-spacing: -0.01em;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.launch__line {
  min-height: 1.6em; margin: 0;
  font-family: var(--font-mono, ui-monospace, monospace);
  font-size: var(--fs-md); color: var(--text);
  animation: flicker-in 260ms var(--ease) both;
}
.launch__bar {
  width: min(420px, 80vw); height: 8px;
  border-radius: var(--r-full); background: var(--bg-elev-3);
  overflow: hidden; border: 1px solid var(--border);
}
.launch__partner {
  display: flex; align-items: center; gap: var(--sp-2);
  color: var(--text-dim); font-size: var(--fs-sm);
  animation: rise 500ms 200ms var(--ease-out) both;
}
@keyframes pulse-in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
@keyframes flicker-in { from { opacity: 0; } 40% { opacity: .35; } to { opacity: 1; } }
.launch__line.is-fresh { animation: flicker-in 260ms var(--ease) both; }
.launch__pct {
  margin: 0; font-family: var(--font-mono);
  font-size: var(--fs-sm); color: var(--accent-2);
  font-variant-numeric: tabular-nums;
}
.launch__skip {
  margin: var(--sp-2) 0 0; font-size: var(--fs-2xs);
  color: var(--text-faint); opacity: .8;
}
.launch:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }


/* ------------------------------------------------------- profile header */

.profile-head { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.profile-head__avatar {
  border-radius: 50%; padding: 3px;
  background: conic-gradient(from 140deg, var(--accent), var(--accent-2), var(--accent));
  line-height: 0;
}
.profile-head__id { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.profile-head__name { font-size: var(--fs-lg); font-weight: 800; }
.profile-head__meta { font-size: var(--fs-xs); color: var(--text-dim); }

/* ====================================== 11c. battle feedback layer
   Chip damage, floating numbers and impact states. The point of all of it is
   legibility: the player should never have to read the log to know how hard
   they were hit.
   ====================================================================== */

.hp__track { position: relative; }
.hp__ghost {
  position: absolute; inset: 0 auto 0 0;
  background: var(--ghost);
  border-radius: var(--r-full);
  transition: width 520ms var(--ease-out) 260ms;
  pointer-events: none;
}
.hp__numbers { display: flex; justify-content: flex-end; gap: 2px; letter-spacing: .02em; }
.hp__value { color: var(--text); font-weight: 700; }
.hp__sep, .hp__max { opacity: .65; }
.hp--pulse .hp__fill--critical { animation: hp-pulse 1.1s ease-in-out infinite; }
@keyframes hp-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.45); } }

.bar--stat { height: 7px; }
.bar__fill { position: relative; overflow: hidden; }
.bar__fill::after {
  content: '';
  position: absolute; inset: 0 0 50% 0;
  background: linear-gradient(180deg, rgba(255,255,255,.28), transparent);
  border-radius: var(--r-full);
}

.combat-card { position: relative; }
.floater {
  position: absolute;
  left: 50%; top: 22%;
  transform: translate(-50%, 0);
  font-weight: 800;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
  text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 12px rgba(0,0,0,.35);
  pointer-events: none;
  opacity: 0;
  transition: transform 1050ms var(--ease-out), opacity 1050ms ease-out;
  z-index: 5;
  white-space: nowrap;
}
.floater.is-up { transform: translate(calc(-50% + var(--drift, 0px)), -46px); opacity: 1; }
.floater--damage { color: #ff8f7a; }
.floater--super  { color: var(--super); font-size: 22px; }
.floater--weak   { color: var(--weak); }
.floater--crit   { color: var(--crit); font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 18px rgba(255,207,92,.6); }
.floater--heal   { color: var(--heal); }
.floater--status { color: var(--accent-2); font-size: var(--fs-sm); }
.floater--miss   { color: var(--text-dim); font-size: var(--fs-md); }
.floater--info   { color: var(--text); font-size: var(--fs-sm); top: 34%; }

/* Battle side structure: `.slot__card` is re-rendered on every state change,
   `.slot__fx` persists so floating numbers outlive the re-render. */
.arena__foe, .arena__ally { position: relative; }
.slot__card { position: relative; }
.slot__fx { position: absolute; inset: 0; pointer-events: none; }

/* Impact states — applied for ~600ms by components.impact(). */
.slot__card.is-hit    { animation: shake 300ms var(--ease); }
.slot__card.is-crit   { animation: crit-shake 560ms var(--ease); }
.slot__card.is-lunge  { animation: lunge 380ms var(--ease); }
.slot__card.is-throw  { animation: suck-in 520ms var(--ease); }
.slot__card.is-wobble { animation: wobble 420ms var(--ease); }
.arena.is-flash { animation: crit-flash 420ms var(--ease-out); }
@keyframes crit-shake {
  0% { transform: translate(0, 0) scale(1); }
  15% { transform: translate(-10px, 3px) scale(1.05) rotate(-2deg); filter: brightness(1.6); }
  35% { transform: translate(9px, -3px) scale(1.04) rotate(2deg); }
  55% { transform: translate(-6px, 2px) scale(1.02) rotate(-1deg); }
  100% { transform: translate(0, 0) scale(1); }
}
@keyframes wobble {
  0%, 100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(-7px) rotate(-4deg); }
  75% { transform: translateX(7px) rotate(4deg); }
}
@keyframes suck-in {
  0% { transform: scale(1); opacity: 1; }
  55% { transform: scale(.42) rotate(140deg); opacity: .35; filter: brightness(1.5); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes crit-flash {
  0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
  20% { box-shadow: inset 0 0 90px 12px rgba(255,255,255,.5); }
  100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
}

/* Exploration feedback */
.btn.is-scanning { position: relative; overflow: hidden; }
.btn.is-scanning::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: sweep 900ms linear infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.view--explore.is-encounter { animation: crit-flash 620ms var(--ease-out); }

/* ============================================ 11d. avatar containers */

.avatar-wrap, .portrait-wrap { display: grid; place-items: center; line-height: 0; }
.avatar-wrap svg, .portrait-wrap svg { display: block; }
.portrait {
  position: relative;
  display: grid;
  place-items: center;
  padding-bottom: 8%;
}
/* Aura ring: each creature glows in its own colour (--aura comes from the
   species art), which is what makes three starters read as three characters
   instead of three sprites. */
.portrait__ring {
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--aura) 34%, transparent), transparent 70%);
  animation: portrait-breathe 5.5s ease-in-out infinite;
}
.portrait__platform {
  position: absolute;
  bottom: 2%;
  left: 50%;
  width: 58%; height: 13%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--aura) 55%, transparent), transparent 72%);
  filter: blur(5px);
}
.portrait__art { position: relative; z-index: 1; line-height: 0; }
.portrait__ring, .portrait__platform { pointer-events: none; }
@keyframes portrait-breathe {
  0%, 100% { transform: scale(1); opacity: .8; }
  50%      { transform: scale(1.05); opacity: 1; }
}

.input--range { -webkit-appearance: none; appearance: none; height: 26px; padding: 0; background: transparent; border: 0; }
.input--range::-webkit-slider-runnable-track {
  height: 6px; border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--accent), var(--bg-elev-3));
}
.input--range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; margin-top: -6px;
  border-radius: 50%; background: var(--text); border: 2px solid var(--accent);
  cursor: pointer;
}
.input--range::-moz-range-track { height: 6px; border-radius: var(--r-full); background: var(--bg-elev-3); }
.input--range::-moz-range-progress { height: 6px; border-radius: var(--r-full); background: var(--accent); }
.input--range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text); border: 2px solid var(--accent); cursor: pointer;
}

/* ========================================================== 12. responsive */

@media (min-width: 760px) {
  .arena { grid-template-columns: 1fr 1fr; align-items: center; }
  .arena__foe { justify-content: center; }
  .arena__ally { justify-content: center; }
  .view { padding-top: var(--sp-5); }
  .log { height: 150px; }
}

/* Wizard steps that want the full canvas (splash, launch) opt out of the
   narrow reading column the text steps use. */
.view.view--onboarding.is-step-0,
.view.view--onboarding.is-step-4 { max-width: none; padding-left: 0; padding-right: 0; }
.view.view--onboarding.is-step-2,
.view.view--onboarding.is-step-3 { max-width: var(--creator-max); }

@media (min-width: 900px) {
  .creator__grid { grid-template-columns: minmax(300px, 380px) 1fr; }
  .partner { grid-template-columns: 260px 1fr; align-items: center; }
  .partner__stats { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 480px) {
  .topbar__stats .pill:not(.pill--shards) { display: none; }
  .hero__shards { text-align: left; }
  .modal__panel { padding: var(--sp-4); }
  .move-grid { grid-template-columns: 1fr 1fr; }
}

@media print {
  .topbar, .tabbar, .toast-root { display: none; }
}

{"entry":"src/main.js","modules":[{"key":"src/core/bus.js","code":"/**\n * bus.js — Minimal synchronous event bus.\n *\n * Used for cross-module notifications that must not create import cycles\n * (state → UI, sync → UI, persistence → settings). Handlers are invoked with a\n * single payload object; errors are isolated so one bad listener cannot break\n * the app.\n *\n * @module core/bus\n */\n\nconst listeners = new Map();\n\n/**\n * Subscribe to an event.\n * @param {string} event\n * @param {(payload:any) => void} handler\n * @returns {() => void} Unsubscribe function.\n */\nexport function on(event, handler) {\n  if (!listeners.has(event)) listeners.set(event, new Set());\n  listeners.get(event).add(handler);\n  return () => off(event, handler);\n}\n\n/** Subscribe once. */\nexport function once(event, handler) {\n  const wrapped = (payload) => { off(event, wrapped); handler(payload); };\n  return on(event, wrapped);\n}\n\n/** Unsubscribe. */\nexport function off(event, handler) {\n  listeners.get(event)?.delete(handler);\n}\n\n/**\n * Emit an event. Listener exceptions are caught and logged so a failing\n * listener never aborts the emitting workflow.\n * @param {string} event\n * @param {any} [payload]\n */\nexport function emit(event, payload) {\n  const set = listeners.get(event);\n  if (!set) return;\n  for (const handler of [...set]) {\n    try {\n      handler(payload);\n    } catch (err) {\n      console.error(`[bus] listener for \"${event}\" threw:`, err);\n    }\n  }\n}\n\n/** Remove every listener (used by tests and full teardown). */\nexport function clearBus() {\n  listeners.clear();\n}\n\n/** Canonical event names, to avoid typos across modules. */\nexport const EVENTS = {\n  STATE_CHANGED: 'state:changed',\n  STATE_PERSISTED: 'state:persisted',\n  TOAST: 'ui:toast',\n  NAVIGATE: 'ui:navigate',\n  BATTLE_START: 'battle:start',\n  BATTLE_END: 'battle:end',\n  CREATURE_CAUGHT: 'creature:caught',\n  EVOLVED: 'creature:evolved',\n  LEVEL_UP: 'creature:levelup',\n  SYNC_STATUS: 'sync:status',\n};\n"},{"key":"src/core/crypto.js","code":"/**\n * crypto.js — Client-side cryptography for the local-first vault.\n *\n * Threat model\n * ------------\n * The sync server is treated as *hostile but curious*: it stores opaque\n * ciphertext and can never read it. Everything below runs in the browser via\n * Web Crypto; the passphrase and derived keys never leave the device.\n *\n *   Key derivation : PBKDF2-HMAC-SHA256, 250 000 iterations, 16-byte salt\n *   Encryption     : AES-256-GCM, fresh 12-byte IV per operation\n *   Integrity      : GCM authentication tag (built in)\n *\n * Keys are non-extractable CryptoKey objects, so even a successful XSS payload\n * cannot export the raw key material (it can still use it — hence the\n * passphrase re-prompt for destructive operations in the UI).\n *\n * @module core/crypto\n */\n\nconst enc = new TextEncoder();\nconst dec = new TextDecoder();\nconst subtle = () => globalThis.crypto?.subtle;\n\n/** Assert Web Crypto availability (HTTPS or localhost). */\nexport function assertCrypto() {\n  if (!globalThis.crypto?.subtle) {\n    throw new Error('Web Crypto is unavailable. Serve DigiPoke over HTTPS or localhost.');\n  }\n}\n\n/* --------------------------------------------------------- base64 helpers */\n\n/** Encode bytes as standard base64. */\nexport function toB64(buf) {\n  const bytes = new Uint8Array(buf);\n  let out = '';\n  for (let i = 0; i < bytes.length; i += 0x8000) {\n    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));\n  }\n  return btoa(out);\n}\n\n/** Decode standard base64 into a Uint8Array. */\nexport function fromB64(str) {\n  const bin = atob(str);\n  const bytes = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n  return bytes;\n}\n\n/* --------------------------------------------------------------- identities */\n\n/** Cryptographically random hex id (uid, profile id, request id…). */\nexport function randomId(prefix = 'id') {\n  const bytes = crypto.getRandomValues(new Uint8Array(12));\n  const hex = [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');\n  return `${prefix}_${hex}`;\n}\n\n/** Fresh 16-byte salt, base64 encoded. */\nexport function newSalt() {\n  return toB64(crypto.getRandomValues(new Uint8Array(16)));\n}\n\n/* ------------------------------------------------------------ key derivation */\n\n/**\n * Derive a non-extractable AES-GCM key from a passphrase.\n * @param {string} passphrase\n * @param {string} saltB64\n * @param {number} [iterations=250000]\n * @returns {Promise<CryptoKey>}\n */\nexport async function deriveVaultKey(passphrase, saltB64, iterations = 250000) {\n  assertCrypto();\n  const material = await subtle().importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);\n  return subtle().deriveKey(\n    { name: 'PBKDF2', salt: fromB64(saltB64), iterations, hash: 'SHA-256' },\n    material,\n    { name: 'AES-GCM', length: 256 },\n    false,          // non-extractable\n    ['encrypt', 'decrypt', 'wrapKey', 'unwrapKey'],\n  );\n}\n\n/* ------------------------------------------------------------- encryption */\n\n/**\n * Encrypt any structured-clonable value.\n * @param {CryptoKey} key\n * @param {any} data\n * @returns {Promise<{alg:string, iv:string, ct:string}>}\n */\nexport async function encryptJson(key, data) {\n  assertCrypto();\n  const iv = crypto.getRandomValues(new Uint8Array(12));\n  const ct = await subtle().encrypt(\n    { name: 'AES-GCM', iv },\n    key,\n    enc.encode(JSON.stringify(data)),\n  );\n  return { alg: 'AES-GCM-256', iv: toB64(iv), ct: toB64(ct) };\n}\n\n/**\n * Decrypt a value produced by `encryptJson`.\n * @param {CryptoKey} key\n * @param {{alg:string, iv:string, ct:string}} envelope\n * @returns {Promise<any>}\n */\nexport async function decryptJson(key, envelope) {\n  assertCrypto();\n  const plain = await subtle().decrypt(\n    { name: 'AES-GCM', iv: fromB64(en
