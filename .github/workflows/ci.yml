# DigiPoke continuous integration.
#
# Runs on every push and pull request. The whole suite is dependency-free:
# the linter and the domain/API tests run on bare Node, and the jsdom browser
# journey tests need the two test-only packages, which `npm ci` installs.
#
# Gates enforced here (identical to local `npm test` + `npm run lint`):
#   1. npm run lint  — import resolution, service-worker precache list,
#                      placeholder scan, external-URL scan, CSS class coverage
#   2. npm test      — 40 tests: domain (18) · API (12) · headless UI (10)
#   3. build:single  — the one-file bundle must still assemble
#   4. verify:single — that bundle must boot and play its first two steps

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # jsdom and fake-indexeddb are test-only; without them the UI suite
      # skips itself, so we install explicitly and keep `npm ci` strict.
      - name: Install test dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Walks the opening flow like a new player: audio coverage, focus,
      # responsiveness wiring and feedback on every step.
      - name: Opening playtest
        run: npm run playtest

      - name: Build single-file bundle
        run: npm run build:single

      - name: Verify single-file bundle
        run: npm run verify:single

      - name: Upload single-file bundle
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: digipoke-single-file
          path: dist/digipoke.html
          if-no-files-found: error
